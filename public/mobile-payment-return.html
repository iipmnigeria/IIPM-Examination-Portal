<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3f2f" />
    <title>Returning to AgileCert Global</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f8f6; color: #17352c; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #d8e6df; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(15, 63, 47, .12); text-align: center; }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 18px; background: #e9f7ef; color: #0f7a4d; font-size: 28px; font-weight: 900; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #5b6f67; line-height: 1.55; }
      small { display: block; margin-top: 16px; color: #7b8d86; }
      button { width: 100%; margin-top: 20px; border: 0; border-radius: 14px; padding: 14px 18px; background: #0f7a4d; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1 id="title">Returning to AgileCert Global</h1>
      <p id="message">Your payment result is being sent securely back to the app.</p>
      <button id="returnButton" type="button">Return to AgileCert</button>
      <small id="fallback">Returning automatically…</small>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const reference = params.get('reference') || params.get('trxref') || '';
      const cancelled = params.get('cancelled') === '1';
      const appParams = new URLSearchParams();
      if (reference) appParams.set('reference', reference);
      if (cancelled) appParams.set('cancelled', '1');
      const appUrl = `agilecert://payment-return?${appParams.toString()}`;

      if (cancelled) {
        document.getElementById('title').textContent = 'Payment window closed';
        document.getElementById('message').textContent = 'Returning to AgileCert. No access will be granted unless Paystack confirms payment.';
      }

      const returnToApp = () => {
        window.location.replace(appUrl);
        window.setTimeout(() => {
          document.getElementById('fallback').textContent =
            'If AgileCert did not open, tap the button above.';
        }, 1200);
      };

      document.getElementById('returnButton').addEventListener('click', returnToApp);
      window.setTimeout(returnToApp, 150);
    </script>
  </body>
</html>
