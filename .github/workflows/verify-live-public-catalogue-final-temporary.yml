name: Temporary Final Live Public Catalogue Verification

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - ".github/workflows/verify-live-public-catalogue-final-temporary.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify rendered production catalogue locally
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install application and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium

      - name: Build production application
        run: npm run build

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/agilecert-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agilecert-preview.log
          exit 1

      - name: Verify rendered catalogue launcher and dialog
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.stack || error.message));

            const response = await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            const launcher = page.getByRole('button', {
              name: 'Open AgileCert programme catalogue',
            });
            await launcher.waitFor({ state: 'visible', timeout: 15000 });
            const label = (await launcher.textContent())?.trim();
            if (!label || !label.includes('Programmes')) {
              throw new Error(`Unexpected launcher label: ${JSON.stringify(label)}`);
            }

            await launcher.click();
            await page.getByRole('heading', {
              name: 'AgileCert Programme Catalogue',
            }).waitFor({ state: 'visible', timeout: 10000 });

            console.log(`Preview HTTP status: ${response?.status()}`);
            console.log(`Verified launcher text: ${label}`);
            console.log('Catalogue dialog opened successfully.');
            console.log(`Page errors: ${pageErrors.length ? pageErrors.join('\n---\n') : '[none]'}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
