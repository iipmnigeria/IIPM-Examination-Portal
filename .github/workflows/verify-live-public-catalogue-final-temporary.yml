name: Temporary Final Live Public Catalogue Verification

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - ".github/workflows/verify-live-public-catalogue-final-temporary.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify public Programmes launcher and catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify latest catalogue bundle is deployed
        run: |
          python - <<'PY'
          import re
          import time
          import urllib.parse
          import urllib.request

          base_url = 'https://agilecert.iipmi.org/'
          required = [
              'Open AgileCert programme catalogue',
              'fixed bottom-5 right-5 z-[240]',
          ]
          last_error = None

          for attempt in range(1, 9):
              try:
                  request = urllib.request.Request(base_url, headers={'User-Agent': 'IIPM-Final-Live-Verification/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      html = response.read().decode('utf-8', errors='replace')
                  scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
                  assets = [html]
                  for source in scripts:
                      url = urllib.parse.urljoin(base_url, source)
                      asset_request = urllib.request.Request(url, headers={'User-Agent': 'IIPM-Final-Live-Verification/1.0'})
                      with urllib.request.urlopen(asset_request, timeout=30) as response:
                          assets.append(response.read().decode('utf-8', errors='replace'))
                  deployed = '\n'.join(assets)
                  missing = [marker for marker in required if marker not in deployed]
                  if not missing:
                      print(f'Latest catalogue bundle verified on attempt {attempt}.')
                      print(f'Downloaded {len(scripts)} script asset(s).')
                      break
                  raise RuntimeError(f'Missing marker(s): {missing}')
              except Exception as error:
                  last_error = error
                  print(f'Bundle attempt {attempt} not ready: {error}')
                  if attempt < 8:
                      time.sleep(10)
          else:
              raise SystemExit(f'Latest catalogue bundle not deployed: {last_error}')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify rendered public interface
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            let lastError;

            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                await page.goto('https://agilecert.iipmi.org/', {
                  waitUntil: 'domcontentloaded',
                  timeout: 45000,
                });
                const launcher = page.getByRole('button', {
                  name: 'Open AgileCert programme catalogue',
                });
                await launcher.waitFor({ state: 'visible', timeout: 15000 });
                const label = (await launcher.textContent())?.trim();
                if (!label || !label.includes('Programmes')) {
                  throw new Error(`Unexpected launcher label: ${JSON.stringify(label)}`);
                }

                await launcher.click();
                await page.getByRole('heading', {
                  name: 'AgileCert Programme Catalogue',
                }).waitFor({ state: 'visible', timeout: 10000 });

                console.log(`Verified rendered public catalogue on attempt ${attempt}.`);
                console.log(`Launcher text: ${label}`);
                console.log('Catalogue dialog opened successfully.');
                await browser.close();
                process.exit(0);
              } catch (error) {
                lastError = error;
                console.log(`Browser attempt ${attempt} not ready: ${error.message}`);
                if (attempt < 8) await new Promise((resolve) => setTimeout(resolve, 15000));
              }
            }

            await browser.close();
            throw lastError;
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
