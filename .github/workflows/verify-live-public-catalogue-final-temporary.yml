name: Temporary Final Live Public Catalogue Verification

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - ".github/workflows/verify-live-public-catalogue-final-temporary.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose live catalogue rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Capture live runtime diagnostics
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleMessages = [];
            const pageErrors = [];
            const failedRequests = [];

            page.on('console', (message) => consoleMessages.push(`${message.type()}: ${message.text()}`));
            page.on('pageerror', (error) => pageErrors.push(error.stack || error.message));
            page.on('requestfailed', (request) => failedRequests.push(`${request.url()} :: ${request.failure()?.errorText}`));

            const response = await page.goto('https://agilecert.iipmi.org/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.waitForTimeout(12000);

            const diagnostics = await page.evaluate(() => {
              const root = document.getElementById('root');
              const startup = document.getElementById('iipm-startup-diagnostic');
              const launcher = document.querySelector('[aria-label="Open AgileCert programme catalogue"]');
              return {
                url: window.location.href,
                title: document.title,
                readyState: document.readyState,
                bodyText: document.body.innerText.slice(0, 4000),
                rootHtml: root?.innerHTML.slice(0, 5000) ?? null,
                rootChildCount: root?.childElementCount ?? null,
                launcherCount: document.querySelectorAll('[aria-label="Open AgileCert programme catalogue"]').length,
                launcherOuterHtml: launcher?.outerHTML ?? null,
                startupDisplay: startup ? getComputedStyle(startup).display : null,
                startupText: startup?.innerText.slice(0, 2000) ?? null,
                scripts: Array.from(document.scripts).map((script) => script.src || '[inline]'),
              };
            });

            console.log(`HTTP status: ${response?.status()}`);
            console.log('DIAGNOSTICS_START');
            console.log(JSON.stringify(diagnostics, null, 2));
            console.log('DIAGNOSTICS_END');
            console.log('CONSOLE_START');
            console.log(consoleMessages.join('\n') || '[none]');
            console.log('CONSOLE_END');
            console.log('PAGE_ERRORS_START');
            console.log(pageErrors.join('\n---\n') || '[none]');
            console.log('PAGE_ERRORS_END');
            console.log('FAILED_REQUESTS_START');
            console.log(failedRequests.join('\n') || '[none]');
            console.log('FAILED_REQUESTS_END');

            await browser.close();
            if (diagnostics.launcherCount < 1) process.exit(1);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
