name: Resume Phase 4 Certificate Commerce

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/resume-phase-4-certificate-commerce.txt'

permissions:
  contents: write

concurrency:
  group: phase-4-certificate-commerce-production-resume
  cancel-in-progress: false

jobs:
  resume-phase-4:
    name: Activate Phase 4 database, functions and production source
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_CERTIFICATE_PAYSTACK_SECRET: ${{ secrets.AGILECERT_PAYSTACK_SECRET_KEY }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      PHASE_4_MERGE_COMMIT: 'a0aca15360c07d2e2f6bada0cf80cd35060bb9ae'
      PHASE_4_HOLD_COMMIT: '191614ecca0c2212b33c1756415ba1fe30036a2e'
      PHASE_4_MIGRATION: '202607240105_phase_4_certificate_payment_credential_issuance.sql'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/
      WORKDIR: /tmp/agilecert-phase-4-resume

    steps:
      - name: Checkout held production source
        uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Confirm exact reversible hold state
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          echo "held_source_head=$current" | tee "$RUNNER_TEMP/phase-4-resume-source-state.log"
          git merge-base --is-ancestor "$PHASE_4_HOLD_COMMIT" "$current"
          git diff --quiet "$PHASE_4_HOLD_COMMIT" "$current"
          test ! -e "supabase/migrations/$PHASE_4_MIGRATION"
          test ! -e supabase/functions/initialize-certificate-payment/index.ts
          test ! -e supabase/functions/verify-certificate-payment/index.ts
          test ! -e supabase/functions/paystack-certificate-webhook/index.ts

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify or configure dedicated certificate payment secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          npx --yes supabase@latest secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-4-resume-secret-before.log"

          if grep -q 'AGILECERT_PAYSTACK_SECRET_KEY' "$RUNNER_TEMP/phase-4-resume-secret-before.log"; then
            echo 'Dedicated certificate payment secret already exists in Supabase.'
          elif [ -n "$GITHUB_CERTIFICATE_PAYSTACK_SECRET" ]; then
            npx --yes supabase@latest secrets set \
              --project-ref "$SUPABASE_PROJECT_REF" \
              "AGILECERT_PAYSTACK_SECRET_KEY=$GITHUB_CERTIFICATE_PAYSTACK_SECRET" \
              2>&1 | tee "$RUNNER_TEMP/phase-4-resume-secret-set.log"
          else
            echo 'AGILECERT_PAYSTACK_SECRET_KEY is absent from both Supabase and GitHub Actions.'
            exit 1
          fi

          npx --yes supabase@latest secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "IIPM_PORTAL_URL=$LIVE_URL" \
            2>&1 | tee -a "$RUNNER_TEMP/phase-4-resume-secret-set.log"

          npx --yes supabase@latest secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-4-resume-secret-after.log"
          grep -q 'AGILECERT_PAYSTACK_SECRET_KEY' "$RUNNER_TEMP/phase-4-resume-secret-after.log"
          grep -q 'IIPM_PORTAL_URL' "$RUNNER_TEMP/phase-4-resume-secret-after.log"

      - name: Reapply only the approved Phase 4 merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit "$PHASE_4_HOLD_COMMIT"
          reactivation_sha="$(git rev-parse HEAD)"
          echo "reactivation_commit=$reactivation_sha" | tee -a "$RUNNER_TEMP/phase-4-resume-source-state.log"

          git diff --quiet "$PHASE_4_MERGE_COMMIT" HEAD
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed" | tee "$RUNNER_TEMP/phase-4-resume-changed-files.log"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 14

          for expected in \
            .github/workflows/validate-agilecert-phase-3.yml \
            .github/workflows/validate-agilecert-phase-4.yml \
            docs/AGILECERT_PHASE_4_SCOPE.md \
            src/components/AdminCertificateCommerceLauncher.tsx \
            src/components/CandidateCertificateCommerce.tsx \
            src/components/CertificatePaymentReturnHandler.tsx \
            src/main.tsx \
            src/services/certificateCommerceService.ts \
            supabase/config.toml \
            supabase/functions/_shared/agilecertCertificatePaystack.ts \
            supabase/functions/initialize-certificate-payment/index.ts \
            supabase/functions/paystack-certificate-webhook/index.ts \
            supabase/functions/verify-certificate-payment/index.ts \
            supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql; do
            grep -Fxq "$expected" "$RUNNER_TEMP/phase-4-resume-changed-files.log"
          done

      - name: Validate exact restored Phase 4 application
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'Credential Store' "$js_file"
          grep -q 'IIPM Certificate Verification' "$js_file"
          sha256sum "$js_file" | awk '{print $1}' | tee "$RUNNER_TEMP/phase-4-resume-expected-js.sha256"

      - name: Prepare isolated production migration workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/supabase/migrations"
          cp supabase/config.toml "$WORKDIR/supabase/config.toml"
          for migration in \
            202607230101_phase_2_candidate_profile_foundation.sql \
            202607230102_phase_2_candidate_profile_photo.sql \
            202607240101_phase_2_3a_preparation_material_entitlements.sql \
            202607240102_phase_2_3b_material_admin_tools.sql \
            202607240103_phase_2_4_secure_material_delivery.sql \
            202607240104_phase_3_certificate_eligibility_issuance_verification.sql \
            202607240105_phase_4_certificate_payment_credential_issuance.sql; do
            cp "supabase/migrations/$migration" "$WORKDIR/supabase/migrations/"
          done
          test "$(find "$WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Link production Supabase
        shell: bash
        working-directory: /tmp/agilecert-phase-4-resume
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply only migration 202607240105
        shell: bash
        working-directory: /tmp/agilecert-phase-4-resume
        run: |
          set +e
          output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-4-resume-dry-run.log"
          test "$status" -eq 0

          if printf '%s\n' "$output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 4 migration is already applied.'
          else
            pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            test "$pending" = "$PHASE_4_MIGRATION"
            npx --yes supabase@latest db push \
              --linked \
              --password "$SUPABASE_DB_PASSWORD" \
              --yes \
              2>&1 | tee "$RUNNER_TEMP/phase-4-resume-apply.log"
          fi

      - name: Verify production migration history and schema
        shell: bash
        working-directory: /tmp/agilecert-phase-4-resume
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase-4-resume-migration-history.log"
          schema="$RUNNER_TEMP/phase-4-resume-public-schema.sql"
          npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            2>&1 | tee "$history"

          for version in 202607230101 202607230102 202607240101 202607240102 202607240103 202607240104 202607240105; do
            grep -q "$version" "$history"
          done

          npx --yes supabase@latest db dump \
            --linked \
            --schema public \
            --file "$schema" \
            --password "$SUPABASE_DB_PASSWORD"
          test -s "$schema"

          for marker in \
            agilecert_certificate_products \
            agilecert_certificate_product_prices \
            agilecert_certificate_orders \
            agilecert_certificate_payments \
            agilecert_paid_credentials \
            agilecert_certificate_commerce_audits \
            create_agilecert_certificate_order \
            fulfil_paid_agilecert_certificate_order \
            waive_agilecert_certificate_order \
            get_my_agilecert_certificate_commerce \
            get_agilecert_certificate_commerce_admin_console \
            upsert_agilecert_certificate_product_price; do
            grep -q "$marker" "$schema"
          done

      - name: Deploy approved Phase 4 certificate payment functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in \
            initialize-certificate-payment \
            verify-certificate-payment \
            paystack-certificate-webhook; do
            npx --yes supabase@latest functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt \
              2>&1 | tee -a "$RUNNER_TEMP/phase-4-resume-functions-deploy.log"
          done

      - name: Verify active functions and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          functions="$RUNNER_TEMP/phase-4-resume-functions-list.log"
          npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$functions"

          for function_name in \
            initialize-exam-payment \
            verify-exam-payment \
            paystack-webhook \
            agilecert-material-delivery \
            initialize-certificate-payment \
            verify-certificate-payment \
            paystack-certificate-webhook; do
            grep -q "$function_name" "$functions"
          done

          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          init_status="$(curl -sS -o "$RUNNER_TEMP/phase-4-resume-init-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/initialize-certificate-payment")"
          verify_status="$(curl -sS -o "$RUNNER_TEMP/phase-4-resume-verify-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/verify-certificate-payment")"
          webhook_status="$(curl -sS -o "$RUNNER_TEMP/phase-4-resume-webhook-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/paystack-certificate-webhook")"

          {
            echo "initialize-certificate-payment HTTP $init_status"
            echo "verify-certificate-payment HTTP $verify_status"
            echo "paystack-certificate-webhook HTTP $webhook_status"
          } | tee "$RUNNER_TEMP/phase-4-resume-function-probes.log"

          test "$init_status" = '400'
          test "$verify_status" = '400'
          test "$webhook_status" = '401'
          grep -Eqi 'authentication is required|authorization' "$RUNNER_TEMP/phase-4-resume-init-probe.json"
          grep -Eqi 'authentication is required|authorization' "$RUNNER_TEMP/phase-4-resume-verify-probe.json"
          grep -q 'Invalid Paystack signature' "$RUNNER_TEMP/phase-4-resume-webhook-probe.json"

      - name: Push exact Phase 4 reactivation commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:supabase-integration

      - name: Upload backend and source activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-resume-backend-source-evidence
          path: |
            ${{ runner.temp }}/phase-4-resume-source-state.log
            ${{ runner.temp }}/phase-4-resume-changed-files.log
            ${{ runner.temp }}/phase-4-resume-secret-before.log
            ${{ runner.temp }}/phase-4-resume-secret-set.log
            ${{ runner.temp }}/phase-4-resume-secret-after.log
            ${{ runner.temp }}/phase-4-resume-expected-js.sha256
            ${{ runner.temp }}/phase-4-resume-dry-run.log
            ${{ runner.temp }}/phase-4-resume-apply.log
            ${{ runner.temp }}/phase-4-resume-migration-history.log
            ${{ runner.temp }}/phase-4-resume-public-schema.sql
            ${{ runner.temp }}/phase-4-resume-functions-deploy.log
            ${{ runner.temp }}/phase-4-resume-functions-list.log
            ${{ runner.temp }}/phase-4-resume-function-probes.log
            ${{ runner.temp }}/phase-4-resume-init-probe.json
            ${{ runner.temp }}/phase-4-resume-verify-probe.json
            ${{ runner.temp }}/phase-4-resume-webhook-probe.json
          if-no-files-found: warn
          retention-days: 3
