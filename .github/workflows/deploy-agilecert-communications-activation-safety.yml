name: Deploy AgileCert Communications Activation Safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-communications-activation-safety.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-agilecert-communications-activation-safety
  cancel-in-progress: false

env:
  EXPECTED_COMMIT: eaaa71de585f3a3a786451129598a3cb2ffce14a
  PROJECT_REF: cfecicvugfrrhcvhduzc

jobs:
  database-and-functions:
    name: Deploy cutover authority and provider safety functions
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out exact approved activation-safety source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact approved release unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -s supabase/migrations/202607271300_communications_activation_safety.sql
          test -s supabase/functions/agilecert-communications-control/index.ts
          test -s supabase/functions/agilecert-resend-webhook/index.ts
          python3 <<'PY'
          from pathlib import Path
          sql = Path('supabase/migrations/202607271300_communications_activation_safety.sql').read_text()
          control = Path('supabase/functions/agilecert-communications-control/index.ts').read_text()
          webhook = Path('supabase/functions/agilecert-resend-webhook/index.ts').read_text()
          required = [
              'delivery_cutover_at',
              'pre_activation_backlog',
              'configure_agilecert_communication_provider_activation',
              'box.due_at >= settings.delivery_cutover_at',
              'delivered@resend.dev',
              'RESEND_WEBHOOK_SECRET',
              'svix-signature',
          ]
          combined = '\n'.join([sql, control, webhook])
          missing = [item for item in required if item not in combined]
          assert not missing, f'Missing activation-safety marker: {missing}'
          assert 'provider_enabled = true' not in sql.lower(), 'Migration must not enable provider delivery.'
          forbidden = ['PAYSTACK_SECRET_KEY', 'question_answer_keys', 'candidate_answers', 'government_id', 'selfie_path']
          found = [item for item in forbidden if item in combined]
          assert not found, f'Protected authority leaked into activation safety: {found}'
          PY

      - name: Isolate pre-tracking legacy migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agilecert-legacy-migrations
          python3 <<'PY'
          from pathlib import Path
          import shutil
          boundary = 202607230101
          target = 202607271300
          for path in Path('supabase/migrations').glob('*.sql'):
              prefix = path.name.split('_', 1)[0]
              if prefix.isdigit():
                  version = int(prefix)
                  if version < boundary and version != target:
                      shutil.move(str(path), f'/tmp/agilecert-legacy-migrations/{path.name}')
          PY

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Determine exact migration state
        id: migration_state
        shell: bash
        run: |
          set -o pipefail
          printf '%s\n' '202607271300_communications_activation_safety.sql' > activation-safety-expected.txt
          supabase db push --linked --include-all --dry-run 2>&1 | tee activation-safety-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' activation-safety-dry-run.log \
            | sort -u > activation-safety-pending.txt || true
          if diff -u activation-safety-expected.txt activation-safety-pending.txt; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          elif [ ! -s activation-safety-pending.txt ] && grep -q 'Remote database is up to date' activation-safety-dry-run.log; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Unexpected migration state:' >&2
            cat activation-safety-pending.txt >&2
            exit 1
          fi

      - name: Apply only the approved activation-safety migration
        if: steps.migration_state.outputs.apply == 'true'
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked --include-all 2>&1 | tee activation-safety-deploy.log
          grep -q 'Applying migration 202607271300_communications_activation_safety.sql' activation-safety-deploy.log
          grep -q 'Finished supabase db push' activation-safety-deploy.log

      - name: Verify remote activation-safety schema
        shell: bash
        run: |
          set -o pipefail
          supabase db dump --linked --schema public --file activation-safety-schema.sql \
            2>&1 | tee activation-safety-schema-dump.log
          python3 <<'PY'
          from pathlib import Path
          schema = Path('activation-safety-schema.sql').read_text(encoding='utf-8', errors='ignore')
          required = [
              'delivery_cutover_at',
              'initial_provider_activated_at',
              'last_provider_disabled_at',
              'verified_sender_domain',
              'guard_agilecert_communication_outbox_cutover',
              'agilecert_communication_outbox_cutover_guard',
              'configure_agilecert_communication_provider_activation',
              'pre_activation_backlog',
          ]
          missing = [item for item in required if item not in schema]
          assert not missing, f'Remote activation-safety schema markers missing: {missing}'
          PY

      - name: Confirm no migration remains pending
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee activation-safety-post-deploy-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' activation-safety-post-deploy-dry-run.log \
            | sort -u > activation-safety-post-deploy-pending.txt || true
          test ! -s activation-safety-post-deploy-pending.txt
          grep -q 'Remote database is up to date' activation-safety-post-deploy-dry-run.log

      - name: Deploy only the approved safety functions
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy agilecert-communications-control --project-ref "$PROJECT_REF" \
            2>&1 | tee activation-control-function-deploy.log
          supabase functions deploy agilecert-resend-webhook --project-ref "$PROJECT_REF" \
            2>&1 | tee activation-webhook-function-deploy.log
          supabase functions list --project-ref "$PROJECT_REF" \
            2>&1 | tee activation-safety-function-list.log
          grep -q 'agilecert-communications-control' activation-safety-function-list.log
          grep -q 'agilecert-resend-webhook' activation-safety-function-list.log

      - name: Confirm both public endpoints fail closed
        shell: bash
        run: |
          set -euo pipefail
          control_status="$(curl --silent --show-error \
            --output activation-control-boundary.json \
            --write-out '%{http_code}' \
            --request POST "https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-communications-control" \
            --header 'Content-Type: application/json' \
            --data '{"action":"activation-readiness"}')"
          test "$control_status" != '200'
          jq -e '.error | type == "string"' activation-control-boundary.json >/dev/null

          webhook_status="$(curl --silent --show-error \
            --output activation-webhook-boundary.json \
            --write-out '%{http_code}' \
            --request POST "https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-resend-webhook" \
            --header 'Content-Type: application/json' \
            --data '{"type":"email.delivered"}')"
          test "$webhook_status" != '200'
          jq -e '.error | type == "string"' activation-webhook-boundary.json >/dev/null

      - name: Create sanitized production evidence
        if: always()
        shell: bash
        env:
          MIGRATION_APPLIED: ${{ steps.migration_state.outputs.apply }}
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              'sourceCommit': os.environ.get('EXPECTED_COMMIT'),
              'projectRef': os.environ.get('PROJECT_REF'),
              'migration': '202607271300_communications_activation_safety.sql',
              'migrationAppliedThisRun': os.environ.get('MIGRATION_APPLIED') == 'true',
              'migrationPendingAfterDeployment': False,
              'providerEnabledByDeployment': False,
              'candidateEmailSentByDeployment': False,
              'deployedFunctions': [
                  'agilecert-communications-control',
                  'agilecert-resend-webhook',
              ],
              'protectedAuthoritiesChanged': False,
          }
          Path('communications-activation-safety-production-evidence.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-activation-safety-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-activation-safety-production-evidence.json
            activation-safety-expected.txt
            activation-safety-dry-run.log
            activation-safety-pending.txt
            activation-safety-deploy.log
            activation-safety-schema-dump.log
            activation-safety-schema.sql
            activation-safety-post-deploy-dry-run.log
            activation-safety-post-deploy-pending.txt
            activation-control-function-deploy.log
            activation-webhook-function-deploy.log
            activation-safety-function-list.log
            activation-control-boundary.json
            activation-webhook-boundary.json

  pages:
    name: Verify exact compiled activation-aware Pages deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate exact permanent Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          conclusion=''
          for attempt in $(seq 1 90); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=supabase-integration&per_page=50" \
              > activation-safety-pages-runs.json
            run_id="$(jq -r --arg sha "$EXPECTED_COMMIT" '.workflow_runs[] | select(.head_sha == $sha and .name == "Deploy AgileCert Compiled Pages") | .id' activation-safety-pages-runs.json | head -n 1)"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' activation-safety-pages-runs.json)"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""' activation-safety-pages-runs.json)"
              if [ "$status" = 'completed' ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$conclusion" = 'success'
          printf '%s' "$run_id" > activation-safety-pages-run-id.txt

      - name: Verify live activation-aware communications evidence
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat activation-safety-pages-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > activation-safety-pages-jobs.json
          jq -e '.jobs | length >= 3' activation-safety-pages-jobs.json >/dev/null
          jq -e 'all(.jobs[]; .conclusion == "success")' activation-safety-pages-jobs.json >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > activation-safety-pages-artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name == "agilecert-pages-live-verification" and (.expired | not)) | .id' activation-safety-pages-artifacts.json | head -n 1)"
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > activation-safety-pages-live-evidence.zip
          mkdir -p activation-safety-pages-live-evidence
          unzip -q activation-safety-pages-live-evidence.zip -d activation-safety-pages-live-evidence
          live_js="$(find activation-safety-pages-live-evidence -type f -name 'live-app.js' | head -n 1)"
          test -s "$live_js"
          grep -q 'Controlled activation' "$live_js"
          grep -q 'Delivery cutover' "$live_js"
          grep -q 'verified Resend credentials' "$live_js"
          python3 <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              'sourceCommit': os.environ.get('EXPECTED_COMMIT'),
              'pagesRunId': Path('activation-safety-pages-run-id.txt').read_text().strip(),
              'controlledActivationVisible': True,
              'deliveryCutoverVisible': True,
          }
          Path('communications-activation-safety-pages-evidence.json').write_text(json.dumps(evidence, indent=2))
          PY

      - name: Upload Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-activation-safety-pages-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-activation-safety-pages-evidence.json
            activation-safety-pages-run-id.txt
            activation-safety-pages-jobs.json
