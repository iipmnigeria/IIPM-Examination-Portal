name: Patch Phase 1D Deno Namespace Once

on:
  push:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/patch-phase1d-deno-namespace-once.yml'

permissions:
  contents: write

concurrency:
  group: patch-phase1d-deno-namespace-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Add Deno namespace declarations and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git worktree add /tmp/phase1d origin/feature/certificate-master-bootstrap-phase1d
          cd /tmp/phase1d
          git switch -c phase1d-deno-namespace-fix

          python3 <<'PY'
          from pathlib import Path

          paths = [
              Path('scripts/certificate-masters/cipmn-approved-completion-master.ts'),
              Path('scripts/certificate-masters/cipmn-approved-completion-master.test.ts'),
          ]
          directive = '/// <reference lib="deno.ns" />\n\n'
          for path in paths:
              content = path.read_text(encoding='utf-8')
              if content.startswith(directive):
                  raise SystemExit(f'Deno namespace directive already exists: {path}')
              if '/// <reference lib="deno.ns" />' in content:
                  raise SystemExit(f'Unexpected Deno namespace directive placement: {path}')
              path.write_text(directive + content, encoding='utf-8')
          PY

          for path in \
            scripts/certificate-masters/cipmn-approved-completion-master.ts \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts; do
            head -n 1 "$path" | grep -qx '/// <reference lib="deno.ns" />'
          done

          git add \
            scripts/certificate-masters/cipmn-approved-completion-master.ts \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          git diff --cached --check
          git commit -m 'Declare Deno namespace for Phase 1D scripts'
          git push origin HEAD:feature/certificate-master-bootstrap-phase1d

          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/patch-phase1d-deno-namespace-once.yml
          git commit -m 'Remove one-use Phase 1D namespace patch control'
          git push origin HEAD:supabase-integration
