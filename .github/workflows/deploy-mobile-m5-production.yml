name: Deploy Mobile M5 Production

on:
  push:
    branches:
      - deploy/m5-production-activation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mobile-m5-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: cfecicvugfrrhcvhduzc

    steps:
      - name: Check out validated production source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in repository secrets." >&2
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is not configured in repository secrets." >&2
            exit 1
          fi

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Review pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --include-all \
            --dry-run \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Phase M5 database authority
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Paystack cart initializer
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy initialize-exam-cart-payment \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      - name: Confirm deployed function is listed
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
