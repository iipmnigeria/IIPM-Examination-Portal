name: Align Communications Branch History

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/sync-communications-history.txt'

permissions:
  contents: write

concurrency:
  group: align-communications-branch-history
  cancel-in-progress: false

jobs:
  align:
    name: Preserve communications tree and align Phase 7 ancestry
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout communications branch
        uses: actions/checkout@v4
        with:
          ref: communications-automation
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Align source ancestry and patch webhook body handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin supabase-integration

          before="$(git rev-parse HEAD)"
          base="$(git rev-parse origin/supabase-integration)"
          printf 'communications_before=%s\nsupabase_integration=%s\n' "$before" "$base" | tee communications-history-before.txt

          if git merge-base --is-ancestor "$base" HEAD; then
            echo 'Current supabase-integration is already an ancestor.' | tee communications-history-result.txt
          else
            git merge -s ours --no-edit "$base"
            echo 'Communications tree preserved; current supabase-integration added as ancestry.' | tee communications-history-result.txt
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/agilecert-communications/index.ts')
          source = path.read_text(encoding='utf-8')
          old = "const body = (await request.json().catch(() => ({}))) as Record<string, unknown>;"
          new = "const body = (await request.clone().json().catch(() => ({}))) as Record<string, unknown>;"
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
              print('Patched webhook request parsing to preserve the body for the webhook handler.')
          elif new in source:
              print('Webhook request parsing is already patched.')
          else:
              raise SystemExit('Expected communications request parsing marker was not found.')
          PY

          if ! git diff --quiet; then
            git add supabase/functions/agilecert-communications/index.ts
            git commit -m 'Preserve communications webhook request body'
          fi

          git push origin HEAD:communications-automation
          git fetch origin communications-automation supabase-integration
          git merge-base --is-ancestor origin/supabase-integration origin/communications-automation
          git diff --name-only origin/supabase-integration...origin/communications-automation \
            | sort > communications-final-changed-files.txt

          protected='^(docs/AGILECERT_PHASE_7_AI_CV_PROFILE_BUILDER_SCOPE\.md|scripts/phase7-completion-behaviour\.sql|src/components/AiCvEnhancementLauncher\.tsx|src/services/aiCvEnhancementService\.ts|supabase/functions/agilecert-ai-cv/|supabase/migrations/202607271100_phase_7_)'
          if grep -Eq "$protected" communications-final-changed-files.txt; then
            cat communications-final-changed-files.txt
            exit 1
          fi

          grep -q 'request.clone().json()' supabase/functions/agilecert-communications/index.ts

      - name: Upload history-alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communications-history-alignment-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-history-before.txt
            communications-history-result.txt
            communications-final-changed-files.txt
