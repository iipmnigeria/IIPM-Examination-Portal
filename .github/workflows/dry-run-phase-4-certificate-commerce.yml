name: Dry Run Phase 4 Certificate Commerce

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-4-certificate-commerce-dry-run.txt'

permissions:
  contents: read

concurrency:
  group: phase-4-certificate-commerce-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify Phase 4 production migration plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'effdd161c829d6db2235ecde2da8cd5c4dc07aed'
      MIGRATION_FILE: supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql
      SUPABASE_WORKDIR: /tmp/agilecert-phase-4-dry-run

    steps:
      - name: Checkout exact Phase 4 draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate approved inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$MIGRATION_FILE"
          grep -q 'agilecert_certificate_orders' "$MIGRATION_FILE"
          grep -q 'fulfil_paid_agilecert_certificate_order' "$MIGRATION_FILE"
          grep -q 'agilecert_paid_credentials' "$MIGRATION_FILE"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare deployed migration-history workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          cp supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240102_phase_2_3b_material_admin_tools.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$MIGRATION_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Link production Supabase project
        working-directory: /tmp/agilecert-phase-4-dry-run
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run approved migration only
        shell: bash
        working-directory: /tmp/agilecert-phase-4-dry-run
        run: |
          set +e
          output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-4-production-dry-run.log"
          test "$status" -eq 0
          pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
          test "$pending" = "$(basename "$MIGRATION_FILE")"

      - name: Verify migration remains unapplied
        shell: bash
        working-directory: /tmp/agilecert-phase-4-dry-run
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase-4-production-migration-history.log"
          npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history"
          python3 - "$history" <<'PY'
          from pathlib import Path
          import sys

          expected_applied = ['202607230101','202607230102','202607240101','202607240102','202607240103','202607240104']
          pending = '202607240105'
          rows = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              if '|' not in line:
                  continue
              parts = [part.strip().strip('`') for part in line.split('|')]
              if len(parts) >= 3:
                  rows.append(parts)
          for version in expected_applied:
              assert any(row[0] == version and row[1] == version for row in rows), f'{version} is not fully applied.'
          candidates = [row for row in rows if row[0] == pending or row[1] == pending]
          assert candidates, 'Phase 4 migration is missing from history.'
          assert not any(row[1] == pending for row in candidates), f'Phase 4 migration is unexpectedly applied: {candidates}'
          PY

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-certificate-production-dry-run
          path: |
            ${{ runner.temp }}/phase-4-production-dry-run.log
            ${{ runner.temp }}/phase-4-production-migration-history.log
          if-no-files-found: warn
          retention-days: 3
