name: Validate Certificate Master Bootstrap Phase 1D

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/validate-certificate-master-bootstrap-phase1d.yml'
      - 'docs/CERTIFICATE_MASTER_BOOTSTRAP_PHASE1D.md'
      - 'scripts/certificate-masters/cipmn-approved-completion-master.ts'
      - 'scripts/certificate-masters/cipmn-approved-completion-master.test.ts'
      - 'supabase/migrations/202608012400_certificate_template_contract_phase1d.sql'
      - 'supabase/tests/certificate_template_contract_phase1d_smoke.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certificate-master-bootstrap-phase1d-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict Phase 1D change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/supabase-integration...HEAD | sort > changed-files.txt
          cat > allowed-files.txt <<'FILES'
          .github/workflows/validate-certificate-master-bootstrap-phase1d.yml
          docs/CERTIFICATE_MASTER_BOOTSTRAP_PHASE1D.md
          scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          scripts/certificate-masters/cipmn-approved-completion-master.ts
          supabase/migrations/202608012400_certificate_template_contract_phase1d.sql
          supabase/tests/certificate_template_contract_phase1d_smoke.sql
          FILES
          sort -o allowed-files.txt allowed-files.txt
          diff -u allowed-files.txt changed-files.txt

      - name: Confirm protected authorities and approved legacy renderer are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/supabase-integration...HEAD -- \
            src/services/cipmnCertificateRenderer.ts \
            src/services/certificateService.ts \
            src/services/certificatePdfService.ts \
            src/services/examService.ts \
            src/services/financeConsoleService.ts \
            src/services/financeConsoleCompletionService.ts \
            supabase/functions/render-certificate-pdf/index.ts \
            supabase/functions/render-certificate-pdf/render.ts \
            supabase/functions/initialize-exam-payment/index.ts \
            supabase/functions/verify-exam-payment/index.ts \
            supabase/functions/paystack-webhook/index.ts
          ! grep -R -E "(insert|update|delete)[[:space:]]+.*(agilecert_issued_certificates|agilecert_certificate_eligibility_records|attempts|exam_orders|exam_payments)" \
            supabase/migrations/202608012400_certificate_template_contract_phase1d.sql \
            scripts/certificate-masters
          ! grep -R -E '(PAYSTACK_SECRET_KEY|sk_(live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,})' \
            docs/CERTIFICATE_MASTER_BOOTSTRAP_PHASE1D.md \
            scripts/certificate-masters \
            supabase/migrations/202608012400_certificate_template_contract_phase1d.sql \
            supabase/tests/certificate_template_contract_phase1d_smoke.sql
          grep -q 'renderCipmnCompletionCertificate' \
            src/services/cipmnCertificateRenderer.ts
          grep -q 'The source renderer remains unchanged' \
            docs/CERTIFICATE_MASTER_BOOTSTRAP_PHASE1D.md

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production application
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Type-check deterministic master generator
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto \
            scripts/certificate-masters/cipmn-approved-completion-master.ts
          deno check --node-modules-dir=auto \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts

      - name: Generate and test approved CIPMN master
        shell: bash
        env:
          PHASE1D_ARTIFACT_DIR: phase1d-artifacts
        run: |
          set -o pipefail
          rm -rf phase1d-artifacts phase1d-artifacts-repeat
          deno test --node-modules-dir=auto \
            --allow-env --allow-read --allow-write \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts \
            2>&1 | tee phase1d-master-tests.log
          grep -q 'certificateMasterBootstrapPhase1DVerified' \
            phase1d-master-tests.log
          test -s phase1d-artifacts/cipmn-approved-completion-master-v1.pdf
          test -s phase1d-artifacts/cipmn-approved-completion-overlay-v1.json
          test -s phase1d-artifacts/cipmn-approved-completion-manifest-v1.json
          test -s phase1d-artifacts/cipmn-approved-completion-rendered-sample-v1.pdf
          test -s phase1d-artifacts/cipmn-approved-completion-test-report-v1.json

          deno run --node-modules-dir=auto \
            --allow-read --allow-write \
            scripts/certificate-masters/cipmn-approved-completion-master.ts \
            phase1d-artifacts-repeat \
            > phase1d-repeat-manifest.log

          cmp \
            phase1d-artifacts/cipmn-approved-completion-master-v1.pdf \
            phase1d-artifacts-repeat/cipmn-approved-completion-master-v1.pdf
          cmp \
            phase1d-artifacts/cipmn-approved-completion-overlay-v1.json \
            phase1d-artifacts-repeat/cipmn-approved-completion-overlay-v1.json
          cmp \
            phase1d-artifacts/cipmn-approved-completion-manifest-v1.json \
            phase1d-artifacts-repeat/cipmn-approved-completion-manifest-v1.json

          sha256sum phase1d-artifacts/* \
            | sort > phase1d-artifact-sha256.txt
          cat phase1d-artifact-sha256.txt

      - name: Verify generated artifact contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path('phase1d-artifacts')
          manifest = json.loads(
              (root / 'cipmn-approved-completion-manifest-v1.json').read_text()
          )
          report = json.loads(
              (root / 'cipmn-approved-completion-test-report-v1.json').read_text()
          )
          required = {
              'holderName', 'examinationTitle', 'examinationCode', 'score',
              'completionDate', 'certificateNumber', 'verificationCode', 'qrCode'
          }
          assert set(manifest['requiredFields']) == required, manifest
          assert manifest['overlay']['elementCount'] == 8, manifest
          assert len(manifest['master']['sha256']) == 64, manifest
          assert manifest['master']['pageWidthPoints'] == 841.89, manifest
          assert manifest['master']['pageHeightPoints'] == 595.28, manifest
          assert report['deterministic'] is True, report
          assert report['pageCount'] == 1, report
          assert report['externalAssets'] == 0, report
          assert report['longNameTest'] is True, report
          assert report['longExaminationTitleTest'] is True, report
          assert report['qrGenerationTest'] is True, report
          print(json.dumps({
              'masterSha256': manifest['master']['sha256'],
              'masterBytes': manifest['master']['fileSizeBytes'],
              'overlaySha256': manifest['overlay']['sha256'],
              'renderedSha256': report['renderedSha256'],
              'requiredFields': sorted(required),
          }, indent=2))
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Neutralise production-only identity bootstrap in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          -- CI-only: production identity bootstrap is intentionally disabled.
          commit;
          SQL

      - name: Start database-only Supabase services
        shell: bash
        run: |
          set -euo pipefail
          excluded='gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor'
          if ! timeout --signal=TERM --kill-after=15s 180s \
            supabase start -x "$excluded" --ignore-health-check --debug \
            > phase1d-supabase-start.log 2>&1; then
            cat phase1d-supabase-start.log
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          cat phase1d-supabase-start.log
          exit 1

      - name: Apply complete migration history
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local 2>&1 | tee phase1d-db-reset.log
          grep -q 'Applying migration 202608011300_certificate_master_console_phase1a.sql' \
            phase1d-db-reset.log
          grep -q 'Applying migration 202608012100_certificate_visual_designer_phase1b.sql' \
            phase1d-db-reset.log
          grep -q 'Applying migration 202608012200_certificate_server_rendering_phase1c.sql' \
            phase1d-db-reset.log
          grep -q 'Applying migration 202608012300_certificate_renderer_examination_code_compatibility.sql' \
            phase1d-db-reset.log
          grep -q 'Applying migration 202608012400_certificate_template_contract_phase1d.sql' \
            phase1d-db-reset.log

      - name: Run certificate platform regression suites
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_management_console_phase1a_smoke.sql \
            2>&1 | tee phase1d-phase1a-regression.log
          grep -q 'certificateManagementConsolePhase1AVerified' \
            phase1d-phase1a-regression.log

          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_visual_designer_phase1b_smoke.sql \
            2>&1 | tee phase1d-phase1b-regression.log
          grep -q 'certificateVisualDesignerPhase1BVerified' \
            phase1d-phase1b-regression.log

          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_server_rendering_phase1c_smoke.sql \
            2>&1 | tee phase1d-phase1c-regression.log
          grep -q 'certificateServerRenderingPhase1CVerified' \
            phase1d-phase1c-regression.log

          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql \
            2>&1 | tee phase1d-examination-code-regression.log
          grep -q 'certificateRendererExaminationCodeCompatibilityVerified' \
            phase1d-examination-code-regression.log

      - name: Run Phase 1D template contract smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_template_contract_phase1d_smoke.sql \
            2>&1 | tee phase1d-contract-smoke.log
          grep -q 'certificateTemplateContractPhase1DVerified' \
            phase1d-contract-smoke.log

      - name: Verify controlled bootstrap architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CIPMN_COMPLETION_APPROVED' \
            scripts/certificate-masters/cipmn-approved-completion-master.ts
          grep -q 'fixedArtworkEmbedded: true' \
            scripts/certificate-masters/cipmn-approved-completion-master.ts
          grep -q 'referencedAssetsRequired: false' \
            scripts/certificate-masters/cipmn-approved-completion-master.ts
          grep -q 'certificate_admin_set_template_contract' \
            supabase/migrations/202608012400_certificate_template_contract_phase1d.sql
          grep -q "status not in ('draft', 'in_review')" \
            supabase/migrations/202608012400_certificate_template_contract_phase1d.sql
          grep -q 'template.contract.updated' \
            supabase/migrations/202608012400_certificate_template_contract_phase1d.sql
          grep -q 'A global assignment is prohibited' \
            docs/CERTIFICATE_MASTER_BOOTSTRAP_PHASE1D.md

      - name: Upload Phase 1D validation evidence and approved artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-master-bootstrap-phase1d-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            changed-files.txt
            allowed-files.txt
            phase1d-master-tests.log
            phase1d-repeat-manifest.log
            phase1d-artifact-sha256.txt
            phase1d-supabase-start.log
            phase1d-db-reset.log
            phase1d-phase1a-regression.log
            phase1d-phase1b-regression.log
            phase1d-phase1c-regression.log
            phase1d-examination-code-regression.log
            phase1d-contract-smoke.log
            phase1d-artifacts/

      - name: Stop isolated Supabase services
        if: always()
        run: timeout --signal=TERM --kill-after=10s 45s supabase stop --no-backup || true
