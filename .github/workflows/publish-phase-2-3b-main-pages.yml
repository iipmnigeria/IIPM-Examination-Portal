name: Publish Phase 2.3B to Main Pages Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/publish-phase-2-3b-main-pages.txt'

permissions:
  contents: write

concurrency:
  group: publish-phase-2-3b-main-pages
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish compiled bundle to configured main Pages source
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPROVED_APP_COMMIT: 'f3d6caae56e4a4ba9e0563a8549764d84dcc7f87'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout approved production application
        uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Confirm approved commit and Phase 2.3B source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          grep -q 'Material Management' src/components/AdminMaterialManagementPanel.tsx
          grep -q 'get_agilecert_material_admin_console' src/services/materialAdminService.ts
          grep -q 'AdminMaterialManagementLauncher' src/main.tsx

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Verify and fingerprint compiled bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Compiled output incorrectly references the Vite source entry.'
            exit 1
          fi
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          test "$(wc -c < "$js_file")" -gt 1000
          sha256sum "$js_file" | awk '{print $1}' | tee "$RUNNER_TEMP/expected-live-js.sha256"
          touch dist/.nojekyll

      - name: Overlay compiled deployment files on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/agilecert-main-pages
          git worktree add --detach /tmp/agilecert-main-pages origin/main

          rm -rf /tmp/agilecert-main-pages/assets
          cp -a dist/. /tmp/agilecert-main-pages/

          cd /tmp/agilecert-main-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html assets .nojekyll
          while IFS= read -r file; do
            case "$file" in
              index.html|.nojekyll) ;;
              *) git add -A -- "$file" ;;
            esac
          done < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -printf '%f\n')

          if git diff --cached --quiet; then
            echo 'The configured Pages source already contains the approved compiled bundle.'
          else
            git commit -m "Deploy Phase 2.3B ${APPROVED_APP_COMMIT}"
            git push origin HEAD:main
          fi

      - name: Wait for exact compiled live bundle
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(cat "$RUNNER_TEMP/expected-live-js.sha256")"
          success=0
          for attempt in $(seq 1 30); do
            status="$(curl -L -sS -o "$RUNNER_TEMP/live-index.html" -w '%{http_code}' "$LIVE_URL?phase23b-main=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = '200' ] \
              && grep -q 'AgileCert Global' "$RUNNER_TEMP/live-index.html" \
              && ! grep -q '/src/main.tsx' "$RUNNER_TEMP/live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/live-index.html" | head -n 1 | cut -d'"' -f2)"
              if [ -n "$asset" ]; then
                asset_url="$(python - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error "$asset_url?phase23b=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/live-app.js"; then
                  live_sha="$(sha256sum "$RUNNER_TEMP/live-app.js" | awk '{print $1}')"
                  echo "Expected JS SHA-256: $expected_sha"
                  echo "Live JS SHA-256:     $live_sha"
                  if [ "$live_sha" = "$expected_sha" ]; then
                    success=1
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-smoke"
          cd "$RUNNER_TEMP/live-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Render and inspect deployed portal
        shell: bash
        working-directory: ${{ runner.temp }}/live-smoke
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            const response = await page.goto(`${process.env.LIVE_URL}?phase23b-main-final=${process.env.GITHUB_RUN_ID}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(6000);

            const status = response ? response.status() : 0;
            const title = await page.title();
            const bodyText = (await page.locator('body').innerText()).trim();
            const root = page.locator('#root');
            const rootCount = await root.count();
            const rootHtml = rootCount ? (await root.innerHTML()).trim() : '';
            const bootShellVisible = await page.locator('#iipm-boot-shell').isVisible().catch(() => false);

            const report = {
              url: page.url(),
              status,
              title,
              bodyTextLength: bodyText.length,
              rootHtmlLength: rootHtml.length,
              bootShellVisible,
              pageErrors,
              consoleErrors,
              bodyPreview: bodyText.slice(0, 500),
            };

            fs.writeFileSync(`${process.env.RUNNER_TEMP}/live-phase-2-3b-main-report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${process.env.RUNNER_TEMP}/live-phase-2-3b-main.png`, fullPage: true });
            await browser.close();

            if (status !== 200) throw new Error(`Live portal returned HTTP ${status}.`);
            if (!/AgileCert Global/i.test(title)) throw new Error(`Unexpected page title: ${title}`);
            if (rootCount !== 1 || rootHtml.length < 100) throw new Error('The application root is blank or missing.');
            if (bodyText.length < 100) throw new Error('The rendered page has insufficient visible content.');
            if (bootShellVisible) throw new Error('The static loading shell did not hand over to React.');
            if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload final live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agilecert-phase-2-3b-main-evidence
          path: |
            ${{ runner.temp }}/expected-live-js.sha256
            ${{ runner.temp }}/live-index.html
            ${{ runner.temp }}/live-app.js
            ${{ runner.temp }}/live-phase-2-3b-main-report.json
            ${{ runner.temp }}/live-phase-2-3b-main.png
          if-no-files-found: warn
          retention-days: 3
