name: Correct AgileCert Pages Source and Verify Phase 6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/correct-agilecert-pages-source.txt'

permissions:
  contents: read
  pages: write

concurrency:
  group: correct-agilecert-pages-source
  cancel-in-progress: false

jobs:
  correct-and-verify:
    name: Publish main compiled bundle and verify live Adviser
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PHASE_6_COMMIT: '0233c69ddb0686b00df8b123f648fc63f323e05e'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout exact validated Phase 6 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE_6_COMMIT }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and fingerprint exact Phase 6 frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE_6_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'AI Certification Adviser' "$js_file"
          grep -q 'Catalogue-grounded guidance' "$js_file"
          sha256sum "$js_file" | awk '{print $1}' | tee "$RUNNER_TEMP/expected-live-js.sha256"

      - name: Verify main contains the exact compiled bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > "$RUNNER_TEMP/main-index.html"
          grep -q 'AgileCert Global' "$RUNNER_TEMP/main-index.html"
          ! grep -q '/src/main.tsx' "$RUNNER_TEMP/main-index.html"
          main_asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/main-index.html" | head -n 1 | cut -d'"' -f2)"
          test -n "$main_asset"
          git show "origin/main:${main_asset#./}" > "$RUNNER_TEMP/main-app.js"
          expected="$(cat "$RUNNER_TEMP/expected-live-js.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/main-app.js" | awk '{print $1}')"
          echo "Expected: $expected" | tee "$RUNNER_TEMP/main-bundle-verification.txt"
          echo "Main:     $actual" | tee -a "$RUNNER_TEMP/main-bundle-verification.txt"
          test "$actual" = "$expected"

      - name: Confirm incorrect Pages source before correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            > "$RUNNER_TEMP/pages-before.json"
          jq '{status, build_type, source, https_enforced}' "$RUNNER_TEMP/pages-before.json" \
            | tee "$RUNNER_TEMP/pages-before-sanitized.json"
          test "$(jq -r '.build_type' "$RUNNER_TEMP/pages-before.json")" = 'legacy'
          test "$(jq -r '.source.branch' "$RUNNER_TEMP/pages-before.json")" = 'supabase-integration'
          test "$(jq -r '.source.path' "$RUNNER_TEMP/pages-before.json")" = '/'

      - name: Change Pages source to compiled main root
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{build_type:"legacy",source:{branch:"main",path:"/"}}' \
            > "$RUNNER_TEMP/pages-update.json"
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            --input "$RUNNER_TEMP/pages-update.json"

      - name: Verify corrected Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 30); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/pages" \
              > "$RUNNER_TEMP/pages-after.json"
            branch="$(jq -r '.source.branch // ""' "$RUNNER_TEMP/pages-after.json")"
            path="$(jq -r '.source.path // ""' "$RUNNER_TEMP/pages-after.json")"
            echo "Attempt $attempt: ${branch}:${path}"
            if [ "$branch" = 'main' ] && [ "$path" = '/' ]; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" -eq 1
          jq '{status, build_type, source, https_enforced}' "$RUNNER_TEMP/pages-after.json" \
            | tee "$RUNNER_TEMP/pages-after-sanitized.json"

      - name: Ensure a Pages build is queued for main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages/builds" \
            > "$RUNNER_TEMP/pages-build-request.json" 2> "$RUNNER_TEMP/pages-build-request-error.txt"
          status=$?
          set -e
          echo "Pages build request exit status: $status" | tee "$RUNNER_TEMP/pages-build-request-status.txt"
          cat "$RUNNER_TEMP/pages-build-request-error.txt" || true

      - name: Wait for exact compiled Phase 6 live bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-live-js.sha256")"
          success=0
          for attempt in $(seq 1 60); do
            status="$(curl -L -sS -o "$RUNNER_TEMP/live-index.html" -w '%{http_code}' \
              "$LIVE_URL?phase6-pages-corrected=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = '200' ] \
              && grep -q 'AgileCert Global' "$RUNNER_TEMP/live-index.html" \
              && ! grep -q '/src/main.tsx' "$RUNNER_TEMP/live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/live-index.html" | head -n 1 | cut -d'"' -f2)"
              if [ -n "$asset" ]; then
                asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error \
                  "$asset_url?phase6-pages-corrected=${GITHUB_RUN_ID}-${attempt}" \
                  -o "$RUNNER_TEMP/live-app.js"; then
                  actual="$(sha256sum "$RUNNER_TEMP/live-app.js" | awk '{print $1}')"
                  echo "Expected: $expected"
                  echo "Live:     $actual"
                  if [ "$actual" = "$expected" ]; then
                    success=1
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-smoke"
          cd "$RUNNER_TEMP/live-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Browser-test live AI Certification Adviser
        shell: bash
        working-directory: ${{ runner.temp }}/live-smoke
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            const response = await page.goto(`${process.env.LIVE_URL}?phase6-browser=${process.env.GITHUB_RUN_ID}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(5000);

            const openButton = page.locator('button[aria-label="Open AgileCert AI Certification Adviser"]');
            await openButton.waitFor({ state: 'visible', timeout: 30000 });
            await openButton.click();

            const adviser = page.locator('section[aria-label="AgileCert AI Certification Adviser"]');
            await adviser.waitFor({ state: 'visible', timeout: 10000 });
            await adviser.locator('input[type="checkbox"]').check();
            await adviser.locator('textarea').fill('Which published examination can strengthen project planning skills?');
            await adviser.locator('button[aria-label="Send adviser message"]').click();
            await page.waitForFunction(() => {
              const panel = document.querySelector('section[aria-label="AgileCert AI Certification Adviser"]');
              return panel && panel.querySelectorAll('article').length >= 3;
            }, null, { timeout: 60000 });

            const panelText = (await adviser.innerText()).trim();
            const report = {
              status: response ? response.status() : 0,
              title: await page.title(),
              adviserVisible: await adviser.isVisible(),
              panelTextLength: panelText.length,
              containsCatalogueGuidance: /Catalogue-grounded guidance/i.test(panelText),
              containsAssistantResponse: adviser.locator('article').count ? (await adviser.locator('article').count()) >= 3 : false,
              pageErrors,
              consoleErrors,
              panelPreview: panelText.slice(0, 1200),
            };

            fs.writeFileSync(`${process.env.RUNNER_TEMP}/phase-6-live-browser-report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${process.env.RUNNER_TEMP}/phase-6-live-browser.png`, fullPage: true });
            await browser.close();

            if (report.status !== 200) throw new Error(`Live portal returned HTTP ${report.status}.`);
            if (!/AgileCert Global/i.test(report.title)) throw new Error(`Unexpected page title: ${report.title}`);
            if (!report.adviserVisible || report.panelTextLength < 200) throw new Error('AI Adviser did not render correctly.');
            if (!report.containsCatalogueGuidance || !report.containsAssistantResponse) throw new Error('AI Adviser response was not confirmed.');
            if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`Browser console errors: ${consoleErrors.join(' | ')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload final Pages correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-pages-correction-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/expected-live-js.sha256
            ${{ runner.temp }}/main-bundle-verification.txt
            ${{ runner.temp }}/pages-before-sanitized.json
            ${{ runner.temp }}/pages-after-sanitized.json
            ${{ runner.temp }}/pages-build-request-status.txt
            ${{ runner.temp }}/live-index.html
            ${{ runner.temp }}/live-app.js
            ${{ runner.temp }}/phase-6-live-browser-report.json
            ${{ runner.temp }}/phase-6-live-browser.png
