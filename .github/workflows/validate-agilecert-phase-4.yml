name: Validate AgileCert Phase 4

on:
  push:
    branches: [phase-4-certificate-payment-credential-issuance]
    paths:
      - 'src/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql'
      - 'supabase/functions/initialize-certificate-payment/**'
      - 'supabase/functions/verify-certificate-payment/**'
      - 'supabase/functions/paystack-certificate-webhook/**'
      - 'supabase/functions/_shared/agilecertCertificatePaystack.ts'
      - 'docs/AGILECERT_PHASE_4_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-4.yml'
      - '.github/workflows/validate-agilecert-phase-3.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'src/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql'
      - 'supabase/functions/initialize-certificate-payment/**'
      - 'supabase/functions/verify-certificate-payment/**'
      - 'supabase/functions/paystack-certificate-webhook/**'
      - 'supabase/functions/_shared/agilecertCertificatePaystack.ts'
      - 'docs/AGILECERT_PHASE_4_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-4.yml'
      - '.github/workflows/validate-agilecert-phase-3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 4 build, payment and credential controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify browser output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          grep -q 'root' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check certificate payment functions
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/initialize-certificate-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/verify-certificate-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/paystack-certificate-webhook/index.ts

      - name: Confirm exact backend scope
        shell: bash
        run: |
          set -euo pipefail
          migrations="$(git diff --name-only origin/supabase-integration...HEAD | grep '^supabase/migrations/' || true)"
          test "$migrations" = 'supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql'
          functions="$(git diff --name-only origin/supabase-integration...HEAD | grep '^supabase/functions/' | sort || true)"
          expected="$(printf '%s\n' \
            'supabase/functions/_shared/agilecertCertificatePaystack.ts' \
            'supabase/functions/initialize-certificate-payment/index.ts' \
            'supabase/functions/paystack-certificate-webhook/index.ts' \
            'supabase/functions/verify-certificate-payment/index.ts' | sort)"
          test "$functions" = "$expected"

      - name: Confirm pricing, order and fulfilment authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          sql = Path('supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql').read_text()
          required = [
              'agilecert_certificate_products',
              'agilecert_certificate_product_prices',
              'agilecert_certificate_orders',
              'agilecert_certificate_payments',
              'agilecert_paid_credentials',
              'agilecert_certificate_commerce_audits',
              'get_my_agilecert_certificate_commerce',
              'create_agilecert_certificate_order',
              'agilecert_issue_certificate_for_order',
              'fulfil_paid_agilecert_certificate_order',
              'waive_agilecert_certificate_order',
              'get_agilecert_certificate_commerce_admin_console',
              'upsert_agilecert_certificate_product_price',
              "interval '7 days'",
              "now() + interval '30 minutes'",
              "('achievement', 'NGN', 2000000, 2500000, true)",
              "('achievement', 'USD', 3500, 5000, true)",
              "('professional', 'NGN', 5000000, 7500000, true)",
              "('professional', 'USD', 6000, 7500, true)",
              'Verified payment or an authorised waiver is required',
              'to service_role',
              "notify pgrst, 'reload schema'",
          ]
          missing = [item for item in required if item not in sql]
          assert not missing, f'Missing Phase 4 authority controls: {missing}'
          assert 'v_product.requires_identity_verification' in sql
          assert 'Professional Certificate checkout will open after identity verification is available' in sql
          assert 'Professional Certificate issuance requires the identity-verification phase' in sql
          assert not re.search(r'insert\s+into\s+storage\.buckets', sql, re.I)
          PY

      - name: Confirm Paystack security and secret isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          paths = [
              'supabase/functions/_shared/agilecertCertificatePaystack.ts',
              'supabase/functions/initialize-certificate-payment/index.ts',
              'supabase/functions/verify-certificate-payment/index.ts',
              'supabase/functions/paystack-certificate-webhook/index.ts',
          ]
          code = '\n'.join(Path(path).read_text() for path in paths)
          required = [
              'AGILECERT_PAYSTACK_SECRET_KEY',
              'crypto.subtle.importKey',
              "hash: 'SHA-512'",
              'constantTimeEqual',
              'requireAuthenticatedUser',
              'create_agilecert_certificate_order',
              'fulfil_paid_agilecert_certificate_order',
              'transactionReference !== order.reference',
              'transactionCurrency !== order.currency.toUpperCase()',
              'requestedAmount !== Number(order.payable_amount_minor)',
              'transactionEmail',
              'verifyAgileCertCertificateWebhookSignature',
              'verifyAgileCertCertificateTransaction(reference)',
              'certificate_payment=callback',
          ]
          missing = [item for item in required if item not in code]
          assert not missing, f'Missing payment controls: {missing}'
          assert "Deno.env.get('PAYSTACK_SECRET_KEY')" not in code
          assert not re.search(r'(sk_live_|sk_test_|sb_secret_)[A-Za-z0-9_-]{12,}', code)
          frontend = '\n'.join(path.read_text(errors='ignore') for path in Path('src').rglob('*') if path.is_file())
          assert 'AGILECERT_PAYSTACK_SECRET_KEY' not in frontend
          assert 'SUPABASE_SERVICE_ROLE' not in frontend
          PY

      - name: Confirm candidate and administrator controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [
              'src/services/certificateCommerceService.ts',
              'src/components/CandidateCertificateCommerce.tsx',
              'src/components/CertificatePaymentReturnHandler.tsx',
              'src/components/AdminCertificateCommerceLauncher.tsx',
              'src/main.tsx',
          ]
          code = '\n'.join(Path(path).read_text() for path in files)
          required = [
              'get_my_agilecert_certificate_commerce',
              'initialize-certificate-payment',
              'verify-certificate-payment',
              'get_agilecert_certificate_commerce_admin_console',
              'waive_agilecert_certificate_order',
              'upsert_agilecert_certificate_product_price',
              'Certificate Payment & Credential Centre',
              'Examination and certificate fees are separate',
              'Professional Certificate checkout opens after the identity-verification phase',
              'Credential Store',
              'downloadBadge',
              'downloadTranscript',
              'Certificate Commerce Administration',
              'Authorised Certificate of Achievement waiver',
              "['exam_admin', 'super_admin']",
              'CandidateCertificateCommerce',
              'CertificatePaymentReturnHandler',
              'AdminCertificateCommerceLauncher',
          ]
          missing = [item for item in required if item not in code]
          assert not missing, f'Missing frontend controls: {missing}'
          PY

      - name: Confirm existing runtimes and later phases remain excluded
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/supabase-integration...HEAD)"
          forbidden='^src/services/(commerceService|examService|preparationMaterialService|materialAdminService)\.ts$|^src/components/(CandidateCommerceOverlay|PaymentReturnHandler|AdminCommerceConsole|ExamScreen|StudentDashboard|AdminPortal|CandidatePreparationMaterialsPanel|AdminMaterialManagementPanel)\.tsx$|^supabase/functions/(initialize-exam-payment|verify-exam-payment|paystack-webhook)/|^supabase/functions/_shared/paystack\.ts$'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            printf '%s\n' "$changed"
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import re

          sql = Path('supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql').read_text()
          forbidden = [
              r'create\s+table\s+(?:if\s+not\s+exists\s+)?public\.agilecert_identity_verification',
              r'create\s+or\s+replace\s+function\s+public\.agilecert_identity_provider',
              r'create\s+table\s+(?:if\s+not\s+exists\s+)?public\.agilecert_automation_job',
              r'create\s+or\s+replace\s+function\s+public\.agilecert_ai_adviser',
              r'create\s+table\s+(?:if\s+not\s+exists\s+)?public\.agilecert_email_delivery',
          ]
          found = [pattern for pattern in forbidden if re.search(pattern, sql, re.I | re.S)]
          assert not found, f'Excluded capability found: {found}'
          PY

      - name: Confirm registrations and scope document
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          config = Path('supabase/config.toml').read_text()
          for name in ['initialize-certificate-payment', 'verify-certificate-payment', 'paystack-certificate-webhook']:
              assert f'[functions.{name}]\nverify_jwt = false' in config
          scope = Path('docs/AGILECERT_PHASE_4_SCOPE.md').read_text()
          required = [
              'Passing an examination continues to establish eligibility only',
              'NGN 20,000',
              'USD 35',
              'NGN 50,000',
              'USD 60',
              '`AGILECERT_PAYSTACK_SECRET_KEY`',
              'Existing Phase 3 certificates are grandfathered',
              'No Phase 4 merge or deployment may occur without explicit approval',
          ]
          missing = [item for item in required if item not in scope]
          assert not missing, f'Missing scope statements: {missing}'
          PY
