name: Patch Original Phase 4 Credential Migration

on:
  push:
    branches: [phase-4-professional-credential-system]
    paths:
      - 'supabase/migrations/202607261200_phase_4_professional_credential_system.sql'
      - '.github/workflows/validate-agilecert-phase-4.yml'

permissions:
  contents: write

concurrency:
  group: patch-original-phase-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-professional-credential-system
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct migration queries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/202607261200_phase_4_professional_credential_system.sql')
          text = path.read_text()
          changed = False

          old = """from public.agilecert_issued_certificates certificate
join public.examinations examination on examination.id = certificate.examination_id
left join public.agilecert_credential_policies policy
  on policy.programme_id = examination.programme_id
 and policy.product_code = credential.product_code
 and policy.active = true
where certificate.id = credential.certificate_id;"""
          new = """from public.agilecert_issued_certificates certificate
join public.examinations examination on examination.id = certificate.examination_id
join public.agilecert_credential_policies policy
  on policy.programme_id = examination.programme_id
 and policy.active = true
where certificate.id = credential.certificate_id
  and policy.product_code = credential.product_code;"""

          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          if "'programmeTitle', programme.title" in text:
              text = text.replace("'programmeTitle', programme.title", "'programmeTitle', programme.name", 1)
              changed = True

          path.write_text(text)
          Path('.phase4_patch_changed').write_text('1' if changed else '0')
          PY

          grep -q "policy.product_code = credential.product_code;" supabase/migrations/202607261200_phase_4_professional_credential_system.sql
          grep -q "'programmeTitle', programme.name" supabase/migrations/202607261200_phase_4_professional_credential_system.sql
          ! grep -q "programme.title" supabase/migrations/202607261200_phase_4_professional_credential_system.sql

      - name: Commit correction when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat .phase4_patch_changed)" != '1' ]; then
            echo 'Migration is already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202607261200_phase_4_professional_credential_system.sql
          git commit -m 'Correct Phase 4 credential migration queries'
          git push origin HEAD:phase-4-professional-credential-system
