name: Verify Finance Console Phase 1 Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-finance-console-phase1-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-finance-console-phase1-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend deployments and live role authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPROVED_SOURCE_COMMIT: '0793caab245b0942bc4b779826a60a2f3a977a45'
      NAMECHEAP_SOURCE_COMMIT: '8d63470401630a5717823cdeaa4d136e5612ae1e'
      PAGES_TRIGGER_COMMIT: '067af8238af7a34856446baf48f40661dd148d80'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      PAGE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact approved Finance Console source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact approved frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npx vite build
          test -s dist/index.html
          grep -q 'Open Finance Console' src/components/AdminFinanceConsole.tsx
          grep -q 'Examination Fees' src/components/AdminFinanceConsole.tsx
          grep -q 'Permissions' src/components/AdminFinanceConsole.tsx
          grep -q 'get_finance_console_snapshot' src/services/financeConsoleService.ts
          grep -q 'finance_upsert_exam_price' src/services/financeConsoleService.ts

          python3 <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          html = Path('dist/index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The approved build did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          candidate = Path('dist') / relative.lstrip('./').lstrip('/')
          if not candidate.is_file():
              raise SystemExit(f'Approved bundle not found: {candidate}')
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          Path('finance-console-approved-bundle.json').write_text(
              json.dumps({'relativePath': relative, 'sha256': digest}, indent=2),
              encoding='utf-8',
          )
          print(json.dumps({'relativePath': relative, 'sha256': digest}, indent=2))
          PY

      - name: Confirm authorised Pages and Namecheap deployment runs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20" \
            -o finance-console-pages-runs.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-namecheap.yml/runs?branch=supabase-integration&event=push&per_page=30" \
            -o finance-console-namecheap-runs.json

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          def find_run(path, expected_sha, label):
              payload = json.loads(Path(path).read_text())
              matches = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == expected_sha
              ]
              if not matches:
                  raise SystemExit(f'No {label} run was found for {expected_sha}.')
              run = matches[0]
              if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  raise SystemExit(f'{label} run is not successful: {run}')
              return {
                  'runId': run.get('id'),
                  'headSha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'createdAt': run.get('created_at'),
                  'updatedAt': run.get('updated_at'),
              }

          result = {
              'githubPages': find_run(
                  'finance-console-pages-runs.json',
                  os.environ['PAGES_TRIGGER_COMMIT'],
                  'GitHub Pages deployment',
              ),
              'namecheap': find_run(
                  'finance-console-namecheap-runs.json',
                  os.environ['NAMECHEAP_SOURCE_COMMIT'],
                  'Namecheap deployment',
              ),
          }
          Path('finance-console-deployment-runs-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify the exact public GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="$(date +%s)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${PAGE_URL}?finance_console_release=${cache_buster}" \
            -o finance-console-live-index.html

          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path('finance-console-live-index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The live Pages document did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          live_url = urljoin('https://iipmnigeria.github.io/IIPM-Examination-Portal/', relative)
          Path('finance-console-live-bundle-url.txt').write_text(live_url, encoding='utf-8')
          print(live_url)
          PY

          live_bundle_url="$(cat finance-console-live-bundle-url.txt)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${live_bundle_url}?finance_console_release=${cache_buster}" \
            -o finance-console-live-bundle.js

          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          approved = json.loads(Path('finance-console-approved-bundle.json').read_text())
          live_bytes = Path('finance-console-live-bundle.js').read_bytes()
          live_text = live_bytes.decode('utf-8', errors='replace')
          live_hash = hashlib.sha256(live_bytes).hexdigest()
          required = [
              'Finance Console',
              'Examination Fees',
              'get_finance_console_snapshot',
              'finance_upsert_exam_price',
          ]
          missing = [marker for marker in required if marker not in live_text]
          if missing:
              raise SystemExit(f'Live Finance Console markers are missing: {missing}')
          if live_hash != approved['sha256']:
              raise SystemExit(
                  f"Live bundle hash {live_hash} does not match approved hash {approved['sha256']}"
              )
          result = {
              'pageUrl': 'https://iipmnigeria.github.io/IIPM-Examination-Portal/',
              'approvedSha256': approved['sha256'],
              'liveSha256': live_hash,
              'exactBundleVerified': True,
              'requiredMarkersPresent': required,
          }
          Path('finance-console-pages-verification-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Run rolled-back live finance role and fee lifecycle verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 <<'PY'
          import json
          from pathlib import Path

          sql = Path('supabase/tests/finance_console_phase1_smoke.sql').read_text(encoding='utf-8')
          sql = sql.replace('\\set ON_ERROR_STOP on\n\n', '', 1)
          sql += """
          select jsonb_build_object(
            'transactionRolledBack', true,
            'superAdminConsoleAuthorityVerified', true,
            'examAdminPermissionRevocationVerified', true,
            'examAdminPermissionRestoreVerified', true,
            'examinationFeeLifecycleVerified', true,
            'immutableFinanceAuditVerified', true,
            'candidateFinanceAccessDenied', true,
            'legacyPriceRpcDenied', true
          ) as verification;
          """
          Path('/tmp/finance-console-live-role-test.json').write_text(
              json.dumps({'query': sql}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/finance-console-live-role-test.json \
            -o finance-console-live-role-test.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('finance-console-live-role-test.json').read_text())
          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit(f'Unexpected production role-test response: {data}')
          result = data[0].get('verification') or {}
          expected = [
              'transactionRolledBack',
              'superAdminConsoleAuthorityVerified',
              'examAdminPermissionRevocationVerified',
              'examAdminPermissionRestoreVerified',
              'examinationFeeLifecycleVerified',
              'immutableFinanceAuditVerified',
              'candidateFinanceAccessDenied',
              'legacyPriceRpcDenied',
          ]
          if not all(result.get(key) is True for key in expected):
              raise SystemExit(f'Finance role verification failed: {result}')
          Path('finance-console-live-role-test-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload sanitized release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-console-phase1-production-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            finance-console-approved-bundle.json
            finance-console-deployment-runs-safe.json
            finance-console-pages-verification-safe.json
            finance-console-live-role-test-safe.json
