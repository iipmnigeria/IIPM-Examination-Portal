name: Deploy Phase 4 Certificate Commerce

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-4-certificate-production.txt'

permissions:
  contents: read

concurrency:
  group: phase-4-certificate-commerce-production
  cancel-in-progress: false

jobs:
  deploy-certificate-commerce:
    name: Apply Phase 4 migration and deploy certificate payment functions
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      AGILECERT_PAYSTACK_SECRET_KEY: ${{ secrets.AGILECERT_PAYSTACK_SECRET_KEY }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'a0aca15360c07d2e2f6bada0cf80cd35060bb9ae'
      CERTIFICATE_VERSION: '202607240105'
      CERTIFICATE_FILE: supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql
      SUPABASE_WORKDIR: /tmp/agilecert-phase-4-production
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout exact approved application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate controlled deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$AGILECERT_PAYSTACK_SECRET_KEY"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$CERTIFICATE_FILE"
          test -s supabase/functions/initialize-certificate-payment/index.ts
          test -s supabase/functions/verify-certificate-payment/index.ts
          test -s supabase/functions/paystack-certificate-webhook/index.ts
          test -s supabase/functions/_shared/agilecertCertificatePaystack.ts
          python3 <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql').read_text()
          required = [
              'agilecert_certificate_products',
              'agilecert_certificate_product_prices',
              'agilecert_certificate_orders',
              'agilecert_certificate_payments',
              'agilecert_paid_credentials',
              'agilecert_certificate_commerce_audits',
              'create_agilecert_certificate_order',
              'fulfil_paid_agilecert_certificate_order',
              'waive_agilecert_certificate_order',
              'get_my_agilecert_certificate_commerce',
              'get_agilecert_certificate_commerce_admin_console',
              'upsert_agilecert_certificate_product_price',
              "('achievement', 'NGN', 2000000, 2500000, true)",
              "('achievement', 'USD', 3500, 5000, true)",
              "('professional', 'NGN', 5000000, 7500000, true)",
              "('professional', 'USD', 6000, 7500, true)",
              'identity_verification_required',
          ]
          missing = [marker for marker in required if marker not in migration]
          if missing:
              raise SystemExit(f'Missing Phase 4 controls: {missing}')

          config = Path('supabase/config.toml').read_text()
          for name in ['initialize-certificate-payment', 'verify-certificate-payment', 'paystack-certificate-webhook']:
              marker = f'[functions.{name}]\nverify_jwt = false'
              if marker not in config:
                  raise SystemExit(f'Missing function registration: {name}')

          helper = Path('supabase/functions/_shared/agilecertCertificatePaystack.ts').read_text()
          if "Deno.env.get('AGILECERT_PAYSTACK_SECRET_KEY')" not in helper:
              raise SystemExit('Certificate Paystack secret isolation is missing.')
          if 'PAYSTACK_SECRET_KEY' in helper.replace('AGILECERT_PAYSTACK_SECRET_KEY', ''):
              raise SystemExit('Existing examination Paystack secret was referenced.')

          forbidden = [
              r'create\s+table.*identity_verification',
              r'create\s+or\s+replace\s+function.*identity_provider',
              r'create\s+table.*automation_job',
              r'create\s+or\s+replace\s+function.*ai_adviser',
          ]
          found = [pattern for pattern in forbidden if re.search(pattern, migration, re.I | re.S)]
          if found:
              raise SystemExit(f'Excluded later-phase implementation found: {found}')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare isolated migration workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          for migration in \
            202607230101_phase_2_candidate_profile_foundation.sql \
            202607230102_phase_2_candidate_profile_photo.sql \
            202607240101_phase_2_3a_preparation_material_entitlements.sql \
            202607240102_phase_2_3b_material_admin_tools.sql \
            202607240103_phase_2_4_secure_material_delivery.sql \
            202607240104_phase_3_certificate_eligibility_issuance_verification.sql \
            202607240105_phase_4_certificate_payment_credential_issuance.sql; do
            cp "supabase/migrations/$migration" "$SUPABASE_WORKDIR/supabase/migrations/"
          done
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Link production Supabase
        shell: bash
        working-directory: /tmp/agilecert-phase-4-production
        run: |
          set -euo pipefail
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply only Phase 4
        shell: bash
        working-directory: /tmp/agilecert-phase-4-production
        run: |
          set +e
          output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-4-production-dry-run.log"
          test "$status" -eq 0
          if printf '%s\n' "$output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 4 migration is already applied.'
          else
            pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            test "$pending" = "$(basename "$CERTIFICATE_FILE")"
            npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --yes \
              2>&1 | tee "$RUNNER_TEMP/phase-4-production-apply.log"
          fi

      - name: Verify migration history and deployed schema
        shell: bash
        working-directory: /tmp/agilecert-phase-4-production
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase-4-production-migration-history.log"
          schema="$RUNNER_TEMP/phase-4-public-schema.sql"
          npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history"
          python3 - "$history" <<'PY'
          from pathlib import Path
          import sys

          expected = ['202607230101','202607230102','202607240101','202607240102','202607240103','202607240104','202607240105']
          rows = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              if '|' in line:
                  parts = [part.strip().strip('`') for part in line.split('|')]
                  if len(parts) >= 3:
                      rows.append(parts)
          for version in expected:
              if not any(row[0] == version and row[1] == version for row in rows):
                  raise SystemExit(f'Migration {version} is not recorded locally and remotely.')
          PY
          npx --yes supabase@latest db dump --linked --schema public --file "$schema" --password "$SUPABASE_DB_PASSWORD"
          test -s "$schema"
          for marker in \
            agilecert_certificate_products \
            agilecert_certificate_product_prices \
            agilecert_certificate_orders \
            agilecert_certificate_payments \
            agilecert_paid_credentials \
            agilecert_certificate_commerce_audits \
            create_agilecert_certificate_order \
            fulfil_paid_agilecert_certificate_order \
            waive_agilecert_certificate_order \
            get_my_agilecert_certificate_commerce \
            get_agilecert_certificate_commerce_admin_console \
            upsert_agilecert_certificate_product_price; do
            grep -q "$marker" "$schema"
          done

      - name: Configure certificate payment runtime secret
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "AGILECERT_PAYSTACK_SECRET_KEY=$AGILECERT_PAYSTACK_SECRET_KEY" \
            "IIPM_PORTAL_URL=$LIVE_URL" \
            2>&1 | tee "$RUNNER_TEMP/phase-4-secrets-set.log"

      - name: Deploy approved certificate payment functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in \
            initialize-certificate-payment \
            verify-certificate-payment \
            paystack-certificate-webhook; do
            npx --yes supabase@latest functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt \
              2>&1 | tee -a "$RUNNER_TEMP/phase-4-functions-deploy.log"
          done

      - name: Verify active functions and security probes
        shell: bash
        run: |
          set -euo pipefail
          functions_log="$RUNNER_TEMP/phase-4-functions-list.log"
          npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee "$functions_log"
          for function_name in \
            initialize-exam-payment \
            verify-exam-payment \
            paystack-webhook \
            agilecert-material-delivery \
            initialize-certificate-payment \
            verify-certificate-payment \
            paystack-certificate-webhook; do
            grep -q "$function_name" "$functions_log"
          done

          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          init_status="$(curl -sS -o "$RUNNER_TEMP/initialize-certificate-payment-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/initialize-certificate-payment")"
          verify_status="$(curl -sS -o "$RUNNER_TEMP/verify-certificate-payment-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/verify-certificate-payment")"
          webhook_status="$(curl -sS -o "$RUNNER_TEMP/paystack-certificate-webhook-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "$base/paystack-certificate-webhook")"

          echo "initialize-certificate-payment HTTP $init_status" | tee "$RUNNER_TEMP/phase-4-function-probes.log"
          echo "verify-certificate-payment HTTP $verify_status" | tee -a "$RUNNER_TEMP/phase-4-function-probes.log"
          echo "paystack-certificate-webhook HTTP $webhook_status" | tee -a "$RUNNER_TEMP/phase-4-function-probes.log"

          test "$init_status" = '400'
          test "$verify_status" = '400'
          test "$webhook_status" = '401'
          grep -Eqi 'authentication is required|authorization' "$RUNNER_TEMP/initialize-certificate-payment-probe.json"
          grep -Eqi 'authentication is required|authorization' "$RUNNER_TEMP/verify-certificate-payment-probe.json"
          grep -q 'Invalid Paystack signature' "$RUNNER_TEMP/paystack-certificate-webhook-probe.json"

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-certificate-production-deployment-evidence
          path: |
            ${{ runner.temp }}/phase-4-production-dry-run.log
            ${{ runner.temp }}/phase-4-production-apply.log
            ${{ runner.temp }}/phase-4-production-migration-history.log
            ${{ runner.temp }}/phase-4-public-schema.sql
            ${{ runner.temp }}/phase-4-secrets-set.log
            ${{ runner.temp }}/phase-4-functions-deploy.log
            ${{ runner.temp }}/phase-4-functions-list.log
            ${{ runner.temp }}/phase-4-function-probes.log
            ${{ runner.temp }}/initialize-certificate-payment-probe.json
            ${{ runner.temp }}/verify-certificate-payment-probe.json
            ${{ runner.temp }}/paystack-certificate-webhook-probe.json
          if-no-files-found: warn
          retention-days: 3
