name: Apply Commerce Modal Auto-Close

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-commerce-auto-close.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'auto-close-commerce-success'
    name: Patch, validate and commit commerce auto-close
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-close-commerce-success
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply focused frontend changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          overlay = Path('src/components/CandidateCommerceOverlay.tsx')
          text = overlay.read_text(encoding='utf-8')

          quote_anchor = "      setQuote(nextQuote);\n      setMessage("
          quote_replacement = """      const accessQuote = nextQuote as PurchaseQuote & {
                status?: string;
                canLaunch?: boolean;
              };

              if (accessQuote.canLaunch || accessQuote.status === 'already_unlocked') {
                await refreshCatalogue();
                window.dispatchEvent(new Event('iipm-commerce-refresh'));
                setSelectedTest(null);
                return;
              }

              setQuote(nextQuote);
              setMessage("""
          if text.count(quote_anchor) != 1:
              raise SystemExit(f'Expected one quote anchor, found {text.count(quote_anchor)}')
          text = text.replace(quote_anchor, quote_replacement, 1)

          success_message = "        setMessage('Examination unlocked successfully. You may now launch the secured session.');\n"
          if text.count(success_message) != 1:
              raise SystemExit(f'Expected one success message, found {text.count(success_message)}')
          text = text.replace(success_message, '', 1)

          success_marker = "      if (nextOrder.canLaunch || ['waived', 'already_unlocked'].includes(nextOrder.status)) {"
          marker_index = text.find(success_marker)
          if marker_index < 0:
              raise SystemExit('Successful order marker was not found')
          block_end = text.find('\n      }', marker_index)
          if block_end < 0:
              raise SystemExit('Successful order block end was not found')
          block = text[marker_index:block_end]
          return_anchor = '        return;'
          if block.count(return_anchor) != 1:
              raise SystemExit('Successful order return anchor is not unique')
          block = block.replace(return_anchor, '        setSelectedTest(null);\n        return;', 1)
          text = text[:marker_index] + block + text[block_end:]
          overlay.write_text(text, encoding='utf-8')

          payment = Path('src/components/PaymentReturnHandler.tsx')
          payment_text = payment.read_text(encoding='utf-8')
          idle_anchor = "  if (state === 'idle') return null;"
          auto_close = """  useEffect(() => {
                if (state !== 'success') return;

                const closeTimer = window.setTimeout(() => {
                  clearPaymentParameters();
                  setState('idle');
                }, 1200);

                return () => window.clearTimeout(closeTimer);
              }, [state]);

              if (state === 'idle') return null;"""
          if payment_text.count(idle_anchor) != 1:
              raise SystemExit(f'Expected one payment idle anchor, found {payment_text.count(idle_anchor)}')
          payment.write_text(payment_text.replace(idle_anchor, auto_close, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Remove one-time patch workflow and commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-commerce-auto-close.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CandidateCommerceOverlay.tsx src/components/PaymentReturnHandler.tsx .github/workflows/apply-commerce-auto-close.yml
          git diff --cached --check
          git commit -m 'Close commerce popups automatically after success'
          git push origin HEAD:auto-close-commerce-success
