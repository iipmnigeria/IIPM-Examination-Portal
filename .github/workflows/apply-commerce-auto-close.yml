name: Apply Commerce Modal Auto-Close

on:
  push:
    branches: [auto-close-commerce-success]
    paths:
      - '.github/workflows/apply-commerce-auto-close.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Patch, validate and commit commerce auto-close
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-close-commerce-success
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused frontend changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          overlay = Path('src/components/CandidateCommerceOverlay.tsx')
          text = overlay.read_text(encoding='utf-8')

          old_quote = """      const nextQuote = await quoteExamPurchase({
                examinationId: selectedTest.id,
                currency,
                couponCode,
              });
              setQuote(nextQuote);
              setMessage(
          """
          new_quote = """      const nextQuote = await quoteExamPurchase({
                examinationId: selectedTest.id,
                currency,
                couponCode,
              });
              const accessQuote = nextQuote as PurchaseQuote & {
                status?: string;
                canLaunch?: boolean;
              };

              if (accessQuote.canLaunch || accessQuote.status === 'already_unlocked') {
                await refreshCatalogue();
                window.dispatchEvent(new Event('iipm-commerce-refresh'));
                setSelectedTest(null);
                return;
              }

              setQuote(nextQuote);
              setMessage(
          """
          if text.count(old_quote) != 1:
              raise SystemExit(f'Expected one quote block, found {text.count(old_quote)}')
          text = text.replace(old_quote, new_quote, 1)

          old_success = """      if (nextOrder.canLaunch || ['waived', 'already_unlocked'].includes(nextOrder.status)) {
                setMessage('Examination unlocked successfully. You may now launch the secured session.');
                await refreshCatalogue();
                window.dispatchEvent(new Event('iipm-commerce-refresh'));
                return;
              }
          """
          new_success = """      if (nextOrder.canLaunch || ['waived', 'already_unlocked'].includes(nextOrder.status)) {
                await refreshCatalogue();
                window.dispatchEvent(new Event('iipm-commerce-refresh'));
                setSelectedTest(null);
                return;
              }
          """
          if text.count(old_success) != 1:
              raise SystemExit(f'Expected one successful order block, found {text.count(old_success)}')
          overlay.write_text(text.replace(old_success, new_success, 1), encoding='utf-8')

          payment = Path('src/components/PaymentReturnHandler.tsx')
          payment_text = payment.read_text(encoding='utf-8')
          anchor = """  useEffect(() => {
                if (!shouldVerify) return;
                void verify();
              }, [shouldVerify, reference]);

              if (state === 'idle') return null;
          """
          replacement = """  useEffect(() => {
                if (!shouldVerify) return;
                void verify();
              }, [shouldVerify, reference]);

              useEffect(() => {
                if (state !== 'success') return;

                const closeTimer = window.setTimeout(() => {
                  clearPaymentParameters();
                  setState('idle');
                }, 1200);

                return () => window.clearTimeout(closeTimer);
              }, [state]);

              if (state === 'idle') return null;
          """
          if payment_text.count(anchor) != 1:
              raise SystemExit(f'Expected one payment success anchor, found {payment_text.count(anchor)}')
          payment.write_text(payment_text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Remove one-time patch workflow and commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-commerce-auto-close.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CandidateCommerceOverlay.tsx src/components/PaymentReturnHandler.tsx .github/workflows/apply-commerce-auto-close.yml
          git diff --cached --check
          git commit -m 'Close commerce popups automatically after success'
          git push origin HEAD:auto-close-commerce-success
