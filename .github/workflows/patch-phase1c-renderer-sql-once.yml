name: Complete Phase 1C Branch Cleanup Once

on:
  push:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/patch-phase1c-renderer-sql-once.yml'

permissions:
  contents: write

concurrency:
  group: patch-phase1c-renderer-sql-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/certificate-server-rendering-phase1c
          fetch-depth: 0

      - name: Preserve SQL correction and remove temporary controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v_before := to_jsonb(v_assignment);' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          ! grep -q 'select to_jsonb(assignment), assignment' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql

          rm -f \
            .github/workflows/materialize-certificate-server-rendering-phase1c.yml \
            .github/workflows/patch-certificate-server-rendering-phase1c-sql.yml \
            deployment-triggers/materialize-certificate-server-rendering-phase1c.txt \
            deployment-triggers/patch-certificate-server-rendering-phase1c-sql.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/materialize-certificate-server-rendering-phase1c.yml \
            .github/workflows/patch-certificate-server-rendering-phase1c-sql.yml \
            deployment-triggers/materialize-certificate-server-rendering-phase1c.txt \
            deployment-triggers/patch-certificate-server-rendering-phase1c-sql.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary Phase 1C patch controls'
            git push origin HEAD:feature/certificate-server-rendering-phase1c
          fi

      - name: Remove this one-use workflow from source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin supabase-integration
          git checkout -B supabase-integration origin/supabase-integration
          rm -f .github/workflows/patch-phase1c-renderer-sql-once.yml
          git add .github/workflows/patch-phase1c-renderer-sql-once.yml
          git diff --cached --check
          git commit -m 'Remove one-use Phase 1C SQL patch control'
          git push origin HEAD:supabase-integration
