name: Deploy Finance Console Phase 1B Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-finance-console-phase1b-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: finance-console-phase1b-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy and verify Finance Console Phase 1B
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_COMMIT: '1a9d6f44f3423b7757f9a07f809fccf46765fe42'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact approved Phase 1B source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify approved source and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > phase1b-expected-migrations.txt <<'EOF'
          202607311100_finance_console_certification_products_fees.sql
          202607311101_finance_console_certification_pricing_rules.sql
          202607311102_finance_console_certification_identity_route_hardening.sql
          EOF
          sort -o phase1b-expected-migrations.txt phase1b-expected-migrations.txt

          while read -r migration; do
            test -s "supabase/migrations/$migration"
          done < phase1b-expected-migrations.txt

          test -s src/components/FinanceCertificationFeesPanel.tsx
          test -s src/components/AdminFinanceConsole.tsx
          test -s src/services/financeConsoleService.ts
          test -s src/services/certificateCommerceService.ts
          test -s supabase/tests/finance_console_phase1b_certification_fees_smoke.sql
          test -s supabase/tests/finance_console_phase1b_certification_rules_smoke.sql
          test -s supabase/tests/finance_console_phase1b_identity_route_smoke.sql

          grep -q 'finance.certificate_prices.manage' supabase/migrations/202607311100_finance_console_certification_products_fees.sql
          grep -q 'get_finance_certification_snapshot' supabase/migrations/202607311100_finance_console_certification_products_fees.sql
          grep -q 'agilecert_certificate_product_scopes' supabase/migrations/202607311101_finance_console_certification_pricing_rules.sql
          grep -q 'agilecert_resolve_certificate_pricing' supabase/migrations/202607311101_finance_console_certification_pricing_rules.sql
          grep -q 'create_agilecert_professional_certificate_order' supabase/migrations/202607311102_finance_console_certification_identity_route_hardening.sql
          grep -q 'Professional requests are always routed' supabase/migrations/202607311102_finance_console_certification_identity_route_hardening.sql

          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]+' \
            src/components/FinanceCertificationFeesPanel.tsx \
            src/components/AdminFinanceConsole.tsx \
            src/services/financeConsoleService.ts \
            src/services/certificateCommerceService.ts \
            supabase/migrations/20260731110*.sql

      - name: Build exact approved frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          NODE_ENV=production npx vite build
          test -s dist/index.html
          grep -q 'Certification Fees' src/components/AdminFinanceConsole.tsx
          grep -q 'Certification pricing rule' src/components/FinanceCertificationFeesPanel.tsx
          grep -q 'Programme and examination applicability' src/components/FinanceCertificationFeesPanel.tsx
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'Certification Fees' "$js_file"
          grep -q 'Included with examination' "$js_file"
          sha256sum "$js_file" > phase1b-approved-bundle.sha256

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require exactly the three approved Phase 1B migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 | tee phase1b-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' phase1b-production-dry-run.log \
            | sort -u > phase1b-production-pending.txt || true
          diff -u phase1b-expected-migrations.txt phase1b-production-pending.txt
          test "$(wc -l < phase1b-production-pending.txt | tr -d ' ')" -eq 3

      - name: Apply approved Phase 1B migrations
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked 2>&1 | tee phase1b-production-deploy.log
          while read -r migration; do
            grep -q "Applying migration $migration" phase1b-production-deploy.log
          done < phase1b-expected-migrations.txt
          grep -q 'Finished supabase db push' phase1b-production-deploy.log

      - name: Verify production certification finance authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          select jsonb_build_object(
            'certificateTables', (
              select count(*) from pg_tables
              where schemaname = 'public'
                and tablename in (
                  'agilecert_certificate_products',
                  'agilecert_certificate_product_prices',
                  'agilecert_certificate_product_scopes'
                )
            ),
            'scopeRls', coalesce((
              select rowsecurity from pg_tables
              where schemaname = 'public'
                and tablename = 'agilecert_certificate_product_scopes'
            ), false),
            'pricingModeColumn', exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'agilecert_certificate_product_prices'
                and column_name = 'pricing_mode'
            ),
            'certificateProducts', (
              select count(*) from public.agilecert_certificate_products
            ),
            'certificatePermission', exists (
              select 1 from public.agilecert_finance_permission_definitions
              where permission_key = 'finance.certificate_prices.manage'
                and is_active = true
            ),
            'snapshotFunction', to_regprocedure(
              'public.get_finance_certification_snapshot(integer)'
            ) is not null,
            'pricingRuleFunction', to_regprocedure(
              'public.finance_upsert_certificate_product_price_rule(text,text,bigint,bigint,text,text[],timestamptz,timestamptz,boolean,text)'
            ) is not null,
            'scopeFunction', to_regprocedure(
              'public.finance_upsert_certificate_product_scope(uuid,text,text,uuid,uuid,boolean,text)'
            ) is not null,
            'candidateAchievementOrderFunction', to_regprocedure(
              'public.create_agilecert_certificate_order(uuid,text,text)'
            ) is not null,
            'candidateProfessionalOrderFunction', to_regprocedure(
              'public.create_agilecert_professional_certificate_order(uuid,text)'
            ) is not null,
            'authenticatedCandidateOrderExecute',
              has_function_privilege(
                'authenticated',
                'public.create_agilecert_certificate_order(uuid,text,text)',
                'execute'
              )
              and has_function_privilege(
                'authenticated',
                'public.create_agilecert_professional_certificate_order(uuid,text)',
                'execute'
              ),
            'internalNoChargeExposed',
              has_function_privilege(
                'authenticated',
                'public.agilecert_create_no_charge_certificate_order(uuid,text,text,boolean)',
                'execute'
              )
              or has_function_privilege(
                'anon',
                'public.agilecert_create_no_charge_certificate_order(uuid,text,text,boolean)',
                'execute'
              ),
            'internalLegacyExposed',
              has_function_privilege(
                'authenticated',
                'public.create_agilecert_certificate_order_phase1b_legacy(uuid,text,text)',
                'execute'
              )
              or has_function_privilege(
                'authenticated',
                'public.create_agilecert_professional_certificate_order_phase1b_legacy(uuid,text)',
                'execute'
              ),
            'authenticatedScopeTableAccess',
              has_table_privilege(
                'authenticated',
                'public.agilecert_certificate_product_scopes',
                'select'
              )
          ) as verification;
          """
          Path('/tmp/phase1b-production-verify.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/phase1b-production-verify.json \
            -o phase1b-production-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('phase1b-production-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('certificateTables') == 3, result
          assert result.get('scopeRls') is True, result
          assert result.get('pricingModeColumn') is True, result
          assert result.get('certificateProducts') == 2, result
          assert result.get('certificatePermission') is True, result
          assert result.get('snapshotFunction') is True, result
          assert result.get('pricingRuleFunction') is True, result
          assert result.get('scopeFunction') is True, result
          assert result.get('candidateAchievementOrderFunction') is True, result
          assert result.get('candidateProfessionalOrderFunction') is True, result
          assert result.get('authenticatedCandidateOrderExecute') is True, result
          assert result.get('internalNoChargeExposed') is False, result
          assert result.get('internalLegacyExposed') is False, result
          assert result.get('authenticatedScopeTableAccess') is False, result
          Path('phase1b-production-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Run rolled-back production Phase 1B lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            supabase/tests/finance_console_phase1b_certification_fees_smoke.sql \
            supabase/tests/finance_console_phase1b_certification_rules_smoke.sql \
            supabase/tests/finance_console_phase1b_identity_route_smoke.sql
          do
            test_name="$(basename "$test_file" .sql)"
            TEST_FILE="$test_file" TEST_NAME="$test_name" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['TEST_FILE'])
          test_name = os.environ['TEST_NAME']
          sql = path.read_text(encoding='utf-8')
          sql = sql.replace('\\set ON_ERROR_STOP on\n\n', '', 1)
          prefix, marker, suffix = sql.rpartition('rollback;')
          assert marker, f'No rollback marker in {path}'
          sql = prefix + f"""
          select jsonb_build_object(
            'test', '{test_name}',
            'passed', true,
            'transactionRolledBack', true
          ) as verification;
          rollback;
          """ + suffix
          Path(f'/tmp/{test_name}.json').write_text(
              json.dumps({'query': sql}), encoding='utf-8'
          )
          PY

            curl --fail-with-body --silent --show-error \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary "@/tmp/${test_name}.json" \
              -o "${test_name}-production.json"

            TEST_NAME="$test_name" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          test_name = os.environ['TEST_NAME']
          data = json.loads(Path(f'{test_name}-production.json').read_text())
          assert isinstance(data, list) and data, data
          result = None
          for row in reversed(data):
              if isinstance(row, dict) and isinstance(row.get('verification'), dict):
                  candidate = row['verification']
                  if candidate.get('test') == test_name:
                      result = candidate
                      break
          assert result is not None, data
          assert result.get('passed') is True, result
          assert result.get('transactionRolledBack') is True, result
          Path(f'{test_name}-production-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY
          done

      - name: Confirm production migration ledger is current
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 | tee phase1b-post-deploy-dry-run.log
          while read -r migration; do
            ! grep -q "$migration" phase1b-post-deploy-dry-run.log
          done < phase1b-expected-migrations.txt
          grep -q 'Remote database is up to date' phase1b-post-deploy-dry-run.log

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-console-phase1b-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase1b-expected-migrations.txt
            phase1b-approved-bundle.sha256
            phase1b-production-dry-run.log
            phase1b-production-pending.txt
            phase1b-production-deploy.log
            phase1b-production-safe.json
            finance_console_phase1b_certification_fees_smoke-production-safe.json
            finance_console_phase1b_certification_rules_smoke-production-safe.json
            finance_console_phase1b_identity_route_smoke-production-safe.json
            phase1b-post-deploy-dry-run.log
