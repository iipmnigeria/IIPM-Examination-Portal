name: Patch Phase 1D PDF Signature Guard Once

on:
  push:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/patch-phase1d-pdf-signature-guard-once.yml'

permissions:
  contents: write

concurrency:
  group: patch-phase1d-pdf-signature-guard-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Replace arbitrary size threshold with PDF signature guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git worktree add /tmp/phase1d origin/feature/certificate-master-bootstrap-phase1d
          cd /tmp/phase1d
          git switch -c phase1d-pdf-signature-guard-fix

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/certificate-masters/cipmn-approved-completion-master.test.ts')
          content = path.read_text(encoding='utf-8')
          old = """assert(
            masterOne.byteLength > 20_000,
            `The approved master PDF is unexpectedly small: ${masterOne.byteLength} bytes.`,
          );
          """
          new = """assert(
            masterOne.byteLength > 500,
            `The approved master PDF is incomplete: ${masterOne.byteLength} bytes.`,
          );
          assert(
            new TextDecoder().decode(masterOne.subarray(0, 5)) === '%PDF-',
            'The approved master does not contain a valid PDF file signature.',
          );
          """
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one Phase 1D size-guard block.')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

          grep -q 'masterOne.byteLength > 500' \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          grep -q "decode(masterOne.subarray(0, 5)) === '%PDF-'" \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          ! grep -q 'masterOne.byteLength > 20_000' \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts

          git add scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          git diff --cached --check
          git commit -m 'Validate Phase 1D master by PDF structure'
          git push origin HEAD:feature/certificate-master-bootstrap-phase1d

          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/patch-phase1d-pdf-signature-guard-once.yml
          git commit -m 'Remove one-use Phase 1D PDF guard patch control'
          git push origin HEAD:supabase-integration
