name: Dry Run Phase 3 Certificate Authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-3-certificate-dry-run.txt'

permissions:
  contents: read

concurrency:
  group: phase-3-certificate-authority-dry-run
  cancel-in-progress: false

jobs:
  verify-production-plan:
    name: Verify Phase 3 production migration plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'ba67bfab9b5f26a58b018ae284c1d76c770416d6'
      PROFILE_VERSION: '202607230101'
      PHOTO_VERSION: '202607230102'
      ENTITLEMENT_VERSION: '202607240101'
      MATERIAL_ADMIN_VERSION: '202607240102'
      MATERIAL_DELIVERY_VERSION: '202607240103'
      CERTIFICATE_VERSION: '202607240104'
      PROFILE_FILE: supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql
      PHOTO_FILE: supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql
      ENTITLEMENT_FILE: supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql
      MATERIAL_ADMIN_FILE: supabase/migrations/202607240102_phase_2_3b_material_admin_tools.sql
      MATERIAL_DELIVERY_FILE: supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql
      CERTIFICATE_FILE: supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql
      SUPABASE_WORKDIR: /tmp/agilecert-phase-3-dry-run

    steps:
      - name: Checkout exact Phase 3 draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate approved inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$PROFILE_FILE"
          test -s "$PHOTO_FILE"
          test -s "$ENTITLEMENT_FILE"
          test -s "$MATERIAL_ADMIN_FILE"
          test -s "$MATERIAL_DELIVERY_FILE"
          test -s "$CERTIFICATE_FILE"
          test "$CERTIFICATE_VERSION" = '202607240104'
          grep -q 'agilecert_certificate_eligibility_records' "$CERTIFICATE_FILE"
          grep -q 'issue_agilecert_certificate' "$CERTIFICATE_FILE"
          grep -q 'verify_agilecert_certificate' "$CERTIFICATE_FILE"
          if find supabase/functions -type f -newer "$CERTIFICATE_FILE" 2>/dev/null | grep -q .; then
            echo 'Unexpected Phase 3 Edge Function input found.'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare deployed migration-history workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          cp "$PROFILE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$PHOTO_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$ENTITLEMENT_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$MATERIAL_ADMIN_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$MATERIAL_DELIVERY_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$CERTIFICATE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Link production Supabase project
        shell: bash
        working-directory: /tmp/agilecert-phase-3-dry-run
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run approved migration only
        shell: bash
        working-directory: /tmp/agilecert-phase-3-dry-run
        run: |
          set +e
          dry_run_output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          dry_run_status=$?
          set -e
          printf '%s\n' "$dry_run_output" | tee "$RUNNER_TEMP/phase-3-certificate-dry-run.log"
          test "$dry_run_status" -eq 0

          if printf '%s\n' "$dry_run_output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 3 migration unexpectedly appears applied.'
            exit 1
          fi

          pending_versions="$(printf '%s\n' "$dry_run_output" | grep -Eo '20[0-9]{10,12}' | sort -u || true)"
          echo 'Pending migration versions detected:'
          printf '%s\n' "$pending_versions"
          test "$pending_versions" = "$CERTIFICATE_VERSION"

      - name: Verify migration remains unapplied
        shell: bash
        working-directory: /tmp/agilecert-phase-3-dry-run
        run: |
          set -euo pipefail
          history_file="$RUNNER_TEMP/phase-3-certificate-migration-history.log"
          npx --yes supabase@latest migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history_file"

          python - "$history_file" "$PROFILE_VERSION" "$PHOTO_VERSION" "$ENTITLEMENT_VERSION" "$MATERIAL_ADMIN_VERSION" "$MATERIAL_DELIVERY_VERSION" "$CERTIFICATE_VERSION" <<'PY'
          from pathlib import Path
          import sys

          history = Path(sys.argv[1]).read_text()
          deployed = sys.argv[2:-1]
          pending = sys.argv[-1]
          rows = []
          for line in history.splitlines():
              if '|' not in line:
                  continue
              parts = [part.strip().strip('`') for part in line.split('|')]
              if len(parts) >= 3:
                  rows.append(parts)

          for version in deployed:
              matched = [row for row in rows if row[0] == version or row[1] == version]
              if not any(row[0] == version and row[1] == version for row in matched):
                  raise SystemExit(f'Deployed migration {version} is not aligned locally and remotely: {matched}')

          pending_rows = [row for row in rows if row[0] == pending or row[1] == pending]
          if not pending_rows:
              raise SystemExit(f'Pending migration {pending} is missing from local migration history.')
          if any(row[0] == pending and row[1] == pending for row in pending_rows):
              raise SystemExit(f'Pending migration {pending} is already recorded remotely: {pending_rows}')
          PY

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-certificate-production-dry-run
          path: |
            ${{ runner.temp }}/phase-3-certificate-dry-run.log
            ${{ runner.temp }}/phase-3-certificate-migration-history.log
          if-no-files-found: warn
          retention-days: 3
