name: Deploy Certificate Server Rendering Phase 1C Production

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-certificate-server-rendering-phase1c-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-certificate-server-rendering-phase1c-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy and verify Certificate Server Rendering Phase 1C
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_COMMIT: '0e42b3ea39835f897e04c13aece5ec08c3d7c56d'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify exact approved release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > certificate-renderer-expected-migrations.txt <<'EOF'
          202608012200_certificate_server_rendering_phase1c.sql
          EOF

          test -s supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          test -s supabase/functions/render-certificate-pdf/index.ts
          test -s supabase/functions/render-certificate-pdf/render.ts
          test -s supabase/functions/render-certificate-pdf/render.test.ts
          test -s src/components/AdminCertificateRendererConsole.tsx
          test -s src/services/serverCertificatePdfService.ts

          grep -q 'renderer_enabled boolean not null default false' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          grep -q 'Certificate render bindings are immutable' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          grep -q 'complete_agilecert_certificate_server_render' \
            supabase/functions/render-certificate-pdf/index.ts
          grep -q 'MASTER_DIGEST_MISMATCH' \
            supabase/functions/render-certificate-pdf/index.ts
          grep -q 'LEGACY_RENDER_REQUIRED' \
            src/services/serverCertificatePdfService.ts

          git diff --quiet "${EXPECTED_COMMIT}^1" "$EXPECTED_COMMIT" -- \
            src/services/certificateCompletionService.ts \
            src/services/certificateService.ts \
            src/services/cipmnCertificateRenderer.ts \
            src/services/examService.ts \
            src/services/financeConsoleService.ts \
            src/services/financeConsoleCompletionService.ts \
            supabase/functions/initialize-exam-payment/index.ts \
            supabase/functions/verify-exam-payment/index.ts \
            supabase/functions/initialize-exam-cart-payment/index.ts \
            supabase/functions/verify-exam-cart-payment/index.ts \
            supabase/functions/paystack-webhook/index.ts

          ! grep -R -E '(PAYSTACK_SECRET_KEY|sk_(live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,})' \
            supabase/functions/render-certificate-pdf \
            src/components/AdminCertificateRendererConsole.tsx \
            src/services/serverCertificatePdfService.ts \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql

      - name: Validate application and renderer Edge Function
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          deno check --node-modules-dir=auto supabase/functions/render-certificate-pdf/index.ts
          deno check --node-modules-dir=auto supabase/functions/render-certificate-pdf/render.ts
          deno test --node-modules-dir=auto --allow-env \
            supabase/functions/render-certificate-pdf/render.test.ts \
            2>&1 | tee certificate-renderer-production-tests.log
          grep -q '2 passed' certificate-renderer-production-tests.log
          test -s dist/index.html
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > certificate-renderer-approved-dist.sha256

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Snapshot protected production authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              p.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(p.oid)) as definition_hash
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in (
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'set_agilecert_certificate_status',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order',
                'resolve_agilecert_certificate_master',
                'certificate_designer_validate_overlay',
                'get_certificate_template_designer_snapshot',
                'certificate_admin_save_template_design'
              )
          )
          select jsonb_build_object(
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(identity || ':' || definition_hash, '|' order by identity), ''))
              from protected_functions
            ),
            'legacyTemplates', (select count(*) from public.agilecert_certificate_templates),
            'eligibilityRecords', (select count(*) from public.agilecert_certificate_eligibility_records),
            'issuedCertificates', (select count(*) from public.agilecert_issued_certificates),
            'certificateAuditEvents', (select count(*) from public.agilecert_certificate_audit_events),
            'attempts', (select count(*) from public.attempts),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'coupons', (select count(*) from public.coupons),
            'masterTemplates', (select count(*) from public.agilecert_certificate_master_templates),
            'masterVersions', (select count(*) from public.agilecert_certificate_master_versions),
            'assets', (select count(*) from public.agilecert_certificate_assets),
            'assignments', (select count(*) from public.agilecert_certificate_master_assignments),
            'masterAuditEvents', (select count(*) from public.agilecert_certificate_master_audit),
            'overlaySchemaHash', (
              select md5(coalesce(string_agg(id::text || ':' || md5(overlay_schema::text), '|' order by id), ''))
              from public.agilecert_certificate_master_versions
            ),
            'assignmentAuthorityHash', (
              select md5(coalesce(string_agg(
                concat_ws(':', id::text, category_id::text, template_id::text,
                  template_version_id::text, scope_type,
                  coalesce(programme_id::text, ''), coalesce(examination_id::text, ''),
                  priority::text, effective_from::text, coalesce(effective_to::text, ''),
                  is_active::text, created_by::text, coalesce(updated_by::text, ''),
                  created_at::text, updated_at::text),
                '|' order by id), ''))
              from public.agilecert_certificate_master_assignments
            ),
            'permissionDefinitionsExcludingPhase1C', (
              select md5(coalesce(string_agg(permission_key || ':' || is_active::text, '|' order by permission_key), ''))
              from public.agilecert_certificate_permission_definitions
              where permission_key <> 'certificate.render.manage'
            ),
            'rolePermissionsExcludingPhase1C', (
              select md5(coalesce(string_agg(role || ':' || permission_key || ':' || is_granted::text, '|' order by role, permission_key), ''))
              from public.agilecert_certificate_role_permissions
              where permission_key <> 'certificate.render.manage'
            )
          ) as verification;
          """
          Path('/tmp/certificate-renderer-pre-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/certificate-renderer-pre-query.json \
            -o certificate-renderer-pre-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('certificate-renderer-pre-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('protectedFunctionCount', 0) >= 8, result
          Path('certificate-renderer-pre-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Require exactly one approved pending migration
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 \
            | tee certificate-renderer-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' \
            certificate-renderer-production-dry-run.log \
            | sort -u > certificate-renderer-production-pending.txt || true
          diff -u certificate-renderer-expected-migrations.txt \
            certificate-renderer-production-pending.txt
          test "$(wc -l < certificate-renderer-production-pending.txt | tr -d ' ')" -eq 1

      - name: Apply approved Phase 1C migration
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked 2>&1 \
            | tee certificate-renderer-production-deploy.log
          grep -q 'Applying migration 202608012200_certificate_server_rendering_phase1c.sql' \
            certificate-renderer-production-deploy.log
          grep -q 'Finished supabase db push' certificate-renderer-production-deploy.log

      - name: Deploy approved certificate renderer Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy render-certificate-pdf \
            --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1 \
            | tee certificate-renderer-function-deploy.log
          supabase functions list --project-ref "$PROJECT_REF" -o json \
            > certificate-renderer-functions.json

          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('certificate-renderer-functions.json').read_text())
          names = {item.get('name') for item in data if isinstance(item, dict)}
          assert 'render-certificate-pdf' in names, names
          Path('certificate-renderer-functions-safe.json').write_text(
              json.dumps({'deployedFunctions': ['render-certificate-pdf']}, indent=2),
              encoding='utf-8'
          )
          PY

      - name: Verify live Phase 1C authority and preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              p.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(p.oid)) as definition_hash
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in (
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'set_agilecert_certificate_status',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order',
                'resolve_agilecert_certificate_master',
                'certificate_designer_validate_overlay',
                'get_certificate_template_designer_snapshot',
                'certificate_admin_save_template_design'
              )
          ), required_tables(table_name) as (
            values
              ('agilecert_certificate_render_bindings'),
              ('agilecert_certificate_render_jobs')
          ), required_functions(function_signature) as (
            values
              ('public.agilecert_certificate_overlay_sha256(jsonb)'),
              ('public.certificate_admin_set_assignment_renderer_enabled(uuid,boolean,text)'),
              ('public.resolve_agilecert_certificate_render_master(uuid,text,timestamp with time zone)'),
              ('public.get_agilecert_certificate_server_render_context(uuid)'),
              ('public.complete_agilecert_certificate_server_render(uuid,boolean,text,text,bigint,integer,text,text)'),
              ('public.get_certificate_renderer_console_snapshot(integer)')
          )
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '202608012200'
            ),
            'assignmentRendererColumns', (
              select count(*) from information_schema.columns
              where table_schema = 'public'
                and table_name = 'agilecert_certificate_master_assignments'
                and column_name in (
                  'renderer_enabled', 'renderer_enabled_by', 'renderer_enabled_at',
                  'renderer_disabled_at', 'renderer_reason',
                  'renderer_source_sha256', 'renderer_overlay_sha256'
                )
            ),
            'permissionDefinition', (
              select count(*) from public.agilecert_certificate_permission_definitions
              where permission_key = 'certificate.render.manage' and is_active
            ),
            'examAdminPermissionRows', (
              select count(*) from public.agilecert_certificate_role_permissions
              where role = 'exam_admin' and permission_key = 'certificate.render.manage'
            ),
            'examAdminRenderGranted', (
              select count(*) from public.agilecert_certificate_role_permissions
              where role = 'exam_admin' and permission_key = 'certificate.render.manage' and is_granted
            ),
            'requiredTables', (
              select count(*) from required_tables required
              where to_regclass('public.' || required.table_name) is not null
            ),
            'rlsTables', (
              select count(*) from required_tables required
              join pg_class relation on relation.relname = required.table_name
              join pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'public' and relation.relrowsecurity
            ),
            'directBrowserGrants', (
              select count(*)
              from information_schema.role_table_grants grant_row
              join required_tables required on required.table_name = grant_row.table_name
              where grant_row.table_schema = 'public'
                and grant_row.grantee in ('authenticated', 'anon', 'PUBLIC')
            ),
            'immutableBindingTrigger', (
              select count(*) from pg_trigger
              where tgrelid = 'public.agilecert_certificate_render_bindings'::regclass
                and tgname = 'agilecert_certificate_render_binding_immutable'
                and not tgisinternal
            ),
            'securityDefinerFunctions', (
              select count(*)
              from required_functions required
              where exists (
                select 1 from pg_proc function_row
                where function_row.oid = required.function_signature::regprocedure
                  and function_row.prosecdef
              )
            ),
            'authenticatedFunctionAccess', (
              select
                (case when has_function_privilege('authenticated', 'public.certificate_admin_set_assignment_renderer_enabled(uuid,boolean,text)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('authenticated', 'public.get_agilecert_certificate_server_render_context(uuid)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('authenticated', 'public.get_certificate_renderer_console_snapshot(integer)', 'execute') then 1 else 0 end)
            ),
            'anonymousFunctionAccess', (
              select count(*) from required_functions required
              where has_function_privilege('anon', required.function_signature, 'execute')
            ),
            'rendererEnabledAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
              where renderer_enabled
            ),
            'renderBindings', (select count(*) from public.agilecert_certificate_render_bindings),
            'renderJobs', (select count(*) from public.agilecert_certificate_render_jobs),
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(identity || ':' || definition_hash, '|' order by identity), ''))
              from protected_functions
            ),
            'legacyTemplates', (select count(*) from public.agilecert_certificate_templates),
            'eligibilityRecords', (select count(*) from public.agilecert_certificate_eligibility_records),
            'issuedCertificates', (select count(*) from public.agilecert_issued_certificates),
            'certificateAuditEvents', (select count(*) from public.agilecert_certificate_audit_events),
            'attempts', (select count(*) from public.attempts),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'coupons', (select count(*) from public.coupons),
            'masterTemplates', (select count(*) from public.agilecert_certificate_master_templates),
            'masterVersions', (select count(*) from public.agilecert_certificate_master_versions),
            'assets', (select count(*) from public.agilecert_certificate_assets),
            'assignments', (select count(*) from public.agilecert_certificate_master_assignments),
            'masterAuditEvents', (select count(*) from public.agilecert_certificate_master_audit),
            'overlaySchemaHash', (
              select md5(coalesce(string_agg(id::text || ':' || md5(overlay_schema::text), '|' order by id), ''))
              from public.agilecert_certificate_master_versions
            ),
            'assignmentAuthorityHash', (
              select md5(coalesce(string_agg(
                concat_ws(':', id::text, category_id::text, template_id::text,
                  template_version_id::text, scope_type,
                  coalesce(programme_id::text, ''), coalesce(examination_id::text, ''),
                  priority::text, effective_from::text, coalesce(effective_to::text, ''),
                  is_active::text, created_by::text, coalesce(updated_by::text, ''),
                  created_at::text, updated_at::text),
                '|' order by id), ''))
              from public.agilecert_certificate_master_assignments
            ),
            'permissionDefinitionsExcludingPhase1C', (
              select md5(coalesce(string_agg(permission_key || ':' || is_active::text, '|' order by permission_key), ''))
              from public.agilecert_certificate_permission_definitions
              where permission_key <> 'certificate.render.manage'
            ),
            'rolePermissionsExcludingPhase1C', (
              select md5(coalesce(string_agg(role || ':' || permission_key || ':' || is_granted::text, '|' order by role, permission_key), ''))
              from public.agilecert_certificate_role_permissions
              where permission_key <> 'certificate.render.manage'
            )
          ) as verification;
          """
          Path('/tmp/certificate-renderer-post-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/certificate-renderer-post-query.json \
            -o certificate-renderer-post-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path

          pre = json.loads(Path('certificate-renderer-pre-safe.json').read_text())
          data = json.loads(Path('certificate-renderer-post-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          post = data[0].get('verification') or {}

          assert post.get('migrationApplied') is True, post
          assert post.get('assignmentRendererColumns') == 7, post
          assert post.get('permissionDefinition') == 1, post
          assert post.get('examAdminPermissionRows') == 1, post
          assert post.get('examAdminRenderGranted') == 0, post
          assert post.get('requiredTables') == 2, post
          assert post.get('rlsTables') == 2, post
          assert post.get('directBrowserGrants') == 0, post
          assert post.get('immutableBindingTrigger') == 1, post
          assert post.get('securityDefinerFunctions') == 6, post
          assert post.get('authenticatedFunctionAccess') == 3, post
          assert post.get('anonymousFunctionAccess') == 0, post
          assert post.get('rendererEnabledAssignments') == 0, post
          assert post.get('renderBindings') == 0, post
          assert post.get('renderJobs') == 0, post

          preserved = [
            'protectedFunctionCount', 'protectedFunctionHash',
            'legacyTemplates', 'eligibilityRecords', 'issuedCertificates',
            'certificateAuditEvents', 'attempts', 'examOrders', 'examPayments',
            'bulkOrders', 'bulkPayments', 'coupons', 'masterTemplates',
            'masterVersions', 'assets', 'assignments', 'masterAuditEvents',
            'overlaySchemaHash', 'assignmentAuthorityHash',
            'permissionDefinitionsExcludingPhase1C',
            'rolePermissionsExcludingPhase1C'
          ]
          for key in preserved:
            assert post.get(key) == pre.get(key), (key, pre.get(key), post.get(key))

          Path('certificate-renderer-post-safe.json').write_text(
              json.dumps(post, indent=2), encoding='utf-8'
          )
          print(json.dumps(post, indent=2))
          PY

      - name: Verify deployed Edge Function fails closed without authentication
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            -o certificate-renderer-unauthenticated-response.json \
            -w '%{http_code}' \
            -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/render-certificate-pdf" \
            -H 'Content-Type: application/json' \
            --data '{"certificateId":"00000000-0000-0000-0000-000000000000"}')"
          case "$status" in
            401|403) ;;
            *) cat certificate-renderer-unauthenticated-response.json; exit 1 ;;
          esac
          printf '{"unauthenticatedStatus":%s}\n' "$status" \
            > certificate-renderer-function-auth-safe.json

      - name: Confirm production migration ledger is current
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 \
            | tee certificate-renderer-production-final-dry-run.log
          grep -q 'Remote database is up to date' \
            certificate-renderer-production-final-dry-run.log

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-server-rendering-phase1c-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            certificate-renderer-expected-migrations.txt
            certificate-renderer-approved-dist.sha256
            certificate-renderer-production-tests.log
            certificate-renderer-pre-safe.json
            certificate-renderer-post-safe.json
            certificate-renderer-production-dry-run.log
            certificate-renderer-production-pending.txt
            certificate-renderer-production-deploy.log
            certificate-renderer-function-deploy.log
            certificate-renderer-functions-safe.json
            certificate-renderer-function-auth-safe.json
            certificate-renderer-production-final-dry-run.log