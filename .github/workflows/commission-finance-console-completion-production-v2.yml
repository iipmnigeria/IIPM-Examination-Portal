name: Commission Finance Console Completion Production v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/commission-finance-console-completion-production-v2.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: commission-finance-console-completion-production-v2
  cancel-in-progress: false

jobs:
  commission:
    name: Run rolled-back Finance Console production commissioning
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: '39255e9ea56178ef2b362a089bd0788846dcbbd7'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      LIVE_BASE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact commissioned source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact source and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -R -q 'Advanced examination pricing saved and audited' dist/assets
          grep -R -q 'finance-gateway-status' dist/assets
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > commissioned-dist.sha256

      - name: Run live role and finance lifecycle with mandatory rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime
          import json
          import os
          import urllib.request
          from pathlib import Path

          endpoint = f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query"
          token = os.environ['SUPABASE_ACCESS_TOKEN']

          def query(sql):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': sql}).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'IIPM-Finance-Console-Commissioning-v2',
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = json.loads(response.read().decode())
              assert isinstance(data, list), data
              return data

          state_sql = r"""
          with protected_functions as (
            select p.oid::regprocedure::text identity, md5(pg_get_functiondef(p.oid)) definition_hash
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in ('create_exam_order','fulfil_paid_exam_order','create_exam_bulk_order','fulfil_paid_exam_bulk_order')
          )
          select jsonb_build_object(
            'settingsHash', (select md5(to_jsonb(s)::text) from public.agilecert_finance_settings s where singleton = true),
            'rolePermissionsHash', (select md5(coalesce(string_agg(role || ':' || permission_key || ':' || is_granted::text, '|' order by role, permission_key), '')) from public.agilecert_finance_role_permissions),
            'profileRoleHash', (select md5(coalesce(string_agg(id::text || ':' || role || ':' || is_active::text, '|' order by id), '')) from public.profiles),
            'protectedFunctionHash', (select md5(coalesce(string_agg(identity || ':' || definition_hash, '|' order by identity), '')) from protected_functions),
            'examPricesHash', (select md5(coalesce(string_agg(id::text || ':' || examination_id::text || ':' || currency || ':' || amount_minor::text || ':' || is_active::text, '|' order by id), '')) from public.exam_prices),
            'couponHash', (select md5(coalesce(string_agg(id::text || ':' || upper(code) || ':' || is_active::text || ':' || discount_type || ':' || discount_value::text, '|' order by id), '')) from public.coupons),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'auditEvents', (select count(*) from public.agilecert_finance_audit_events),
            'syntheticPolicies', (select count(*) from public.agilecert_exam_pricing_policies where currency = 'XUT'),
            'syntheticPrices', (select count(*) from public.exam_prices where currency = 'XUT'),
            'syntheticCoupons', (select count(*) from public.coupons where upper(code) = 'UATFCCOMMISSION'),
            'syntheticAudits', (select count(*) from public.agilecert_finance_audit_events where coalesce(metadata->>'reason','') like 'Production UAT%'),
            'superAdmins', (select count(*) from public.profiles where role='super_admin' and is_active=true),
            'examAdmins', (select count(*) from public.profiles where role='exam_admin' and is_active=true),
            'candidates', (select count(*) from public.profiles where role='candidate' and is_active=true)
          ) state;
          """

          pre = next(r['state'] for r in query(state_sql) if 'state' in r)
          assert pre['superAdmins'] >= 1, pre
          assert pre['examAdmins'] >= 1 or pre['candidates'] >= 2, pre
          assert pre['syntheticPolicies'] == pre['syntheticPrices'] == pre['syntheticCoupons'] == pre['syntheticAudits'] == 0, pre
          Path('commissioning-pre.json').write_text(json.dumps(pre, indent=2))

          uat_sql = r"""
          begin;
          do $uat$
          declare
            super_id uuid;
            admin_id uuid;
            candidate_id uuid;
            exam_id uuid;
            programme_id uuid;
            access_payload jsonb;
            snapshot_payload jsonb;
            settings_row public.agilecert_finance_settings%rowtype;
            receipt_payload jsonb;
            order_id uuid;
            order_type text;
          begin
            select id into super_id from public.profiles where role='super_admin' and is_active=true order by created_at limit 1;
            select id into candidate_id from public.profiles where role='candidate' and is_active=true order by created_at limit 1;
            select id into admin_id from public.profiles where role='exam_admin' and is_active=true order by created_at limit 1;
            if admin_id is null then
              select id into admin_id from public.profiles where role='candidate' and is_active=true and id<>candidate_id order by created_at limit 1;
              if admin_id is not null then
                update public.profiles set role='exam_admin', updated_at=now() where id=admin_id;
              end if;
            end if;
            select e.id,e.programme_id into exam_id,programme_id from public.examinations e where e.is_published=true order by e.created_at limit 1;
            if super_id is null or admin_id is null or candidate_id is null or exam_id is null then
              raise exception 'Required production identities or examination are unavailable.';
            end if;

            if (select count(*) from public.agilecert_finance_role_permissions where role='exam_admin' and permission_key in ('finance.dashboard.view','finance.exports.download','finance.receipts.manage') and is_granted=true)<>3 then
              raise exception 'Expected reporting permissions are not active.';
            end if;
            if (select count(*) from public.agilecert_finance_role_permissions where role='exam_admin' and permission_key in ('finance.settings.manage','finance.transactions.reconcile','finance.access.recover','finance.adjustments.approve') and is_granted=true)<>0 then
              raise exception 'A high-impact Examination Administrator permission is unexpectedly active.';
            end if;

            perform set_config('request.jwt.claim.role','authenticated',true);
            perform set_config('request.jwt.claim.sub',candidate_id::text,true);
            begin
              perform public.get_finance_console_completion_snapshot(10,now()-interval '30 days',now());
              raise exception 'Candidate unexpectedly accessed Finance Console.';
            exception when others then
              if position('Candidate unexpectedly' in sqlerrm)>0 then raise; end if;
              if position('does not have permission' in sqlerrm)=0 then raise exception 'Unexpected candidate denial: %',sqlerrm; end if;
            end;

            perform set_config('request.jwt.claim.sub',admin_id::text,true);
            access_payload:=public.get_my_finance_console_access();
            if access_payload->>'role'<>'exam_admin'
               or coalesce((access_payload->>'canViewDashboard')::boolean,false) is not true
               or coalesce((access_payload->>'canManageReceipts')::boolean,false) is not true
               or coalesce((access_payload->>'canExportTransactions')::boolean,false) is not true
               or coalesce((access_payload->>'canManageSettings')::boolean,false) is not false
               or coalesce((access_payload->>'canReconcileTransactions')::boolean,false) is not false
               or coalesce((access_payload->>'canRecoverAccess')::boolean,false) is not false
               or coalesce((access_payload->>'canApproveAdjustments')::boolean,false) is not false then
              raise exception 'Examination Administrator default access is incorrect: %',access_payload;
            end if;

            select * into settings_row from public.agilecert_finance_settings where singleton=true;
            begin
              perform public.finance_upsert_general_settings(
                settings_row.default_currency,settings_row.supported_currencies,settings_row.paystack_enabled,
                settings_row.paystack_environment,settings_row.paystack_status_note,settings_row.tax_enabled,
                settings_row.tax_label,settings_row.default_tax_profile_id,settings_row.receipt_prefix,
                settings_row.payment_reference_prefix,settings_row.payment_expiry_minutes,
                settings_row.abandoned_order_hours,settings_row.refunds_enabled,settings_row.reversals_enabled,
                settings_row.manual_payment_approval_enabled,settings_row.bank_transfer_instructions,
                settings_row.minimum_transaction_minor,settings_row.maximum_transaction_minor,
                settings_row.allow_partial_payments,settings_row.allow_overpayments,
                'Production UAT expected settings denial'
              );
              raise exception 'Exam admin unexpectedly changed settings before delegation.';
            exception when others then
              if position('unexpectedly changed settings' in sqlerrm)>0 then raise; end if;
              if position('does not have permission' in sqlerrm)=0 then raise exception 'Unexpected settings denial: %',sqlerrm; end if;
            end;

            perform set_config('request.jwt.claim.sub',super_id::text,true);
            access_payload:=public.get_my_finance_console_access();
            if access_payload->>'role'<>'super_admin'
               or coalesce((access_payload->>'canManageSettings')::boolean,false) is not true
               or coalesce((access_payload->>'canReconcileTransactions')::boolean,false) is not true
               or coalesce((access_payload->>'canRecoverAccess')::boolean,false) is not true
               or coalesce((access_payload->>'canApproveAdjustments')::boolean,false) is not true then
              raise exception 'Super Administrator authority is incomplete: %',access_payload;
            end if;

            perform public.admin_set_finance_role_permission('exam_admin','finance.settings.manage',true,'Production UAT temporary settings delegation');
            perform set_config('request.jwt.claim.sub',admin_id::text,true);
            access_payload:=public.get_my_finance_console_access();
            if coalesce((access_payload->>'canManageSettings')::boolean,false) is not true then raise exception 'Delegated settings permission is missing.'; end if;
            perform public.finance_upsert_general_settings(
              settings_row.default_currency,settings_row.supported_currencies,settings_row.paystack_enabled,
              settings_row.paystack_environment,coalesce(settings_row.paystack_status_note,'')||' [Production UAT]',settings_row.tax_enabled,
              settings_row.tax_label,settings_row.default_tax_profile_id,settings_row.receipt_prefix,
              settings_row.payment_reference_prefix,settings_row.payment_expiry_minutes,
              settings_row.abandoned_order_hours,settings_row.refunds_enabled,settings_row.reversals_enabled,
              settings_row.manual_payment_approval_enabled,settings_row.bank_transfer_instructions,
              settings_row.minimum_transaction_minor,settings_row.maximum_transaction_minor,
              settings_row.allow_partial_payments,settings_row.allow_overpayments,
              'Production UAT delegated settings save'
            );

            perform set_config('request.jwt.claim.sub',super_id::text,true);
            perform public.finance_upsert_exam_pricing_policy(exam_id,'XUT',1234500,1111100,'Production UAT Promotion',now()-interval '1 minute',now()+interval '1 day','paid',2,900000,true,true,'Production UAT advanced pricing lifecycle');
            if not exists(select 1 from public.agilecert_exam_pricing_policies where examination_id=exam_id and currency='XUT' and standard_amount_minor=1234500 and promotional_amount_minor=1111100 and attempts_included=2 and retake_amount_minor=900000 and bulk_cart_eligible=true and is_active=true) then raise exception 'Advanced pricing was not stored correctly.'; end if;
            if not exists(select 1 from public.exam_prices where examination_id=exam_id and currency='XUT' and amount_minor=1111100 and is_active=true) then raise exception 'Effective promotional price was not applied.'; end if;

            perform public.finance_upsert_coupon_advanced(null,'UATFCCOMMISSION','Production UAT Coupon','Rolled-back commissioning coupon','percentage',15,null,array[programme_id],array[exam_id],500000,2,false,250000,now()-interval '1 minute',now()+interval '1 day',10,1,true,'Production UAT advanced coupon lifecycle');
            if not exists(select 1 from public.coupons where upper(code)='UATFCCOMMISSION' and minimum_amount_minor=500000 and minimum_module_count=2 and allow_multi_module_cart=false and maximum_discount_minor=250000 and maximum_redemptions=10 and per_candidate_limit=1 and is_active=true) then raise exception 'Advanced coupon was not stored correctly.'; end if;
            if (select count(*) from public.agilecert_coupon_targets t join public.coupons c on c.id=t.coupon_id where upper(c.code)='UATFCCOMMISSION' and t.is_active=true)<>2 then raise exception 'Coupon targets were not stored correctly.'; end if;

            snapshot_payload:=public.get_finance_console_completion_snapshot(50,now()-interval '90 days',now());
            if jsonb_typeof(snapshot_payload)<>'object' or jsonb_typeof(snapshot_payload->'transactions')<>'array' or jsonb_typeof(snapshot_payload->'dashboard')<>'object' then raise exception 'Snapshot payload is invalid.'; end if;

            perform set_config('request.jwt.claim.sub',admin_id::text,true);
            perform public.finance_record_export('production_uat_csv',jsonb_array_length(snapshot_payload->'transactions'),jsonb_build_object('rolledBack',true,'scope','commissioning'));
            select 'exam',id into order_type,order_id from public.exam_orders where status in ('paid','waived') order by created_at desc limit 1;
            if order_id is null then select 'bulk',id into order_type,order_id from public.exam_bulk_orders where status in ('paid','partially_fulfilled','fulfilled') order by created_at desc limit 1; end if;
            if order_id is not null then
              receipt_payload:=public.finance_get_receipt_payload(order_type,order_id);
              if jsonb_typeof(receipt_payload)<>'object' or nullif(receipt_payload->>'receiptNumber','') is null or nullif(receipt_payload->>'reference','') is null then raise exception 'Receipt payload is invalid.'; end if;
            end if;
            if order_id is null then select 'exam',id into order_type,order_id from public.exam_orders order by created_at desc limit 1; end if;
            if order_id is null then select 'bulk',id into order_type,order_id from public.exam_bulk_orders order by created_at desc limit 1; end if;
            perform set_config('request.jwt.claim.sub',super_id::text,true);
            if order_id is not null then perform public.finance_queue_recovery_action(order_type,order_id,'refund_review','Production UAT recovery queue lifecycle'); end if;

            perform public.admin_set_finance_role_permission('exam_admin','finance.settings.manage',false,'Production UAT temporary settings delegation revoked');
            perform set_config('request.jwt.claim.sub',admin_id::text,true);
            access_payload:=public.get_my_finance_console_access();
            if coalesce((access_payload->>'canManageSettings')::boolean,false) is not false then raise exception 'Temporary permission was not revoked.'; end if;
            if (select count(*) from public.agilecert_finance_audit_events where coalesce(metadata->>'reason','') like 'Production UAT%')<5 then raise exception 'Expected audit evidence was not generated.'; end if;
          end;
          $uat$;

          select jsonb_build_object(
            'candidateDenied',true,
            'examAdminDefaultsPassed',true,
            'superAdminAuthorityPassed',true,
            'delegationLifecyclePassed',true,
            'settingsPassed',true,
            'pricingPassed',exists(select 1 from public.agilecert_exam_pricing_policies where currency='XUT'),
            'promotionPassed',exists(select 1 from public.exam_prices where currency='XUT' and amount_minor=1111100),
            'couponPassed',exists(select 1 from public.coupons where upper(code)='UATFCCOMMISSION'),
            'couponTargetsPassed',(select count(*) from public.agilecert_coupon_targets t join public.coupons c on c.id=t.coupon_id where upper(c.code)='UATFCCOMMISSION')=2,
            'snapshotPassed',true,
            'exportPassed',exists(select 1 from public.agilecert_finance_audit_events where action='finance_data_exported' and metadata->>'exportType'='production_uat_csv'),
            'auditEvents',(select count(*) from public.agilecert_finance_audit_events where coalesce(metadata->>'reason','') like 'Production UAT%'),
            'rollbackRequired',true
          ) uat;
          rollback;
          select jsonb_build_object(
            'syntheticPolicies',(select count(*) from public.agilecert_exam_pricing_policies where currency='XUT'),
            'syntheticPrices',(select count(*) from public.exam_prices where currency='XUT'),
            'syntheticCoupons',(select count(*) from public.coupons where upper(code)='UATFCCOMMISSION'),
            'syntheticAudits',(select count(*) from public.agilecert_finance_audit_events where coalesce(metadata->>'reason','') like 'Production UAT%'),
            'highImpactExamAdminGrants',(select count(*) from public.agilecert_finance_role_permissions where role='exam_admin' and permission_key in ('finance.settings.manage','finance.transactions.reconcile','finance.access.recover','finance.adjustments.approve') and is_granted=true),
            'rolledBack',true
          ) cleanup;
          """

          rows = query(uat_sql)
          uat = next(r['uat'] for r in rows if isinstance(r.get('uat'),dict))
          cleanup = next(r['cleanup'] for r in rows if isinstance(r.get('cleanup'),dict))
          for key in ['candidateDenied','examAdminDefaultsPassed','superAdminAuthorityPassed','delegationLifecyclePassed','settingsPassed','pricingPassed','promotionPassed','couponPassed','couponTargetsPassed','snapshotPassed','exportPassed','rollbackRequired']:
              assert uat[key] is True, (key,uat)
          assert uat['auditEvents'] >= 5, uat
          assert cleanup == {'syntheticPolicies':0,'syntheticPrices':0,'syntheticCoupons':0,'syntheticAudits':0,'highImpactExamAdminGrants':0,'rolledBack':True}, cleanup

          post = next(r['state'] for r in query(state_sql) if 'state' in r)
          preserved = ['settingsHash','rolePermissionsHash','profileRoleHash','protectedFunctionHash','examPricesHash','couponHash','examOrders','examPayments','bulkOrders','bulkPayments','auditEvents','syntheticPolicies','syntheticPrices','syntheticCoupons','syntheticAudits']
          for key in preserved:
              assert pre[key] == post[key], (key,pre,post)

          evidence = {
              'sourceCommit': os.environ['EXPECTED_SOURCE_COMMIT'],
              'uat': uat,
              'cleanup': cleanup,
              'prePostStateMatched': True,
              'preservedStateKeys': preserved,
              'initialActiveExamAdministrators': pre['examAdmins'],
              'temporaryExamAdministratorUsed': pre['examAdmins'] == 0,
              'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('production-commissioning.json').write_text(json.dumps(evidence,indent=2))
          Path('commissioning-post.json').write_text(json.dumps(post,indent=2))
          print(json.dumps(evidence,indent=2))
          PY

      - name: Verify live bundle and unauthenticated denial
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$LIVE_BASE_URL?commissioning=$EXPECTED_SOURCE_COMMIT" -o live-index.html
          grep -Eo '(src|href)="[^"]+"' live-index.html | sed -E 's/^(src|href)="//;s/"$//' | while read -r ref; do
            case "$ref" in http*|data:*|'#'*) continue;; esac
            rel="${ref#./}"; rel="${rel#/}"
            case "$rel" in *.js|*.mjs) curl --fail --silent --show-error "${LIVE_BASE_URL}${rel}" >> live-bundle.js;; esac
          done
          grep -q 'Advanced examination pricing saved and audited' live-bundle.js
          grep -q 'finance-gateway-status' live-bundle.js
          for fn in admin-verify-exam-payment finance-gateway-status; do
            status=$(curl --silent --show-error -o "${fn}-denial.json" -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}" -H 'Content-Type: application/json' --data '{}')
            test "$status" != '200'
            ! grep -Eqi '(sk_(live|test)_[A-Za-z0-9]+|service_role|SUPABASE_SERVICE_ROLE_KEY)' "${fn}-denial.json"
          done
          sha256sum live-index.html live-bundle.js > live-commissioning.sha256

      - name: Upload commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-console-completion-production-commissioning-v2
          retention-days: 30
          if-no-files-found: warn
          path: |
            commissioned-dist.sha256
            commissioning-pre.json
            production-commissioning.json
            commissioning-post.json
            live-index.html
            live-bundle.js
            live-commissioning.sha256
            admin-verify-exam-payment-denial.json
            finance-gateway-status-denial.json
