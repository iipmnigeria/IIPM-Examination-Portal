name: Inspect Certificate Renderer Pilot Readiness

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/inspect-certificate-renderer-pilot-readiness.txt'

permissions:
  contents: read

concurrency:
  group: inspect-certificate-renderer-pilot-readiness
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect non-global renderer pilot candidates
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: '0e42b3ea39835f897e04c13aece5ec08c3d7c56d'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - name: Verify approved production source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -s supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          grep -q 'renderer_enabled boolean not null default false' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql

      - name: Query production pilot readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with candidate_base as (
            select
              assignment.id as assignment_id,
              assignment.scope_type,
              assignment.priority,
              assignment.effective_from,
              assignment.effective_to,
              assignment.is_active,
              assignment.renderer_enabled,
              category.code as category_code,
              category.name as category_name,
              institution.code as institution_code,
              institution.name as institution_name,
              template.id as template_id,
              template.code as template_code,
              template.name as template_name,
              version.id as version_id,
              version.version_number,
              version.status as version_status,
              version.quality_status,
              version.source_format,
              version.sha256 as source_sha256,
              version.overlay_schema,
              programme.id as programme_id,
              programme.code as programme_code,
              programme.name as programme_name,
              examination.id as examination_id,
              examination.code as examination_code,
              examination.title as examination_title,
              public.certificate_designer_validate_overlay(
                version.id,
                version.overlay_schema
              ) as overlay_report
            from public.agilecert_certificate_master_assignments assignment
            join public.agilecert_certificate_categories category
              on category.id = assignment.category_id
            join public.agilecert_certificate_master_templates template
              on template.id = assignment.template_id
            join public.agilecert_certificate_master_versions version
              on version.id = assignment.template_version_id
            join public.agilecert_certificate_institutions institution
              on institution.id = template.institution_id
            left join public.programmes programme
              on programme.id = assignment.programme_id
            left join public.examinations examination
              on examination.id = assignment.examination_id
            where assignment.scope_type in ('examination', 'programme')
          ), assessed as (
            select
              candidate.*,
              coalesce((candidate.overlay_report->>'valid')::boolean, false)
                as overlay_valid,
              (
                select count(distinct element->>'assetId')
                from jsonb_array_elements(candidate.overlay_schema) element
                where nullif(element->>'assetId', '') is not null
              ) as referenced_assets,
              (
                select count(distinct asset.id)
                from jsonb_array_elements(candidate.overlay_schema) element
                join public.agilecert_certificate_assets asset
                  on (element->>'assetId') ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
                 and asset.id = (element->>'assetId')::uuid
                 and asset.institution_id = candidate.institution_code::text::uuid
                where false
              ) as unused_ready_assets
            from candidate_base candidate
          ), final_assessment as (
            select
              assessed.*,
              (
                select count(distinct asset.id)
                from jsonb_array_elements(assessed.overlay_schema) element
                join public.agilecert_certificate_assets asset
                  on (element->>'assetId') ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
                 and asset.id = (element->>'assetId')::uuid
                join public.agilecert_certificate_master_templates template_check
                  on template_check.id = assessed.template_id
                 and template_check.institution_id = asset.institution_id
                where nullif(element->>'assetId', '') is not null
                  and asset.status = 'approved'
                  and asset.sha256 is not null
                  and asset.mime_type in ('image/png', 'image/jpeg')
              ) as ready_assets
            from assessed
          ), ranked as (
            select
              final_assessment.*,
              (
                final_assessment.is_active
                and not final_assessment.renderer_enabled
                and final_assessment.version_status = 'published'
                and final_assessment.quality_status in ('passed', 'waived')
                and final_assessment.source_format in ('pdf', 'png', 'jpeg')
                and final_assessment.source_sha256 is not null
                and final_assessment.overlay_valid
                and final_assessment.referenced_assets = final_assessment.ready_assets
                and final_assessment.effective_from <= now()
                and (
                  final_assessment.effective_to is null
                  or final_assessment.effective_to > now()
                )
              ) as eligible,
              case final_assessment.scope_type
                when 'examination' then 1
                when 'programme' then 2
                else 9
              end as scope_rank
            from final_assessment
          )
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202608012200'
            ),
            'rendererEnabledAssignments', (
              select count(*)
              from public.agilecert_certificate_master_assignments
              where renderer_enabled
            ),
            'globalRendererEnabledAssignments', (
              select count(*)
              from public.agilecert_certificate_master_assignments
              where renderer_enabled and scope_type = 'global'
            ),
            'existingRenderBindings', (
              select count(*) from public.agilecert_certificate_render_bindings
            ),
            'existingRenderJobs', (
              select count(*) from public.agilecert_certificate_render_jobs
            ),
            'nonGlobalAssignments', (select count(*) from ranked),
            'eligibleNonGlobalAssignments', (
              select count(*) from ranked where eligible
            ),
            'recommendedCandidate', (
              select jsonb_strip_nulls(jsonb_build_object(
                'assignmentId', assignment_id,
                'scopeType', scope_type,
                'institutionCode', institution_code,
                'institutionName', institution_name,
                'categoryCode', category_code,
                'categoryName', category_name,
                'templateId', template_id,
                'templateCode', template_code,
                'templateName', template_name,
                'versionId', version_id,
                'versionNumber', version_number,
                'programmeId', programme_id,
                'programmeCode', programme_code,
                'programmeName', programme_name,
                'examinationId', examination_id,
                'examinationCode', examination_code,
                'examinationTitle', examination_title,
                'sourceFormat', source_format,
                'qualityStatus', quality_status,
                'overlayValid', overlay_valid,
                'referencedAssets', referenced_assets,
                'readyAssets', ready_assets,
                'priority', priority,
                'effectiveFrom', effective_from,
                'effectiveTo', effective_to
              ))
              from ranked
              where eligible
              order by scope_rank, priority, effective_from desc, assignment_id
              limit 1
            ),
            'candidates', coalesce((
              select jsonb_agg(jsonb_strip_nulls(jsonb_build_object(
                'assignmentId', assignment_id,
                'scopeType', scope_type,
                'institutionCode', institution_code,
                'categoryCode', category_code,
                'templateCode', template_code,
                'versionNumber', version_number,
                'programmeCode', programme_code,
                'examinationCode', examination_code,
                'examinationTitle', examination_title,
                'versionStatus', version_status,
                'qualityStatus', quality_status,
                'sourceFormat', source_format,
                'hasSourceDigest', source_sha256 is not null,
                'overlayValid', overlay_valid,
                'referencedAssets', referenced_assets,
                'readyAssets', ready_assets,
                'isActive', is_active,
                'rendererEnabled', renderer_enabled,
                'eligible', eligible
              )) order by scope_rank, priority, effective_from desc, assignment_id)
              from ranked
            ), '[]'::jsonb)
          ) as readiness;
          """
          # Replace a deliberately unreachable placeholder subquery fragment before execution.
          query = query.replace(
              "and asset.institution_id = candidate.institution_code::text::uuid\n                where false",
              "where false",
          )
          Path('/tmp/pilot-readiness-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pilot-readiness-query.json \
            -o pilot-readiness-response.json

      - name: Validate and sanitize readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('pilot-readiness-response.json').read_text())
          assert isinstance(raw, list) and len(raw) == 1, raw
          readiness = raw[0].get('readiness') or {}
          assert readiness.get('migrationApplied') is True, readiness
          assert readiness.get('globalRendererEnabledAssignments') == 0, readiness
          assert readiness.get('existingRenderBindings') == 0, readiness
          assert readiness.get('existingRenderJobs') == 0, readiness

          candidate = readiness.get('recommendedCandidate')
          decision = {
              'status': 'READY' if candidate else 'NO_ELIGIBLE_NON_GLOBAL_ASSIGNMENT',
              'productionSourceCommit': '0e42b3ea39835f897e04c13aece5ec08c3d7c56d',
              **readiness,
          }
          Path('certificate-renderer-pilot-readiness.json').write_text(
              json.dumps(decision, indent=2), encoding='utf-8'
          )

          lines = [
              '# Certificate Renderer Pilot Readiness',
              '',
              f"Status: **{decision['status']}**",
              f"Eligible non-global assignments: **{readiness.get('eligibleNonGlobalAssignments', 0)}**",
              f"Renderer-enabled assignments: **{readiness.get('rendererEnabledAssignments', 0)}**",
              f"Existing render bindings: **{readiness.get('existingRenderBindings', 0)}**",
              f"Existing render jobs: **{readiness.get('existingRenderJobs', 0)}**",
          ]
          if candidate:
              lines += [
                  '',
                  '## Recommended pilot',
                  f"- Scope: `{candidate.get('scopeType')}`",
                  f"- Institution: `{candidate.get('institutionCode')}` — {candidate.get('institutionName')}",
                  f"- Category: `{candidate.get('categoryCode')}` — {candidate.get('categoryName')}",
                  f"- Template: `{candidate.get('templateCode')}` — {candidate.get('templateName')}",
                  f"- Programme: `{candidate.get('programmeCode')}` — {candidate.get('programmeName')}",
                  f"- Examination: `{candidate.get('examinationCode')}` — {candidate.get('examinationTitle')}",
                  f"- Source: `{candidate.get('sourceFormat')}`; quality `{candidate.get('qualityStatus')}`",
                  f"- Assets: {candidate.get('readyAssets')}/{candidate.get('referencedAssets')} ready",
                  f"- Assignment ID: `{candidate.get('assignmentId')}`",
              ]
          Path('certificate-renderer-pilot-readiness.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          print(json.dumps(decision, indent=2))
          PY

      - name: Upload sanitized readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: certificate-renderer-pilot-readiness
          retention-days: 30
          if-no-files-found: error
          path: |
            certificate-renderer-pilot-readiness.json
            certificate-renderer-pilot-readiness.md
