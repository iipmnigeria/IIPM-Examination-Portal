name: Regenerate official CIPMN logo asset

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - '.github/workflows/regenerate-official-cipmn-logo.yml'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/cipmn-certificate-lossless-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate official CIPMN vectors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-cipmn-logo-review
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0 Safari/537.36'
          for asset in cipmn_logo coa; do
            curl --fail --location --silent --show-error --max-time 30 \
              --proto '=https' --tlsv1.2 \
              --user-agent "$UA" \
              --referer 'https://app.cipmn.gov.ng/' \
              --output "official-cipmn-logo-review/${asset}-official.svg" \
              "https://app.cipmn.gov.ng/${asset}.svg"
          done

          python <<'PY'
          import base64
          import hashlib
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          review = pathlib.Path('official-cipmn-logo-review')
          metadata = []
          encoded = {}

          def local(tag):
              return tag.rsplit('}', 1)[-1].lower()

          for name in ('cipmn_logo', 'coa'):
              path = review / f'{name}-official.svg'
              data = path.read_bytes()
              if len(data) < 100 or len(data) > 2_000_000:
                  raise SystemExit(f'Unexpected official {name} SVG size: {len(data)} bytes.')

              text = data.decode('utf-8-sig')
              if '<!DOCTYPE' in text.upper() or '<!ENTITY' in text.upper():
                  raise SystemExit(f'Official {name} SVG contains a forbidden document type or entity declaration.')

              root = ET.fromstring(text)
              if local(root.tag) != 'svg':
                  raise SystemExit(f'Official {name} source root element is not SVG.')

              forbidden = []
              external = []
              events = []
              drawables = 0
              for element in root.iter():
                  element_name = local(element.tag)
                  if element_name in {'script', 'foreignobject', 'iframe', 'object', 'embed'}:
                      forbidden.append(element_name)
                  if element_name in {'path', 'circle', 'ellipse', 'rect', 'polygon', 'polyline', 'line', 'text', 'use'}:
                      drawables += 1
                  for key, value in element.attrib.items():
                      attr = local(key)
                      if attr.startswith('on'):
                          events.append(attr)
                      if attr in {'href', 'src'}:
                          candidate = value.strip().lower()
                          if candidate and not candidate.startswith('#') and not candidate.startswith('data:'):
                              external.append(value)

              if forbidden or external or events or drawables < 1:
                  raise SystemExit(
                      f'Unsafe or empty official {name} SVG: forbidden={forbidden}, external={external}, events={events}, drawables={drawables}'
                  )

              view_box = root.attrib.get('viewBox') or root.attrib.get('viewbox')
              width = root.attrib.get('width')
              height = root.attrib.get('height')
              if not view_box and not (width and height):
                  raise SystemExit(f'Official {name} SVG has no usable dimensions.')

              if view_box:
                  numbers = [float(value) for value in re.split(r'[\s,]+', view_box.strip()) if value]
                  if len(numbers) != 4 or numbers[2] <= 0 or numbers[3] <= 0:
                      raise SystemExit(f'Invalid official {name} viewBox: {view_box}.')
                  aspect = numbers[2] / numbers[3]
              else:
                  number = lambda value: float(re.match(r'\s*([0-9.]+)', value or '').group(1))
                  aspect = number(width) / number(height)

              if not 0.45 <= aspect <= 1.8:
                  raise SystemExit(f'Unexpected official {name} aspect ratio: {aspect:.3f}.')

              digest = hashlib.sha256(data).hexdigest()
              metadata.extend([
                  f'{name}.source=https://app.cipmn.gov.ng/{name}.svg',
                  f'{name}.bytes={len(data)}',
                  f'{name}.sha256={digest}',
                  f'{name}.viewBox={view_box or ""}',
                  f'{name}.width={width or ""}',
                  f'{name}.height={height or ""}',
                  f'{name}.aspect={aspect:.6f}',
                  f'{name}.drawable_elements={drawables}',
              ])
              encoded[name] = base64.b64encode(data).decode('ascii')
              print(f'Validated official {name} SVG: bytes={len(data)}, aspect={aspect:.3f}, drawables={drawables}, sha256={digest}')

          composite = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320">
            <image x="4" y="12" width="230" height="296" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,{encoded['coa']}"/>
            <image x="245" y="18" width="245" height="284" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,{encoded['cipmn_logo']}"/>
            <g fill="#2f3033" font-family="DejaVu Sans, Arial, sans-serif">
              <text x="515" y="98" font-size="44" font-weight="700">CHARTERED INSTITUTE OF</text>
              <text x="515" y="154" font-size="44" font-weight="700">PROJECT MANAGERS OF NIGERIA</text>
              <text x="515" y="211" font-size="26" font-weight="400">Regulatory Body for Project Management in Nigeria</text>
            </g>
          </svg>'''
          (review / 'cipmn-horizontal-composite.svg').write_text(composite, encoding='utf-8')
          metadata.extend([
              'composite.width=1200',
              'composite.height=320',
              'composite.aspect=3.750000',
          ])
          (review / 'source-metadata.txt').write_text('\n'.join(metadata) + '\n', encoding='utf-8')
          PY

      - name: Render and validate lossless horizontal PNG
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq librsvg2-bin
          fi
          rsvg-convert \
            --width 1200 \
            --height 320 \
            --output official-cipmn-logo-review/cipmn-horizontal-composite.png \
            official-cipmn-logo-review/cipmn-horizontal-composite.svg

          python <<'PY'
          import base64
          import binascii
          import pathlib
          import struct
          import zlib

          path = pathlib.Path('official-cipmn-logo-review/cipmn-horizontal-composite.png')
          data = path.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Rendered composite is not PNG.')

          offset = 8
          width = height = None
          idat = []
          reached_iend = False
          chunks = []
          while offset + 12 <= len(data):
              length = struct.unpack('>I', data[offset:offset + 4])[0]
              chunk_type = data[offset + 4:offset + 8]
              start = offset + 8
              end = start + length
              crc_end = end + 4
              if crc_end > len(data):
                  raise SystemExit(f'Truncated rendered PNG chunk: {chunk_type!r}.')
              expected_crc = struct.unpack('>I', data[end:crc_end])[0]
              actual_crc = binascii.crc32(chunk_type + data[start:end]) & 0xffffffff
              if expected_crc != actual_crc:
                  raise SystemExit(f'CRC failure in rendered PNG chunk: {chunk_type!r}.')
              name = chunk_type.decode('ascii')
              chunks.append(name)
              if name == 'IHDR':
                  width, height = struct.unpack('>II', data[start:start + 8])
              elif name == 'IDAT':
                  idat.append(data[start:end])
              elif name == 'IEND':
                  reached_iend = True
                  offset = crc_end
                  break
              offset = crc_end

          if not reached_iend or offset != len(data) or not idat:
              raise SystemExit('Rendered PNG is incomplete.')
          if (width, height) != (1200, 320):
              raise SystemExit(f'Unexpected rendered dimensions: {width}x{height}.')
          zlib.decompress(b''.join(idat))

          payload = base64.b64encode(data).decode('ascii')
          pathlib.Path('official-cipmn-logo-review/cipmnCertificateCipmnLogo.ts').write_text(
              "export const CIPMN_CERTIFICATE_LOGO_DATA_URI = "
              f"'data:image/png;base64,{payload}';\n",
              encoding='utf-8',
          )
          print(f'Validated horizontal PNG: {width}x{height}, bytes={len(data)}, chunks={chunks}.')
          PY

      - name: Upload official composite review
        uses: actions/upload-artifact@v4
        with:
          name: official-cipmn-logo-review
          path: official-cipmn-logo-review/
          if-no-files-found: error
