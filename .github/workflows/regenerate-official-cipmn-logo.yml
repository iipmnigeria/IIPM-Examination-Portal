name: Regenerate official CIPMN logo asset

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - '.github/workflows/regenerate-official-cipmn-logo.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/cipmn-certificate-lossless-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cipmn-certificate-lossless-quality
          fetch-depth: 0

      - name: Inspect authoritative CIPMN logo records
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0 Safari/537.36'
          curl --fail --location --silent --show-error --max-time 30 --user-agent "$UA" \
            --output /tmp/government.html 'https://cipmn.gov.ng/'
          curl --fail --location --silent --show-error --max-time 30 --user-agent "$UA" \
            --output /tmp/application.html 'https://app.cipmn.gov.ng/'
          curl --fail --location --silent --show-error --max-time 30 --user-agent "$UA" \
            --output /tmp/media-logo.json 'https://cipmn.gov.ng/wp-json/wp/v2/media?search=logo&per_page=100'
          curl --fail --location --silent --show-error --max-time 30 --user-agent "$UA" \
            --output /tmp/media-cipmn.json 'https://cipmn.gov.ng/wp-json/wp/v2/media?search=CIPMN&per_page=100'

          python <<'PY'
          import html
          import json
          import pathlib
          import re

          print('=== WORDPRESS MEDIA: SEARCH LOGO ===')
          for source in ('/tmp/media-logo.json', '/tmp/media-cipmn.json'):
              records = json.loads(pathlib.Path(source).read_text('utf-8'))
              for record in records:
                  details = record.get('media_details') or {}
                  source_url = record.get('source_url') or ''
                  slug = record.get('slug') or ''
                  title = html.unescape((record.get('title') or {}).get('rendered') or '')
                  alt = html.unescape(record.get('alt_text') or '')
                  haystack = ' '.join((slug, title, alt, source_url)).lower()
                  if 'logo' not in haystack and 'cipmn' not in haystack:
                      continue
                  print(json.dumps({
                      'id': record.get('id'),
                      'slug': slug,
                      'title': title,
                      'alt': alt,
                      'source_url': source_url,
                      'width': details.get('width'),
                      'height': details.get('height'),
                      'mime_type': record.get('mime_type'),
                  }, sort_keys=True))

          print('=== GOVERNMENT HOME IMG TAGS ===')
          government = pathlib.Path('/tmp/government.html').read_text('utf-8', errors='ignore')
          for tag in re.findall(r'<img\b[^>]*>', government, flags=re.I):
              lower = html.unescape(tag).lower()
              if 'logo' in lower or 'cipmn' in lower:
                  print(html.unescape(tag)[:1500])

          print('=== APPLICATION CIPMN_LOGO CONTEXT ===')
          application = pathlib.Path('/tmp/application.html').read_text('utf-8', errors='ignore')
          matches = list(re.finditer(r'cipmn[_-]?logo', application, flags=re.I))
          for match in matches[:20]:
              start = max(0, match.start() - 500)
              end = min(len(application), match.end() + 500)
              print(application[start:end])
              print('---')
          print(f'application_logo_mentions={len(matches)}')
          PY
