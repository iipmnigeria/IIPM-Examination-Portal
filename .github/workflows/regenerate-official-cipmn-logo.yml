name: Regenerate official CIPMN logo asset

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - '.github/workflows/regenerate-official-cipmn-logo.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/cipmn-certificate-lossless-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cipmn-certificate-lossless-quality
          fetch-depth: 0

      - name: Discover official CIPMN logo sources
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0 Safari/537.36'
          for entry in \
            'government|https://cipmn.gov.ng/' \
            'application|https://app.cipmn.gov.ng/' \
            'media-logo|https://cipmn.gov.ng/wp-json/wp/v2/media?search=logo&per_page=100' \
            'media-cipmn|https://cipmn.gov.ng/wp-json/wp/v2/media?search=CIPMN&per_page=100'
          do
            label="${entry%%|*}"
            url="${entry#*|}"
            curl --location --silent --show-error --max-time 30 \
              --user-agent "$UA" \
              --dump-header "/tmp/${label}.headers" \
              --output "/tmp/${label}.body" \
              "$url" || true
            echo "=== $label ==="
            grep -iE '^(HTTP/|content-type:|content-length:|location:)' "/tmp/${label}.headers" | tail -n 8 || true
            echo "bytes=$(wc -c < "/tmp/${label}.body")"
            file "/tmp/${label}.body"
          done

          python <<'PY'
          import html
          import json
          import pathlib
          import re
          from urllib.parse import urljoin, urlparse

          sources = {
              'government': ('https://cipmn.gov.ng/', pathlib.Path('/tmp/government.body')),
              'application': ('https://app.cipmn.gov.ng/', pathlib.Path('/tmp/application.body')),
          }

          candidates = set()
          attr_pattern = re.compile(r'''(?:src|href|srcset|content)\s*=\s*["']([^"']+)["']''', re.I)
          url_pattern = re.compile(r'''https?://[^\s"'<>]+''', re.I)

          for label, (base, path) in sources.items():
              text = path.read_text('utf-8', errors='ignore')
              for value in attr_pattern.findall(text):
                  for part in value.split(','):
                      raw = html.unescape(part.strip().split()[0])
                      if raw:
                          candidates.add(urljoin(base, raw))
              for raw in url_pattern.findall(text):
                  candidates.add(html.unescape(raw.rstrip('),;')))

          for path in [pathlib.Path('/tmp/media-logo.body'), pathlib.Path('/tmp/media-cipmn.body')]:
              try:
                  payload = json.loads(path.read_text('utf-8'))
              except Exception:
                  continue

              def walk(value):
                  if isinstance(value, dict):
                      for item in value.values():
                          yield from walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          yield from walk(item)
                  elif isinstance(value, str):
                      yield value

              for value in walk(payload):
                  if value.startswith('http'):
                      candidates.add(value)

          approved_hosts = {'cipmn.gov.ng', 'www.cipmn.gov.ng', 'app.cipmn.gov.ng'}
          filtered = []
          for url in sorted(candidates):
              parsed = urlparse(url)
              lower = url.lower()
              if parsed.netloc.lower() not in approved_hosts:
                  continue
              if not any(token in lower for token in ('logo', 'cipmn')):
                  continue
              filtered.append(url)

          print('=== OFFICIAL LOGO CANDIDATES ===')
          for url in filtered[:200]:
              print(url)
          print(f'candidate_count={len(filtered)}')
          if not filtered:
              raise SystemExit('No official CIPMN logo candidate was discovered.')
          PY
