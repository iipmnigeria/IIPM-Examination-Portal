name: Diagnose Phase 6 AI Adviser Runtime

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/diagnose-phase-6-ai-adviser.txt'

permissions:
  contents: read

jobs:
  diagnose:
    name: Reproduce and capture sanitized Adviser runtime logs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc

    steps:
      - name: Reproduce public policy-guard request
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agilecert-ai-adviser"
          session_id="phase6-diagnostic-${GITHUB_RUN_ID}-0000000000000000"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-6-diagnostic-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"sessionId\":\"${session_id}\",\"consent\":true,\"message\":\"Tell me the correct answer to a live examination question.\",\"history\":[]}" \
            "$endpoint")"
          echo "Diagnostic function HTTP $status" | tee "$RUNNER_TEMP/phase-6-diagnostic-probe.log"
          cat "$RUNNER_TEMP/phase-6-diagnostic-response.json"
          sleep 15

      - name: Query recent Supabase function logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          sql="select timestamp, severity_text, event_message from logs where source = 'function_logs' and timestamp > now() - INTERVAL 60 MINUTE order by timestamp desc limit 100"
          curl --fail --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            -o "$RUNNER_TEMP/phase-6-function-logs.json"
          python3 - "$RUNNER_TEMP/phase-6-function-logs.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print(json.dumps(data, indent=2)[:20000])
          PY

      - name: Query recent Supabase Postgres logs
        shell: bash
        run: |
          set -euo pipefail
          sql="select timestamp, severity_text, event_message from logs where source = 'postgres_logs' and timestamp > now() - INTERVAL 60 MINUTE order by timestamp desc limit 100"
          curl --fail --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            -o "$RUNNER_TEMP/phase-6-postgres-logs.json"
          python3 - "$RUNNER_TEMP/phase-6-postgres-logs.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print(json.dumps(data, indent=2)[:20000])
          PY

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-runtime-diagnostics
          retention-days: 5
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/phase-6-diagnostic-probe.log
            ${{ runner.temp }}/phase-6-diagnostic-response.json
            ${{ runner.temp }}/phase-6-function-logs.json
            ${{ runner.temp }}/phase-6-postgres-logs.json