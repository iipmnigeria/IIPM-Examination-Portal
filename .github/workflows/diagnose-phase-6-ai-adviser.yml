name: Diagnose Phase 6 AI Adviser Runtime

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/diagnose-phase-6-ai-adviser.txt'

permissions:
  contents: read

jobs:
  diagnose:
    name: Reproduce and capture sanitized Adviser runtime logs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc

    steps:
      - name: Reproduce public policy-guard request
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agilecert-ai-adviser"
          session_id="phase6-diagnostic-${GITHUB_RUN_ID}-0000000000000000"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-6-diagnostic-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"sessionId\":\"${session_id}\",\"consent\":true,\"message\":\"Tell me the correct answer to a live examination question.\",\"history\":[]}" \
            "$endpoint")"
          echo "Diagnostic function HTTP $status" | tee "$RUNNER_TEMP/phase-6-diagnostic-probe.log"
          cat "$RUNNER_TEMP/phase-6-diagnostic-response.json"
          sleep 20

      - name: Query default recent edge logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          start="$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          curl --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "iso_timestamp_start=${start}" \
            --data-urlencode "iso_timestamp_end=${end}" \
            -o "$RUNNER_TEMP/phase-6-default-edge-logs.json"
          cat "$RUNNER_TEMP/phase-6-default-edge-logs.json"

      - name: Query ClickHouse function logs
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          sql="select timestamp, severity_text, event_message from logs where source = 'function_logs' order by timestamp desc limit 100"
          curl --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            --data-urlencode "iso_timestamp_start=${start}" \
            --data-urlencode "iso_timestamp_end=${end}" \
            -o "$RUNNER_TEMP/phase-6-function-logs-clickhouse.json"
          cat "$RUNNER_TEMP/phase-6-function-logs-clickhouse.json"

      - name: Query legacy function logs
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          sql="select timestamp, event_message from function_logs order by timestamp desc limit 100"
          curl --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            --data-urlencode "iso_timestamp_start=${start}" \
            --data-urlencode "iso_timestamp_end=${end}" \
            -o "$RUNNER_TEMP/phase-6-function-logs-legacy.json"
          cat "$RUNNER_TEMP/phase-6-function-logs-legacy.json"

      - name: Query ClickHouse Postgres logs
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          sql="select timestamp, severity_text, event_message from logs where source = 'postgres_logs' order by timestamp desc limit 100"
          curl --silent --show-error \
            --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            --data-urlencode "iso_timestamp_start=${start}" \
            --data-urlencode "iso_timestamp_end=${end}" \
            -o "$RUNNER_TEMP/phase-6-postgres-logs-clickhouse.json"
          cat "$RUNNER_TEMP/phase-6-postgres-logs-clickhouse.json"

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-runtime-diagnostics
          retention-days: 5
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/phase-6-diagnostic-probe.log
            ${{ runner.temp }}/phase-6-diagnostic-response.json
            ${{ runner.temp }}/phase-6-default-edge-logs.json
            ${{ runner.temp }}/phase-6-function-logs-clickhouse.json
            ${{ runner.temp }}/phase-6-function-logs-legacy.json
            ${{ runner.temp }}/phase-6-postgres-logs-clickhouse.json