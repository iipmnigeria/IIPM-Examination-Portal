name: Deploy CIPMN Catalogue Navigation Pages

on:
  push:
    branches: [main]
    paths:
      - 'deployment-triggers/deploy-cipmn-catalogue-navigation.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-cipmn-catalogue-navigation-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish and verify catalogue navigation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APPROVED_APP_COMMIT: '83cbb43d83cdac2178a9a8d8886afca37d59c169'

    steps:
      - name: Checkout exact approved application source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Verify exact approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s src/components/StudentDashboard.tsx
          grep -q 'IIPM Specialist Certification Catalogue' src/components/StudentDashboard.tsx
          grep -q 'CIPMN Professional Licensing Mock Examinations' src/components/StudentDashboard.tsx
          grep -q 'Academic Gradebook & Credentials' src/components/StudentDashboard.tsx
          grep -q "programmeCode === 'CIPMN-MOCK'" src/components/StudentDashboard.tsx

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify compiled catalogue navigation
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

          python3 - <<'PY'
          from pathlib import Path

          markers = [
              'IIPM Specialist Certification Catalogue',
              'CIPMN Professional Licensing Mock Examinations',
              'Academic Gradebook & Credentials',
              'CIPMN-MOCK',
          ]
          javascript = sorted(Path('dist/assets').glob('*.js'))
          assert javascript, 'No compiled JavaScript files were found.'
          selected = set()
          for marker in markers:
              matching = [
                  path for path in javascript
                  if marker in path.read_text(encoding='utf-8', errors='ignore')
              ]
              assert matching, f'Compiled marker is missing: {marker}'
              selected.update(matching)
          Path('catalogue-marker-bundle-paths.txt').write_text(
              '\n'.join(str(path) for path in sorted(selected)) + '\n',
              encoding='utf-8',
          )
          PY

          : > compiled-catalogue-bundles.sha256
          while IFS= read -r js_file; do
            test -s "$js_file"
            printf '%s  %s\n' "$(sha256sum "$js_file" | cut -d' ' -f1)" "$(basename "$js_file")" \
              >> compiled-catalogue-bundles.sha256
          done < catalogue-marker-bundle-paths.txt
          sort -k2 -o compiled-catalogue-bundles.sha256 compiled-catalogue-bundles.sha256
          test -s compiled-catalogue-bundles.sha256
          cat compiled-catalogue-bundles.sha256
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload compiled Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy compiled Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live compiled bundle
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          success=0

          for attempt in $(seq 1 20); do
            rm -rf live-catalogue-assets
            mkdir -p live-catalogue-assets
            all_assets_valid=1

            if ! curl --fail --silent --show-error --location "$PAGE_URL" -o live-index.html; then
              all_assets_valid=0
            elif grep -q '/src/main.tsx' live-index.html; then
              all_assets_valid=0
            fi

            if [ "$all_assets_valid" -eq 1 ]; then
              while read -r expected_hash asset_name; do
                asset_url="$(python3 - "$PAGE_URL" "$asset_name" <<'PY'
          import sys
          from urllib.parse import urljoin
          print(urljoin(sys.argv[1], 'assets/' + sys.argv[2]))
          PY
          )"
                destination="live-catalogue-assets/$asset_name"
                if ! curl --fail --silent --show-error --location "$asset_url" -o "$destination"; then
                  all_assets_valid=0
                  break
                fi
                actual_hash="$(sha256sum "$destination" | cut -d' ' -f1)"
                if [ "$actual_hash" != "$expected_hash" ]; then
                  all_assets_valid=0
                  break
                fi
              done < compiled-catalogue-bundles.sha256
            fi

            if [ "$all_assets_valid" -eq 1 ]; then
              if python3 - <<'PY'
          from pathlib import Path

          markers = [
              'IIPM Specialist Certification Catalogue',
              'CIPMN Professional Licensing Mock Examinations',
              'Academic Gradebook & Credentials',
              'CIPMN-MOCK',
          ]
          contents = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in sorted(Path('live-catalogue-assets').glob('*.js'))
          )
          missing = [marker for marker in markers if marker not in contents]
          assert not missing, f'Live catalogue markers are missing: {missing}'
          PY
              then
                success=1
                break
              fi
            fi

            sleep 6
          done

          test "$success" -eq 1
          : > live-catalogue-bundles.sha256
          for js_file in live-catalogue-assets/*.js; do
            printf '%s  %s\n' "$(sha256sum "$js_file" | cut -d' ' -f1)" "$(basename "$js_file")" \
              >> live-catalogue-bundles.sha256
          done
          sort -k2 -o live-catalogue-bundles.sha256 live-catalogue-bundles.sha256
          diff -u compiled-catalogue-bundles.sha256 live-catalogue-bundles.sha256

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          compiled_manifest = Path('compiled-catalogue-bundles.sha256').read_bytes()
          live_manifest = Path('live-catalogue-bundles.sha256').read_bytes()
          assert compiled_manifest == live_manifest
          compiled_hash = hashlib.sha256(compiled_manifest).hexdigest()
          live_hash = hashlib.sha256(live_manifest).hexdigest()
          evidence = {
              'sourceCommit': os.environ['APPROVED_APP_COMMIT'],
              'pageUrl': os.environ['PAGE_URL'],
              'compiledBundleSha256': compiled_hash,
              'liveBundleSha256': live_hash,
              'verifiedAssetCount': len(Path('compiled-catalogue-bundles.sha256').read_text().splitlines()),
              'navigation': [
                  'IIPM Specialist Certification Catalogue',
                  'CIPMN Professional Licensing Mock Examinations',
                  'Academic Gradebook & Credentials',
              ],
              'cipmnRoutingMarker': 'CIPMN-MOCK',
          }
          Path('cipmn-catalogue-navigation-production.json').write_text(
              json.dumps(evidence, indent=2), encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-catalogue-navigation-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            catalogue-marker-bundle-paths.txt
            compiled-catalogue-bundles.sha256
            live-index.html
            live-catalogue-bundles.sha256
            cipmn-catalogue-navigation-production.json
