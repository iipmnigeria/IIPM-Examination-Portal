name: Temporary Live Unified Certification Programmes Verification

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - ".github/workflows/verify-live-unified-certification-programmes-temporary.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed unified catalogue bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed catalogue markers
        run: |
          python - <<'PY'
          import re
          import time
          import urllib.parse
          import urllib.request

          base_url = 'https://agilecert.iipmi.org/'
          required = [
              'Certification Programmes',
              'IIPM Specialist Certification Catalogue',
              'AgileCert Certification Catalogue',
              'Open AgileCert Catalogue',
              'Project Risk & Quality Management',
              'Performance and People Management',
          ]
          last_error = None

          for attempt in range(1, 13):
              try:
                  request = urllib.request.Request(
                      base_url,
                      headers={'User-Agent': 'IIPM-Deployment-Verification/1.0'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      html = response.read().decode('utf-8', errors='replace')

                  scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
                  assets = [html]
                  for source in scripts:
                      url = urllib.parse.urljoin(base_url, source)
                      asset_request = urllib.request.Request(
                          url,
                          headers={'User-Agent': 'IIPM-Deployment-Verification/1.0'},
                      )
                      with urllib.request.urlopen(asset_request, timeout=30) as response:
                          assets.append(response.read().decode('utf-8', errors='replace'))

                  deployed = '\n'.join(assets)
                  missing = [marker for marker in required if marker not in deployed]
                  if not missing:
                      print(f'Unified Certification Programmes bundle verified on attempt {attempt}.')
                      print(f'Downloaded {len(scripts)} script asset(s).')
                      break

                  raise RuntimeError(f'Missing marker(s): {missing}')
              except Exception as error:
                  last_error = error
                  print(f'Attempt {attempt} not ready: {error}')
                  if attempt < 12:
                      time.sleep(10)
          else:
              raise SystemExit(f'Unified catalogue bundle not deployed: {last_error}')
          PY
