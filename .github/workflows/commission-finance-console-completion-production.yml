name: Commission Finance Console Completion Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/commission-finance-console-completion-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: commission-finance-console-completion-production
  cancel-in-progress: false

jobs:
  commission:
    name: Run rolled-back production UAT and commissioning
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_COMMIT: '39255e9ea56178ef2b362a089bd0788846dcbbd7'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      LIVE_BASE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact commissioned source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact source and production bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -s supabase/migrations/202608010600_finance_console_completion.sql
          test -s src/components/FinanceConsoleCompletionPanel.tsx
          test -s src/services/financeConsoleCompletionService.ts
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -R -q 'Advanced examination pricing saved and audited' dist/assets
          grep -R -q 'finance-gateway-status' dist/assets
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > finance-console-commissioned-dist.sha256

      - name: Run rolled-back live role and finance lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          project_ref = os.environ['PROJECT_REF']
          access_token = os.environ['SUPABASE_ACCESS_TOKEN']
          endpoint = f'https://api.supabase.com/v1/projects/{project_ref}/database/query'

          def run_query(sql: str):
              payload = json.dumps({'query': sql}).encode('utf-8')
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {access_token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'IIPM-Finance-Console-Commissioning',
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  body = response.read().decode('utf-8')
              result = json.loads(body)
              if not isinstance(result, list):
                  raise AssertionError(result)
              return result

          state_query = r"""
          with protected_functions as (
            select
              p.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(p.oid)) as definition_hash
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in (
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order'
              )
          )
          select jsonb_build_object(
            'settingsHash', (
              select md5(to_jsonb(setting)::text)
              from public.agilecert_finance_settings setting
              where singleton = true
            ),
            'rolePermissionsHash', (
              select md5(coalesce(string_agg(
                role || ':' || permission_key || ':' || is_granted::text,
                '|' order by role, permission_key
              ), ''))
              from public.agilecert_finance_role_permissions
            ),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(
                identity || ':' || definition_hash,
                '|' order by identity
              ), ''))
              from protected_functions
            ),
            'examPricesHash', (
              select md5(coalesce(string_agg(
                id::text || ':' || examination_id::text || ':' || currency || ':' ||
                amount_minor::text || ':' || is_active::text,
                '|' order by id
              ), ''))
              from public.exam_prices
            ),
            'couponHash', (
              select md5(coalesce(string_agg(
                id::text || ':' || upper(code) || ':' || is_active::text || ':' ||
                discount_type || ':' || discount_value::text,
                '|' order by id
              ), ''))
              from public.coupons
            ),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'financeAuditEvents', (select count(*) from public.agilecert_finance_audit_events),
            'syntheticPricingPolicies', (
              select count(*) from public.agilecert_exam_pricing_policies where currency = 'XUT'
            ),
            'syntheticPrices', (
              select count(*) from public.exam_prices where currency = 'XUT'
            ),
            'syntheticCoupons', (
              select count(*) from public.coupons where upper(code) = 'UATFCCOMMISSION'
            ),
            'syntheticAuditEvents', (
              select count(*) from public.agilecert_finance_audit_events
              where coalesce(metadata ->> 'reason', '') like 'Production UAT%'
            ),
            'activeSuperAdministrators', (
              select count(*) from public.profiles where role = 'super_admin' and is_active = true
            ),
            'activeExaminationAdministrators', (
              select count(*) from public.profiles where role = 'exam_admin' and is_active = true
            ),
            'activeCandidates', (
              select count(*) from public.profiles where role = 'candidate' and is_active = true
            )
          ) as state;
          """

          pre_rows = run_query(state_query)
          pre = next(row['state'] for row in pre_rows if isinstance(row, dict) and 'state' in row)
          assert pre['activeSuperAdministrators'] >= 1, pre
          assert pre['activeExaminationAdministrators'] >= 1, pre
          assert pre['activeCandidates'] >= 1, pre
          assert pre['syntheticPricingPolicies'] == 0, pre
          assert pre['syntheticPrices'] == 0, pre
          assert pre['syntheticCoupons'] == 0, pre
          assert pre['syntheticAuditEvents'] == 0, pre
          Path('finance-console-commissioning-pre.json').write_text(
              json.dumps(pre, indent=2), encoding='utf-8'
          )

          uat_sql = r"""
          begin;

          do $uat$
          declare
            v_super_id uuid;
            v_exam_admin_id uuid;
            v_candidate_id uuid;
            v_examination_id uuid;
            v_programme_id uuid;
            v_access jsonb;
            v_snapshot jsonb;
            v_settings public.agilecert_finance_settings%rowtype;
            v_receipt jsonb;
            v_order_id uuid;
            v_order_type text;
          begin
            select id into v_super_id
            from public.profiles
            where role = 'super_admin' and is_active = true
            order by created_at
            limit 1;

            select id into v_exam_admin_id
            from public.profiles
            where role = 'exam_admin' and is_active = true
            order by created_at
            limit 1;

            select id into v_candidate_id
            from public.profiles
            where role = 'candidate' and is_active = true
            order by created_at
            limit 1;

            select examination.id, examination.programme_id
            into v_examination_id, v_programme_id
            from public.examinations examination
            where examination.is_published = true
            order by examination.created_at
            limit 1;

            if v_super_id is null or v_exam_admin_id is null
               or v_candidate_id is null or v_examination_id is null then
              raise exception 'Production commissioning requires active super administrator, examination administrator, candidate and published examination records.';
            end if;

            if (
              select count(*) from public.agilecert_finance_role_permissions
              where role = 'exam_admin'
                and permission_key in (
                  'finance.dashboard.view',
                  'finance.exports.download',
                  'finance.receipts.manage'
                )
                and is_granted = true
            ) <> 3 then
              raise exception 'The expected Examination Administrator reporting permissions are not active.';
            end if;

            if (
              select count(*) from public.agilecert_finance_role_permissions
              where role = 'exam_admin'
                and permission_key in (
                  'finance.settings.manage',
                  'finance.transactions.reconcile',
                  'finance.access.recover',
                  'finance.adjustments.approve'
                )
                and is_granted = true
            ) <> 0 then
              raise exception 'A high-impact Examination Administrator permission is unexpectedly granted.';
            end if;

            perform set_config('request.jwt.claim.sub', v_candidate_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);
            begin
              perform public.get_finance_console_completion_snapshot(10, now() - interval '30 days', now());
              raise exception 'UAT candidate unexpectedly accessed the Finance Console.';
            exception when others then
              if position('UAT candidate unexpectedly' in sqlerrm) > 0 then
                raise;
              end if;
              if position('does not have permission' in sqlerrm) = 0 then
                raise exception 'Candidate denial returned an unexpected error: %', sqlerrm;
              end if;
            end;

            perform set_config('request.jwt.claim.sub', v_exam_admin_id::text, true);
            v_access := public.get_my_finance_console_access();
            if v_access ->> 'role' <> 'exam_admin'
               or coalesce((v_access ->> 'canViewDashboard')::boolean, false) is not true
               or coalesce((v_access ->> 'canManageReceipts')::boolean, false) is not true
               or coalesce((v_access ->> 'canExportTransactions')::boolean, false) is not true
               or coalesce((v_access ->> 'canManageSettings')::boolean, false) is not false
               or coalesce((v_access ->> 'canReconcileTransactions')::boolean, false) is not false
               or coalesce((v_access ->> 'canRecoverAccess')::boolean, false) is not false
               or coalesce((v_access ->> 'canApproveAdjustments')::boolean, false) is not false then
              raise exception 'Examination Administrator default Finance Console access is incorrect: %', v_access;
            end if;

            select * into v_settings
            from public.agilecert_finance_settings
            where singleton = true;

            begin
              perform public.finance_upsert_general_settings(
                p_default_currency => v_settings.default_currency,
                p_supported_currencies => v_settings.supported_currencies,
                p_paystack_enabled => v_settings.paystack_enabled,
                p_paystack_environment => v_settings.paystack_environment,
                p_paystack_status_note => v_settings.paystack_status_note,
                p_tax_enabled => v_settings.tax_enabled,
                p_tax_label => v_settings.tax_label,
                p_default_tax_profile_id => v_settings.default_tax_profile_id,
                p_receipt_prefix => v_settings.receipt_prefix,
                p_payment_reference_prefix => v_settings.payment_reference_prefix,
                p_payment_expiry_minutes => v_settings.payment_expiry_minutes,
                p_abandoned_order_hours => v_settings.abandoned_order_hours,
                p_refunds_enabled => v_settings.refunds_enabled,
                p_reversals_enabled => v_settings.reversals_enabled,
                p_manual_payment_approval_enabled => v_settings.manual_payment_approval_enabled,
                p_bank_transfer_instructions => v_settings.bank_transfer_instructions,
                p_minimum_transaction_minor => v_settings.minimum_transaction_minor,
                p_maximum_transaction_minor => v_settings.maximum_transaction_minor,
                p_allow_partial_payments => v_settings.allow_partial_payments,
                p_allow_overpayments => v_settings.allow_overpayments,
                p_change_reason => 'Production UAT expected settings denial'
              );
              raise exception 'UAT Examination Administrator unexpectedly changed settings before delegation.';
            exception when others then
              if position('unexpectedly changed settings' in sqlerrm) > 0 then
                raise;
              end if;
              if position('does not have permission' in sqlerrm) = 0 then
                raise exception 'Settings denial returned an unexpected error: %', sqlerrm;
              end if;
            end;

            perform set_config('request.jwt.claim.sub', v_super_id::text, true);
            v_access := public.get_my_finance_console_access();
            if v_access ->> 'role' <> 'super_admin'
               or coalesce((v_access ->> 'canManageSettings')::boolean, false) is not true
               or coalesce((v_access ->> 'canReconcileTransactions')::boolean, false) is not true
               or coalesce((v_access ->> 'canRecoverAccess')::boolean, false) is not true
               or coalesce((v_access ->> 'canApproveAdjustments')::boolean, false) is not true then
              raise exception 'Super Administrator Finance Console authority is incomplete: %', v_access;
            end if;

            perform public.admin_set_finance_role_permission(
              'exam_admin',
              'finance.settings.manage',
              true,
              'Production UAT temporary settings delegation'
            );

            perform set_config('request.jwt.claim.sub', v_exam_admin_id::text, true);
            v_access := public.get_my_finance_console_access();
            if coalesce((v_access ->> 'canManageSettings')::boolean, false) is not true then
              raise exception 'Temporary settings delegation was not reflected for the Examination Administrator.';
            end if;

            perform public.finance_upsert_general_settings(
              p_default_currency => v_settings.default_currency,
              p_supported_currencies => v_settings.supported_currencies,
              p_paystack_enabled => v_settings.paystack_enabled,
              p_paystack_environment => v_settings.paystack_environment,
              p_paystack_status_note => coalesce(v_settings.paystack_status_note, '') || ' [Production UAT]',
              p_tax_enabled => v_settings.tax_enabled,
              p_tax_label => v_settings.tax_label,
              p_default_tax_profile_id => v_settings.default_tax_profile_id,
              p_receipt_prefix => v_settings.receipt_prefix,
              p_payment_reference_prefix => v_settings.payment_reference_prefix,
              p_payment_expiry_minutes => v_settings.payment_expiry_minutes,
              p_abandoned_order_hours => v_settings.abandoned_order_hours,
              p_refunds_enabled => v_settings.refunds_enabled,
              p_reversals_enabled => v_settings.reversals_enabled,
              p_manual_payment_approval_enabled => v_settings.manual_payment_approval_enabled,
              p_bank_transfer_instructions => v_settings.bank_transfer_instructions,
              p_minimum_transaction_minor => v_settings.minimum_transaction_minor,
              p_maximum_transaction_minor => v_settings.maximum_transaction_minor,
              p_allow_partial_payments => v_settings.allow_partial_payments,
              p_allow_overpayments => v_settings.allow_overpayments,
              p_change_reason => 'Production UAT delegated settings save'
            );

            perform set_config('request.jwt.claim.sub', v_super_id::text, true);

            perform public.finance_upsert_exam_pricing_policy(
              p_examination_id => v_examination_id,
              p_currency => 'XUT',
              p_standard_amount_minor => 1234500,
              p_promotional_amount_minor => 1111100,
              p_promotion_name => 'Production UAT Promotion',
              p_promotion_starts_at => now() - interval '1 minute',
              p_promotion_ends_at => now() + interval '1 day',
              p_access_mode => 'paid',
              p_attempts_included => 2,
              p_retake_amount_minor => 900000,
              p_bulk_cart_eligible => true,
              p_is_active => true,
              p_change_reason => 'Production UAT advanced pricing lifecycle'
            );

            if not exists (
              select 1
              from public.agilecert_exam_pricing_policies
              where examination_id = v_examination_id
                and currency = 'XUT'
                and standard_amount_minor = 1234500
                and promotional_amount_minor = 1111100
                and attempts_included = 2
                and retake_amount_minor = 900000
                and bulk_cart_eligible = true
                and is_active = true
            ) then
              raise exception 'The advanced pricing UAT policy was not stored correctly.';
            end if;

            if not exists (
              select 1 from public.exam_prices
              where examination_id = v_examination_id
                and currency = 'XUT'
                and amount_minor = 1111100
                and is_active = true
            ) then
              raise exception 'The effective promotional amount was not applied to the authoritative examination price.';
            end if;

            perform public.finance_upsert_coupon_advanced(
              p_coupon_id => null,
              p_code => 'UATFCCOMMISSION',
              p_name => 'Production UAT Coupon',
              p_description => 'Rolled-back Finance Console commissioning coupon',
              p_discount_type => 'percentage',
              p_discount_value => 15,
              p_currency => null,
              p_programme_ids => array[v_programme_id],
              p_examination_ids => array[v_examination_id],
              p_minimum_amount_minor => 500000,
              p_minimum_module_count => 2,
              p_allow_multi_module_cart => false,
              p_maximum_discount_minor => 250000,
              p_starts_at => now() - interval '1 minute',
              p_expires_at => now() + interval '1 day',
              p_maximum_redemptions => 10,
              p_per_candidate_limit => 1,
              p_is_active => true,
              p_change_reason => 'Production UAT advanced coupon lifecycle'
            );

            if not exists (
              select 1 from public.coupons
              where upper(code) = 'UATFCCOMMISSION'
                and minimum_amount_minor = 500000
                and minimum_module_count = 2
                and allow_multi_module_cart = false
                and maximum_discount_minor = 250000
                and maximum_redemptions = 10
                and per_candidate_limit = 1
                and is_active = true
            ) then
              raise exception 'The advanced coupon UAT configuration was not stored correctly.';
            end if;

            if (
              select count(*)
              from public.agilecert_coupon_targets target
              join public.coupons coupon on coupon.id = target.coupon_id
              where upper(coupon.code) = 'UATFCCOMMISSION'
                and target.is_active = true
            ) <> 2 then
              raise exception 'The UAT coupon did not retain both selected targets.';
            end if;

            v_snapshot := public.get_finance_console_completion_snapshot(
              50,
              now() - interval '90 days',
              now()
            );
            if jsonb_typeof(v_snapshot) <> 'object'
               or jsonb_typeof(v_snapshot -> 'transactions') <> 'array'
               or jsonb_typeof(v_snapshot -> 'dashboard') <> 'object'
               or jsonb_typeof(v_snapshot -> 'pricingPolicies') <> 'array'
               or jsonb_typeof(v_snapshot -> 'couponTargets') <> 'array' then
              raise exception 'The Finance Console completion snapshot payload is invalid: %', v_snapshot;
            end if;

            perform set_config('request.jwt.claim.sub', v_exam_admin_id::text, true);
            perform public.finance_record_export(
              'production_uat_csv',
              jsonb_array_length(v_snapshot -> 'transactions'),
              jsonb_build_object('rolledBack', true, 'scope', 'commissioning')
            );

            select 'exam', id into v_order_type, v_order_id
            from public.exam_orders
            where status in ('paid', 'waived')
            order by created_at desc
            limit 1;

            if v_order_id is null then
              select 'bulk', id into v_order_type, v_order_id
              from public.exam_bulk_orders
              where status in ('paid', 'partially_fulfilled', 'fulfilled')
              order by created_at desc
              limit 1;
            end if;

            if v_order_id is not null then
              v_receipt := public.finance_get_receipt_payload(v_order_type, v_order_id);
              if jsonb_typeof(v_receipt) <> 'object'
                 or nullif(v_receipt ->> 'receiptNumber', '') is null
                 or nullif(v_receipt ->> 'reference', '') is null then
                raise exception 'The production receipt payload is invalid: %', v_receipt;
              end if;
            end if;

            if v_order_id is null then
              select 'exam', id into v_order_type, v_order_id
              from public.exam_orders
              order by created_at desc
              limit 1;
            end if;
            if v_order_id is null then
              select 'bulk', id into v_order_type, v_order_id
              from public.exam_bulk_orders
              order by created_at desc
              limit 1;
            end if;

            perform set_config('request.jwt.claim.sub', v_super_id::text, true);
            if v_order_id is not null then
              perform public.finance_queue_recovery_action(
                v_order_type,
                v_order_id,
                'refund_review',
                'Production UAT recovery queue lifecycle'
              );
            end if;

            perform public.admin_set_finance_role_permission(
              'exam_admin',
              'finance.settings.manage',
              false,
              'Production UAT temporary settings delegation revoked'
            );

            perform set_config('request.jwt.claim.sub', v_exam_admin_id::text, true);
            v_access := public.get_my_finance_console_access();
            if coalesce((v_access ->> 'canManageSettings')::boolean, false) is not false then
              raise exception 'The temporary settings permission was not revoked.';
            end if;

            if (
              select count(*)
              from public.agilecert_finance_audit_events
              where coalesce(metadata ->> 'reason', '') like 'Production UAT%'
            ) < 5 then
              raise exception 'The rolled-back UAT lifecycle did not produce the expected finance audit evidence.';
            end if;
          end;
          $uat$;

          select jsonb_build_object(
            'candidateAccessDenied', true,
            'examAdminDefaultReportingAccessPassed', true,
            'examAdminHighImpactDefaultDenialPassed', true,
            'superAdminAuthorityPassed', true,
            'permissionDelegationAndRevocationPassed', true,
            'generalSettingsSavePassed', true,
            'advancedPricingPassed', exists (
              select 1 from public.agilecert_exam_pricing_policies where currency = 'XUT'
            ),
            'effectivePromotionPassed', exists (
              select 1 from public.exam_prices where currency = 'XUT' and amount_minor = 1111100
            ),
            'advancedCouponPassed', exists (
              select 1 from public.coupons where upper(code) = 'UATFCCOMMISSION'
            ),
            'couponTargetsPassed', (
              select count(*)
              from public.agilecert_coupon_targets target
              join public.coupons coupon on coupon.id = target.coupon_id
              where upper(coupon.code) = 'UATFCCOMMISSION'
            ) = 2,
            'snapshotAndDashboardPassed', true,
            'exportAuditPassed', exists (
              select 1 from public.agilecert_finance_audit_events
              where action = 'finance_data_exported'
                and metadata ->> 'exportType' = 'production_uat_csv'
            ),
            'receiptEvaluatedWhenAvailable', exists (
              select 1 from public.exam_orders where status in ('paid', 'waived')
            ) or exists (
              select 1 from public.exam_bulk_orders
              where status in ('paid', 'partially_fulfilled', 'fulfilled')
            ),
            'recoveryQueueEvaluatedWhenOrderAvailable', exists (
              select 1 from public.exam_orders
            ) or exists (
              select 1 from public.exam_bulk_orders
            ),
            'uatAuditEventsInsideTransaction', (
              select count(*) from public.agilecert_finance_audit_events
              where coalesce(metadata ->> 'reason', '') like 'Production UAT%'
            ),
            'transactionWillRollBack', true
          ) as uat_verification;

          rollback;

          select jsonb_build_object(
            'syntheticPricingPolicies', (
              select count(*) from public.agilecert_exam_pricing_policies where currency = 'XUT'
            ),
            'syntheticPrices', (
              select count(*) from public.exam_prices where currency = 'XUT'
            ),
            'syntheticCoupons', (
              select count(*) from public.coupons where upper(code) = 'UATFCCOMMISSION'
            ),
            'syntheticAuditEvents', (
              select count(*) from public.agilecert_finance_audit_events
              where coalesce(metadata ->> 'reason', '') like 'Production UAT%'
            ),
            'highImpactExamAdminGrants', (
              select count(*) from public.agilecert_finance_role_permissions
              where role = 'exam_admin'
                and permission_key in (
                  'finance.settings.manage',
                  'finance.transactions.reconcile',
                  'finance.access.recover',
                  'finance.adjustments.approve'
                )
                and is_granted = true
            ),
            'transactionRolledBack', true
          ) as cleanup_verification;
          """

          uat_rows = run_query(uat_sql)
          uat = next(
              row['uat_verification']
              for row in uat_rows
              if isinstance(row, dict) and isinstance(row.get('uat_verification'), dict)
          )
          cleanup = next(
              row['cleanup_verification']
              for row in uat_rows
              if isinstance(row, dict) and isinstance(row.get('cleanup_verification'), dict)
          )

          required_true = [
              'candidateAccessDenied',
              'examAdminDefaultReportingAccessPassed',
              'examAdminHighImpactDefaultDenialPassed',
              'superAdminAuthorityPassed',
              'permissionDelegationAndRevocationPassed',
              'generalSettingsSavePassed',
              'advancedPricingPassed',
              'effectivePromotionPassed',
              'advancedCouponPassed',
              'couponTargetsPassed',
              'snapshotAndDashboardPassed',
              'exportAuditPassed',
              'transactionWillRollBack',
          ]
          for key in required_true:
              assert uat.get(key) is True, (key, uat)
          assert int(uat.get('uatAuditEventsInsideTransaction') or 0) >= 5, uat
          assert cleanup.get('transactionRolledBack') is True, cleanup
          assert cleanup.get('syntheticPricingPolicies') == 0, cleanup
          assert cleanup.get('syntheticPrices') == 0, cleanup
          assert cleanup.get('syntheticCoupons') == 0, cleanup
          assert cleanup.get('syntheticAuditEvents') == 0, cleanup
          assert cleanup.get('highImpactExamAdminGrants') == 0, cleanup

          post_rows = run_query(state_query)
          post = next(row['state'] for row in post_rows if isinstance(row, dict) and 'state' in row)

          immutable_keys = [
              'settingsHash',
              'rolePermissionsHash',
              'protectedFunctionHash',
              'examPricesHash',
              'couponHash',
              'examOrders',
              'examPayments',
              'bulkOrders',
              'bulkPayments',
              'financeAuditEvents',
              'syntheticPricingPolicies',
              'syntheticPrices',
              'syntheticCoupons',
              'syntheticAuditEvents',
          ]
          for key in immutable_keys:
              assert post.get(key) == pre.get(key), (key, pre, post)

          safe = {
              'approvedSourceCommit': os.environ['EXPECTED_SOURCE_COMMIT'],
              'uat': uat,
              'cleanup': cleanup,
              'prePostStateMatched': True,
              'preservedStateKeys': immutable_keys,
              'commissionedAt': __import__('datetime').datetime.now(
                  __import__('datetime').timezone.utc
              ).isoformat(),
          }
          Path('finance-console-production-commissioning.json').write_text(
              json.dumps(safe, indent=2), encoding='utf-8'
          )
          Path('finance-console-commissioning-post.json').write_text(
              json.dumps(post, indent=2), encoding='utf-8'
          )
          print(json.dumps(safe, indent=2))
          PY

      - name: Verify live frontend and fail-closed functions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          live_base = os.environ['LIVE_BASE_URL']
          local_index = Path('dist/index.html').read_bytes()

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'IIPM-Finance-Console-Commissioning',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, (url, response.status)
                  return response.read()

          live_index = None
          for attempt in range(1, 7):
              query = urllib.parse.urlencode({
                  'commissioning': os.environ['EXPECTED_SOURCE_COMMIT'],
                  'attempt': attempt,
                  'time': int(time.time()),
              })
              candidate = fetch(f'{live_base}?{query}')
              if candidate == local_index:
                  live_index = candidate
                  break
              time.sleep(10)
          assert live_index == local_index, 'Live index.html does not match the commissioned build.'

          index_text = local_index.decode('utf-8')
          refs = sorted(set(re.findall(r'(?:src|href)=["\']([^"\']+)["\']', index_text)))
          live_bundle = bytearray()
          compared = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', 'data:', '#')):
                  continue
              relative = ref.lstrip('./').lstrip('/')
              local_path = Path('dist') / relative
              if not local_path.is_file():
                  continue
              local_bytes = local_path.read_bytes()
              live_bytes = fetch(urllib.parse.urljoin(live_base, ref))
              assert live_bytes == local_bytes, f'Live file mismatch: {ref}'
              if relative.endswith(('.js', '.mjs')):
                  live_bundle.extend(live_bytes)
              compared.append({
                  'path': relative,
                  'sha256': hashlib.sha256(local_bytes).hexdigest(),
                  'bytes': len(local_bytes),
              })

          bundle_text = live_bundle.decode('utf-8', errors='ignore')
          assert 'Advanced examination pricing saved and audited' in bundle_text
          assert 'finance-gateway-status' in bundle_text
          evidence = {
              'liveBaseUrl': live_base,
              'exactIndexMatch': True,
              'indexSha256': hashlib.sha256(local_index).hexdigest(),
              'exactAssetMatches': compared,
              'financeCompletionMarkersPresent': True,
          }
          Path('finance-console-live-commissioning.json').write_text(
              json.dumps(evidence, indent=2), encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2))
          PY

          for function_name in admin-verify-exam-payment finance-gateway-status; do
            status=$(curl --silent --show-error \
              -o "finance-console-${function_name}-commissioning-denial.json" \
              -w '%{http_code}' \
              -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/${function_name}" \
              -H 'Content-Type: application/json' \
              --data '{}')
            test "$status" != '200'
            ! grep -Eqi '(sk_(live|test)_[A-Za-z0-9]+|service_role|SUPABASE_SERVICE_ROLE_KEY)' \
              "finance-console-${function_name}-commissioning-denial.json"
          done

      - name: Upload commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-console-completion-production-commissioning
          retention-days: 30
          if-no-files-found: warn
          path: |
            finance-console-commissioned-dist.sha256
            finance-console-commissioning-pre.json
            finance-console-production-commissioning.json
            finance-console-commissioning-post.json
            finance-console-live-commissioning.json
            finance-console-admin-verify-exam-payment-commissioning-denial.json
            finance-console-finance-gateway-status-commissioning-denial.json
