name: Deploy Phase 5 Identity Assurance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-phase-5-identity-assurance.txt'

permissions:
  contents: read

concurrency:
  group: phase-5-identity-assurance-production
  cancel-in-progress: false

jobs:
  deploy-phase-5:
    name: Apply Phase 5 database, function and live verification
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      PHASE_5_COMMIT: '2308162d8e9047096c0292bf8450865399700145'
      PHASE_5_MIGRATION_1: '202607250101_phase_5_identity_assurance_professional_certificate.sql'
      PHASE_5_MIGRATION_2: '202607250102_phase_5_identity_assurance_hardening.sql'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout exact merged Phase 5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE_5_COMMIT }}
          fetch-depth: 0

      - name: Confirm exact source and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE_5_COMMIT"
          test -f "supabase/migrations/$PHASE_5_MIGRATION_1"
          test -f "supabase/migrations/$PHASE_5_MIGRATION_2"
          test -f supabase/functions/initialize-certificate-payment/index.ts
          test -f docs/AGILECERT_PHASE_5_SCOPE.md
          grep -q 'Identity Assurance and Professional Certificate Enablement' docs/AGILECERT_PHASE_5_SCOPE.md

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate merged application
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'Identity Assurance' "$js_file"
          grep -q 'Professional Certificate' "$js_file"
          sha256sum "$js_file" | tee "$RUNNER_TEMP/phase-5-expected-js.sha256"

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production Supabase
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview exactly two Phase 5 migrations
        shell: bash
        run: |
          set +e
          output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-5-dry-run.log"
          test "$status" -eq 0

          if printf '%s\n' "$output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 5 migrations are already applied.'
          else
            pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            expected="$(printf '%s\n%s\n' "$PHASE_5_MIGRATION_1" "$PHASE_5_MIGRATION_2" | sort -u)"
            test "$pending" = "$expected"
          fi

      - name: Apply Phase 5 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes \
            2>&1 | tee "$RUNNER_TEMP/phase-5-apply.log"

      - name: Verify production migration history and schema
        shell: bash
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase-5-migration-history.log"
          public_schema="$RUNNER_TEMP/phase-5-public-schema.sql"
          storage_schema="$RUNNER_TEMP/phase-5-storage-schema.sql"

          npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            2>&1 | tee "$history"
          for version in 202607230101 202607230102 202607240101 202607240102 202607240103 202607240104 202607240105 202607250101 202607250102; do
            grep -q "$version" "$history"
          done

          npx --yes supabase@latest db dump \
            --linked \
            --schema public \
            --file "$public_schema" \
            --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db dump \
            --linked \
            --schema storage \
            --file "$storage_schema" \
            --password "$SUPABASE_DB_PASSWORD"

          for marker in \
            agilecert_identity_verifications \
            agilecert_identity_verification_audits \
            agilecert_identity_is_approved \
            get_my_agilecert_identity_assurance \
            submit_my_agilecert_identity_assurance \
            withdraw_my_agilecert_identity_assurance \
            get_agilecert_identity_assurance_admin_console \
            review_agilecert_identity_assurance \
            create_agilecert_professional_certificate_order \
            agilecert_guard_and_invalidate_identity_on_profile_change \
            agilecert_issue_identity_verified_certificate_for_order; do
            grep -q "$marker" "$public_schema"
          done

          grep -q 'agilecert-identity-evidence' "$storage_schema"
          grep -q 'agilecert_candidate_identity_evidence' "$storage_schema"
          grep -q 'agilecert_admin_identity_evidence' "$storage_schema"

      - name: Deploy updated certificate-payment initializer
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy initialize-certificate-payment \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            2>&1 | tee "$RUNNER_TEMP/phase-5-function-deploy.log"

      - name: Verify active function and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          functions="$RUNNER_TEMP/phase-5-functions-list.log"
          npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$functions"
          grep -q 'initialize-certificate-payment' "$functions"
          grep -q 'verify-certificate-payment' "$functions"
          grep -q 'paystack-certificate-webhook' "$functions"
          grep -q 'initialize-exam-payment' "$functions"
          grep -q 'agilecert-material-delivery' "$functions"

          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/initialize-certificate-payment"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-5-function-probe.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' "$endpoint")"
          echo "initialize-certificate-payment HTTP $status" | tee "$RUNNER_TEMP/phase-5-function-probe.log"
          test "$status" = '400'
          grep -Eqi 'authentication is required|authorization' "$RUNNER_TEMP/phase-5-function-probe.json"

      - name: Verify live Phase 5 portal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-5-live"
          cd "$RUNNER_TEMP/phase-5-live"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

          success=0
          for attempt in $(seq 1 24); do
            if LIVE_URL="${LIVE_URL}?phase5=${GITHUB_RUN_ID}&attempt=${attempt}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });

          const response = await page.goto(process.env.LIVE_URL, {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForTimeout(6000);
          const status = response?.status() ?? 0;
          const title = await page.title();
          const bodyText = (await page.locator('body').innerText()).trim();
          const report = { status, title, bodyLength: bodyText.length, bodyPreview: bodyText.slice(0, 800), pageErrors, consoleErrors };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/phase-5-live-report.json`, JSON.stringify(report, null, 2));
          await page.screenshot({ path: `${process.env.RUNNER_TEMP}/phase-5-live.png`, fullPage: true });
          await browser.close();

          if (status < 200 || status >= 400) process.exit(1);
          if (!title.includes('AgileCert Global')) process.exit(1);
          if (bodyText.length < 100 || !bodyText.includes('AgileCert Global')) process.exit(1);
          if (pageErrors.length > 0 || consoleErrors.length > 0) process.exit(1);
          NODE
            then
              success=1
              break
            fi
            sleep 10
          done
          test "$success" = '1'

      - name: Upload Phase 5 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-identity-assurance-production-evidence
          path: |
            ${{ runner.temp }}/phase-5-expected-js.sha256
            ${{ runner.temp }}/phase-5-dry-run.log
            ${{ runner.temp }}/phase-5-apply.log
            ${{ runner.temp }}/phase-5-migration-history.log
            ${{ runner.temp }}/phase-5-public-schema.sql
            ${{ runner.temp }}/phase-5-storage-schema.sql
            ${{ runner.temp }}/phase-5-function-deploy.log
            ${{ runner.temp }}/phase-5-functions-list.log
            ${{ runner.temp }}/phase-5-function-probe.log
            ${{ runner.temp }}/phase-5-function-probe.json
            ${{ runner.temp }}/phase-5-live-report.json
            ${{ runner.temp }}/phase-5-live.png
          if-no-files-found: warn
          retention-days: 30
