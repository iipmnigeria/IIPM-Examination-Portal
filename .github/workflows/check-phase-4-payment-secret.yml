name: Check Phase 4 Payment Secret

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/check-phase-4-payment-secret.txt'

permissions:
  contents: read

jobs:
  audit-secret-names:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEDICATED_SECRET: ${{ secrets.AGILECERT_PAYSTACK_SECRET_KEY }}
      EXISTING_PAYSTACK_SECRET: ${{ secrets.PAYSTACK_SECRET_KEY }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit configured secret names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          {
            if [ -n "$DEDICATED_SECRET" ]; then
              echo 'github.AGILECERT_PAYSTACK_SECRET_KEY=present'
            else
              echo 'github.AGILECERT_PAYSTACK_SECRET_KEY=absent'
            fi
            if [ -n "$EXISTING_PAYSTACK_SECRET" ]; then
              echo 'github.PAYSTACK_SECRET_KEY=present'
            else
              echo 'github.PAYSTACK_SECRET_KEY=absent'
            fi
          } | tee "$RUNNER_TEMP/phase-4-github-secret-presence.log"

          npx --yes supabase@latest secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-4-supabase-secret-names.log"

          if grep -q 'AGILECERT_PAYSTACK_SECRET_KEY' "$RUNNER_TEMP/phase-4-supabase-secret-names.log"; then
            echo 'supabase.AGILECERT_PAYSTACK_SECRET_KEY=present' | tee "$RUNNER_TEMP/phase-4-secret-result.log"
          else
            echo 'supabase.AGILECERT_PAYSTACK_SECRET_KEY=absent' | tee "$RUNNER_TEMP/phase-4-secret-result.log"
          fi

      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-payment-secret-audit
          path: |
            ${{ runner.temp }}/phase-4-github-secret-presence.log
            ${{ runner.temp }}/phase-4-supabase-secret-names.log
            ${{ runner.temp }}/phase-4-secret-result.log
          if-no-files-found: warn
          retention-days: 1
