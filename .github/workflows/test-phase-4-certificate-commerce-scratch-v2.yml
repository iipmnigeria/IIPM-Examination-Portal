name: Test Phase 4 Certificate Commerce Scratch V2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-4-certificate-commerce-scratch-v2.txt'

permissions:
  contents: read

concurrency:
  group: phase-4-certificate-commerce-scratch-v2
  cancel-in-progress: false

jobs:
  exercise:
    name: Exercise Phase 4 certificate commerce in PostgreSQL 16
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      APPROVED_APP_COMMIT: 'effdd161c829d6db2235ecde2da8cd5c4dc07aed'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact approved migrations
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$APPROVED_APP_COMMIT^{commit}"
          git show "$APPROVED_APP_COMMIT:supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql" > /tmp/phase-3-certificate-authority.sql
          git show "$APPROVED_APP_COMMIT:supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql" > /tmp/phase-4-certificate-commerce.sql
          test -s /tmp/phase-3-certificate-authority.sql
          test -s /tmp/phase-4-certificate-commerce.sql
          grep -q 'issue_agilecert_certificate' /tmp/phase-3-certificate-authority.sql
          grep -q 'fulfil_paid_agilecert_certificate_order' /tmp/phase-4-certificate-commerce.sql

      - name: Apply and exercise migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f validation/phase-4-certificate-commerce-scratch-v2.sql \
            2>&1 | tee "$RUNNER_TEMP/phase-4-scratch-v2-results.log"

      - name: Upload scratch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-certificate-scratch-database-v2
          path: ${{ runner.temp }}/phase-4-scratch-v2-results.log
          if-no-files-found: warn
          retention-days: 3
