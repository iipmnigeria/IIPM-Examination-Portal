name: Monitor Phase 6 Pages Artifact Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/monitor-phase-6-pages-artifact.txt'

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    name: Locate and report exact Pages artifact deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: '224fc066d483e521fad005f643f77cebc66d1b64'
      TARGET_WORKFLOW: deploy-agilecert-phase-6-pages-artifact.yml

    steps:
      - name: Find and wait for exact push deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=supabase-integration&per_page=20" \
              > "$RUNNER_TEMP/workflow-runs.json"
            run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' "$RUNNER_TEMP/workflow-runs.json" | head -n 1)"
            if [ -n "$run_id" ]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' "$RUNNER_TEMP/workflow-runs.json")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""' "$RUNNER_TEMP/workflow-runs.json")"
              echo "Attempt $attempt: run $run_id status=$status conclusion=$conclusion"
              if [ "$status" = 'completed' ]; then
                break
              fi
            else
              echo "Attempt $attempt: exact run not listed yet"
            fi
            sleep 10
          done
          test -n "$run_id"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            > "$RUNNER_TEMP/workflow-run.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            > "$RUNNER_TEMP/workflow-jobs.json"
          jq '{id, name, event, status, conclusion, head_branch, head_sha, run_number, html_url, created_at, updated_at}' \
            "$RUNNER_TEMP/workflow-run.json" | tee "$RUNNER_TEMP/workflow-run-sanitized.json"
          jq '{jobs: [.jobs[] | {id, name, status, conclusion, steps: [.steps[] | {name, status, conclusion}]}]}' \
            "$RUNNER_TEMP/workflow-jobs.json" | tee "$RUNNER_TEMP/workflow-jobs-sanitized.json"
          test "$(jq -r '.status' "$RUNNER_TEMP/workflow-run.json")" = 'completed'
          test "$(jq -r '.conclusion' "$RUNNER_TEMP/workflow-run.json")" = 'success'

      - name: Upload sanitized deployment monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-pages-deployment-monitor
          retention-days: 5
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/workflow-run-sanitized.json
            ${{ runner.temp }}/workflow-jobs-sanitized.json
