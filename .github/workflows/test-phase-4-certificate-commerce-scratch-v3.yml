name: Test Phase 4 Certificate Commerce Scratch V3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-4-certificate-commerce-scratch-v3.txt'

permissions:
  contents: read

concurrency:
  group: phase-4-certificate-commerce-scratch-v3
  cancel-in-progress: false

jobs:
  exercise:
    name: Exercise corrected Phase 4 certificate commerce in PostgreSQL 16
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      APPROVED_APP_COMMIT: 'effdd161c829d6db2235ecde2da8cd5c4dc07aed'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact approved migrations
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$APPROVED_APP_COMMIT^{commit}"
          git show "$APPROVED_APP_COMMIT:supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql" > /tmp/phase-3-certificate-authority.sql
          git show "$APPROVED_APP_COMMIT:supabase/migrations/202607240105_phase_4_certificate_payment_credential_issuance.sql" > /tmp/phase-4-certificate-commerce.sql
          test -s /tmp/phase-3-certificate-authority.sql
          test -s /tmp/phase-4-certificate-commerce.sql
          grep -q 'issue_agilecert_certificate' /tmp/phase-3-certificate-authority.sql
          grep -q 'fulfil_paid_agilecert_certificate_order' /tmp/phase-4-certificate-commerce.sql

      - name: Prepare corrected isolated scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('validation/phase-4-certificate-commerce-scratch-v2.sql').read_text()

          migration_marker = "\\i /tmp/phase-4-certificate-commerce.sql\n"
          if source.count(migration_marker) != 1:
              raise SystemExit('Unexpected Phase 4 migration include marker count.')
          source = source.replace(
              migration_marker,
              migration_marker
              + "\n-- Match Supabase service-role direct read capability in the isolated scratch database.\n"
              + "grant select on public.agilecert_certificate_orders, public.agilecert_issued_certificates, public.agilecert_paid_credentials to service_role;\n",
              1,
          )

          anon_marker = "reset role;\nset role anon;\nselect set_config('request.jwt.claim.sub', '', false);"
          if source.count(anon_marker) != 1:
              raise SystemExit('Unexpected anonymous verification marker count.')
          source = source.replace(
              anon_marker,
              "select set_config('scratch.credential_code', (select credential_code from public.agilecert_paid_credentials where candidate_id = '11111111-1111-4111-8111-111111111111'), false);\n"
              "select set_config('scratch.badge_code', (select badge_code from public.agilecert_paid_credentials where candidate_id = '11111111-1111-4111-8111-111111111111'), false);\n\n"
              + anon_marker,
              1,
          )

          credential_query = "(select credential_code from public.agilecert_paid_credentials where candidate_id = '11111111-1111-4111-8111-111111111111')"
          badge_query = "(select badge_code from public.agilecert_paid_credentials where candidate_id = '11111111-1111-4111-8111-111111111111')"
          if source.count(credential_query) < 2 or source.count(badge_query) < 2:
              raise SystemExit('Unexpected credential or badge query count.')

          # Replace only the anonymous verification calls; the lifecycle check later remains admin-scoped.
          anon_start = source.index("set role anon;")
          anon_end = source.index("reset role;\nset role authenticated;", anon_start)
          anon_block = source[anon_start:anon_end]
          if anon_block.count(credential_query) != 1 or anon_block.count(badge_query) != 1:
              raise SystemExit('Unexpected anonymous credential query count.')
          anon_block = anon_block.replace(credential_query, "current_setting('scratch.credential_code')", 1)
          anon_block = anon_block.replace(badge_query, "current_setting('scratch.badge_code')", 1)
          source = source[:anon_start] + anon_block + source[anon_end:]

          Path('/tmp/phase-4-certificate-commerce-scratch-v3.sql').write_text(source)
          PY
          grep -q "grant select on public.agilecert_certificate_orders" /tmp/phase-4-certificate-commerce-scratch-v3.sql
          grep -q "current_setting('scratch.credential_code')" /tmp/phase-4-certificate-commerce-scratch-v3.sql

      - name: Apply and exercise migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f /tmp/phase-4-certificate-commerce-scratch-v3.sql \
            2>&1 | tee "$RUNNER_TEMP/phase-4-scratch-v3-results.log"

      - name: Upload scratch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-certificate-scratch-database-v3
          path: ${{ runner.temp }}/phase-4-scratch-v3-results.log
          if-no-files-found: warn
          retention-days: 3
