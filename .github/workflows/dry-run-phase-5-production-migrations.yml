name: Dry Run Phase 5 Production Migrations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-5-production-dry-run.txt'

permissions:
  contents: read

concurrency:
  group: phase-5-production-migration-dry-run
  cancel-in-progress: false

jobs:
  preview:
    name: Preview Phase 5 against production without applying changes
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      PHASE_5_BRANCH: phase-5-identity-assurance-professional-certificate
      WORKDIR: /tmp/agilecert-phase-5-production-preview

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-identity-assurance-professional-certificate
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm exact Phase 5 source and migration files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          git rev-parse HEAD | tee "$RUNNER_TEMP/phase-5-production-preview-source.log"
          git diff --quiet origin/supabase-integration...HEAD -- \
            supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql \
            supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql || true
          test -s supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql
          test -s supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql
          sha256sum \
            supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql \
            supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql \
            | tee -a "$RUNNER_TEMP/phase-5-production-preview-source.log"

      - name: Prepare isolated linked workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cp -R supabase "$WORKDIR/supabase"
          test -s "$WORKDIR/supabase/config.toml"

      - name: Link production project
        shell: bash
        working-directory: /tmp/agilecert-phase-5-production-preview
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Capture production migration history
        shell: bash
        working-directory: /tmp/agilecert-phase-5-production-preview
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            2>&1 | tee "$RUNNER_TEMP/phase-5-production-migration-history.log"
          for version in 202607230101 202607230102 202607240101 202607240102 202607240103 202607240104 202607240105; do
            grep -q "$version" "$RUNNER_TEMP/phase-5-production-migration-history.log"
          done
          if grep -Eq '202607250101[^|]*\|[^|]*202607250101|202607250102[^|]*\|[^|]*202607250102' "$RUNNER_TEMP/phase-5-production-migration-history.log"; then
            echo 'A Phase 5 migration is already recorded remotely.'
            exit 1
          fi

      - name: Preview exactly two Phase 5 migrations
        shell: bash
        working-directory: /tmp/agilecert-phase-5-production-preview
        run: |
          set +e
          output="$(supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-5-production-dry-run.log"
          test "$status" -eq 0

          pending="$(printf '%s\n' "$output" \
            | grep -Eo '20260725010[12]_[A-Za-z0-9_.-]+\.sql' \
            | sort -u || true)"
          expected="$(printf '%s\n' \
            '202607250101_phase_5_identity_assurance_professional_certificate.sql' \
            '202607250102_phase_5_identity_assurance_hardening.sql' \
            | sort)"
          test "$pending" = "$expected"

          all_migrations="$(printf '%s\n' "$output" \
            | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' \
            | sort -u || true)"
          test "$all_migrations" = "$expected"

      - name: Verify production prerequisites remain Phase 4 only
        shell: bash
        working-directory: /tmp/agilecert-phase-5-production-preview
        run: |
          set -euo pipefail
          supabase db dump \
            --linked \
            --schema public \
            --file "$RUNNER_TEMP/phase-5-production-public-schema.sql" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db dump \
            --linked \
            --schema storage \
            --file "$RUNNER_TEMP/phase-5-production-storage-schema.sql" \
            --password "$SUPABASE_DB_PASSWORD"

          public_schema="$RUNNER_TEMP/phase-5-production-public-schema.sql"
          storage_schema="$RUNNER_TEMP/phase-5-production-storage-schema.sql"
          test -s "$public_schema"
          test -s "$storage_schema"

          for marker in \
            agilecert_candidate_profiles \
            agilecert_certificate_eligibility_records \
            agilecert_certificate_products \
            agilecert_certificate_orders \
            agilecert_certificate_payments \
            agilecert_paid_credentials \
            fulfil_paid_agilecert_certificate_order; do
            grep -q "$marker" "$public_schema"
          done
          grep -q 'file_size_limit' "$storage_schema"
          grep -q 'allowed_mime_types' "$storage_schema"

          if grep -Eq 'agilecert_identity_verifications|submit_my_agilecert_identity_assurance|create_agilecert_professional_certificate_order' "$public_schema"; then
            echo 'Phase 5 schema already exists in production; dry-run safety expectation failed.'
            exit 1
          fi

      - name: Upload read-only production preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-production-migration-dry-run
          retention-days: 5
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/phase-5-production-preview-source.log
            ${{ runner.temp }}/phase-5-production-migration-history.log
            ${{ runner.temp }}/phase-5-production-dry-run.log
            ${{ runner.temp }}/phase-5-production-public-schema.sql
            ${{ runner.temp }}/phase-5-production-storage-schema.sql
