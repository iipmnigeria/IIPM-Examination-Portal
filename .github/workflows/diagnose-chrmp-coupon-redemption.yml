name: Diagnose CHRMP Coupon Redemption

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/diagnose-chrmp-coupon-redemption.txt'

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect live CHRMP100 redemption state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Query sanitized production redemption state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json
          query = r'''
          select jsonb_build_object(
            'coupon', jsonb_build_object(
              'code', c.code,
              'maximumRedemptions', c.maximum_redemptions,
              'perCandidateLimit', c.per_candidate_limit,
              'isActive', c.is_active,
              'expiresAt', c.expires_at,
              'activeUsage', (
                select count(*) from public.coupon_redemptions x
                where x.coupon_id = c.id and x.status in ('reserved','redeemed')
              )
            ),
            'redemptions', coalesce((
              select jsonb_agg(jsonb_build_object(
                'candidateKey', substr(md5(cr.candidate_id::text), 1, 12),
                'redemptionStatus', cr.status,
                'redemptionCreatedAt', cr.created_at,
                'redeemedAt', cr.redeemed_at,
                'releasedAt', cr.released_at,
                'orderStatus', eo.status,
                'orderCreatedAt', eo.created_at,
                'orderExpiresAt', eo.expires_at,
                'payableAmountMinor', eo.payable_amount_minor,
                'hasActiveAssignment', exists (
                  select 1 from public.exam_assignments ea
                  where ea.candidate_id = cr.candidate_id
                    and ea.examination_id = eo.examination_id
                    and ea.status = 'assigned'
                    and (ea.available_from is null or ea.available_from <= now())
                    and (ea.expires_at is null or ea.expires_at > now())
                )
              ) order by cr.created_at desc)
              from public.coupon_redemptions cr
              join public.exam_orders eo on eo.id = cr.order_id
              where cr.coupon_id = c.id
            ), '[]'::jsonb),
            'recentQuoteFailures', coalesce((
              select jsonb_agg(jsonb_build_object(
                'candidateKey', substr(md5(al.actor_id::text), 1, 12),
                'createdAt', al.created_at,
                'action', al.action,
                'metadata', al.metadata - 'email' - 'name'
              ) order by al.created_at desc)
              from public.audit_logs al
              where al.created_at > now() - interval '2 hours'
                and (al.metadata::text ilike '%CHRMP100%' or al.metadata::text ilike '%coupon%')
            ), '[]'::jsonb)
          ) as diagnostic
          from public.coupons c
          where upper(c.code) = 'CHRMP100';
          '''
          open('/tmp/query.json','w',encoding='utf-8').write(json.dumps({'query':query}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            -o chrmp-coupon-diagnostic.json
          python3 - <<'PY'
          import json
          data=json.load(open('chrmp-coupon-diagnostic.json',encoding='utf-8'))
          assert isinstance(data,list) and len(data)==1, data
          diag=data[0].get('diagnostic') or {}
          assert (diag.get('coupon') or {}).get('code')=='CHRMP100', diag
          open('chrmp-coupon-diagnostic-safe.json','w',encoding='utf-8').write(json.dumps(diag,indent=2,default=str))
          print(json.dumps(diag,indent=2,default=str))
          PY

      - name: Upload sanitized diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-chrmp-coupon-redemption-diagnostic
          retention-days: 5
          path: chrmp-coupon-diagnostic-safe.json
