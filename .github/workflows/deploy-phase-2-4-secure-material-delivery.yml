# One-purpose production deployment for the approved AgileCert Phase 2.4 increment.
name: Deploy Phase 2.4 Secure Material Delivery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-2-4-production.txt'

permissions:
  contents: read

concurrency:
  group: phase-2-4-secure-material-delivery-production
  cancel-in-progress: false

jobs:
  deploy-secure-material-delivery:
    name: Apply Phase 2.4 database and Edge Function
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'ca4c29ac5c2730b86000dfaefda6583cffc77053'
      PROFILE_VERSION: '202607230101'
      PHOTO_VERSION: '202607230102'
      ENTITLEMENT_VERSION: '202607240101'
      ADMIN_VERSION: '202607240102'
      DELIVERY_VERSION: '202607240103'
      PROFILE_FILE: supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql
      PHOTO_FILE: supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql
      ENTITLEMENT_FILE: supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql
      ADMIN_FILE: supabase/migrations/202607240102_phase_2_3b_material_admin_tools.sql
      DELIVERY_FILE: supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql
      FUNCTION_FILE: supabase/functions/agilecert-material-delivery/index.ts
      FUNCTION_NAME: agilecert-material-delivery
      SUPABASE_WORKDIR: /tmp/agilecert-phase-2-4-production

    steps:
      - name: Checkout exact approved application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate controlled deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          required_files = [
              os.environ['PROFILE_FILE'],
              os.environ['PHOTO_FILE'],
              os.environ['ENTITLEMENT_FILE'],
              os.environ['ADMIN_FILE'],
              os.environ['DELIVERY_FILE'],
              os.environ['FUNCTION_FILE'],
          ]
          for file_name in required_files:
              path = Path(file_name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Required deployment input is missing: {file_name}')

          if os.environ['DELIVERY_VERSION'] != '202607240103':
              raise SystemExit('Unexpected Phase 2.4 migration version.')

          migration = Path(os.environ['DELIVERY_FILE']).read_text()
          function = Path(os.environ['FUNCTION_FILE']).read_text()

          migration_markers = [
              'agilecert_material_download_audits',
              'authorize_agilecert_material_download',
              'to service_role',
              "bucket_id = 'agilecert-preparation-materials'",
          ]
          function_markers = [
              'createSignedUrl',
              'signedUrlTtlSeconds',
              'auth.getUser',
              'SUPABASE_SERVICE_ROLE_KEY',
          ]
          for marker in migration_markers:
              if marker not in migration:
                  raise SystemExit(f'Migration marker is missing: {marker}')
          for marker in function_markers:
              if marker not in function:
                  raise SystemExit(f'Edge Function marker is missing: {marker}')

          hardcoded_secret = re.compile(
              r'sb_secret_|service_role\s*[=:]\s*["\'][A-Za-z0-9_-]{20,}',
              re.IGNORECASE,
          )
          if hardcoded_secret.search(function):
              raise SystemExit('A privileged credential appears to be hard-coded.')
          print('Controlled Phase 2.4 deployment inputs verified.')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check approved Edge Function
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto "$FUNCTION_FILE" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-check.log"

      - name: Prepare isolated Phase 2 migration-history workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          cp "$PROFILE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$PHOTO_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$ENTITLEMENT_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$ADMIN_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$DELIVERY_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Link isolated workspace to production Supabase
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-production
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply exactly Phase 2.4
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-production
        run: |
          set +e
          dry_run_output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          dry_run_status=$?
          set -e
          printf '%s\n' "$dry_run_output" | tee "$RUNNER_TEMP/phase-2-4-production-dry-run.log"
          test "$dry_run_status" -eq 0

          if printf '%s\n' "$dry_run_output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 2.4 migration is already applied; no database change is required.'
          else
            pending_files="$(printf '%s\n' "$dry_run_output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            echo 'Pending migration files detected:'
            printf '%s\n' "$pending_files"
            test "$pending_files" = "$(basename "$DELIVERY_FILE")"
            npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Verify all Phase 2 migration history
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-production
        run: |
          set -euo pipefail
          history_file="$RUNNER_TEMP/phase-2-4-production-migration-history.log"
          npx --yes supabase@latest migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history_file"

          python - "$history_file" "$PROFILE_VERSION" "$PHOTO_VERSION" "$ENTITLEMENT_VERSION" "$ADMIN_VERSION" "$DELIVERY_VERSION" <<'PY'
          from pathlib import Path
          import sys

          history = Path(sys.argv[1]).read_text()
          required = sys.argv[2:]
          rows = []
          for line in history.splitlines():
              if '|' not in line:
                  continue
              parts = [part.strip().strip('`') for part in line.split('|')]
              if len(parts) >= 3:
                  rows.append(parts)

          for version in required:
              matched = [row for row in rows if row[0] == version or row[1] == version]
              if not matched:
                  raise SystemExit(f'Migration {version} is missing from history.')
              if not any(row[0] == version and row[1] == version for row in matched):
                  raise SystemExit(f'Migration {version} is not recorded both locally and remotely: {matched}')
          PY

      - name: Verify deployed public and storage schema
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-production
        run: |
          set -euo pipefail
          public_schema="$RUNNER_TEMP/phase-2-4-public-schema.sql"
          storage_schema="$RUNNER_TEMP/phase-2-4-storage-schema.sql"
          npx --yes supabase@latest db dump \
            --linked \
            --schema public \
            --file "$public_schema" \
            --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db dump \
            --linked \
            --schema storage \
            --file "$storage_schema" \
            --password "$SUPABASE_DB_PASSWORD"
          test -s "$public_schema"
          test -s "$storage_schema"
          grep -q 'agilecert_material_download_audits' "$public_schema"
          grep -q 'authorize_agilecert_material_download' "$public_schema"
          grep -q 'get_agilecert_material_download_audits' "$public_schema"
          grep -q 'agilecert_is_material_admin' "$public_schema"
          grep -q 'agilecert_material_storage_admin_select' "$storage_schema"
          grep -q 'agilecert_material_storage_admin_insert' "$storage_schema"
          grep -q 'agilecert_material_storage_admin_update' "$storage_schema"
          grep -q 'agilecert_material_storage_admin_delete' "$storage_schema"

      - name: Deploy only the approved Edge Function
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-deploy.log"

      - name: Verify Edge Function registration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-list.log"
          grep -q "$FUNCTION_NAME" "$RUNNER_TEMP/phase-2-4-edge-function-list.log"

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-4-production-deployment-evidence
          path: |
            ${{ runner.temp }}/phase-2-4-edge-function-check.log
            ${{ runner.temp }}/phase-2-4-production-dry-run.log
            ${{ runner.temp }}/phase-2-4-production-migration-history.log
            ${{ runner.temp }}/phase-2-4-public-schema.sql
            ${{ runner.temp }}/phase-2-4-storage-schema.sql
            ${{ runner.temp }}/phase-2-4-edge-function-deploy.log
            ${{ runner.temp }}/phase-2-4-edge-function-list.log
          if-no-files-found: warn
          retention-days: 3
