name: Diagnose Phase 7 TypeScript

on:
  push:
    branches: [phase-7-ai-cv-profile-builder-foundation]
    paths:
      - '.github/workflows/diagnose-phase7-typescript.yml'
      - 'src/App.tsx'
      - 'src/components/AiCvProfileBuilder.tsx'
      - 'src/services/aiCvProfileBuilderService.ts'
      - 'src/services/cvPdfService.ts'
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/diagnose-phase7-typescript.yml'
      - 'src/App.tsx'
      - 'src/components/AiCvProfileBuilder.tsx'
      - 'src/services/aiCvProfileBuilderService.ts'
      - 'src/services/cvPdfService.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run lint > phase7-typescript.log 2>&1
          code=$?
          cat phase7-typescript.log
          echo "$code" > phase7-typescript-exit-code.txt
          exit "$code"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-typescript-diagnostics
          retention-days: 3
          path: |
            phase7-typescript.log
            phase7-typescript-exit-code.txt
