name: Repair Finance Reporting Aliases

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/202608010600_finance_console_completion.sql'
      - '.github/workflows/validate-finance-console-completion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair_reporting_aliases:
    name: Repair reserved reporting period aliases once
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-finance-console-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace only the verified reporting aliases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/202608010600_finance_console_completion.sql')
          original = path.read_text(encoding='utf-8')
          updated = original
          replacements = (
              ("'week',weekly.week,", "'week',weekly.metric_week,"),
              ("order by weekly.week)", "order by weekly.metric_week)"),
              ("select to_char(date_trunc('week',created_at),'IYYY-\"W\"IW') week,currency,", "select to_char(date_trunc('week',created_at),'IYYY-\"W\"IW') as metric_week,currency,"),
              ("'month',monthly.month,", "'month',monthly.metric_month,"),
              ("order by monthly.month)", "order by monthly.metric_month)"),
              ("select to_char(date_trunc('month',created_at),'YYYY-MM') month,currency,", "select to_char(date_trunc('month',created_at),'YYYY-MM') as metric_month,currency,"),
          )

          for old, new in replacements:
              count = updated.count(old)
              if count == 1:
                  updated = updated.replace(old, new, 1)
              elif count == 0 and new in updated:
                  continue
              else:
                  raise SystemExit(f'Unexpected occurrence count for {old!r}: {count}')

          if updated == original:
              print('Reporting aliases are already repaired.')
          else:
              path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- supabase/migrations/202608010600_finance_console_completion.sql; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202608010600_finance_console_completion.sql
          git commit -m 'Fix Finance Console reporting period aliases'
          git push origin HEAD:${{ github.head_ref }}
