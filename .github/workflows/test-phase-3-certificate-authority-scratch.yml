name: Test Phase 3 Certificate Authority in Scratch Database

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-3-certificate-scratch.txt'

permissions:
  contents: read

concurrency:
  group: phase-3-certificate-scratch-database
  cancel-in-progress: false

jobs:
  exercise-certificate-authority:
    name: Apply and exercise Phase 3 certificate authority SQL
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      APPROVED_APP_COMMIT: 'ba67bfab9b5f26a58b018ae284c1d76c770416d6'
      MIGRATION_FILE: supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql

    steps:
      - name: Checkout exact Phase 3 draft head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate migration input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$MIGRATION_FILE"
          grep -q 'evaluate_agilecert_certificate_eligibility' "$MIGRATION_FILE"
          grep -q 'issue_agilecert_certificate' "$MIGRATION_FILE"
          grep -q 'verify_agilecert_certificate' "$MIGRATION_FILE"

      - name: Prepare compatible AgileCert baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;

          do $$ begin
            create role anon nologin;
          exception when duplicate_object then null;
          end $$;
          do $$ begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end $$;

          create schema if not exists auth;
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;

          grant usage on schema auth, public to anon, authenticated;
          grant execute on function auth.uid() to anon, authenticated;

          create table public.profiles (
            id uuid primary key,
            full_name text not null,
            email text not null unique,
            role text not null,
            candidate_code text,
            is_active boolean not null default true
          );
          create table public.programmes (
            id uuid primary key,
            code text not null unique
          );
          create table public.examinations (
            id uuid primary key,
            programme_id uuid not null references public.programmes(id),
            title text not null,
            pass_mark numeric(5,2) not null default 70
          );
          create table public.attempts (
            id uuid primary key,
            candidate_id uuid not null references public.profiles(id),
            examination_id uuid not null references public.examinations(id),
            percentage numeric(5,2) not null default 0,
            status text not null,
            suspicious_score numeric(5,2) not null default 0,
            submitted_at timestamptz,
            graded_at timestamptz
          );
          create table public.agilecert_candidate_profiles (
            user_id uuid primary key references public.profiles(id),
            legal_name text
          );

          grant select on public.profiles, public.programmes, public.examinations,
            public.attempts, public.agilecert_candidate_profiles to authenticated;
          SQL

      - name: Apply Phase 3 migration
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f "$MIGRATION_FILE" \
            2>&1 | tee "$RUNNER_TEMP/phase-3-certificate-migration-apply.log"

      - name: Exercise eligibility, issuance, verification and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL' 2>&1 | tee "$RUNNER_TEMP/phase-3-certificate-scratch-results.log"
          insert into public.profiles (id, full_name, email, role, candidate_code, is_active) values
            ('11111111-1111-4111-8111-111111111111', 'Ada Candidate', 'ada@example.test', 'candidate', 'AGC-0001', true),
            ('22222222-2222-4222-8222-222222222222', 'Bola Candidate', 'bola@example.test', 'candidate', 'AGC-0002', true),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'Exam Administrator', 'admin@example.test', 'exam_admin', null, true),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Audit Officer', 'audit@example.test', 'auditor', null, true);

          insert into public.agilecert_candidate_profiles (user_id, legal_name) values
            ('11111111-1111-4111-8111-111111111111', 'Ada Candidate'),
            ('22222222-2222-4222-8222-222222222222', 'Bola Candidate');

          insert into public.programmes (id, code) values
            ('30000000-0000-4000-8000-000000000001', 'PMFC');
          insert into public.examinations (id, programme_id, title, pass_mark) values
            ('40000000-0000-4000-8000-000000000001',
             '30000000-0000-4000-8000-000000000001',
             'Project Management Foundation Certified Examination', 70);

          insert into public.attempts (
            id, candidate_id, examination_id, percentage, status,
            suspicious_score, submitted_at, graded_at
          ) values
            ('50000000-0000-4000-8000-000000000001',
             '11111111-1111-4111-8111-111111111111',
             '40000000-0000-4000-8000-000000000001',
             82, 'submitted', 12, now() - interval '2 days', now() - interval '2 days'),
            ('50000000-0000-4000-8000-000000000002',
             '22222222-2222-4222-8222-222222222222',
             '40000000-0000-4000-8000-000000000001',
             88, 'flagged', 65, now() - interval '1 day', now() - interval '1 day');

          do $$
          begin
            if not exists (
              select 1 from public.agilecert_certificate_eligibility_records
              where attempt_id = '50000000-0000-4000-8000-000000000001'
                and eligibility_status = 'eligible'
                and integrity_status = 'cleared'
                and score = 82 and pass_mark = 70
            ) then
              raise exception 'Clear passing attempt did not become eligible.';
            end if;
            if not exists (
              select 1 from public.agilecert_certificate_eligibility_records
              where attempt_id = '50000000-0000-4000-8000-000000000002'
                and eligibility_status = 'blocked'
                and integrity_status = 'flagged'
                and reason_code = 'integrity_flagged'
            ) then
              raise exception 'Flagged passing attempt was not blocked.';
            end if;
          end $$;

          select set_config(
            'scratch.eligibility_id',
            (select id::text from public.agilecert_certificate_eligibility_records
             where attempt_id = '50000000-0000-4000-8000-000000000001'),
            false
          );

          set role authenticated;
          select set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false);
          do $$
          declare
            v_workspace jsonb;
          begin
            v_workspace := public.get_my_agilecert_certificate_workspace();
            if jsonb_array_length(v_workspace->'items') <> 1
               or (v_workspace->'counts'->>'eligible')::integer <> 1 then
              raise exception 'Candidate workspace did not isolate the eligible record: %', v_workspace;
            end if;
          end $$;

          select public.request_my_agilecert_certificate(
            '50000000-0000-4000-8000-000000000001'
          );

          do $$
          begin
            if not exists (
              select 1 from public.agilecert_certificate_eligibility_records
              where attempt_id = '50000000-0000-4000-8000-000000000001'
                and candidate_id = auth.uid()
                and eligibility_status = 'requested'
                and requested_at is not null
            ) then
              raise exception 'Candidate issuance request was not recorded.';
            end if;

            begin
              perform public.issue_agilecert_certificate(
                current_setting('scratch.eligibility_id')::uuid
              );
              raise exception 'Candidate unexpectedly issued a certificate.';
            exception when others then
              if sqlerrm = 'Candidate unexpectedly issued a certificate.' then raise; end if;
            end;

            begin
              insert into public.agilecert_issued_certificates (
                certificate_number, verification_code, candidate_id, eligibility_id,
                examination_id, attempt_id, holder_name, certificate_title,
                examination_title, score, pass_mark
              ) values (
                'INVALID', 'INVALID', auth.uid(),
                current_setting('scratch.eligibility_id')::uuid,
                '40000000-0000-4000-8000-000000000001',
                '50000000-0000-4000-8000-000000000001',
                'Invalid Candidate', 'Invalid Certificate', 'Invalid Examination', 82, 70
              );
              raise exception 'Candidate direct certificate insert unexpectedly succeeded.';
            exception when others then
              if sqlerrm = 'Candidate direct certificate insert unexpectedly succeeded.' then raise; end if;
            end;
          end $$;

          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub', '22222222-2222-4222-8222-222222222222', false);
          do $$
          begin
            begin
              perform public.request_my_agilecert_certificate(
                '50000000-0000-4000-8000-000000000002'
              );
              raise exception 'Flagged candidate unexpectedly requested issuance.';
            exception when others then
              if sqlerrm = 'Flagged candidate unexpectedly requested issuance.' then raise; end if;
            end;
          end $$;

          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub', 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', false);
          do $$
          begin
            begin
              perform public.issue_agilecert_certificate(
                current_setting('scratch.eligibility_id')::uuid
              );
              raise exception 'Auditor unexpectedly issued a certificate.';
            exception when others then
              if sqlerrm = 'Auditor unexpectedly issued a certificate.' then raise; end if;
            end;
          end $$;

          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          select public.issue_agilecert_certificate(current_setting('scratch.eligibility_id')::uuid);
          select public.issue_agilecert_certificate(current_setting('scratch.eligibility_id')::uuid);

          do $$
          declare
            v_console jsonb;
          begin
            if (select count(*) from public.agilecert_issued_certificates
                where attempt_id = '50000000-0000-4000-8000-000000000001') <> 1 then
              raise exception 'Certificate issuance was not idempotent.';
            end if;
            if not exists (
              select 1 from public.agilecert_issued_certificates
              where attempt_id = '50000000-0000-4000-8000-000000000001'
                and certificate_number ~ '^IIPM/PMFC/[0-9]{4}/[0-9]{6}$'
                and verification_code ~ '^[A-F0-9]{18}$'
                and holder_name = 'Ada Candidate'
                and status = 'active'
            ) then
              raise exception 'Issued certificate authority fields are invalid.';
            end if;
            v_console := public.get_agilecert_certificate_admin_console(100);
            if (v_console->'counts'->>'activeCertificates')::integer <> 1 then
              raise exception 'Administrator console did not report the active certificate: %', v_console;
            end if;
          end $$;

          reset role;
          select set_config('scratch.certificate_id', id::text, false),
                 set_config('scratch.verification_code', verification_code, false),
                 set_config('scratch.certificate_number', certificate_number, false)
          from public.agilecert_issued_certificates
          where attempt_id = '50000000-0000-4000-8000-000000000001';

          set role anon;
          select set_config('request.jwt.claim.sub', '', false);
          do $$
          declare
            v_result jsonb;
          begin
            v_result := public.verify_agilecert_certificate(
              current_setting('scratch.verification_code')
            );
            if not coalesce((v_result->>'found')::boolean, false)
               or not coalesce((v_result->>'valid')::boolean, false)
               or v_result->>'status' <> 'active' then
              raise exception 'Active certificate verification failed: %', v_result;
            end if;
            if v_result ? 'candidateId' or v_result ? 'candidate_id'
               or v_result ? 'candidateEmail' or v_result ? 'email'
               or v_result ? 'answers' or v_result ? 'proctorLogs'
               or v_result ? 'payment' then
              raise exception 'Public verification exposed private fields: %', v_result;
            end if;
            begin
              perform count(*) from public.agilecert_issued_certificates;
              raise exception 'Anonymous direct certificate read unexpectedly succeeded.';
            exception when others then
              if sqlerrm = 'Anonymous direct certificate read unexpectedly succeeded.' then raise; end if;
            end;
          end $$;

          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          select public.set_agilecert_certificate_status(
            current_setting('scratch.certificate_id')::uuid,
            'suspended',
            'Scratch lifecycle verification'
          );

          reset role;
          set role anon;
          select set_config('request.jwt.claim.sub', '', false);
          do $$
          declare
            v_result jsonb;
          begin
            v_result := public.verify_agilecert_certificate(
              current_setting('scratch.certificate_number')
            );
            if not coalesce((v_result->>'found')::boolean, false)
               or coalesce((v_result->>'valid')::boolean, true)
               or v_result->>'status' <> 'suspended' then
              raise exception 'Suspended certificate verification failed: %', v_result;
            end if;
          end $$;

          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          select public.set_agilecert_certificate_status(
            current_setting('scratch.certificate_id')::uuid, 'active', null
          );
          select public.upsert_agilecert_certificate_policy(
            '40000000-0000-4000-8000-000000000001',
            'Certificate of Achievement', null, 49.99, true
          );
          select public.reconcile_agilecert_certificate_eligibilities(
            '40000000-0000-4000-8000-000000000001'
          );

          reset role;
          do $$
          begin
            if (select count(*) from public.agilecert_certificate_eligibility_records) <> 2 then
              raise exception 'Unexpected eligibility record count.';
            end if;
            if (select count(*) from public.agilecert_issued_certificates) <> 1 then
              raise exception 'Unexpected issued certificate count.';
            end if;
          end $$;

          select 'Phase 3 scratch certificate authority checks passed.' as result;
          SQL

      - name: Upload scratch database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-certificate-scratch-database
          path: |
            ${{ runner.temp }}/phase-3-certificate-migration-apply.log
            ${{ runner.temp }}/phase-3-certificate-scratch-results.log
          if-no-files-found: warn
          retention-days: 3
