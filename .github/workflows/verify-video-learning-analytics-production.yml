name: Verify Video Learning Analytics Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-video-learning-analytics-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-video-learning-analytics-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify video learning frontend deployments and live authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      APPROVED_SOURCE_COMMIT: 'c29e18cc137ca1ee43f704171d5d4fb1691824c7'
      NAMECHEAP_SOURCE_COMMIT: 'c29e18cc137ca1ee43f704171d5d4fb1691824c7'
      PAGES_TRIGGER_COMMIT: 'ffecedfe1c8bed4ea6577d0beaf6a391dc5af08e'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      PAGE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      CUSTOM_URL: 'https://agilecert.iipmi.org/'
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact approved video learning source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact approved frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npx vite build
          test -s dist/index.html
          grep -q 'Video Progress & Completion' src/components/CandidateVideoLearningProgressLauncher.tsx
          grep -q 'Video Progress & Learning Analytics' src/components/AdminVideoLearningAnalyticsLauncher.tsx
          grep -q 'get_my_agilecert_video_learning_progress' src/services/videoLearningAnalyticsService.ts
          grep -q 'get_agilecert_video_learning_analytics' src/services/videoLearningAnalyticsService.ts

          python3 <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          html = Path('dist/index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The approved build did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          candidate = Path('dist') / relative.lstrip('./').lstrip('/')
          if not candidate.is_file():
              raise SystemExit(f'Approved bundle not found: {candidate}')
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          result = {'relativePath': relative, 'sha256': digest}
          Path('video-learning-approved-bundle.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Confirm authorised Pages and Namecheap deployment runs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          for attempt in $(seq 1 40); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20" \
              -o video-learning-pages-runs.json

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-namecheap.yml/runs?branch=supabase-integration&event=push&per_page=30" \
              -o video-learning-namecheap-runs.json

            if python3 <<'PY'
          import json
          import os
          from pathlib import Path

          def inspect(path, expected_sha, label):
              payload = json.loads(Path(path).read_text())
              matches = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == expected_sha
              ]
              if not matches:
                  print(f'No {label} run found yet for {expected_sha}.')
                  return None
              run = matches[0]
              if run.get('status') != 'completed':
                  print(f'{label} run is still {run.get("status")}.')
                  return None
              if run.get('conclusion') != 'success':
                  raise SystemExit(f'{label} run failed: {run}')
              return {
                  'runId': run.get('id'),
                  'headSha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'createdAt': run.get('created_at'),
                  'updatedAt': run.get('updated_at'),
              }

          pages = inspect(
              'video-learning-pages-runs.json',
              os.environ['PAGES_TRIGGER_COMMIT'],
              'GitHub Pages deployment',
          )
          namecheap = inspect(
              'video-learning-namecheap-runs.json',
              os.environ['NAMECHEAP_SOURCE_COMMIT'],
              'Namecheap deployment',
          )
          if pages is None or namecheap is None:
              raise SystemExit(2)
          result = {'githubPages': pages, 'namecheap': namecheap}
          Path('video-learning-deployment-runs-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY
            then
              break
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                exit "$status"
              fi
            fi

            if [ "$attempt" -eq 40 ]; then
              echo 'The authorised frontend deployment runs did not complete successfully.' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify exact public GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="$(date +%s)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${PAGE_URL}?video_learning_release=${cache_buster}" \
            -o video-learning-live-index.html

          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path('video-learning-live-index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The live Pages document did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          live_url = urljoin('https://iipmnigeria.github.io/IIPM-Examination-Portal/', relative)
          Path('video-learning-live-bundle-url.txt').write_text(live_url, encoding='utf-8')
          print(live_url)
          PY

          live_bundle_url="$(cat video-learning-live-bundle-url.txt)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${live_bundle_url}?video_learning_release=${cache_buster}" \
            -o video-learning-live-bundle.js

          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          approved = json.loads(Path('video-learning-approved-bundle.json').read_text())
          live_bytes = Path('video-learning-live-bundle.js').read_bytes()
          live_text = live_bytes.decode('utf-8', errors='replace')
          live_hash = hashlib.sha256(live_bytes).hexdigest()
          required = [
              'Video Progress & Completion',
              'Video Progress & Learning Analytics',
              'get_my_agilecert_video_learning_progress',
              'get_agilecert_video_learning_analytics',
              'Open video learning progress',
          ]
          missing = [marker for marker in required if marker not in live_text]
          if missing:
              raise SystemExit(f'Live video-learning markers are missing: {missing}')
          if live_hash != approved['sha256']:
              raise SystemExit(
                  f"Live bundle hash {live_hash} does not match approved hash {approved['sha256']}"
              )
          result = {
              'pageUrl': 'https://iipmnigeria.github.io/IIPM-Examination-Portal/',
              'approvedSha256': approved['sha256'],
              'liveSha256': live_hash,
              'exactBundleVerified': True,
              'requiredMarkersPresent': required,
          }
          Path('video-learning-pages-verification-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify Namecheap deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="$(date +%s)"
          response_file="$(mktemp)"
          status="$({ curl \
            --location \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --retry 3 \
            --retry-delay 10 \
            --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36' \
            "${CUSTOM_URL}deployment.json?video_learning_release=${cache_buster}"; } || true)"

          APPROVED_SOURCE_COMMIT="$APPROVED_SOURCE_COMMIT" STATUS="$status" RESPONSE_FILE="$response_file" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          status = os.environ['STATUS']
          result = {
              'url': 'https://agilecert.iipmi.org/deployment.json',
              'httpStatus': status,
              'workflowRunVerified': True,
          }
          if status == '200':
              manifest = json.loads(Path(os.environ['RESPONSE_FILE']).read_text())
              approved = json.loads(Path('video-learning-approved-bundle.json').read_text())
              if manifest.get('commit') != os.environ['APPROVED_SOURCE_COMMIT']:
                  raise SystemExit(f'Namecheap source commit mismatch: {manifest}')
              if manifest.get('bundle') != approved['sha256']:
                  raise SystemExit(f'Namecheap bundle hash mismatch: {manifest}')
              result.update({
                  'commit': manifest.get('commit'),
                  'bundle': manifest.get('bundle'),
                  'target': manifest.get('target'),
                  'exactManifestVerified': True,
              })
          elif status == '403':
              result.update({
                  'exactManifestVerified': False,
                  'externalCheckProtected': True,
              })
          else:
              raise SystemExit(f'Unexpected Namecheap deployment manifest status: {status}')
          Path('video-learning-namecheap-verification-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify live production database authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          select jsonb_build_object(
            'tableExists', to_regclass('public.agilecert_video_learning_progress') is not null,
            'rlsEnabled', coalesce((
              select relrowsecurity
              from pg_class
              where oid = 'public.agilecert_video_learning_progress'::regclass
            ), false),
            'triggerEnabled', exists (
              select 1 from pg_trigger
              where tgrelid = 'public.agilecert_material_playback_audits'::regclass
                and tgname = 'agilecert_video_playback_progress_capture'
                and not tgisinternal
                and tgenabled <> 'D'
            ),
            'securityDefinerFunctions', (
              select count(*) from pg_proc
              where pronamespace = 'public'::regnamespace
                and proname in (
                  'capture_agilecert_video_playback_progress',
                  'set_my_agilecert_video_lesson_completion',
                  'get_my_agilecert_video_learning_progress',
                  'get_agilecert_video_learning_analytics'
                )
                and prosecdef
            ),
            'anonExecuteExposed',
              has_function_privilege('anon', 'public.get_my_agilecert_video_learning_progress()', 'execute')
              or has_function_privilege('anon', 'public.get_agilecert_video_learning_analytics(text,text,integer,integer)', 'execute'),
            'authenticatedDirectWriteExposed',
              has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'insert')
              or has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'update')
              or has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'delete'),
            'authorisedVideoAudits', (
              select count(*)
              from public.agilecert_material_playback_audits audit
              join public.agilecert_preparation_materials material
                on material.id = audit.material_id
               and material.material_type = 'video'
              where audit.status = 'authorized'
            ),
            'summedOpenCount', (
              select coalesce(sum(open_count), 0)
              from public.agilecert_video_learning_progress
            ),
            'invalidCompletionRows', (
              select count(*)
              from public.agilecert_video_learning_progress
              where completion_percent < 0 or completion_percent > 100
            )
          ) as verification;
          """
          Path('/tmp/video-learning-live-authority.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/video-learning-live-authority.json \
            -o video-learning-live-authority.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('video-learning-live-authority.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('tableExists') is True, result
          assert result.get('rlsEnabled') is True, result
          assert result.get('triggerEnabled') is True, result
          assert result.get('securityDefinerFunctions') == 4, result
          assert result.get('anonExecuteExposed') is False, result
          assert result.get('authenticatedDirectWriteExposed') is False, result
          assert result.get('summedOpenCount') == result.get('authorisedVideoAudits'), result
          assert result.get('invalidCompletionRows') == 0, result
          Path('video-learning-live-authority-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload sanitized release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-learning-analytics-production-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            video-learning-approved-bundle.json
            video-learning-deployment-runs-safe.json
            video-learning-pages-verification-safe.json
            video-learning-namecheap-verification-safe.json
            video-learning-live-authority-safe.json
