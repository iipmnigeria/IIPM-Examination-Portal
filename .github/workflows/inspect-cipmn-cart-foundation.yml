name: Inspect CIPMN Cart Foundation

on:
  push:
    branches: [feature/cipmn-multi-module-cart]
    paths:
      - '.github/workflows/inspect-cipmn-cart-foundation.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/inspect-cipmn-cart-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate commerce schema and runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MATCHING FILES ==='
          grep -RIlE 'create_exam_order|fulfil_paid_exam_order|resolve_exam_purchase_quote|create table( if not exists)? public\.exam_orders|create table( if not exists)? public\.exam_payments' supabase/migrations src supabase/functions | sort
          echo '=== TABLE DEFINITIONS ==='
          grep -RInE 'create table( if not exists)? public\.(exam_orders|exam_payments|coupon_redemptions|exam_assignments)' supabase/migrations | sort
          echo '=== FUNCTION DEFINITIONS ==='
          grep -RInE 'create( or replace)? function public\.(resolve_exam_purchase_quote|quote_exam_purchase|create_exam_order|fulfil_paid_exam_order|grant_exam_assignment)' supabase/migrations | sort
          echo '=== CURRENT RUNTIME IMPORTS ==='
          sed -n '1,220p' src/services/commerceService.ts
          echo '=== INITIALIZER ==='
          sed -n '1,260p' supabase/functions/initialize-exam-payment/index.ts
          echo '=== VERIFIER ==='
          sed -n '1,220p' supabase/functions/verify-exam-payment/index.ts
          echo '=== WEBHOOK ==='
          sed -n '1,280p' supabase/functions/paystack-webhook/index.ts
      - name: Extract authoritative SQL sections
        shell: bash
        run: |
          set -euo pipefail
          files=$(grep -RIlE 'create_exam_order|fulfil_paid_exam_order|resolve_exam_purchase_quote|create table( if not exists)? public\.exam_orders|create table( if not exists)? public\.exam_payments' supabase/migrations | sort -u)
          for file in $files; do
            echo "===== $file ====="
            cat "$file"
          done
