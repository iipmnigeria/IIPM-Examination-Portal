name: Check AgileCert Communications Activation Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/check-communications-readiness.txt'

permissions:
  contents: read

concurrency:
  group: check-agilecert-communications-activation-readiness
  cancel-in-progress: false

jobs:
  readiness:
    name: Verify fail-closed state and secret-name readiness
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_WORKER_TOKEN: ${{ secrets.AGILECERT_COMMUNICATIONS_WORKER_TOKEN }}

    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm deployed function and fail-closed public boundaries
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-communications"

          supabase functions list --project-ref "$PROJECT_REF" \
            2>&1 | tee communications-readiness-function-list.log
          grep -q 'agilecert-communications' communications-readiness-function-list.log

          worker_status="$(curl -sS -o communications-readiness-worker.json -w '%{http_code}' \
            -X POST "$endpoint" -H 'Content-Type: application/json' \
            --data '{"action":"scan-and-send"}')"
          test "$worker_status" = '401' -o "$worker_status" = '500'
          jq -e '.error | test("worker|authorisation|not configured"; "i")' \
            communications-readiness-worker.json >/dev/null

          webhook_status="$(curl -sS -o communications-readiness-webhook.json -w '%{http_code}' \
            -X POST "$endpoint" -H 'Content-Type: application/json' \
            --data '{"action":"webhook","type":"email.delivered"}')"
          test "$webhook_status" = '401' -o "$webhook_status" = '500'
          jq -e '.error | test("webhook|authorisation|not configured"; "i")' \
            communications-readiness-webhook.json >/dev/null

          unsubscribe_status="$(curl -sS -o communications-readiness-unsubscribe.html -w '%{http_code}' \
            "$endpoint?action=unsubscribe&token=invalid")"
          test "$unsubscribe_status" = '400'

          printf '%s' "$worker_status" > communications-worker-http-status.txt
          printf '%s' "$webhook_status" > communications-webhook-http-status.txt
          printf '%s' "$unsubscribe_status" > communications-unsubscribe-http-status.txt

      - name: Record secret-name readiness without values
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$PROJECT_REF" --output json \
            > "$RUNNER_TEMP/communications-secrets.json"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          raw = json.loads((Path(os.environ['RUNNER_TEMP']) / 'communications-secrets.json').read_text())
          if isinstance(raw, dict):
              raw = raw.get('secrets', raw.get('data', []))
          names = sorted({str(item.get('name', '')) for item in raw if isinstance(item, dict) and item.get('name')})
          required_supabase = [
              'SUPABASE_SECRET_KEY',
              'RESEND_API_KEY',
              'AGILECERT_COMMUNICATIONS_WORKER_TOKEN',
              'AGILECERT_COMMUNICATIONS_WEBHOOK_TOKEN',
              'AGILECERT_COMMUNICATIONS_SIGNING_SECRET',
          ]
          supabase_readiness = {name: name in names for name in required_supabase}
          github_worker_present = bool(os.environ.get('GITHUB_WORKER_TOKEN', '').strip())
          evidence = {
              'requiredSupabaseSecretNames': required_supabase,
              'supabaseSecretNameReadiness': supabase_readiness,
              'githubHourlyWorkerTokenPresent': github_worker_present,
              'providerCredentialsReady': all(supabase_readiness.values()),
              'hourlyDispatcherReady': github_worker_present,
              'outboundDeliveryReady': all(supabase_readiness.values()) and github_worker_present,
              'secretValuesInspected': False,
              'outboundMessagesSentByReadinessCheck': 0,
          }
          Path('communications-activation-readiness.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-activation-readiness-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-activation-readiness.json
            communications-readiness-function-list.log
            communications-readiness-worker.json
            communications-readiness-webhook.json
            communications-readiness-unsubscribe.html
            communications-worker-http-status.txt
            communications-webhook-http-status.txt
            communications-unsubscribe-http-status.txt
