name: Inspect AgileCert Profile Schema

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/inspect-agilecert-profile-schema.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Query schema metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          query = r'''
          select jsonb_build_object(
            'profiles', (
              select jsonb_agg(jsonb_build_object(
                'column', column_name,
                'type', data_type,
                'nullable', is_nullable,
                'default', column_default
              ) order by ordinal_position)
              from information_schema.columns
              where table_schema='public' and table_name='profiles'
            ),
            'examAssignments', (
              select jsonb_agg(jsonb_build_object(
                'column', column_name,
                'type', data_type,
                'nullable', is_nullable,
                'default', column_default
              ) order by ordinal_position)
              from information_schema.columns
              where table_schema='public' and table_name='exam_assignments'
            )
          ) as schema;
          '''
          open('/tmp/query.json','w',encoding='utf-8').write(json.dumps({'query':query}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            -o agilecert-profile-schema.json
          cat agilecert-profile-schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: agilecert-profile-schema
          retention-days: 3
          path: agilecert-profile-schema.json
