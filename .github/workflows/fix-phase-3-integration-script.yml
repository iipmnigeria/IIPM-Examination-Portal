name: Correct Phase 3 Integration Script Assertion

on:
  push:
    branches: [phase-3-certificate-completion]
    paths:
      - '.github/workflows/fix-phase-3-integration-script.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0
      - name: Remove invalid earlier-migration assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase3-completion-integrate.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    request_signature = 'create or replace function public.request_my_agilecert_certificate(\\n  p_attempt_id uuid\\n)'\n", '', 1)
          text = text.replace("        if request_signature not in sql:\n            raise SystemExit('Existing candidate request function signature is missing.')\n", '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-phase-3-integration-script.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/phase3-completion-integrate.py .github/workflows/fix-phase-3-integration-script.yml
          git diff --cached --check
          git commit -m 'Correct Phase 3 integration script assertion'
          git push origin HEAD:phase-3-certificate-completion
