name: Validate CIPMN Module Mock Examinations

on:
  push:
    branches:
      - phase-9-cipmn-module-mock-examinations
      - hotfix-cipmn-pass-mark-70
    paths:
      - 'supabase/migrations/202607251701_cipmn_module_mock_exam_catalogue.sql'
      - 'supabase/migrations/202607251702_cipmn_mod_001_mock_questions.sql'
      - 'supabase/migrations/202607251703_cipmn_mod_002_mock_questions.sql'
      - 'supabase/migrations/202607251704_cipmn_mod_003_mock_questions.sql'
      - 'supabase/migrations/202607251705_cipmn_mod_004_mock_questions.sql'
      - 'supabase/migrations/202607251706_cipmn_mod_005_mock_questions.sql'
      - 'supabase/migrations/202607251707_cipmn_mod_006_mock_questions.sql'
      - 'supabase/migrations/202607251708_cipmn_mod_007_mock_questions.sql'
      - 'supabase/migrations/202607251709_cipmn_mod_008_mock_questions.sql'
      - 'supabase/migrations/202607251710_cipmn_mod_009_mock_questions.sql'
      - 'supabase/migrations/202607251711_cipmn_mod_010_mock_questions.sql'
      - 'supabase/migrations/202607251712_cipmn_mod_011_mock_questions.sql'
      - 'supabase/migrations/202607251713_cipmn_mod_012_mock_questions.sql'
      - 'supabase/migrations/202607251715_cipmn_module_mock_pass_mark_70.sql'
      - '.github/workflows/validate-cipmn-module-mock-examinations.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/202607251701_cipmn_module_mock_exam_catalogue.sql'
      - 'supabase/migrations/202607251702_cipmn_mod_001_mock_questions.sql'
      - 'supabase/migrations/202607251703_cipmn_mod_002_mock_questions.sql'
      - 'supabase/migrations/202607251704_cipmn_mod_003_mock_questions.sql'
      - 'supabase/migrations/202607251705_cipmn_mod_004_mock_questions.sql'
      - 'supabase/migrations/202607251706_cipmn_mod_005_mock_questions.sql'
      - 'supabase/migrations/202607251707_cipmn_mod_006_mock_questions.sql'
      - 'supabase/migrations/202607251708_cipmn_mod_007_mock_questions.sql'
      - 'supabase/migrations/202607251709_cipmn_mod_008_mock_questions.sql'
      - 'supabase/migrations/202607251710_cipmn_mod_009_mock_questions.sql'
      - 'supabase/migrations/202607251711_cipmn_mod_010_mock_questions.sql'
      - 'supabase/migrations/202607251712_cipmn_mod_011_mock_questions.sql'
      - 'supabase/migrations/202607251713_cipmn_mod_012_mock_questions.sql'
      - 'supabase/migrations/202607251715_cipmn_module_mock_pass_mark_70.sql'
      - '.github/workflows/validate-cipmn-module-mock-examinations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cipmn-module-mocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build examination portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  database:
    name: Validate 12 examinations and 900 MCQs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Neutralise production-only bootstrap in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          -- CI only: production already has its authorised Super Administrator.
          commit;
          SQL
      - name: Start isolated Supabase services
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee cipmn-mock-supabase-start.log
      - name: Apply all migrations from scratch
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local 2>&1 | tee cipmn-mock-db-reset.log
      - name: Verify catalogue, commerce and bank integrity
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL' | tee cipmn-mock-integrity.log
          do $$
          declare v_pid uuid;
          begin
            select id into v_pid from public.programmes where code='CIPMN-MOCK' and is_active;
            if v_pid is null then raise exception 'CIPMN-MOCK programme is missing.'; end if;
            if (select count(*) from public.examinations where programme_id=v_pid and status='published')<>12 then
              raise exception 'Expected 12 published examinations.';
            end if;
            if exists(
              select 1 from public.examinations e
              left join public.exam_prices ep on ep.examination_id=e.id and ep.currency='NGN' and ep.is_active
              where e.programme_id=v_pid and (
                e.duration_minutes<>120 or e.pass_mark<>70 or e.max_attempts<>1 or e.allow_self_enrollment
                or not e.requires_payment or not e.randomize_questions or not e.randomize_options
                or ep.amount_minor<>2500000 or not ep.is_default
              )
            ) then raise exception 'Incorrect examination runtime or price settings.'; end if;
            if exists(
              select 1 from public.examinations e where e.programme_id=v_pid and
              (select count(*) from public.questions q where q.examination_id=e.id and q.is_active)<>75
            ) then raise exception 'Every module must contain exactly 75 active questions.'; end if;
            if (select count(*) from public.questions q join public.examinations e on e.id=q.examination_id
                where e.programme_id=v_pid and q.is_active)<>900 then raise exception 'Expected 900 active questions.'; end if;
            if (select count(*) from public.question_options qo join public.questions q on q.id=qo.question_id
                join public.examinations e on e.id=q.examination_id where e.programme_id=v_pid and q.is_active)<>3600 then
              raise exception 'Expected 3,600 options.';
            end if;
            if exists(
              select 1 from public.questions q join public.examinations e on e.id=q.examination_id
              where e.programme_id=v_pid and q.is_active and (select count(*) from public.question_options o where o.question_id=q.id)<>4
            ) then raise exception 'A question does not have four options.'; end if;
            if (select count(*) from public.question_answer_keys k join public.questions q on q.id=k.question_id
                join public.examinations e on e.id=q.examination_id join public.question_options o
                on o.id=k.correct_option_id and o.question_id=q.id where e.programme_id=v_pid and q.is_active)<>900 then
              raise exception 'Expected 900 valid protected answer keys.';
            end if;
            if exists(
              select 1 from public.examinations e join public.questions q on q.examination_id=e.id and q.is_active
              where e.programme_id=v_pid group by e.id having count(*)<>count(distinct q.question_text)
            ) then raise exception 'Duplicate question text exists within a module.'; end if;
            if exists(
              select 1 from public.questions q join public.examinations e on e.id=q.examination_id
              where e.programme_id=v_pid and q.is_active and q.question_text !~*
              '(public-sector project|health-sector programme|ICT delivery team|infrastructure contractor|donor-funded initiative)'
            ) then raise exception 'A question is not case/application framed.'; end if;
          end;
          $$;
          select split_part(e.title,' - ',1) module_code,count(q.id) filter(where q.is_active) questions,
                 ep.amount_minor,e.duration_minutes,e.pass_mark
          from public.examinations e join public.programmes p on p.id=e.programme_id
          left join public.questions q on q.examination_id=e.id
          left join public.exam_prices ep on ep.examination_id=e.id and ep.currency='NGN' and ep.is_active
          where p.code='CIPMN-MOCK' group by e.id,ep.amount_minor order by e.title;
          SQL
          grep -Eq 'CIPMN-MOD-001[[:space:]]*\|[[:space:]]*75' cipmn-mock-integrity.log
          grep -Eq 'CIPMN-MOD-012[[:space:]]*\|[[:space:]]*75' cipmn-mock-integrity.log
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-module-mock-examination-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            cipmn-mock-supabase-start.log
            cipmn-mock-db-reset.log
            cipmn-mock-integrity.log
