name: Deploy Phase 3 Certificate Completion Production

on:
  push:
    branches: [supabase-integration]
    paths:
      - 'deployment-triggers/deploy-phase-3-certificate-completion-production.txt'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  APPROVED_APP_COMMIT: '03242b42dbef911dc780d368ffa0fd18c1e85ab7'
  SUPABASE_PROJECT_REF: 'cfecicvugfrrhcvhduzc'
  PHASE3_VERSION: '202607251800'
  PHASE3_FILE: 'supabase/migrations/202607251800_phase_3_certificate_completion.sql'
  LIVE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_50J_vx8mlYNlSZkkoW8Keg_Cmcics2J'

concurrency:
  group: phase-3-certificate-completion-production
  cancel-in-progress: false

jobs:
  deploy-database:
    name: Apply and verify Phase 3 production migration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact approved merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate approved source and deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$PHASE3_FILE"
          test -s src/components/AdminCertificateCompletionPanel.tsx
          test -s src/services/certificatePdfService.ts
          test -s src/services/certificateCompletionService.ts
          grep -q 'agilecert_certificate_templates' "$PHASE3_FILE"
          grep -q 'decide_agilecert_certificate_request' "$PHASE3_FILE"
          grep -q 'correct_and_reissue_agilecert_certificate' "$PHASE3_FILE"
          grep -q 'get_my_agilecert_certificate_render_payload' "$PHASE3_FILE"
          grep -q 'agilecert_certificate_audit_events' "$PHASE3_FILE"
          grep -q 'extensions.gen_random_bytes' "$PHASE3_FILE"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated linked migration workspace
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/agilecert-phase3-production"
          rm -rf "$workdir"
          mkdir -p "$workdir/supabase"
          cp -R supabase/migrations "$workdir/supabase/migrations"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Link production Supabase
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply only approved Phase 3 migration
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          set +e
          output="$(supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase3-production-dry-run.log"
          test "$status" -eq 0

          if printf '%s\n' "$output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Approved Phase 3 migration is already applied.' | tee "$RUNNER_TEMP/phase3-production-apply.log"
          else
            pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            test "$pending" = "$(basename "$PHASE3_FILE")"
            supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes \
              2>&1 | tee "$RUNNER_TEMP/phase3-production-apply.log"
          fi

      - name: Verify production migration history and schema authority
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase3-production-migration-history.log"
          schema="$RUNNER_TEMP/phase3-production-public-schema.sql"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history"
          python3 - "$history" "$PHASE3_VERSION" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          version = sys.argv[2]
          rows = []
          for line in text.splitlines():
              if '|' in line:
                  parts = [part.strip().strip('`') for part in line.split('|')]
                  if len(parts) >= 2:
                      rows.append(parts)
          if not any(row[0] == version and row[1] == version for row in rows):
              raise SystemExit(f'Production migration {version} is not recorded locally and remotely.')
          PY
          supabase db dump --linked --schema public --file "$schema" --password "$SUPABASE_DB_PASSWORD"
          test -s "$schema"
          for marker in \
            agilecert_certificate_templates \
            agilecert_certificate_approval_decisions \
            agilecert_certificate_revisions \
            agilecert_certificate_audit_events \
            decide_agilecert_certificate_request \
            correct_and_reissue_agilecert_certificate \
            get_my_agilecert_certificate_render_payload \
            get_agilecert_certificate_completion_console; do
            grep -q "$marker" "$schema"
          done

      - name: Verify public certificate RPC in production
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/phase3-production-public-verification.json"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_code":"PHASE3-PRODUCTION-VERIFICATION-NOT-FOUND"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/verify_agilecert_certificate")"
          echo "verify_agilecert_certificate HTTP $status" | tee "$RUNNER_TEMP/phase3-production-rpc-probe.log"
          cat "$response"
          test "$status" = '200'
          python3 - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload.get('found') is not False or payload.get('valid') is not False:
              raise SystemExit(f'Unexpected public verification payload: {payload}')
          PY

      - name: Upload database deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-3-production-database-evidence
          path: |
            ${{ runner.temp }}/phase3-production-dry-run.log
            ${{ runner.temp }}/phase3-production-apply.log
            ${{ runner.temp }}/phase3-production-migration-history.log
            ${{ runner.temp }}/phase3-production-public-schema.sql
            ${{ runner.temp }}/phase3-production-public-verification.json
            ${{ runner.temp }}/phase3-production-rpc-probe.log
          if-no-files-found: warn
          retention-days: 30

  build-and-deploy-pages:
    name: Build and deploy exact Phase 3 frontend artifact
    needs: deploy-database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact approved merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install, validate and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          rm -f dist/server.cjs dist/server.cjs.map
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          grep -Rqs 'Certificate Lifecycle' dist/assets
          grep -Rqs 'request changes' dist/assets
          grep -Rqs 'QR' dist/assets

          python3 <<'PY'
          from pathlib import Path
          import hashlib, re
          html = Path('dist/index.html').read_text()
          match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
          if not match:
              raise SystemExit('Compiled JavaScript asset was not found.')
          relative = match.group(1).lstrip('./')
          asset = Path('dist') / relative
          if not asset.is_file():
              raise SystemExit(f'Compiled asset is missing: {asset}')
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          Path('/tmp/phase3-local-asset-path.txt').write_text(relative)
          Path('/tmp/phase3-local-asset-sha256.txt').write_text(digest + '\n')
          print(f'Compiled asset: {relative}')
          print(f'SHA-256: {digest}')
          PY

      - uses: actions/configure-pages@v5

      - name: Upload exact GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact live frontend bundle and production RPC
        shell: bash
        run: |
          set -euo pipefail
          expected_asset="$(cat /tmp/phase3-local-asset-path.txt)"
          expected_sha="$(cat /tmp/phase3-local-asset-sha256.txt)"
          live_index="$RUNNER_TEMP/phase3-live-index.html"
          live_asset="$RUNNER_TEMP/phase3-live-asset.js"

          for attempt in $(seq 1 18); do
            curl -fsSL -H 'Cache-Control: no-cache' "${LIVE_URL}?phase3=${GITHUB_RUN_ID}-${attempt}" -o "$live_index" || true
            if grep -q 'AgileCert Global' "$live_index"; then
              live_path="$(python3 - "$live_index" <<'PY'
          from pathlib import Path
          import re, sys
          html = Path(sys.argv[1]).read_text(errors='replace')
          match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
          print(match.group(1).lstrip('./') if match else '')
          PY
              )"
              if [ -n "$live_path" ]; then
                curl -fsSL -H 'Cache-Control: no-cache' "${LIVE_URL}${live_path}?phase3=${GITHUB_RUN_ID}-${attempt}" -o "$live_asset" || true
                if [ -s "$live_asset" ]; then
                  live_sha="$(sha256sum "$live_asset" | awk '{print $1}')"
                  if [ "$live_sha" = "$expected_sha" ] && [ "$live_path" = "$expected_asset" ]; then
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done

          live_path="$(python3 - "$live_index" <<'PY'
          from pathlib import Path
          import re, sys
          html = Path(sys.argv[1]).read_text(errors='replace')
          match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
          print(match.group(1).lstrip('./') if match else '')
          PY
          )"
          live_sha="$(sha256sum "$live_asset" | awk '{print $1}')"
          {
            echo "Approved commit: $APPROVED_APP_COMMIT"
            echo "Expected asset: $expected_asset"
            echo "Live asset: $live_path"
            echo "Expected SHA-256: $expected_sha"
            echo "Live SHA-256: $live_sha"
            echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          } | tee "$RUNNER_TEMP/phase3-production-pages-verification.log"

          test "$live_path" = "$expected_asset"
          test "$live_sha" = "$expected_sha"
          grep -q 'Certificate Lifecycle' "$live_asset"
          grep -q 'request changes' "$live_asset"

          rpc_response="$RUNNER_TEMP/phase3-production-post-pages-rpc.json"
          rpc_status="$(curl -sS -o "$rpc_response" -w '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_code":"PHASE3-POST-PAGES-VERIFICATION-NOT-FOUND"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/verify_agilecert_certificate")"
          test "$rpc_status" = '200'

      - name: Upload production frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-3-production-pages-evidence
          path: |
            /tmp/phase3-local-asset-path.txt
            /tmp/phase3-local-asset-sha256.txt
            ${{ runner.temp }}/phase3-live-index.html
            ${{ runner.temp }}/phase3-live-asset.js
            ${{ runner.temp }}/phase3-production-pages-verification.log
            ${{ runner.temp }}/phase3-production-post-pages-rpc.json
          if-no-files-found: warn
          retention-days: 30
