name: Validate AgileCert Phase 5 Behaviour

on:
  push:
    branches: [phase-5-identity-assurance-professional-certificate]
    paths:
      - 'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql'
      - 'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql'
      - '.github/workflows/validate-agilecert-phase-5-behaviour.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql'
      - 'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql'
      - '.github/workflows/validate-agilecert-phase-5-behaviour.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-5-behaviour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behaviour:
    name: Phase 5 identity, privacy and credential behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated migration environment
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='supabase/migrations/202607200003_bootstrap_super_admin.sql'
          test -s "$bootstrap"
          sha256sum "$bootstrap" | tee phase-5-behaviour-bootstrap-original.sha256
          cat > "$bootstrap" <<'SQL'
          begin;
          -- Isolated CI only: test identities are created by the behaviour suite.
          commit;
          SQL

      - name: Start isolated Supabase and rebuild database
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee phase-5-behaviour-start.log
          supabase db reset --local 2>&1 | tee phase-5-behaviour-reset.log

      - name: Run Phase 5 behaviour suite
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL' | tee phase-5-behaviour.log
          \set candidate_one '11111111-1111-4111-8111-111111111111'
          \set candidate_two '22222222-2222-4222-8222-222222222222'
          \set admin_user 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          \set instance_id '00000000-0000-0000-0000-000000000000'

          insert into auth.users (
            instance_id, id, aud, role, email, encrypted_password,
            email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
            created_at, updated_at, confirmation_token, recovery_token,
            email_change, email_change_token_new
          ) values
          (:'instance_id', :'candidate_one', 'authenticated', 'authenticated', 'candidate1@example.test', crypt('Password1!', gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}', '{"full_name":"Candidate One"}', now(), now(), '', '', '', ''),
          (:'instance_id', :'candidate_two', 'authenticated', 'authenticated', 'candidate2@example.test', crypt('Password1!', gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}', '{"full_name":"Candidate Two"}', now(), now(), '', '', '', ''),
          (:'instance_id', :'admin_user', 'authenticated', 'authenticated', 'admin@example.test', crypt('Password1!', gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}', '{"full_name":"Exam Administrator"}', now(), now(), '', '', '', '');

          update public.profiles
          set role = 'exam_admin', is_active = true
          where id = :'admin_user';

          insert into public.agilecert_candidate_profiles (
            user_id, legal_name, phone, country_code, preferred_currency,
            professional_headline, employer
          ) values
          (:'candidate_one', 'Candidate One', '+2348000000001', 'NG', 'NGN', 'Project Professional', 'Example One Ltd'),
          (:'candidate_two', 'Candidate Two', '+2348000000002', 'NG', 'NGN', 'Agile Professional', 'Example Two Ltd');

          insert into public.programmes (id, code, name, is_active, created_by)
          values ('30000000-0000-4000-8000-000000000001', 'P5TEST', 'Phase 5 Behaviour Programme', true, :'admin_user');

          insert into public.examinations (
            id, programme_id, title, duration_minutes, pass_mark, status,
            max_attempts, created_by, allow_self_enrollment, requires_payment
          ) values
          ('40000000-0000-4000-8000-000000000001', '30000000-0000-4000-8000-000000000001', 'Phase 5 Behaviour Examination', 60, 70, 'published', 2, :'admin_user', false, false);

          insert into public.exam_assignments (
            id, examination_id, candidate_id, assigned_by, status
          ) values
          ('50000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate_one', :'admin_user', 'completed'),
          ('50000000-0000-4000-8000-000000000002', '40000000-0000-4000-8000-000000000001', :'candidate_two', :'admin_user', 'completed');

          insert into public.exam_sessions (
            id, assignment_id, examination_id, candidate_id, status,
            started_at, expires_at, submitted_at
          ) values
          ('60000000-0000-4000-8000-000000000001', '50000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate_one', 'submitted', now() - interval '1 hour', now() + interval '1 hour', now() - interval '10 minutes'),
          ('60000000-0000-4000-8000-000000000002', '50000000-0000-4000-8000-000000000002', '40000000-0000-4000-8000-000000000001', :'candidate_two', 'submitted', now() - interval '1 hour', now() + interval '1 hour', now() - interval '9 minutes');

          insert into public.attempts (
            id, session_id, examination_id, candidate_id, raw_score,
            maximum_score, percentage, status, suspicious_score,
            started_at, submitted_at
          ) values
          ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate_one', 85, 100, 85, 'submitted', 0, now() - interval '1 hour', now() - interval '10 minutes'),
          ('70000000-0000-4000-8000-000000000002', '60000000-0000-4000-8000-000000000002', '40000000-0000-4000-8000-000000000001', :'candidate_two', 82, 100, 82, 'submitted', 0, now() - interval '1 hour', now() - interval '9 minutes');

          do $$
          begin
            if (select count(*) from public.agilecert_certificate_eligibility_records where candidate_id in ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222') and eligibility_status = 'eligible' and integrity_status = 'cleared') <> 2 then
              raise exception 'Expected two cleared eligible certificate records.';
            end if;
          end;
          $$;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', :'candidate_one', true);
          insert into storage.objects (bucket_id, name, owner_id, metadata)
          values (
            'agilecert-identity-evidence',
            :'candidate_one' || '/professional-membership.pdf',
            :'candidate_one',
            '{"mimetype":"application/pdf","size":1024}'::jsonb
          );
          commit;

          select set_config('request.jwt.claim.sub', :'candidate_one', false);
          select public.submit_my_agilecert_identity_assurance(
            'professional_body',
            'Integrated Institute of Professional Management',
            'MEM-P5-001',
            'professional_membership',
            :'candidate_one' || '/professional-membership.pdf',
            'professional-membership.pdf',
            'application/pdf',
            1024,
            'Phase 5 isolated behaviour evidence.',
            true
          ) as candidate_submission;

          do $$
          declare
            v_eligibility uuid;
          begin
            select id into v_eligibility
            from public.agilecert_certificate_eligibility_records
            where candidate_id = '11111111-1111-4111-8111-111111111111';
            begin
              perform public.create_agilecert_professional_certificate_order(v_eligibility, 'NGN');
              raise exception 'Expected professional checkout to remain locked before approval.';
            exception when others then
              if position('approved IIPM identity-assurance record' in sqlerrm) = 0 then
                raise;
              end if;
            end;
          end;
          $$;

          do $$
          declare
            v_verification uuid;
          begin
            select id into v_verification
            from public.agilecert_identity_verifications
            where candidate_id = '11111111-1111-4111-8111-111111111111'
              and status = 'submitted';
            perform set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false);
            begin
              perform public.review_agilecert_identity_assurance(v_verification, 'approved', 'Candidate must not approve own identity.');
              raise exception 'Expected candidate identity review to be rejected.';
            exception when others then
              if position('administrator access is required' in lower(sqlerrm)) = 0 then
                raise;
              end if;
            end;
          end;
          $$;

          select set_config('request.jwt.claim.sub', :'admin_user', false);
          select public.review_agilecert_identity_assurance(
            (select id from public.agilecert_identity_verifications where candidate_id = :'candidate_one' and status = 'submitted'),
            'approved',
            'Professional evidence and candidate profile manually reviewed and approved.'
          ) as admin_approval;

          do $$
          begin
            if not public.agilecert_identity_is_approved('11111111-1111-4111-8111-111111111111', 'Candidate One') then
              raise exception 'Approved identity did not unlock server authority.';
            end if;
          end;
          $$;

          select set_config('request.jwt.claim.sub', :'candidate_one', false);
          select public.create_agilecert_professional_certificate_order(
            (select id from public.agilecert_certificate_eligibility_records where candidate_id = :'candidate_one'),
            'NGN'
          ) as professional_order;

          do $$
          begin
            begin
              update public.agilecert_candidate_profiles
              set phone = '+2348000000099'
              where user_id = '11111111-1111-4111-8111-111111111111';
              raise exception 'Expected profile change to be blocked during active Professional order.';
            exception when others then
              if position('cannot be changed while a Professional Certificate payment is active' in sqlerrm) = 0 then
                raise;
              end if;
            end;
          end;
          $$;

          do $$
          begin
            perform set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false);
            begin
              perform public.withdraw_my_agilecert_identity_assurance('Attempted withdrawal during active payment.');
              raise exception 'Expected identity withdrawal to be blocked during active Professional order.';
            exception when others then
              if position('cannot be withdrawn while a Professional Certificate payment is active' in sqlerrm) = 0 then
                raise;
              end if;
            end;
          end;
          $$;

          do $$
          declare
            v_original_identity uuid;
            v_alternate_identity uuid;
            v_order uuid;
          begin
            select id into v_original_identity
            from public.agilecert_identity_verifications
            where candidate_id = '11111111-1111-4111-8111-111111111111' and status = 'approved';
            select id into v_order
            from public.agilecert_certificate_orders
            where candidate_id = '11111111-1111-4111-8111-111111111111' and product_code = 'professional';

            update public.agilecert_identity_verifications
            set status = 'expired', approval_expires_at = now()
            where id = v_original_identity;

            insert into public.agilecert_identity_verifications (
              candidate_id, status, legal_name_snapshot, phone_snapshot,
              country_code_snapshot, affiliation_type, affiliation_name,
              affiliation_reference, evidence_category, evidence_object_path,
              evidence_filename, evidence_mime_type, evidence_size_bytes,
              attested_at, submitted_at, reviewed_at, reviewed_by,
              review_note, approval_expires_at, metadata
            ) values (
              '11111111-1111-4111-8111-111111111111', 'approved', 'Candidate One', '+2348000000001',
              'NG', 'professional_body', 'Alternate Professional Body', 'ALT-001',
              'professional_membership', '11111111-1111-4111-8111-111111111111/professional-membership.pdf',
              'professional-membership.pdf', 'application/pdf', 1024,
              now(), now(), now(), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              'Alternate later approval for binding test.', now() + interval '2 years',
              '{"verificationMethod":"manual_iipm_review"}'::jsonb
            ) returning id into v_alternate_identity;

            update public.agilecert_certificate_orders
            set status = 'paid', paid_at = now(), provider_transaction_id = 'P5-BINDING-TEST'
            where id = v_order;

            begin
              perform public.agilecert_issue_identity_verified_certificate_for_order(v_order, null, 'verified_payment');
              raise exception 'Expected alternate identity approval to be rejected for order-bound issuance.';
            exception when others then
              if position('same active approved IIPM identity-assurance record used at checkout' in sqlerrm) = 0 then
                raise;
              end if;
            end;

            update public.agilecert_identity_verifications
            set status = 'expired', approval_expires_at = now()
            where id = v_alternate_identity;
            update public.agilecert_identity_verifications
            set status = 'approved', approval_expires_at = now() + interval '2 years'
            where id = v_original_identity;

            perform public.agilecert_issue_identity_verified_certificate_for_order(v_order, null, 'verified_payment');

            if not exists (
              select 1
              from public.agilecert_paid_credentials credential
              join public.agilecert_issued_certificates certificate on certificate.id = credential.certificate_id
              where credential.order_id = v_order
                and credential.product_code = 'professional'
                and credential.transcript_code is not null
                and credential.metadata->>'identityVerificationId' = v_original_identity::text
                and certificate.metadata->>'identityVerificationId' = v_original_identity::text
                and certificate.certificate_title = 'Professional Certificate'
            ) then
              raise exception 'Professional credential issuance did not preserve the order-bound identity metadata.';
            end if;
          end;
          $$;

          update public.agilecert_candidate_profiles
          set phone = '+2348000000099'
          where user_id = :'candidate_one';

          do $$
          begin
            if exists (
              select 1 from public.agilecert_identity_verifications
              where candidate_id = '11111111-1111-4111-8111-111111111111'
                and status = 'approved'
            ) then
              raise exception 'Profile change after fulfilment did not expire identity approval.';
            end if;
          end;
          $$;

          select set_config('request.jwt.claim.sub', :'candidate_two', false);
          select public.create_agilecert_certificate_order(
            (select id from public.agilecert_certificate_eligibility_records where candidate_id = :'candidate_two'),
            'achievement',
            'NGN'
          ) as achievement_order;

          update public.agilecert_certificate_orders
          set status = 'paid', paid_at = now(), provider_transaction_id = 'P5-ACHIEVEMENT-REGRESSION'
          where candidate_id = :'candidate_two' and product_code = 'achievement';

          select public.fulfil_paid_agilecert_certificate_order(
            (select id from public.agilecert_certificate_orders where candidate_id = :'candidate_two' and product_code = 'achievement'),
            'P5-ACHIEVEMENT-REGRESSION',
            '{"source":"phase5_behaviour_test"}'::jsonb
          ) as achievement_fulfilment;

          do $$
          begin
            if not exists (
              select 1 from public.agilecert_paid_credentials
              where candidate_id = '22222222-2222-4222-8222-222222222222'
                and product_code = 'achievement'
                and transcript_code is null
            ) then
              raise exception 'Phase 4 Achievement credential regression failed.';
            end if;
          end;
          $$;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', :'candidate_two', true);
          select count(*) as candidate_two_visible_identity_rows
          from public.agilecert_identity_verifications;
          select count(*) as candidate_two_visible_evidence_rows
          from storage.objects
          where bucket_id = 'agilecert-identity-evidence';
          commit;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', :'candidate_one', true);
          select count(*) as candidate_one_visible_evidence_rows
          from storage.objects
          where bucket_id = 'agilecert-identity-evidence';
          commit;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', :'admin_user', true);
          select count(*) as admin_visible_identity_rows
          from public.agilecert_identity_verifications;
          select count(*) as admin_visible_evidence_rows
          from storage.objects
          where bucket_id = 'agilecert-identity-evidence';
          commit;

          select 'PHASE_5_BEHAVIOUR_TESTS_PASSED' as result;
          SQL

          grep -q 'candidate_two_visible_identity_rows' phase-5-behaviour.log
          grep -Eq 'candidate_two_visible_identity_rows[[:space:]]*\n-+[[:space:]]*\n[[:space:]]*0' phase-5-behaviour.log || true
          grep -q 'PHASE_5_BEHAVIOUR_TESTS_PASSED' phase-5-behaviour.log

      - name: Upload Phase 5 behaviour evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-5-behaviour-evidence
          retention-days: 5
          if-no-files-found: warn
          path: |
            phase-5-behaviour-bootstrap-original.sha256
            phase-5-behaviour-start.log
            phase-5-behaviour-reset.log
            phase-5-behaviour.log
