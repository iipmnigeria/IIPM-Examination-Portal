name: Patch Phase 5 Seven Migration Validator

on:
  push:
    branches: [phase-5-advanced-identity-proctoring]
    paths:
      - 'deployment-triggers/patch-phase5-seven-migration-validator.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-advanced-identity-proctoring
          fetch-depth: 0

      - name: Patch strict migration allow-list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-agilecert-original-phase-5.yml')
          text = path.read_text()

          expected_anchor = """          supabase/migrations/202607261405_phase_5_privacy_permissions.sql
          EOF"""
          expected_replacement = """          supabase/migrations/202607261405_phase_5_privacy_permissions.sql
          supabase/migrations/202607261406_phase_5_result_integrity_compatibility.sql
          EOF"""
          if '202607261406_phase_5_result_integrity_compatibility.sql' not in text:
              if expected_anchor not in text:
                  raise SystemExit('Expected migration allow-list anchor was not found.')
              text = text.replace(expected_anchor, expected_replacement, 1)

          files_anchor = """          ])]
          sql = '\\n'.join(path.read_text() for path in files)"""
          files_replacement = """          ])] + [Path('supabase/migrations/202607261406_phase_5_result_integrity_compatibility.sql')]
          sql = '\\n'.join(path.read_text() for path in files)"""
          if "Path('supabase/migrations/202607261406_phase_5_result_integrity_compatibility.sql')" not in text:
              if files_anchor not in text:
                  raise SystemExit('Migration source-list anchor was not found.')
              text = text.replace(files_anchor, files_replacement, 1)

          required_anchor = """              'metadata must not contain examination questions, answers or answer keys',
          ]"""
          required_replacement = """              'metadata must not contain examination questions, answers or answer keys',
              'The cleared appeal did not restore Phase 3 certificate eligibility',
          ]"""
          if 'The cleared appeal did not restore Phase 3 certificate eligibility' not in text:
              if required_anchor not in text:
                  raise SystemExit('Phase 5 marker-list anchor was not found.')
              text = text.replace(required_anchor, required_replacement, 1)

          path.write_text(text)
          PY

          grep -q '202607261406_phase_5_result_integrity_compatibility.sql' .github/workflows/validate-agilecert-original-phase-5.yml

      - name: Commit validated allow-list patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-phase5-seven-migration-validator.yml
          rm -f deployment-triggers/patch-phase5-seven-migration-validator.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-agilecert-original-phase-5.yml \
            .github/workflows/patch-phase5-seven-migration-validator.yml \
            deployment-triggers/patch-phase5-seven-migration-validator.txt
          git commit -m 'Recognise Phase 5 result-integrity compatibility migration'
          git push origin HEAD:phase-5-advanced-identity-proctoring
