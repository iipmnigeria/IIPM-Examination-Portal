name: Apply Phase 7 TypeScript Fix

on:
  push:
    branches: [phase-7-ai-cv-profile-builder-foundation]
    paths:
      - 'scripts/fix-phase7-typescript.py'
      - '.github/workflows/apply-phase7-typescript-fix.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'scripts/fix-phase7-typescript.py'
      - '.github/workflows/apply-phase7-typescript-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-phase7-typescript-fix
  cancel-in-progress: false

jobs:
  patch:
    name: Apply and validate TypeScript corrections
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-7-ai-cv-profile-builder-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply corrections
        run: python3 scripts/fix-phase7-typescript.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run lint

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AiCvProfileBuilder.tsx src/services/aiCvProfileBuilderService.ts
          if git diff --cached --quiet; then
            echo 'TypeScript corrections already applied.'
            exit 0
          fi
          git commit -m 'Fix Phase 7 TypeScript types'
          git push origin HEAD:phase-7-ai-cv-profile-builder-foundation
