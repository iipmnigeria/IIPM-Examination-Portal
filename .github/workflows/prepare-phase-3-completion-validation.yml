name: Prepare Phase 3 Completion Validation

on:
  push:
    branches: [phase-3-certificate-completion]
    paths:
      - '.github/workflows/prepare-phase-3-completion-validation.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0

      - name: Correct migration version and template backfill
        shell: bash
        run: |
          set -euo pipefail
          old='supabase/migrations/202607251714_phase_3_certificate_completion.sql'
          new='supabase/migrations/202607251800_phase_3_certificate_completion.sql'
          test -f "$old"
          test ! -e "$new"
          mv "$old" "$new"
          sed -i 's/202607251714_phase_3_certificate_completion.sql/202607251800_phase_3_certificate_completion.sql/g' docs/AGILECERT_PHASE_3_COMPLETION_SCOPE.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202607251800_phase_3_certificate_completion.sql')
          text = path.read_text(encoding='utf-8')
          old = """join public.agilecert_certificate_templates t
            on t.programme_id = e.programme_id
           and t.product_code = 'achievement'
           and t.active = true
          """
          new = """join public.agilecert_certificate_templates t
            on t.programme_id = e.programme_id
           and t.product_code = case
             when lower(coalesce(nullif(c.metadata->>'productCode', ''), 'achievement')) = 'professional'
               then 'professional'
             else 'achievement'
           end
           and t.active = true
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one certificate template backfill block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit prepared migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-phase-3-completion-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AGILECERT_PHASE_3_COMPLETION_SCOPE.md supabase/migrations .github/workflows/prepare-phase-3-completion-validation.yml
          git diff --cached --check
          git commit -m 'Prepare Phase 3 completion migration validation'
          git push origin HEAD:phase-3-certificate-completion
