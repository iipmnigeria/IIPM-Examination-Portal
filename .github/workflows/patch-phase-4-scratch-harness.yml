# trigger-version: 2
name: Patch Phase 4 Scratch Harness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-phase-4-scratch-harness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace psql-variable assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/test-phase-4-certificate-commerce-scratch.yml')
          text = path.read_text()
          start_marker = "          select public.create_agilecert_certificate_order(\n            (select id from public.agilecert_certificate_eligibility_records where attempt_id = '50000000-0000-4000-8000-000000000001'),\n            'achievement',\n            'NGN'\n          ) as order_one \\gset order_one_"
          end_marker = "          end $$;\n\n          do $$\n          begin\n            begin\n              perform public.create_agilecert_certificate_order("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Unable to locate exact scratch-order assertion block: start={start}, end={end}')
          replacement = """          select public.create_agilecert_certificate_order(
            (select id from public.agilecert_certificate_eligibility_records where attempt_id = '50000000-0000-4000-8000-000000000001'),
            'achievement',
            'NGN'
          );

          select public.create_agilecert_certificate_order(
            (select id from public.agilecert_certificate_eligibility_records where attempt_id = '50000000-0000-4000-8000-000000000001'),
            'achievement',
            'NGN'
          );

          do $$
          declare
            first_order public.agilecert_certificate_orders%rowtype;
          begin
            if (select count(*) from public.agilecert_certificate_orders where candidate_id = auth.uid() and status = 'pending') <> 1 then
              raise exception 'Certificate order creation was not idempotent.';
            end if;
            select * into first_order
            from public.agilecert_certificate_orders
            where candidate_id = auth.uid() and status = 'pending';
            if first_order.currency <> 'NGN'
               or first_order.payable_amount_minor <> 2000000
               or first_order.pricing_window <> 'early' then
              raise exception 'Early order pricing is incorrect: %', row_to_json(first_order);
            end if;
          end $$;

"""
          path.write_text(text[:start] + replacement + text[end + len("          end $$;\n\n"):])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/test-phase-4-certificate-commerce-scratch.yml
          git commit -m 'Correct Phase 4 scratch order assertion'
          git push origin HEAD:main
