name: Validate AgileCert Phase 5 Behaviour V2

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql'
      - 'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql'
      - 'supabase/migrations/202607250103_phase_5_supabase_issuer_compatibility.sql'
      - '.github/workflows/validate-agilecert-phase-5-behaviour-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-5-behaviour-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behaviour:
    name: Phase 5 complete identity and credential behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Extract complete behaviour SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-agilecert-phase-5-behaviour.yml').read_text()
          start = source.index("          \\set candidate_one '")
          end = source.index('\n          SQL', start)
          lines = source[start:end].splitlines()
          sql = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('phase-5-complete-behaviour.sql').write_text(sql)
          PY
          grep -q 'PHASE_5_BEHAVIOUR_TESTS_PASSED' phase-5-complete-behaviour.sql

      - name: Start isolated Supabase and rebuild database
        shell: bash
        run: |
          set -o pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          commit;
          SQL
          supabase start 2>&1 | tee phase-5-behaviour-v2-start.log
          supabase db reset --local 2>&1 | tee phase-5-behaviour-v2-reset.log

      - name: Run complete behaviour SQL
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f phase-5-complete-behaviour.sql \
            2>&1 | tee phase-5-behaviour-v2.log
          grep -q 'PHASE_5_BEHAVIOUR_TESTS_PASSED' phase-5-behaviour-v2.log

      - name: Upload Phase 5 behaviour evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-5-behaviour-v2-evidence
          retention-days: 5
          if-no-files-found: warn
          path: |
            phase-5-complete-behaviour.sql
            phase-5-behaviour-v2-start.log
            phase-5-behaviour-v2-reset.log
            phase-5-behaviour-v2.log
