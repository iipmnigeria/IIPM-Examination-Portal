name: Validate Approved CIPMN Certificate Template

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/services/certificatePdfService.ts'
      - 'src/services/cipmnCertificateRenderer.ts'
      - 'src/assets/cipmnCertificate*.ts'
      - 'src/assets/cipmnCertificatePrint/**'
      - 'scripts/render-cipmn-certificate-sample.ts'
      - 'supabase/migrations/202607310600_cipmn_approved_certificate_template.sql'
      - '.github/workflows/validate-cipmn-approved-certificate-template.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check certificate implementation
        run: >-
          npx tsc --noEmit --skipLibCheck --target ES2022
          --module ESNext --moduleResolution Bundler
          --allowSyntheticDefaultImports --esModuleInterop
          src/vite-env.d.ts
          src/services/certificateCompletionService.ts
          src/services/certificatePdfService.ts
          src/services/cipmnCertificateRenderer.ts
          src/assets/cipmnCertificateIipmLogo.ts
          src/assets/cipmnCertificateCipmnLogo.ts
          src/assets/cipmnCertificateBanitoSignature.ts
          src/assets/cipmnCertificatePrint/*.ts

      - name: Validate print-ready PNG assets
        shell: python
        run: |
          import base64
          import hashlib
          import re
          import struct
          from pathlib import Path

          assets = {
              'iipm': {
                  'count': 7,
                  'dimensions': (420, 436),
                  'sha256': 'dfbd4d1cc935c98c824038ff4b37df7c96cb85929d94ff9fc04f6410886e35aa',
                  'aggregator': Path('src/assets/cipmnCertificateIipmLogo.ts'),
              },
              'cipmn': {
                  'count': 6,
                  'dimensions': (1140, 306),
                  'sha256': '38d2dc2b15ece1e444e2ad74452a0bfc8f2c557c61792c6cf9da23bd0a0f538a',
                  'aggregator': Path('src/assets/cipmnCertificateCipmnLogo.ts'),
              },
              'signature': {
                  'count': 4,
                  'dimensions': (288, 240),
                  'sha256': '0131bbf882b9b30b7b22e7667b6bd28b4bde1bc78f200d731bc565a8095eab90',
                  'aggregator': Path('src/assets/cipmnCertificateBanitoSignature.ts'),
              },
          }

          for name, expected in assets.items():
              encoded = ''
              for index in range(1, expected['count'] + 1):
                  path = Path(f'src/assets/cipmnCertificatePrint/{name}{index}.ts')
                  source = path.read_text(encoding='utf-8')
                  match = re.search(r"= '([A-Za-z0-9+/=]+)';", source)
                  assert match, f'Malformed print asset chunk: {path}'
                  encoded += match.group(1)

              raw = base64.b64decode(encoded, validate=True)
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', f'{name} is not a PNG'
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == expected['dimensions'], (name, width, height)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected['sha256'], (name, digest)

              aggregator = expected['aggregator'].read_text(encoding='utf-8')
              assert "'data:image/png;base64,'" in aggregator
              assert 'data:image/jpeg' not in aggregator
              print(f'{name}: {width}x{height}, sha256={digest}')

          renderer = Path('src/services/cipmnCertificateRenderer.ts').read_text(encoding='utf-8')
          required_png_calls = [
              "doc.addImage(IIPM_CERTIFICATE_LOGO_DATA_URI, 'PNG', 81, 13.1, 35, 35, 'iipm-logo');",
              "doc.addImage(CIPMN_CERTIFICATE_LOGO_DATA_URI, 'PNG', 123, 16.1, 95, 25.5, 'cipmn-logo');",
              "doc.addImage(BANITO_SIGNATURE_DATA_URI, 'PNG', 40, 156, 24, 20, 'banito-signature');",
          ]
          missing = [call for call in required_png_calls if call not in renderer]
          assert not missing, missing
          assert "IIPM_CERTIFICATE_LOGO_DATA_URI, 'JPEG'" not in renderer
          assert "CIPMN_CERTIFICATE_LOGO_DATA_URI, 'JPEG'" not in renderer
          assert "BANITO_SIGNATURE_DATA_URI, 'JPEG'" not in renderer
          print('Validated lossless print-ready PNG embedding at the approved dimensions.')

      - name: Build production application
        run: npm run build

      - name: Render dynamic certificate samples
        run: |
          npx esbuild scripts/render-cipmn-certificate-sample.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/render-cipmn-certificate-sample.cjs
          node /tmp/render-cipmn-certificate-sample.cjs
          test -s cipmn-certificate-standard-sample.pdf
          test -s cipmn-certificate-long-content-sample.pdf

      - name: Render and inspect certificate print evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo cipmn-certificate-standard-sample.pdf | tee cipmn-certificate-standard-info.txt
          pdfinfo cipmn-certificate-long-content-sample.pdf | tee cipmn-certificate-long-info.txt
          pdfimages -list cipmn-certificate-standard-sample.pdf | tee cipmn-certificate-standard-images.txt
          pdfimages -list cipmn-certificate-long-content-sample.pdf | tee cipmn-certificate-long-images.txt
          pdftoppm -png -f 1 -singlefile -r 300 \
            cipmn-certificate-standard-sample.pdf cipmn-certificate-standard-sample
          pdftoppm -png -f 1 -singlefile -r 300 \
            cipmn-certificate-long-content-sample.pdf cipmn-certificate-long-content-sample
          test -s cipmn-certificate-standard-sample.png
          test -s cipmn-certificate-long-content-sample.png
          grep -q 'Page size:.*A4' cipmn-certificate-standard-info.txt
          grep -q 'Pages:.*1' cipmn-certificate-standard-info.txt
          grep -q 'Pages:.*1' cipmn-certificate-long-info.txt

      - name: Verify embedded image resolution
        shell: python
        run: |
          import re
          from pathlib import Path

          image_list = Path('cipmn-certificate-standard-images.txt').read_text(encoding='utf-8')
          expected = [(420, 436), (1140, 306), (288, 240)]
          missing = [dimensions for dimensions in expected if not re.search(
              rf'\b{dimensions[0]}\s+{dimensions[1]}\b', image_list
          )]
          assert not missing, f'Missing embedded print-resolution images: {missing}'
          print('Confirmed the three print-ready images are embedded at source resolution.')

      - name: Validate dynamic, security and scope controls
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/services/certificatePdfService.ts').read_text(encoding='utf-8')
          renderer = Path('src/services/cipmnCertificateRenderer.ts').read_text(encoding='utf-8')
          migration = Path('supabase/migrations/202607310600_cipmn_approved_certificate_template.sql').read_text(encoding='utf-8')

          required = [
              (service, 'isCipmnCertificate'),
              (service, 'renderCipmnCompletionCertificate'),
              (service, 'renderDefaultCertificate'),
              (service, 'certificate.holderName'),
              (service, 'certificate.score'),
              (service, 'certificate.issueDate'),
              (service, 'certificate.certificateNumber'),
              (service, 'certificate.verificationCode'),
              (renderer, 'CERTIFICATE OF COMPLETION'),
              (renderer, 'SCORE:'),
              (renderer, 'Date of Completion'),
              (renderer, 'Certificate Number'),
              (renderer, 'BANITO_SIGNATURE_DATA_URI'),
              (renderer, 'IIPM_CERTIFICATE_LOGO_DATA_URI'),
              (renderer, 'CIPMN_CERTIFICATE_LOGO_DATA_URI'),
              (renderer, 'SCAN TO VERIFY'),
              (migration, "upper(p.code) like 'CIPMN%'"),
              (migration, "'variant', 'cipmn-completion-v1'"),
              (migration, "'certificateIdentityChanged', false"),
              (migration, "'examinationCode', v_examination_code"),
          ]
          missing = [marker for text, marker in required if marker not in text]
          assert not missing, missing
          assert renderer.count('BANITO_SIGNATURE_DATA_URI') == 2
          assert 'SAMPLE / NOT VALID' not in renderer
          assert 'SAMPLE - NOT VALID' not in renderer
          assert migration.rstrip().endswith('commit;')
          assert 'certificate_number =' not in migration.lower()
          assert 'verification_code =' not in migration.lower()
          assert 'revision_number =' not in migration.lower()
          assert "where upper(p.code) like 'CIPMN%'" in migration
          print('Validated dynamic CIPMN-only template, identity preservation and non-CIPMN fallback.')

      - name: Upload certificate review evidence
        uses: actions/upload-artifact@v4
        with:
          name: approved-cipmn-certificate-print-quality-samples
          retention-days: 30
          if-no-files-found: error
          path: |
            cipmn-certificate-standard-sample.pdf
            cipmn-certificate-long-content-sample.pdf
            cipmn-certificate-standard-sample.png
            cipmn-certificate-long-content-sample.png
            cipmn-certificate-standard-info.txt
            cipmn-certificate-long-info.txt
            cipmn-certificate-standard-images.txt
            cipmn-certificate-long-images.txt
