name: Patch Phase 1D Master Size Guard Once

on:
  push:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/patch-phase1d-master-size-guard-once.yml'

permissions:
  contents: write

concurrency:
  group: patch-phase1d-master-size-guard-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Correct test-only master size guard and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git worktree add /tmp/phase1d origin/feature/certificate-master-bootstrap-phase1d
          cd /tmp/phase1d
          git switch -c phase1d-master-size-guard-fix

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/certificate-masters/cipmn-approved-completion-master.test.ts')
          content = path.read_text(encoding='utf-8')
          old = "assert(masterOne.byteLength > 100_000, 'The approved master PDF is unexpectedly small.');"
          new = "assert(\n  masterOne.byteLength > 20_000,\n  `The approved master PDF is unexpectedly small: ${masterOne.byteLength} bytes.`,\n);"
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one arbitrary 100 KB master-size assertion.')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

          grep -q 'masterOne.byteLength > 20_000' \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          ! grep -q 'masterOne.byteLength > 100_000' \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          grep -q 'unexpectedly small: ${masterOne.byteLength} bytes' \
            scripts/certificate-masters/cipmn-approved-completion-master.test.ts

          git add scripts/certificate-masters/cipmn-approved-completion-master.test.ts
          git diff --cached --check
          git commit -m 'Use structural Phase 1D PDF quality checks'
          git push origin HEAD:feature/certificate-master-bootstrap-phase1d

          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/patch-phase1d-master-size-guard-once.yml
          git commit -m 'Remove one-use Phase 1D size guard patch control'
          git push origin HEAD:supabase-integration
