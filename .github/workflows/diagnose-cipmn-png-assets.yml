name: Diagnose CIPMN PNG assets

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/assets/cipmnCertificateIipmLogo.ts'
      - 'src/assets/cipmnCertificateCipmnLogo.ts'
      - 'src/assets/cipmnCertificateBanitoSignature.ts'
      - '.github/workflows/diagnose-cipmn-png-assets.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate embedded PNG assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const assets = [
            ['IIPM logo', 'src/assets/cipmnCertificateIipmLogo.ts'],
            ['CIPMN logo', 'src/assets/cipmnCertificateCipmnLogo.ts'],
            ['Banito signature', 'src/assets/cipmnCertificateBanitoSignature.ts'],
          ];

          const crcTable = Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) {
              value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
            }
            return value >>> 0;
          });

          const crc32 = (buffer) => {
            let crc = 0xffffffff;
            for (const byte of buffer) {
              crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
          };

          const parsePng = (bytes) => {
            let offset = 8;
            const chunks = [];
            while (offset + 12 <= bytes.length) {
              const length = bytes.readUInt32BE(offset);
              const typeStart = offset + 4;
              const type = bytes.subarray(typeStart, typeStart + 4).toString('ascii');
              const dataStart = offset + 8;
              const dataEnd = dataStart + length;
              const crcOffset = dataEnd;
              const next = crcOffset + 4;
              if (next > bytes.length) {
                return {
                  valid: false,
                  chunks,
                  offset,
                  remaining: bytes.length - offset,
                  nextLength: length,
                  nextType: type,
                  reason: `truncated ${type}`,
                };
              }

              const expectedCrc = bytes.readUInt32BE(crcOffset);
              const actualCrc = crc32(bytes.subarray(typeStart, dataEnd));
              chunks.push({
                type,
                length,
                offset,
                dataStart,
                dataEnd,
                crcOffset,
                expectedCrc,
                actualCrc,
                crcValid: expectedCrc === actualCrc,
              });
              offset = next;

              if (type === 'IEND') {
                const crcValid = chunks.every((chunk) => chunk.crcValid);
                return {
                  valid: offset === bytes.length && crcValid,
                  chunks,
                  offset,
                  remaining: bytes.length - offset,
                  reason: offset === bytes.length ? (crcValid ? 'complete' : 'CRC mismatch') : 'trailing bytes',
                };
              }
            }

            return {
              valid: false,
              chunks,
              offset,
              remaining: bytes.length - offset,
              reason: 'missing IEND',
            };
          };

          const inspectPixels = (bytes, structure) => {
            const ihdr = structure.chunks.find((chunk) => chunk.type === 'IHDR');
            const idats = structure.chunks.filter((chunk) => chunk.type === 'IDAT');
            if (!ihdr || idats.length === 0 || ihdr.length !== 13) {
              return { valid: false, reason: 'missing IHDR or IDAT' };
            }

            const width = bytes.readUInt32BE(ihdr.dataStart);
            const height = bytes.readUInt32BE(ihdr.dataStart + 4);
            const bitDepth = bytes[ihdr.dataStart + 8];
            const colorType = bytes[ihdr.dataStart + 9];
            const interlace = bytes[ihdr.dataStart + 12];
            const channelsByColorType = { 0: 1, 2: 3, 3: 1, 4: 2, 6: 4 };
            const channels = channelsByColorType[colorType];
            if (!channels) return { valid: false, reason: `unsupported colour type ${colorType}` };

            const compressed = Buffer.concat(idats.map((chunk) => bytes.subarray(chunk.dataStart, chunk.dataEnd)));
            let inflated;
            try {
              inflated = zlib.inflateSync(compressed);
            } catch (error) {
              return { valid: false, reason: `zlib failure: ${error.message}`, width, height, bitDepth, colorType, interlace };
            }

            if (interlace !== 0) {
              return { valid: false, reason: 'interlaced PNG requires separate validation', width, height, bitDepth, colorType, interlace, inflatedBytes: inflated.length };
            }

            const rowBytes = Math.ceil((width * channels * bitDepth) / 8);
            const expectedInflatedBytes = height * (rowBytes + 1);
            return {
              valid: inflated.length === expectedInflatedBytes,
              reason: inflated.length === expectedInflatedBytes ? 'scanlines complete' : 'scanline length mismatch',
              width,
              height,
              bitDepth,
              colorType,
              interlace,
              inflatedBytes: inflated.length,
              expectedInflatedBytes,
            };
          };

          let failed = false;
          for (const [label, path] of assets) {
            const source = fs.readFileSync(path, 'utf8');
            const match = source.match(/data:image\/png;base64,([^'"`\s]+)/);
            if (!match) {
              console.error(`${label}: missing PNG data URI`);
              failed = true;
              continue;
            }

            const payload = match[1].replace(/\s+/g, '');
            const invalid = payload.match(/[^A-Za-z0-9+/=]/g) || [];
            const bytes = Buffer.from(payload, 'base64');
            const canonicalPayload = bytes.toString('base64');
            const canonical = canonicalPayload.replace(/=+$/, '');
            const supplied = payload.replace(/=+$/, '');
            const signatureValid = bytes.length >= 8 && bytes.subarray(0, 8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]));
            const canonicalValid = canonical === supplied;
            const structure = signatureValid ? parsePng(bytes) : { valid: false, chunks: [], offset: 0, remaining: bytes.length, reason: 'bad signature' };
            const chunkNames = structure.chunks.map((chunk) => chunk.type);
            const badCrc = structure.chunks.filter((chunk) => !chunk.crcValid).map((chunk) => chunk.type);
            const pixels = signatureValid ? inspectPixels(bytes, structure) : { valid: false, reason: 'bad signature' };
            console.log(`${label}: length=${payload.length}; mod4=${payload.length % 4}; invalid=${invalid.length}; bytes=${bytes.length}; signature=${signatureValid}; canonical=${canonicalValid}; structure=${structure.valid}; reason=${structure.reason}; offset=${structure.offset}; remaining=${structure.remaining}; chunks=${chunkNames.join(',')}; badCrc=${badCrc.join(',')}; pixels=${pixels.valid}; pixelReason=${pixels.reason}; dimensions=${pixels.width || 0}x${pixels.height || 0}; bitDepth=${pixels.bitDepth ?? ''}; colorType=${pixels.colorType ?? ''}; interlace=${pixels.interlace ?? ''}; inflated=${pixels.inflatedBytes ?? ''}; expected=${pixels.expectedInflatedBytes ?? ''}`);

            const repairableCipmn =
              label === 'CIPMN logo' &&
              signatureValid &&
              pixels.valid &&
              chunkNames.at(-1) === 'IDAT' &&
              structure.remaining > 0 &&
              structure.remaining <= 12 &&
              structure.chunks.filter((chunk) => !chunk.crcValid && chunk.type !== 'IDAT').length === 0;

            if (repairableCipmn) {
              const repairedCore = Buffer.from(bytes.subarray(0, structure.offset));
              for (const chunk of structure.chunks) {
                repairedCore.writeUInt32BE(chunk.actualCrc, chunk.crcOffset);
              }
              const iend = Buffer.from([0x00,0x00,0x00,0x00,0x49,0x45,0x4e,0x44,0xae,0x42,0x60,0x82]);
              const repairedBytes = Buffer.concat([repairedCore, iend]);
              const repairedStructure = parsePng(repairedBytes);
              const repairedPixels = inspectPixels(repairedBytes, repairedStructure);
              if (!repairedStructure.valid || !repairedPixels.valid) {
                throw new Error('CIPMN PNG repair did not produce a fully valid lossless PNG.');
              }

              const repairedPayload = repairedBytes.toString('base64');
              fs.mkdirSync('png-diagnostic', { recursive: true });
              fs.writeFileSync('png-diagnostic/cipmn-logo-repaired.png', repairedBytes);
              fs.writeFileSync(
                'png-diagnostic/cipmnCertificateCipmnLogo.ts',
                `export const CIPMN_CERTIFICATE_LOGO_DATA_URI = 'data:image/png;base64,${repairedPayload}';\n`,
              );
              console.log(`CIPMN logo repair candidate: bytes=${repairedBytes.length}; dimensions=${repairedPixels.width}x${repairedPixels.height}; structure=${repairedStructure.valid}; pixels=${repairedPixels.valid}`);
            }

            if (!signatureValid || !structure.valid || !canonicalValid || !pixels.valid || invalid.length > 0) failed = true;
          }

          if (failed) process.exitCode = 1;
          NODE
      - name: Upload repaired CIPMN logo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-logo-repaired-evidence
          path: png-diagnostic/
          if-no-files-found: ignore
