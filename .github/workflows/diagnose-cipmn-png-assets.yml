name: Diagnose CIPMN PNG assets

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/assets/cipmnCertificateIipmLogo.ts'
      - 'src/assets/cipmnCertificateCipmnLogo.ts'
      - 'src/assets/cipmnCertificateBanitoSignature.ts'
      - '.github/workflows/diagnose-cipmn-png-assets.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate embedded PNG assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assets = [
            ['IIPM logo', 'src/assets/cipmnCertificateIipmLogo.ts'],
            ['CIPMN logo', 'src/assets/cipmnCertificateCipmnLogo.ts'],
            ['Banito signature', 'src/assets/cipmnCertificateBanitoSignature.ts'],
          ];

          const crcTable = Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) {
              value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
            }
            return value >>> 0;
          });

          const crc32 = (buffer) => {
            let crc = 0xffffffff;
            for (const byte of buffer) {
              crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
          };

          const parsePng = (bytes) => {
            let offset = 8;
            const chunks = [];
            let crcValid = true;
            while (offset + 12 <= bytes.length) {
              const length = bytes.readUInt32BE(offset);
              const type = bytes.subarray(offset + 4, offset + 8).toString('ascii');
              const next = offset + 12 + length;
              if (next > bytes.length) {
                return {
                  valid: false,
                  crcValid,
                  chunks,
                  offset,
                  remaining: bytes.length - offset,
                  nextLength: length,
                  nextType: type,
                  reason: `truncated ${type}`,
                };
              }

              const expectedCrc = bytes.readUInt32BE(offset + 8 + length);
              const actualCrc = crc32(bytes.subarray(offset + 4, offset + 8 + length));
              if (expectedCrc !== actualCrc) crcValid = false;
              chunks.push(type);
              offset = next;

              if (type === 'IEND') {
                return {
                  valid: offset === bytes.length && crcValid,
                  crcValid,
                  chunks,
                  offset,
                  remaining: bytes.length - offset,
                  reason: offset === bytes.length ? (crcValid ? 'complete' : 'CRC mismatch') : 'trailing bytes',
                };
              }
            }

            return {
              valid: false,
              crcValid,
              chunks,
              offset,
              remaining: bytes.length - offset,
              reason: 'missing IEND',
            };
          };

          let failed = false;
          for (const [label, path] of assets) {
            const source = fs.readFileSync(path, 'utf8');
            const match = source.match(/data:image\/png;base64,([^'"`\s]+)/);
            if (!match) {
              console.error(`${label}: missing PNG data URI`);
              failed = true;
              continue;
            }

            const payload = match[1].replace(/\s+/g, '');
            const invalid = payload.match(/[^A-Za-z0-9+/=]/g) || [];
            const bytes = Buffer.from(payload, 'base64');
            const canonicalPayload = bytes.toString('base64');
            const canonical = canonicalPayload.replace(/=+$/, '');
            const supplied = payload.replace(/=+$/, '');
            const signatureValid = bytes.length >= 8 && bytes.subarray(0, 8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]));
            const canonicalValid = canonical === supplied;
            const structure = signatureValid ? parsePng(bytes) : { valid: false, crcValid: false, chunks: [], offset: 0, remaining: bytes.length, reason: 'bad signature' };
            const lastChunks = structure.chunks.slice(-6).join(',');
            console.log(`${label}: length=${payload.length}; mod4=${payload.length % 4}; invalid=${invalid.length}; bytes=${bytes.length}; signature=${signatureValid}; canonical=${canonicalValid}; structure=${structure.valid}; crc=${structure.crcValid}; reason=${structure.reason}; offset=${structure.offset}; remaining=${structure.remaining}; chunks=${lastChunks}; nextType=${structure.nextType || ''}; nextLength=${structure.nextLength ?? ''}; tail=${bytes.subarray(-24).toString('hex')}`);

            const repairableCipmn =
              label === 'CIPMN logo' &&
              signatureValid &&
              structure.crcValid &&
              structure.chunks.at(-1) === 'IDAT' &&
              structure.remaining > 0 &&
              structure.remaining <= 12;

            if (repairableCipmn) {
              const iend = Buffer.from([0x00,0x00,0x00,0x00,0x49,0x45,0x4e,0x44,0xae,0x42,0x60,0x82]);
              const repairedBytes = Buffer.concat([bytes.subarray(0, structure.offset), iend]);
              const repairedStructure = parsePng(repairedBytes);
              if (!repairedStructure.valid || !repairedStructure.crcValid) {
                throw new Error('CIPMN PNG repair did not produce a valid lossless PNG.');
              }

              const repairedPayload = repairedBytes.toString('base64');
              fs.mkdirSync('png-diagnostic', { recursive: true });
              fs.writeFileSync('png-diagnostic/cipmn-logo-repaired.png', repairedBytes);
              fs.writeFileSync(
                'png-diagnostic/cipmnCertificateCipmnLogo.ts',
                `export const CIPMN_CERTIFICATE_LOGO_DATA_URI = 'data:image/png;base64,${repairedPayload}';\n`,
              );
              console.log(`CIPMN logo repair candidate: bytes=${repairedBytes.length}; structure=${repairedStructure.valid}; crc=${repairedStructure.crcValid}`);
            }

            if (!signatureValid || !structure.valid || !canonicalValid || invalid.length > 0) failed = true;
          }

          if (failed) process.exitCode = 1;
          NODE
      - name: Upload repaired CIPMN logo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-logo-repaired-evidence
          path: png-diagnostic/
          if-no-files-found: ignore
