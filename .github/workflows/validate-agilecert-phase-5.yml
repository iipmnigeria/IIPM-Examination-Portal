name: Validate AgileCert Phase 5

on:
  push:
    branches: [phase-5-identity-assurance-professional-certificate]
    paths:
      - 'src/**'
      - 'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql'
      - 'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql'
      - 'supabase/functions/initialize-certificate-payment/**'
      - 'docs/AGILECERT_PHASE_5_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-5.yml'
      - '.github/workflows/validate-agilecert-phase-4.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'src/**'
      - 'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql'
      - 'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql'
      - 'supabase/functions/initialize-certificate-payment/**'
      - 'docs/AGILECERT_PHASE_5_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-5.yml'
      - '.github/workflows/validate-agilecert-phase-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 5 identity assurance and professional credential controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify browser output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Identity Assurance'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Identity Review'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Credential Store'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check certificate payment initializer
        run: deno check --node-modules-dir=auto supabase/functions/initialize-certificate-payment/index.ts

      - name: Confirm exact Phase 5 backend scope
        shell: bash
        run: |
          set -euo pipefail
          migrations="$(git diff --name-only origin/supabase-integration...HEAD | grep '^supabase/migrations/' | sort || true)"
          expected="$(printf '%s\n' \
            'supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql' \
            'supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql' | sort)"
          test "$migrations" = "$expected"
          functions="$(git diff --name-only origin/supabase-integration...HEAD | grep '^supabase/functions/' || true)"
          test "$functions" = 'supabase/functions/initialize-certificate-payment/index.ts'

      - name: Confirm identity assurance authority and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          sql = '\n'.join([
              Path('supabase/migrations/202607250101_phase_5_identity_assurance_professional_certificate.sql').read_text(),
              Path('supabase/migrations/202607250102_phase_5_identity_assurance_hardening.sql').read_text(),
          ])
          required = [
              'agilecert_identity_verifications',
              'agilecert_identity_verification_audits',
              'agilecert-identity-evidence',
              'get_my_agilecert_identity_assurance',
              'submit_my_agilecert_identity_assurance',
              'withdraw_my_agilecert_identity_assurance',
              'get_agilecert_identity_assurance_admin_console',
              'review_agilecert_identity_assurance',
              'create_agilecert_professional_certificate_order',
              'agilecert_issue_identity_verified_certificate_for_order',
              'agilecert_guard_and_invalidate_identity_on_profile_change',
              'manual_iipm_review',
              "status = 'approved'",
              "approval_expires_at > now()",
              'allowed_mime_types',
              'file_size_limit',
              'storage.foldername(name)',
              'public = false',
              'Professional Certificate issuance requires the same active approved IIPM identity-assurance record used at checkout',
              'governmentIdProhibited',
              'biometricsProhibited',
              'active Professional Certificate payment',
              'identityVerificationId',
              'set search_path to public, extensions',
          ]
          missing = [item for item in required if item not in sql]
          assert not missing, f'Missing Phase 5 authority controls: {missing}'

          prohibited_implementation = [
              r'create\s+(?:table|function).*face[_ -]?match',
              r'create\s+(?:table|function).*facial[_ -]?recognition',
              r'create\s+(?:table|function).*fingerprint',
              r'create\s+(?:table|function).*voiceprint',
              r'create\s+(?:table|function).*biometric[_ -]?template',
              r'create\s+(?:table|function).*identity[_ -]?provider',
              r'government[_ -]?id[_ -]?number\s+text',
          ]
          found = [pattern for pattern in prohibited_implementation if re.search(pattern, sql, re.I | re.S)]
          assert not found, f'Prohibited identity implementation found: {found}'
          PY

      - name: Confirm candidate and administrator workspaces
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [
              'src/services/identityAssuranceService.ts',
              'src/services/certificateCommerceService.ts',
              'src/components/CandidateIdentityAssurance.tsx',
              'src/components/AdminIdentityAssuranceLauncher.tsx',
              'src/main.tsx',
          ]
          code = '\n'.join(Path(path).read_text() for path in files)
          required = [
              'get_my_agilecert_identity_assurance',
              'submit_my_agilecert_identity_assurance',
              'withdraw_my_agilecert_identity_assurance',
              'get_agilecert_identity_assurance_admin_console',
              'review_agilecert_identity_assurance',
              'agilecert-identity-evidence',
              'Professional Certificate checkout unlocked',
              'Privacy restriction',
              'Reviewer privacy obligation',
              'Identity Assurance',
              'Identity Review',
              'professionalCheckoutUnlocked',
              'CandidateIdentityAssurance',
              'AdminIdentityAssuranceLauncher',
          ]
          missing = [item for item in required if item not in code]
          assert not missing, f'Missing Phase 5 frontend controls: {missing}'
          assert 'passport' in code.lower()
          assert 'selfies' in code.lower()
          assert 'biometric' in code.lower()
          PY

      - name: Confirm Professional Certificate server enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          edge = Path('supabase/functions/initialize-certificate-payment/index.ts').read_text()
          payment_helper = Path('supabase/functions/_shared/agilecertCertificatePaystack.ts').read_text()
          required = [
              "productCode === 'professional'",
              'create_agilecert_professional_certificate_order',
              'create_agilecert_certificate_order',
              'identityAssuranceRequired',
              'requireAuthenticatedUser',
          ]
          missing = [item for item in required if item not in edge]
          assert not missing, f'Missing professional payment enforcement: {missing}'
          assert 'AGILECERT_PAYSTACK_SECRET_KEY' in payment_helper
          assert "Deno.env.get('PAYSTACK_SECRET_KEY')" not in edge
          assert "Deno.env.get('PAYSTACK_SECRET_KEY')" not in payment_helper
          PY

      - name: Confirm existing application boundaries remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/supabase-integration...HEAD)"
          forbidden='^src/services/(commerceService|examService|preparationMaterialService|materialAdminService)\.ts$|^src/components/(CandidateCommerceOverlay|PaymentReturnHandler|AdminCommerceConsole|ExamScreen|StudentDashboard|AdminPortal|CandidatePreparationMaterialsPanel|AdminMaterialManagementPanel)\.tsx$|^supabase/functions/(initialize-exam-payment|verify-exam-payment|paystack-webhook|verify-certificate-payment|paystack-certificate-webhook)/|^supabase/functions/_shared/(paystack|agilecertCertificatePaystack)\.ts$'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Confirm Phase 5 scope document
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          scope = Path('docs/AGILECERT_PHASE_5_SCOPE.md').read_text()
          required = [
              'Identity Assurance and Professional Certificate Enablement',
              'manual and privacy-bounded',
              'private Supabase Storage bucket',
              'Professional Certificate checkout becomes available only',
              '202607250101_phase_5_identity_assurance_professional_certificate.sql',
              '202607250102_phase_5_identity_assurance_hardening.sql',
              'active Professional Certificate payment',
              'same approved identity-assurance record captured on the order',
              'Supabase extensions schema',
              'government-ID collection',
              'selfie capture',
              'facial comparison',
              'third-party KYC',
              'No Phase 5 merge or deployment may occur without separate explicit approval',
          ]
          missing = [item for item in required if item not in scope]
          assert not missing, f'Missing Phase 5 scope controls: {missing}'
          PY
