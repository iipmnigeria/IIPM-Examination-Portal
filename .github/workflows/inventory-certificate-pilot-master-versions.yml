name: Inventory Certificate Pilot Master Versions

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/inventory-certificate-pilot-master-versions.txt'

permissions:
  contents: read

concurrency:
  group: inventory-certificate-pilot-master-versions
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory published render-ready master versions
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: '0e42b3ea39835f897e04c13aece5ec08c3d7c56d'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - name: Verify exact approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          grep -q 'certificate_admin_assign_template' \
            supabase/migrations/202608011300_certificate_master_console_phase1a.sql

      - name: Query published master versions and matching examinations
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with master_base as (
            select
              template.id as template_id,
              template.code as template_code,
              template.name as template_name,
              template.status as template_status,
              template.current_version_id,
              category.id as category_id,
              category.code as category_code,
              category.name as category_name,
              institution.id as institution_id,
              institution.code as institution_code,
              institution.name as institution_name,
              version.id as version_id,
              version.version_number,
              version.status as version_status,
              version.quality_status,
              version.source_format,
              version.sha256 as source_sha256,
              version.storage_bucket,
              version.storage_path,
              coalesce(version.overlay_schema, '[]'::jsonb) as overlay_schema,
              public.certificate_designer_validate_overlay(
                version.id,
                coalesce(version.overlay_schema, '[]'::jsonb)
              ) as overlay_report
            from public.agilecert_certificate_master_versions version
            join public.agilecert_certificate_master_templates template
              on template.id = version.template_id
            join public.agilecert_certificate_categories category
              on category.id = template.category_id
            join public.agilecert_certificate_institutions institution
              on institution.id = template.institution_id
          ), assessed as (
            select
              master.*,
              coalesce((master.overlay_report->>'valid')::boolean, false)
                as overlay_valid,
              (
                select count(distinct element->>'assetId')
                from jsonb_array_elements(master.overlay_schema) element
                where nullif(element->>'assetId', '') is not null
              ) as referenced_assets,
              (
                select count(distinct asset.id)
                from jsonb_array_elements(master.overlay_schema) element
                join public.agilecert_certificate_assets asset
                  on asset.id = case
                    when (element->>'assetId') ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
                    then (element->>'assetId')::uuid
                    else null
                  end
                 and asset.institution_id = master.institution_id
                where nullif(element->>'assetId', '') is not null
                  and asset.status = 'approved'
                  and asset.sha256 is not null
                  and asset.mime_type in ('image/png', 'image/jpeg')
              ) as ready_assets
            from master_base master
          ), ready_masters as (
            select
              assessed.*,
              (
                assessed.template_status = 'published'
                and assessed.version_status = 'published'
                and assessed.quality_status in ('passed', 'waived')
                and assessed.source_format in ('pdf', 'png', 'jpeg')
                and assessed.source_sha256 is not null
                and assessed.storage_bucket = 'certificate-masters'
                and nullif(assessed.storage_path, '') is not null
                and assessed.overlay_valid
                and assessed.referenced_assets = assessed.ready_assets
              ) as render_ready
            from assessed
          ), certificate_population as (
            select
              certificate.examination_id,
              examination.title as examination_title,
              examination.programme_id,
              programme.code as programme_code,
              programme.name as programme_name,
              lower(coalesce(
                nullif(certificate.metadata->>'certificateCategoryCode', ''),
                case
                  when lower(certificate.certificate_title) like '%completion%'
                    then 'completion'
                  when lower(coalesce(certificate.metadata->>'productCode', '')) = 'professional'
                    then 'professional'
                  else 'achievement'
                end
              )) as category_code,
              count(*) as total_certificates,
              count(*) filter (where certificate.status = 'active')
                as active_certificates
            from public.agilecert_issued_certificates certificate
            join public.examinations examination
              on examination.id = certificate.examination_id
            left join public.programmes programme
              on programme.id = examination.programme_id
            group by
              certificate.examination_id,
              examination.title,
              examination.programme_id,
              programme.code,
              programme.name,
              lower(coalesce(
                nullif(certificate.metadata->>'certificateCategoryCode', ''),
                case
                  when lower(certificate.certificate_title) like '%completion%'
                    then 'completion'
                  when lower(coalesce(certificate.metadata->>'productCode', '')) = 'professional'
                    then 'professional'
                  else 'achievement'
                end
              ))
          ), recommended as (
            select
              master.*,
              population.examination_id,
              population.examination_title,
              population.programme_id,
              population.programme_code,
              population.programme_name,
              population.active_certificates,
              population.total_certificates
            from ready_masters master
            join certificate_population population
              on population.category_code = lower(master.category_code)
             and population.active_certificates > 0
            where master.render_ready
            order by
              population.active_certificates,
              population.total_certificates,
              case when master.current_version_id = master.version_id then 0 else 1 end,
              master.version_number desc,
              master.template_code,
              population.examination_title
            limit 1
          )
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '202608012200'
            ),
            'templates', (
              select count(*) from public.agilecert_certificate_master_templates
            ),
            'versions', (
              select count(*) from public.agilecert_certificate_master_versions
            ),
            'publishedVersions', (
              select count(*) from ready_masters
              where version_status = 'published'
            ),
            'renderReadyVersions', (
              select count(*) from ready_masters where render_ready
            ),
            'assignments', (
              select count(*) from public.agilecert_certificate_master_assignments
            ),
            'rendererEnabledAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
              where renderer_enabled
            ),
            'recommendedPilot', (
              select jsonb_build_object(
                'templateId', template_id,
                'templateCode', template_code,
                'templateName', template_name,
                'versionId', version_id,
                'versionNumber', version_number,
                'categoryId', category_id,
                'categoryCode', category_code,
                'categoryName', category_name,
                'institutionId', institution_id,
                'institutionCode', institution_code,
                'institutionName', institution_name,
                'sourceFormat', source_format,
                'qualityStatus', quality_status,
                'overlayValid', overlay_valid,
                'referencedAssets', referenced_assets,
                'readyAssets', ready_assets,
                'examinationId', examination_id,
                'examinationTitle', examination_title,
                'programmeId', programme_id,
                'programmeCode', programme_code,
                'programmeName', programme_name,
                'activeCertificates', active_certificates,
                'totalCertificates', total_certificates,
                'scopeType', 'examination'
              )
              from recommended
            ),
            'masterInventory', coalesce((
              select jsonb_agg(jsonb_build_object(
                'templateId', template_id,
                'templateCode', template_code,
                'templateName', template_name,
                'templateStatus', template_status,
                'versionId', version_id,
                'versionNumber', version_number,
                'isCurrentVersion', current_version_id = version_id,
                'versionStatus', version_status,
                'qualityStatus', quality_status,
                'categoryCode', category_code,
                'institutionCode', institution_code,
                'sourceFormat', source_format,
                'hasSourceDigest', source_sha256 is not null,
                'overlayValid', overlay_valid,
                'referencedAssets', referenced_assets,
                'readyAssets', ready_assets,
                'renderReady', render_ready
              ) order by template_code, version_number desc)
              from ready_masters
            ), '[]'::jsonb),
            'matchingCertificatePopulations', coalesce((
              select jsonb_agg(jsonb_build_object(
                'examinationId', population.examination_id,
                'examinationTitle', population.examination_title,
                'programmeCode', population.programme_code,
                'programmeName', population.programme_name,
                'categoryCode', population.category_code,
                'activeCertificates', population.active_certificates,
                'totalCertificates', population.total_certificates
              ) order by population.active_certificates, population.examination_title)
              from certificate_population population
              where exists (
                select 1 from ready_masters master
                where master.render_ready
                  and lower(master.category_code) = population.category_code
              )
            ), '[]'::jsonb)
          ) as inventory;
          """
          Path('/tmp/master-version-inventory-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          status=$(curl --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/master-version-inventory-query.json \
            -o master-version-inventory-response.json \
            -w '%{http_code}')
          case "$status" in
            2??) ;;
            *) cat master-version-inventory-response.json; exit 1 ;;
          esac

      - name: Validate and sanitize inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('master-version-inventory-response.json').read_text())
          assert isinstance(raw, list) and len(raw) == 1, raw
          inventory = raw[0].get('inventory') or {}
          assert inventory.get('migrationApplied') is True, inventory
          assert inventory.get('assignments') == 0, inventory
          assert inventory.get('rendererEnabledAssignments') == 0, inventory

          recommendation = inventory.get('recommendedPilot')
          result = {
              'status': 'READY_TO_PROVISION' if recommendation else 'NO_RENDER_READY_MATCH',
              'productionSourceCommit': '0e42b3ea39835f897e04c13aece5ec08c3d7c56d',
              **inventory,
          }
          Path('certificate-pilot-master-version-inventory.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )

          lines = [
              '# Certificate Pilot Master Version Inventory',
              '',
              f"Status: **{result['status']}**",
              f"Templates: **{inventory.get('templates', 0)}**",
              f"Versions: **{inventory.get('versions', 0)}**",
              f"Published versions: **{inventory.get('publishedVersions', 0)}**",
              f"Render-ready versions: **{inventory.get('renderReadyVersions', 0)}**",
          ]
          if recommendation:
              lines += [
                  '',
                  '## Recommended isolated assignment',
                  f"- Examination: `{recommendation.get('examinationId')}` — {recommendation.get('examinationTitle')}",
                  f"- Programme: `{recommendation.get('programmeCode')}` — {recommendation.get('programmeName')}",
                  f"- Institution: `{recommendation.get('institutionCode')}` — {recommendation.get('institutionName')}",
                  f"- Category: `{recommendation.get('categoryCode')}` — {recommendation.get('categoryName')}",
                  f"- Template: `{recommendation.get('templateCode')}` — {recommendation.get('templateName')}",
                  f"- Version: {recommendation.get('versionNumber')} ({recommendation.get('sourceFormat')}, {recommendation.get('qualityStatus')})",
                  f"- Matching active certificates: {recommendation.get('activeCertificates')}",
              ]
          Path('certificate-pilot-master-version-inventory.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload sanitized inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: certificate-pilot-master-version-inventory
          retention-days: 30
          if-no-files-found: error
          path: |
            certificate-pilot-master-version-inventory.json
            certificate-pilot-master-version-inventory.md
