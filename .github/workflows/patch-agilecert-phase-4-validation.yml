name: Patch AgileCert Phase 4 Validation

on:
  push:
    branches:
      - phase-4-certificate-payment-credential-issuance
    paths:
      - '.github/workflows/patch-agilecert-phase-4-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-certificate-payment-credential-issuance
      - name: Narrow identity exclusion regex
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-agilecert-phase-4.yml')
          text = path.read_text()
          old = """          forbidden = [
              r'create\\s+table.*identity_verification',
              r'create\\s+or\\s+replace\\s+function.*identity_provider',
              r'create\\s+table.*automation_job',
              r'create\\s+or\\s+replace\\s+function.*ai_adviser',
              r'create\\s+table.*email_delivery',
          ]"""
          new = """          forbidden = [
              r'create\\s+table\\s+(?:if\\s+not\\s+exists\\s+)?public\\.agilecert_identity_verification',
              r'create\\s+or\\s+replace\\s+function\\s+public\\.agilecert_identity_provider',
              r'create\\s+table\\s+(?:if\\s+not\\s+exists\\s+)?public\\.agilecert_automation_job',
              r'create\\s+or\\s+replace\\s+function\\s+public\\.agilecert_ai_adviser',
              r'create\\s+table\\s+(?:if\\s+not\\s+exists\\s+)?public\\.agilecert_email_delivery',
          ]"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one exact exclusion block, found {count}.')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-agilecert-phase-4.yml
          git commit -m 'Narrow Phase 4 identity exclusion assertion'
          git push origin HEAD:phase-4-certificate-payment-credential-issuance
