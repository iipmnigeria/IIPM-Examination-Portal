name: Fix CIPMN Cart Card Selector

on:
  push:
    branches: [feature/cipmn-cart-card-buttons-auto-quote]
    paths:
      - '.github/workflows/fix-cipmn-cart-card-selector.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Patch, build and commit stable card selector
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cipmn-cart-card-buttons-auto-quote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch examination-card selector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/components/CandidateCipmnModuleCart.tsx')
          source = path.read_text(encoding='utf-8')
          old = """        const card = document.getElementById(`exam-card-${test.id}`);
                  const launchButton = card?.querySelector<HTMLButtonElement>('button');
                  const actionArea = launchButton?.parentElement;
                  if (!actionArea || !launchButton) return;
          """
          new = """        const card = document.getElementById(`exam-card-${test.id}`);
                  const launchButton = Array.from(card?.querySelectorAll<HTMLButtonElement>('button') || []).find(
                    (button) => !button.closest('[data-agilecert-cipmn-card-cart-mount]'),
                  );
                  const actionArea = launchButton?.parentElement;
                  if (!actionArea || !launchButton) return;
          """
          if old not in source:
              raise SystemExit('Expected examination-card selector was not found.')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          grep -q "button.closest('\[data-agilecert-cipmn-card-cart-mount\]')" src/components/CandidateCipmnModuleCart.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production portal
        run: npm run build
      - name: Commit selector fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CandidateCipmnModuleCart.tsx
          git diff --cached --check
          git commit -m 'Stabilise CIPMN examination card cart controls'
          git push origin HEAD:feature/cipmn-cart-card-buttons-auto-quote
