name: Patch Phase 5 Feature Exam Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/patch-phase5-feature-exam-integration.txt'

permissions:
  contents: write

concurrency:
  group: patch-phase5-feature-exam-integration
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-advanced-identity-proctoring
          fetch-depth: 0

      - name: Apply idempotent integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace("import ExamScreen from './components/ExamScreen';", "import ExamExperience from './components/ExamExperience';")
          text = text.replace('<ExamScreen\n', '<ExamExperience\n')
          if "import ExamExperience from './components/ExamExperience';" not in text or '<ExamExperience\n' not in text:
              raise SystemExit('App integration markers were not applied.')
          app.write_text(text)

          exam = Path('src/components/ExamScreen.tsx')
          text = exam.read_text()
          anchor = """    const newLog: ProctorLogEvent = {
      id: `log_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
      timestamp: new Date().toISOString(),
      type,
      severity,
      message,
      snapshotUrl
    };

    setProctorLogs((prev) => {"""
          replacement = """    const newLog: ProctorLogEvent = {
      id: `log_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
      timestamp: new Date().toISOString(),
      type,
      severity,
      message,
      snapshotUrl
    };

    window.dispatchEvent(new CustomEvent('agilecert-proctor-event', {
      detail: {
        id: newLog.id,
        timestamp: newLog.timestamp,
        type: newLog.type,
        severity: newLog.severity,
        message: newLog.message,
        aiGenerated: Boolean(snapshotUrl),
      },
    }));

    setProctorLogs((prev) => {"""
          if "window.dispatchEvent(new CustomEvent('agilecert-proctor-event'" not in text:
              if anchor not in text:
                  raise SystemExit('ExamScreen proctor-log anchor was not found.')
              text = text.replace(anchor, replacement, 1)
          exam.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate TypeScript and production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -q 'Identity & Exam Integrity Workspace' dist/assets
          grep -R -q 'Identity, Proctoring & Misconduct Administration' dist/assets
          grep -R -q 'Questions remain protected' dist/assets
          grep -R -q 'agilecert-proctor-event' dist/assets

      - name: Commit only validated Phase 5 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/ExamScreen.tsx
          if git diff --cached --quiet; then
            echo 'Phase 5 exam integration already applied.'
          else
            git commit -m 'Integrate Phase 5 secure examination preflight and live events'
            git push origin HEAD:phase-5-advanced-identity-proctoring
          fi
