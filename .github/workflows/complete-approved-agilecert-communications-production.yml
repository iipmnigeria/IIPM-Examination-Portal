name: Complete Approved AgileCert Communications Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/complete-communications.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: complete-approved-agilecert-communications-production
  cancel-in-progress: false

env:
  EXPECTED_COMMIT: '00ff074d2143dfef66e92a4903f670d20f8b9411'
  PROJECT_REF: 'cfecicvugfrrhcvhduzc'

jobs:
  database-and-function:
    name: Verify applied communications schema and deploy function
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact approved communications source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact source and release files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -s supabase/migrations/202607271200_communications_automation.sql
          test -s supabase/migrations/202607271201_communications_conversion_tracking.sql
          test -s supabase/migrations/202607271202_communications_conversion_trigger.sql
          test -s supabase/functions/agilecert-communications/index.ts

      - name: Isolate pre-tracking legacy migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agilecert-legacy-migrations
          python3 <<'PY'
          from pathlib import Path
          import shutil
          boundary = 202607230101
          for path in Path('supabase/migrations').glob('*.sql'):
              prefix = path.name.split('_', 1)[0]
              if prefix.isdigit() and int(prefix) < boundary:
                  shutil.move(str(path), f'/tmp/agilecert-legacy-migrations/{path.name}')
          PY

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm communications migrations are already applied
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee communications-completion-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' communications-completion-dry-run.log \
            | sort -u > communications-completion-pending.txt || true
          test ! -s communications-completion-pending.txt
          grep -q 'Remote database is up to date' communications-completion-dry-run.log

      - name: Verify live communications schema and disabled provider default
        shell: bash
        run: |
          set -o pipefail
          supabase db dump --linked --schema public --file communications-completion-schema.sql \
            2>&1 | tee communications-completion-schema-dump.log
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          schema = Path('communications-completion-schema.sql').read_text(encoding='utf-8', errors='ignore')
          required = [
              'agilecert_communication_settings', 'agilecert_communication_preferences',
              'agilecert_communication_outbox', 'agilecert_communication_events',
              'agilecert_communication_suppressions',
              'refresh_agilecert_communication_outbox',
              'claim_agilecert_communication_outbox',
              'complete_agilecert_communication_delivery',
              'record_agilecert_communication_provider_event',
              'record_agilecert_communication_conversions',
          ]
          missing = [item for item in required if item not in schema]
          assert not missing, f'Production communications schema markers missing: {missing}'
          assert '"provider_enabled" boolean DEFAULT false NOT NULL' in schema
          evidence = {
              'sourceCommit': os.environ['EXPECTED_COMMIT'],
              'projectRef': os.environ['PROJECT_REF'],
              'migrationsAlreadyApplied': [202607271200, 202607271201, 202607271202],
              'providerEnabledByDefault': False,
              'outboundMessagesSentByDeployment': 0,
              'schemaVerified': True,
          }
          Path('communications-completion-safe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Deploy only the approved communications Edge Function
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy agilecert-communications --project-ref "$PROJECT_REF" \
            2>&1 | tee communications-completion-function-deploy.log
          supabase functions list --project-ref "$PROJECT_REF" \
            2>&1 | tee communications-completion-function-list.log
          grep -q 'agilecert-communications' communications-completion-function-list.log

      - name: Confirm worker boundary without sending email
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o communications-completion-auth-response.json -w '%{http_code}' \
            -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-communications" \
            -H 'Content-Type: application/json' \
            --data '{"action":"scan-and-send"}')"
          test "$status" = '401'

      - name: Upload sanitized completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-production-completion-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-completion-dry-run.log
            communications-completion-pending.txt
            communications-completion-schema-dump.log
            communications-completion-schema.sql
            communications-completion-safe.json
            communications-completion-function-deploy.log
            communications-completion-function-list.log
            communications-completion-auth-response.json

  pages:
    name: Reconfirm exact compiled communications Pages deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconfirm exact Pages run and live markers
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=supabase-integration&per_page=50" \
            > communications-completion-pages-runs.json
          run_id="$(jq -r --arg sha "$EXPECTED_COMMIT" '.workflow_runs[] | select(.head_sha == $sha and .name == "Deploy AgileCert Compiled Pages" and .conclusion == "success") | .id' communications-completion-pages-runs.json | head -n 1)"
          test -n "$run_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > communications-completion-pages-artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name == "agilecert-pages-live-verification" and (.expired | not)) | .id' communications-completion-pages-artifacts.json | head -n 1)"
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > communications-completion-pages.zip
          mkdir -p communications-completion-pages
          unzip -q communications-completion-pages.zip -d communications-completion-pages
          live_js="$(find communications-completion-pages -type f -name 'live-app.js' | head -n 1)"
          test -s "$live_js"
          grep -q 'Email Preferences' "$live_js"
          grep -q 'Communications Automation' "$live_js"
          printf '%s' "$run_id" > communications-completion-pages-run-id.txt

      - name: Upload Pages completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-production-pages-completion-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-completion-pages-run-id.txt
            communications-completion-pages-runs.json
            communications-completion-pages-artifacts.json
