name: Materialize Certificate Server Rendering Phase 1C

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/materialize-certificate-server-rendering-phase1c.txt'

permissions:
  contents: write

concurrency:
  group: materialize-certificate-server-rendering-phase1c
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize checksummed Phase 1C source
        shell: bash
        run: |
          set -euo pipefail
          cat deployment-triggers/phase1c-hex-payload/part-* > /tmp/certificate-server-rendering-phase1c.hex
          python3 <<'PY'
          from pathlib import Path
          encoded = Path('/tmp/certificate-server-rendering-phase1c.hex').read_text().strip()
          Path('/tmp/certificate-server-rendering-phase1c.tar.gz').write_bytes(bytes.fromhex(encoded))
          PY
          echo '7203bcce893de25f4ab2374caca8645888b8dee64360d8b4571812b69ff650d5  /tmp/certificate-server-rendering-phase1c.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/certificate-server-rendering-phase1c.tar.gz
          rm -rf deployment-triggers/phase1c-payload deployment-triggers/phase1c-hex-payload
          rm -f deployment-triggers/materialize-certificate-server-rendering-phase1c.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build Certificate Server Rendering Phase 1C'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
