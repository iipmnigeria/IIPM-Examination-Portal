name: Verify Live CIPMN Card Actions

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-cipmn-card-actions-live-final.yml

permissions:
  contents: read

jobs:
  verify-live-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the current live Pages bundle for the final card-action markers
        shell: bash
        run: |
          set -euo pipefail
          portal='https://iipmnigeria.github.io/IIPM-Examination-Portal/'
          html="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${portal}?card-actions-verify=${GITHUB_RUN_ID}" || true)"
          echo "HTML bytes: ${#html}"
          asset="$(printf '%s' "$html" | grep -oE '/IIPM-Examination-Portal/assets/index-[^"[:space:]]+\.js' | head -n 1 || true)"
          echo "Live asset: ${asset:-none}"

          if [[ -z "$asset" ]]; then
            printf '%s' "$html" | head -c 500
            echo
            exit 1
          fi

          bundle="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "https://iipmnigeria.github.io${asset}?card-actions-verify=${GITHUB_RUN_ID}" || true)"
          echo "Bundle bytes: ${#bundle}"
          primary_marker=0
          payment_marker=0
          cart_marker=0
          printf '%s' "$bundle" | grep -q 'agilecertCipmnPrimaryAction' && primary_marker=1 || true
          printf '%s' "$bundle" | grep -q 'Pay and Unlock' && payment_marker=1 || true
          printf '%s' "$bundle" | grep -q 'agilecertCipmnCardCartMount' && cart_marker=1 || true
          echo "Markers: primary=${primary_marker} payment=${payment_marker} cart=${cart_marker}"

          [[ "$primary_marker" == '1' && "$payment_marker" == '1' && "$cart_marker" == '1' ]]
