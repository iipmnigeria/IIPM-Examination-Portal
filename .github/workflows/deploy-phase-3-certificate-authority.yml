name: Deploy Phase 3 Certificate Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-3-certificate-production.txt'

permissions:
  contents: read

concurrency:
  group: phase-3-certificate-authority-production
  cancel-in-progress: false

jobs:
  deploy-certificate-authority:
    name: Apply approved Phase 3 certificate authority migration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'dc98a784029ab1d08fe6e6a672983d169aece476'
      CERTIFICATE_VERSION: '202607240104'
      CERTIFICATE_FILE: supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql
      SUPABASE_WORKDIR: /tmp/agilecert-phase-3-production

    steps:
      - name: Checkout exact approved application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate exact controlled input
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$CERTIFICATE_FILE"
          python3 <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql').read_text()
          required = [
              'agilecert_certificate_policies',
              'agilecert_certificate_eligibility_records',
              'agilecert_issued_certificates',
              'evaluate_agilecert_certificate_eligibility',
              'request_my_agilecert_certificate',
              'issue_agilecert_certificate',
              'set_agilecert_certificate_status',
              'verify_agilecert_certificate',
              'get_my_agilecert_certificate_workspace',
              'get_agilecert_certificate_admin_console',
              'reconcile_agilecert_certificate_eligibilities',
              "p.role in ('exam_admin', 'super_admin')",
              "status in ('active', 'suspended', 'revoked')",
          ]
          missing = [marker for marker in required if marker not in migration]
          if missing:
              raise SystemExit(f'Missing Phase 3 controls: {missing}')
          forbidden = re.compile(r'(paystack|certificate_order|identity_verification|digital_badge|linkedin|ai_adviser)', re.I)
          if forbidden.search(migration):
              raise SystemExit('Excluded later-phase content detected.')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare isolated migration workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          cp supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240102_phase_2_3b_material_admin_tools.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$CERTIFICATE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Link production Supabase
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply only Phase 3
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set +e
          output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/phase-3-production-dry-run.log"
          test "$status" -eq 0
          if printf '%s\n' "$output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 3 migration is already applied.'
          else
            pending="$(printf '%s\n' "$output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            test "$pending" = "$(basename "$CERTIFICATE_FILE")"
            npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Verify migration history
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/phase-3-production-migration-history.log"
          npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history"
          python3 - "$history" <<'PY'
          from pathlib import Path
          import sys

          expected = ['202607230101','202607230102','202607240101','202607240102','202607240103','202607240104']
          rows = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              if '|' in line:
                  parts = [p.strip().strip('`') for p in line.split('|')]
                  if len(parts) >= 3:
                      rows.append(parts)
          for version in expected:
              if not any(row[0] == version and row[1] == version for row in rows):
                  raise SystemExit(f'Migration {version} is not recorded locally and remotely.')
          PY

      - name: Verify deployed public schema
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/phase-3-public-schema.sql"
          npx --yes supabase@latest db dump --linked --schema public --file "$schema" --password "$SUPABASE_DB_PASSWORD"
          test -s "$schema"
          for marker in \
            agilecert_certificate_policies \
            agilecert_certificate_eligibility_records \
            agilecert_issued_certificates \
            evaluate_agilecert_certificate_eligibility \
            request_my_agilecert_certificate \
            issue_agilecert_certificate \
            set_agilecert_certificate_status \
            verify_agilecert_certificate \
            get_my_agilecert_certificate_workspace \
            get_agilecert_certificate_admin_console \
            reconcile_agilecert_certificate_eligibilities \
            agilecert_certificate_eligibility_attempt_trigger; do
            grep -q "$marker" "$schema"
          done

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-certificate-production-deployment-evidence
          path: |
            ${{ runner.temp }}/phase-3-production-dry-run.log
            ${{ runner.temp }}/phase-3-production-migration-history.log
            ${{ runner.temp }}/phase-3-public-schema.sql
          if-no-files-found: warn
          retention-days: 3
