name: Deploy Phase 3 Certificate Authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-3-certificate-production.txt'

permissions:
  contents: read

concurrency:
  group: phase-3-certificate-authority-production
  cancel-in-progress: false

jobs:
  deploy-certificate-authority:
    name: Apply approved Phase 3 certificate authority migration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'dc98a784029ab1d08fe6e6a672983d169aece476'
      PROFILE_VERSION: '202607230101'
      PHOTO_VERSION: '202607230102'
      ENTITLEMENT_VERSION: '202607240101'
      ADMIN_VERSION: '202607240102'
      DELIVERY_VERSION: '202607240103'
      CERTIFICATE_VERSION: '202607240104'
      PROFILE_FILE: supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql
      PHOTO_FILE: supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql
      ENTITLEMENT_FILE: supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql
      ADMIN_FILE: supabase/migrations/202607240102_phase_2_3b_material_admin_tools.sql
      DELIVERY_FILE: supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql
      CERTIFICATE_FILE: supabase/migrations/202607240104_phase_3_certificate_eligibility_issuance_verification.sql
      SUPABASE_WORKDIR: /tmp/agilecert-phase-3-production

    steps:
      - name: Checkout exact approved application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate controlled deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          required_files = [
              os.environ['PROFILE_FILE'],
              os.environ['PHOTO_FILE'],
              os.environ['ENTITLEMENT_FILE'],
              os.environ['ADMIN_FILE'],
              os.environ['DELIVERY_FILE'],
              os.environ['CERTIFICATE_FILE'],
          ]
          for file_name in required_files:
              path = Path(file_name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Required deployment input is missing: {file_name}')

          if os.environ['CERTIFICATE_VERSION'] != '202607240104':
              raise SystemExit('Unexpected Phase 3 migration version.')

          migration = Path(os.environ['CERTIFICATE_FILE']).read_text()
          required = [
              'agilecert_certificate_policies',
              'agilecert_certificate_eligibility_records',
              'agilecert_issued_certificates',
              'evaluate_agilecert_certificate_eligibility',
              'request_my_agilecert_certificate',
              'issue_agilecert_certificate',
              'set_agilecert_certificate_status',
              'verify_agilecert_certificate',
              'get_my_agilecert_certificate_workspace',
              'get_agilecert_certificate_admin_console',
              'reconcile_agilecert_certificate_eligibility',
              "p.role in ('exam_admin', 'super_admin')",
              "status in ('active', 'suspended', 'revoked')",
          ]
          missing = [value for value in required if value not in migration]
          if missing:
              raise SystemExit(f'Missing Phase 3 migration controls: {missing}')
          forbidden = re.compile(r'(paystack|certificate_order|identity_verification|digital_badge|linkedin|ai_adviser)', re.I)
          if forbidden.search(migration):
              raise SystemExit('The approved Phase 3 migration contains an excluded later-phase feature.')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare isolated migration-history workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SUPABASE_WORKDIR/supabase/config.toml"
          cp "$PROFILE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$PHOTO_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$ENTITLEMENT_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$ADMIN_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$DELIVERY_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          cp "$CERTIFICATE_FILE" "$SUPABASE_WORKDIR/supabase/migrations/"
          test "$(find "$SUPABASE_WORKDIR/supabase/migrations" -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Link isolated workspace to production Supabase
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview and apply exactly Phase 3
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set +e
          dry_run_output="$(npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1)"
          dry_run_status=$?
          set -e
          printf '%s\n' "$dry_run_output" | tee "$RUNNER_TEMP/phase-3-production-dry-run.log"
          test "$dry_run_status" -eq 0

          if printf '%s\n' "$dry_run_output" | grep -Eqi 'up to date|no pending migrations'; then
            echo 'Phase 3 migration is already applied; no database change is required.'
          else
            pending_files="$(printf '%s\n' "$dry_run_output" | grep -Eo '20[0-9]{10,12}_[A-Za-z0-9_.-]+\.sql' | sort -u || true)"
            echo 'Pending migration files detected:'
            printf '%s\n' "$pending_files"
            test "$pending_files" = "$(basename "$CERTIFICATE_FILE")"
            npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Verify all deployed migration history
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          history_file="$RUNNER_TEMP/phase-3-production-migration-history.log"
          npx --yes supabase@latest migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$history_file"

          python3 - "$history_file" "$PROFILE_VERSION" "$PHOTO_VERSION" "$ENTITLEMENT_VERSION" "$ADMIN_VERSION" "$DELIVERY_VERSION" "$CERTIFICATE_VERSION" <<'PY'
          from pathlib import Path
          import sys

          history = Path(sys.argv[1]).read_text()
          required = sys.argv[2:]
          rows = []
          for line in history.splitlines():
              if '|' not in line:
                  continue
              parts = [part.strip().strip('`') for part in line.split('|')]
              if len(parts) >= 3:
                  rows.append(parts)

          for version in required:
              matched = [row for row in rows if row[0] == version or row[1] == version]
              if not matched:
                  raise SystemExit(f'Migration {version} is missing from history.')
              if not any(row[0] == version and row[1] == version for row in matched):
                  raise SystemExit(f'Migration {version} is not recorded both locally and remotely: {matched}')
          PY

      - name: Verify deployed certificate authority schema
        shell: bash
        working-directory: /tmp/agilecert-phase-3-production
        run: |
          set -euo pipefail
          public_schema="$RUNNER_TEMP/phase-3-public-schema.sql"
          npx --yes supabase@latest db dump \
            --linked \
            --schema public \
            --file "$public_schema" \
            --password "$SUPABASE_DB_PASSWORD"
          test -s "$public_schema"
          grep -q 'agilecert_certificate_policies' "$public_schema"
          grep -q 'agilecert_certificate_eligibility_records' "$public_schema"
          grep -q 'agilecert_issued_certificates' "$public_schema"
          grep -q 'evaluate_agilecert_certificate_eligibility' "$public_schema"
          grep -q 'request_my_agilecert_certificate' "$public_schema"
          grep -q 'issue_agilecert_certificate' "$public_schema"
          grep -q 'set_agilecert_certificate_status' "$public_schema"
          grep -q 'verify_agilecert_certificate' "$public_schema"
          grep -q 'get_my_agilecert_certificate_workspace' "$public_schema"
          grep -q 'get_agilecert_certificate_admin_console' "$public_schema"
          grep -q 'reconcile_agilecert_certificate_eligibility' "$public_schema"
          grep -q 'agilecert_certificate_eligibility_attempt_trigger' "$public_schema"

      - name: Upload sanitized database deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-certificate-production-deployment-evidence
          path: |
            ${{ runner.temp }}/phase-3-production-dry-run.log
            ${{ runner.temp }}/phase-3-production-migration-history.log
            ${{ runner.temp }}/phase-3-public-schema.sql
          if-no-files-found: warn
          retention-days: 3
