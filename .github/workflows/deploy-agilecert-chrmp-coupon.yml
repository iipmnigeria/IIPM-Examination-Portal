name: Deploy AgileCert CHRMP Coupon

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-chrmp-coupon.txt'

permissions:
  contents: read

concurrency:
  group: deploy-agilecert-chrmp-coupon
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply and verify CHRMP100 coupon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: '2aab54f4f75791e9bc85825791ff648ccaea3b50'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact scope and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -s supabase/migrations/202607250105_chrmp_five_candidate_coupon.sql
          test "$(git diff --name-only "${EXPECTED_COMMIT}^" "$EXPECTED_COMMIT" | sort | tr '\n' ' ')" = ".github/workflows/validate-agilecert-chrmp-coupon.yml supabase/migrations/202607250105_chrmp_five_candidate_coupon.sql "

      - name: Isolate production-tracked migration window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-local-migrations"
          : > chrmp-coupon-legacy-migrations.txt
          moved=0
          for migration in supabase/migrations/*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            if [[ "$version" < '202607240101' ]]; then
              basename "$migration" >> chrmp-coupon-legacy-migrations.txt
              mv "$migration" "$RUNNER_TEMP/legacy-local-migrations/"
              moved=$((moved + 1))
            fi
          done
          sort -o chrmp-coupon-legacy-migrations.txt chrmp-coupon-legacy-migrations.txt
          test "$moved" -gt 0
          test -s supabase/migrations/202607240101_phase_2_3a_preparation_material_entitlements.sql
          test -s supabase/migrations/202607250105_chrmp_five_candidate_coupon.sql
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tee chrmp-coupon-isolated-window.txt
          awk -F_ '$1 < "202607240101" { print "Unexpected pre-tracking migration remains: " $0 > "/dev/stderr"; exit 1 }' chrmp-coupon-isolated-window.txt

      - name: Link production and require one pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee chrmp-coupon-dry-run.log
          grep -q '202607250105' chrmp-coupon-dry-run.log
          pending="$(grep -Eo '202[0-9]{9,}[^[:space:]]*' chrmp-coupon-dry-run.log | sort -u || true)"
          printf '%s\n' "$pending" | tee chrmp-coupon-pending.txt
          test "$(printf '%s\n' "$pending" | grep -c '^202607250105' || true)" -eq 1
          test "$(printf '%s\n' "$pending" | grep -cv '^202607250105' || true)" -eq 0

      - name: Apply only the approved coupon migration
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee chrmp-coupon-deploy.log

      - name: Verify production coupon and waiver quote
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          query = """
          select jsonb_build_object(
            'code', c.code,
            'discountType', c.discount_type,
            'discountValue', c.discount_value,
            'scope', c.scope,
            'currency', c.currency,
            'maximumRedemptions', c.maximum_redemptions,
            'perCandidateLimit', c.per_candidate_limit,
            'isActive', c.is_active,
            'startsAt', c.starts_at,
            'expiresAt', c.expires_at,
            'programmeCode', p.code,
            'examinationId', e.id,
            'examinationTitle', e.title,
            'activeUsage', (
              select count(*) from public.coupon_redemptions cr
              where cr.coupon_id = c.id and cr.status in ('reserved', 'redeemed')
            ),
            'quote', (
              select jsonb_build_object(
                'listAmountMinor', q.list_amount_minor,
                'discountAmountMinor', q.discount_amount_minor,
                'payableAmountMinor', q.payable_amount_minor,
                'couponCode', q.coupon_code
              )
              from public.resolve_exam_purchase_quote(
                e.id,
                gen_random_uuid(),
                'NGN',
                'CHRMP100'
              ) q
            )
          ) as coupon
          from public.coupons c
          join public.examinations e on e.id = c.examination_id
          join public.programmes p on p.id = e.programme_id
          where upper(c.code) = 'CHRMP100';
          """
          open('/tmp/chrmp-coupon-query.json', 'w', encoding='utf-8').write(json.dumps({'query': query}))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/chrmp-coupon-query.json \
            -o chrmp-coupon-production.json

          python3 - <<'PY'
          import json
          data = json.load(open('chrmp-coupon-production.json', encoding='utf-8'))
          assert isinstance(data, list) and len(data) == 1, data
          coupon = data[0].get('coupon') or {}
          assert coupon.get('code') == 'CHRMP100', coupon
          assert coupon.get('discountType') == 'percentage', coupon
          assert float(coupon.get('discountValue')) == 100, coupon
          assert coupon.get('scope') == 'examination', coupon
          assert coupon.get('currency') is None, coupon
          assert coupon.get('maximumRedemptions') == 5, coupon
          assert coupon.get('perCandidateLimit') == 1, coupon
          assert coupon.get('isActive') is True, coupon
          assert coupon.get('programmeCode') == 'CHRMP', coupon
          assert coupon.get('expiresAt').startswith('2026-08-24T22:59:59'), coupon
          assert coupon.get('activeUsage') == 0, coupon
          quote = coupon.get('quote') or {}
          assert quote.get('couponCode') == 'CHRMP100', quote
          assert quote.get('discountAmountMinor') == quote.get('listAmountMinor'), quote
          assert quote.get('payableAmountMinor') == 0, quote
          safe = {
            'code': coupon['code'],
            'programmeCode': coupon['programmeCode'],
            'examinationTitle': coupon['examinationTitle'],
            'discountValue': coupon['discountValue'],
            'maximumRedemptions': coupon['maximumRedemptions'],
            'perCandidateLimit': coupon['perCandidateLimit'],
            'expiresAt': coupon['expiresAt'],
            'activeUsage': coupon['activeUsage'],
            'payableAmountMinor': quote['payableAmountMinor'],
          }
          open('chrmp-coupon-production-safe.json', 'w', encoding='utf-8').write(json.dumps(safe, indent=2))
          PY

      - name: Confirm no migrations remain pending
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee chrmp-coupon-post-deploy-dry-run.log
          ! grep -q '202607250105' chrmp-coupon-post-deploy-dry-run.log

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-chrmp-coupon-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            chrmp-coupon-legacy-migrations.txt
            chrmp-coupon-isolated-window.txt
            chrmp-coupon-dry-run.log
            chrmp-coupon-pending.txt
            chrmp-coupon-deploy.log
            chrmp-coupon-production-safe.json
            chrmp-coupon-post-deploy-dry-run.log
