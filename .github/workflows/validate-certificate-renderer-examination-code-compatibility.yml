name: Validate Certificate Renderer Examination Code Compatibility

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/validate-certificate-renderer-examination-code-compatibility.yml'
      - 'docs/CERTIFICATE_RENDERER_EXAMINATION_CODE_COMPATIBILITY.md'
      - 'supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql'
      - 'supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certificate-renderer-examination-code-compatibility-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict compatibility change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/supabase-integration...HEAD | sort > changed-files.txt
          cat > allowed-files.txt <<'FILES'
          .github/workflows/validate-certificate-renderer-examination-code-compatibility.yml
          docs/CERTIFICATE_RENDERER_EXAMINATION_CODE_COMPATIBILITY.md
          supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql
          FILES
          sort -o allowed-files.txt allowed-files.txt
          diff -u allowed-files.txt changed-files.txt

      - name: Confirm protected authorities are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/supabase-integration...HEAD -- \
            src/services/certificateService.ts \
            src/services/certificatePdfService.ts \
            src/services/cipmnCertificateRenderer.ts \
            src/services/examService.ts \
            src/services/financeConsoleService.ts \
            src/services/financeConsoleCompletionService.ts \
            supabase/functions/render-certificate-pdf/index.ts \
            supabase/functions/render-certificate-pdf/render.ts \
            supabase/functions/initialize-exam-payment/index.ts \
            supabase/functions/verify-exam-payment/index.ts \
            supabase/functions/paystack-webhook/index.ts
          ! grep -E -i '(insert|delete)[[:space:]]+.*(attempts|agilecert_issued_certificates|exam_orders|exam_payments)' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          ! grep -E -i 'update[[:space:]]+.*(attempts|agilecert_issued_certificates|exam_orders|exam_payments)' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          ! grep -R -E '(sk_(live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,})' \
            docs/CERTIFICATE_RENDERER_EXAMINATION_CODE_COMPATIBILITY.md \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql \
            supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production application
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Neutralise production-only identity bootstrap in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          -- CI-only: production identity bootstrap is intentionally disabled.
          commit;
          SQL

      - name: Start database-only Supabase services
        shell: bash
        run: |
          set -euo pipefail
          excluded='gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor'
          if ! timeout --signal=TERM --kill-after=15s 180s \
            supabase start -x "$excluded" --ignore-health-check --debug \
            > examination-code-supabase-start.log 2>&1; then
            cat examination-code-supabase-start.log
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          cat examination-code-supabase-start.log
          exit 1

      - name: Apply complete migration history
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local 2>&1 | tee examination-code-db-reset.log
          grep -q 'Applying migration 202608011300_certificate_master_console_phase1a.sql' \
            examination-code-db-reset.log
          grep -q 'Applying migration 202608012100_certificate_visual_designer_phase1b.sql' \
            examination-code-db-reset.log
          grep -q 'Applying migration 202608012200_certificate_server_rendering_phase1c.sql' \
            examination-code-db-reset.log
          grep -q 'Applying migration 202608012300_certificate_renderer_examination_code_compatibility.sql' \
            examination-code-db-reset.log

      - name: Run Phase 1A regression smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_management_console_phase1a_smoke.sql \
            2>&1 | tee examination-code-phase1a-regression.log
          grep -q 'certificateManagementConsolePhase1AVerified' \
            examination-code-phase1a-regression.log

      - name: Run Phase 1B regression smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_visual_designer_phase1b_smoke.sql \
            2>&1 | tee examination-code-phase1b-regression.log
          grep -q 'certificateVisualDesignerPhase1BVerified' \
            examination-code-phase1b-regression.log

      - name: Run Phase 1C regression smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_server_rendering_phase1c_smoke.sql \
            2>&1 | tee examination-code-phase1c-regression.log
          grep -q 'certificateServerRenderingPhase1CVerified' \
            examination-code-phase1c-regression.log

      - name: Run examination-code compatibility smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql \
            2>&1 | tee examination-code-compatibility.log
          grep -q 'certificateRendererExaminationCodeCompatibilityVerified' \
            examination-code-compatibility.log

      - name: Verify compatibility architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'add column if not exists code text' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          grep -q 'CIPMN-MOD-' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          grep -q 'agilecert_examinations_derive_code' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          grep -q 'alter column code set not null' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-renderer-examination-code-compatibility-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            changed-files.txt
            allowed-files.txt
            examination-code-supabase-start.log
            examination-code-db-reset.log
            examination-code-phase1a-regression.log
            examination-code-phase1b-regression.log
            examination-code-phase1c-regression.log
            examination-code-compatibility.log

      - name: Stop isolated Supabase services
        if: always()
        run: timeout --signal=TERM --kill-after=10s 45s supabase stop --no-backup || true
