name: Temporary PR 324 Agile Marketing Catalogue Validation

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - "src/data/agileProgrammeCatalogue.ts"
      - "src/components/AgileProgrammeCatalogue.tsx"
      - ".github/workflows/validate-pr-324-agile-marketing-temporary.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify Agile Marketing catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium

      - name: Build production application
        run: npm run build

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/agilecert-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agilecert-preview.log
          exit 1

      - name: Verify Agile Marketing catalogue experience
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.stack || error.message));

            const response = await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            if (response?.status() !== 200) {
              throw new Error(`Unexpected preview status: ${response?.status()}`);
            }

            await page.getByRole('heading', { name: 'IIPM Specialist Certification Catalogue' }).waitFor({
              state: 'visible',
              timeout: 15000,
            });

            const specialistTitles = [
              'Project Risk & Quality Management',
              'Project Planning & Schedule Management',
              'Project Communication & Information Management',
              'Agile Project Management',
              'Procurement & Contract Management',
              'Performance and People Management',
            ];
            for (const title of specialistTitles) {
              await page.getByRole('heading', { name: title, exact: true }).waitFor({ state: 'visible' });
            }
            const candidateAccessButtons = page.getByRole('button', { name: /Open candidate access/i });
            if (await candidateAccessButtons.count() !== 6) {
              throw new Error(`Expected 6 IIPM specialist access buttons, found ${await candidateAccessButtons.count()}.`);
            }

            await page.evaluate(() => {
              window.dispatchEvent(new Event('agilecert:open-certification-programmes'));
            });
            const dialog = page.getByRole('dialog');
            await dialog.getByRole('heading', { name: 'AgileCert Certification Catalogue', exact: true }).waitFor({
              state: 'visible',
              timeout: 10000,
            });

            const categoryButtons = dialog.locator('button').filter({ has: dialog.locator('span') });
            await dialog.getByRole('button', { name: /Agile Marketing\s*3/ }).click();

            const programmes = [
              ['AC-ACGO-A', 'AgileCert Associate Practitioner in Agile Campaign & Growth Operations'],
              ['AC-AMST-P', 'AgileCert Professional in Agile Marketing Strategy & Transformation'],
              ['AC-AMCO-P', 'AgileCert Professional in AI-Enabled Marketing & Content Operations'],
            ];
            for (const [code, title] of programmes) {
              await dialog.getByText(code, { exact: true }).waitFor({ state: 'visible' });
              await dialog.getByRole('heading', { name: title, exact: true }).waitFor({ state: 'visible' });
            }

            await dialog.getByRole('button', { name: 'Associate', exact: true }).click();
            await dialog.getByText('1 programme shown', { exact: true }).waitFor({ state: 'visible' });
            await dialog.getByRole('heading', {
              name: 'AgileCert Associate Practitioner in Agile Campaign & Growth Operations',
              exact: true,
            }).waitFor({ state: 'visible' });

            await dialog.getByRole('button', { name: 'Professional', exact: true }).click();
            await dialog.getByText('2 programmes shown', { exact: true }).waitFor({ state: 'visible' });

            await dialog.getByText('41 proposed programmes across 4 certification categories.', { exact: true }).waitFor({
              state: 'visible',
            });

            if (pageErrors.length) {
              throw new Error(`Browser page errors:\n${pageErrors.join('\n---\n')}`);
            }

            console.log('Production build passed.');
            console.log('Six IIPM specialist programmes and access actions retained.');
            console.log('Agile Marketing category verified with three approved programmes.');
            console.log('Associate and Professional filters verified.');
            console.log('41-programme, four-category catalogue total verified.');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
