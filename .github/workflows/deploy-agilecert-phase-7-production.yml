name: Deploy Approved AgileCert Phase 7 Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-phase-7.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-approved-agilecert-phase-7-production
  cancel-in-progress: false

jobs:
  database-and-function:
    name: Apply Phase 7 database and deploy AI CV function
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPECTED_COMMIT: '133c90474911736701501eb65ba5041cfce22333'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      TRACKING_BOUNDARY: '202607230101'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout exact approved Phase 7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact approved Phase 7 release unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          cat > phase7-expected-migrations.txt <<'EOF'
          202607261300_phase_7_ai_cv_profile_builder_foundation.sql
          202607271100_phase_7_ai_cv_completion.sql
          EOF
          for file in $(cat phase7-expected-migrations.txt); do
            test -s "supabase/migrations/$file"
          done
          test -s supabase/functions/agilecert-ai-cv/index.ts

          python3 <<'PY'
          from pathlib import Path
          foundation = Path('supabase/migrations/202607261300_phase_7_ai_cv_profile_builder_foundation.sql').read_text()
          completion = Path('supabase/migrations/202607271100_phase_7_ai_cv_completion.sql').read_text()
          edge = Path('supabase/functions/agilecert-ai-cv/index.ts').read_text()
          required = [
              'agilecert_candidate_cv_documents',
              'upsert_my_agilecert_candidate_cv_document',
              'agilecert_ai_cv_requests',
              'set_my_agilecert_ai_cv_consent',
              'register_agilecert_ai_cv_request',
              'complete_agilecert_ai_cv_request',
              'mark_my_agilecert_ai_cv_enhancement_applied',
          ]
          combined = foundation + '\n' + completion
          missing = [item for item in required if item not in combined]
          assert not missing, f'Missing Phase 7 database authority: {missing}'
          edge_required = [
              'professional_summary', 'role_tailoring',
              'achievement_rewrite', 'skills_recommendation',
              'GEMINI_API_KEY', 'The candidate must explicitly apply them',
          ]
          missing = [item for item in edge_required if item not in edge]
          assert not missing, f'Missing Phase 7 Edge Function authority: {missing}'
          forbidden = [
              'PAYSTACK_SECRET_KEY', 'update public.question_answer_keys',
              'update public.candidate_answers',
          ]
          found = [item for item in forbidden if item in combined or item in edge]
          assert not found, f'Protected authority leaked into Phase 7: {found}'
          PY

      - name: Isolate pre-tracking legacy migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase7-legacy"
          : > phase7-legacy-local-migrations.txt
          for path in supabase/migrations/*.sql; do
            file="$(basename "$path")"
            version="${file%%_*}"
            if [[ "$version" < "$TRACKING_BOUNDARY" ]]; then
              printf '%s\n' "$file" >> phase7-legacy-local-migrations.txt
              mv "$path" "$RUNNER_TEMP/phase7-legacy/$file"
            fi
          done
          for file in $(cat phase7-expected-migrations.txt); do
            test -s "supabase/migrations/$file"
          done
          ! grep -q '^202607261300_' phase7-legacy-local-migrations.txt
          ! grep -q '^202607271100_' phase7-legacy-local-migrations.txt

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require exactly the two pending Phase 7 migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee phase7-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' phase7-production-dry-run.log \
            | sort -u > phase7-production-pending.txt || true
          sort -o phase7-expected-migrations.txt phase7-expected-migrations.txt
          diff -u phase7-expected-migrations.txt phase7-production-pending.txt
          test "$(wc -l < phase7-production-pending.txt | tr -d ' ')" -eq 2

      - name: Apply approved Phase 7 migrations
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked --include-all 2>&1 | tee phase7-production-deploy.log
          for file in $(cat phase7-expected-migrations.txt); do
            grep -q "Applying migration $file" phase7-production-deploy.log
          done
          grep -q 'Finished supabase db push' phase7-production-deploy.log

      - name: Verify remote Phase 7 privacy authority
        shell: bash
        run: |
          set -o pipefail
          supabase db dump --linked --schema public --file phase7-production-schema.sql \
            2>&1 | tee phase7-production-schema-dump.log
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          schema = Path('phase7-production-schema.sql').read_text(encoding='utf-8', errors='ignore')
          required = [
              'agilecert_candidate_cv_documents',
              'upsert_my_agilecert_candidate_cv_document',
              'agilecert_ai_cv_requests',
              'set_my_agilecert_ai_cv_consent',
              'register_agilecert_ai_cv_request',
              'complete_agilecert_ai_cv_request',
              'mark_my_agilecert_ai_cv_enhancement_applied',
              'ai_last_enhanced_at',
          ]
          missing = [item for item in required if item not in schema]
          assert not missing, f'Production Phase 7 schema markers missing: {missing}'
          evidence = {
              'sourceCommit': os.environ['EXPECTED_COMMIT'],
              'projectRef': os.environ['PROJECT_REF'],
              'migrationCount': 2,
              'requiredSchemaMarkerCount': len(required),
              'privateCvAuthorityPresent': True,
              'aiCvAuditAuthorityPresent': True,
              'paystackAuthorityChanged': False,
          }
          Path('phase7-production-safe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Confirm no migration remains pending
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee phase7-post-deploy-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' phase7-post-deploy-dry-run.log \
            | sort -u > phase7-post-deploy-pending.txt || true
          test ! -s phase7-post-deploy-pending.txt
          grep -q 'Remote database is up to date' phase7-post-deploy-dry-run.log

      - name: Deploy only the approved AI CV Edge Function
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy agilecert-ai-cv --project-ref "$PROJECT_REF" \
            2>&1 | tee phase7-function-deploy.log
          supabase functions list --project-ref "$PROJECT_REF" \
            2>&1 | tee phase7-function-list.log
          grep -q 'agilecert-ai-cv' phase7-function-list.log

      - name: Confirm authenticated function boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o phase7-function-auth-response.json -w '%{http_code}' \
            -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-ai-cv" \
            -H 'Content-Type: application/json' \
            --data '{"action":"professional_summary"}')"
          test "$status" = '401'

      - name: Upload sanitized Phase 7 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-7-production-database-function-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase7-expected-migrations.txt
            phase7-legacy-local-migrations.txt
            phase7-production-dry-run.log
            phase7-production-pending.txt
            phase7-production-deploy.log
            phase7-production-schema-dump.log
            phase7-production-safe.json
            phase7-post-deploy-dry-run.log
            phase7-post-deploy-pending.txt
            phase7-function-deploy.log
            phase7-function-list.log
            phase7-function-auth-response.json

  pages:
    name: Verify exact compiled Phase 7 Pages deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT: '133c90474911736701501eb65ba5041cfce22333'
      GH_TOKEN: ${{ github.token }}
      LIVE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'

    steps:
      - name: Wait for exact permanent Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          conclusion=''
          for attempt in $(seq 1 90); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=supabase-integration&per_page=50" \
              > phase7-pages-runs.json
            run_id="$(jq -r --arg sha "$EXPECTED_COMMIT" '.workflow_runs[] | select(.head_sha == $sha and .name == "Deploy AgileCert Compiled Pages") | .id' phase7-pages-runs.json | head -n 1)"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' phase7-pages-runs.json)"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""' phase7-pages-runs.json)"
              printf 'run_id=%s status=%s conclusion=%s\n' "$run_id" "$status" "$conclusion"
              if [ "$status" = 'completed' ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$conclusion" = 'success'
          printf '%s' "$run_id" > phase7-pages-run-id.txt

      - name: Verify Pages jobs and live Phase 7 evidence
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat phase7-pages-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > phase7-pages-jobs.json
          jq -e '.jobs | length >= 3' phase7-pages-jobs.json >/dev/null
          jq -e 'all(.jobs[]; .conclusion == "success")' phase7-pages-jobs.json >/dev/null

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > phase7-pages-artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name == "agilecert-pages-live-verification" and (.expired | not)) | .id' phase7-pages-artifacts.json | head -n 1)"
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > phase7-pages-live-evidence.zip
          mkdir -p phase7-pages-live-evidence
          unzip -q phase7-pages-live-evidence.zip -d phase7-pages-live-evidence

          live_js="$(find phase7-pages-live-evidence -type f -name 'live-app.js' | head -n 1)"
          mount_report="$(find phase7-pages-live-evidence -type f -name 'agilecert-live-mount-report.json' | head -n 1)"
          test -s "$live_js"
          test -s "$mount_report"
          grep -q 'Private AI CV Studio' "$live_js"
          grep -q 'Generate private suggestion' "$live_js"
          grep -q 'Apply reviewed suggestion' "$live_js"
          jq -e '.status == 200 and .adviserButtonVisible == true and .bootShellExists == false' "$mount_report" >/dev/null

          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'sourceCommit': os.environ['EXPECTED_COMMIT'],
              'deploymentRunId': int(Path('phase7-pages-run-id.txt').read_text()),
              'liveUrl': os.environ['LIVE_URL'],
              'aiCvStudio': 'Private AI CV Studio',
              'candidateReviewApply': True,
              'liveMountVerified': True,
          }
          Path('phase7-pages-production-safe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload Phase 7 Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-7-production-pages-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase7-pages-run-id.txt
            phase7-pages-runs.json
            phase7-pages-jobs.json
            phase7-pages-artifacts.json
            phase7-pages-production-safe.json
