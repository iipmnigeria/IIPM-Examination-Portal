name: Diagnose Live AgileCert Boot Failure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/diagnose-live-boot.txt'

permissions:
  contents: read
  actions: read
  pages: read

jobs:
  diagnose:
    name: Capture live HTML, assets and browser runtime
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Capture Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            | jq '{status, build_type, source, html_url, https_enforced}' \
            | tee "$RUNNER_TEMP/pages-config.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            | jq '{status, commit, created_at, updated_at, error}' \
            | tee "$RUNNER_TEMP/pages-latest-build.json" || true

      - name: Capture live HTML and referenced assets
        shell: bash
        run: |
          set -euo pipefail
          url="${LIVE_URL}?boot-diagnostic=${GITHUB_RUN_ID}"
          curl -L --fail --silent --show-error \
            -D "$RUNNER_TEMP/live-index-headers.txt" \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "$url" \
            -o "$RUNNER_TEMP/live-index.html"
          python3 - "$LIVE_URL" "$RUNNER_TEMP/live-index.html" "$RUNNER_TEMP/live-assets.json" <<'PY'
          import json, re, sys
          from urllib.parse import urljoin
          base, html_path, out_path = sys.argv[1:]
          html = open(html_path, encoding='utf-8').read()
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          styles = re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]*rel=["\']stylesheet["\']|<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)["\']', html, flags=re.I)
          style_paths = [a or b for a, b in styles]
          data = {
            'containsSourceEntry': '/src/main.tsx' in html,
            'containsBootShell': 'iipm-boot-shell' in html,
            'scripts': [{'path': p, 'url': urljoin(base, p)} for p in scripts],
            'styles': [{'path': p, 'url': urljoin(base, p)} for p in style_paths],
          }
          open(out_path, 'w', encoding='utf-8').write(json.dumps(data, indent=2))
          print(json.dumps(data, indent=2))
          PY
          python3 - "$RUNNER_TEMP/live-assets.json" "$RUNNER_TEMP/asset-results.json" <<'PY'
          import hashlib, json, subprocess, sys
          src, out = sys.argv[1:]
          data = json.load(open(src, encoding='utf-8'))
          results = []
          for item in data['scripts'] + data['styles']:
            body = '/tmp/asset-body'
            headers = '/tmp/asset-headers'
            command = ['curl','-L','--silent','--show-error','-D',headers,'-o',body,'-w','%{http_code}',item['url'] + '?boot-asset-check=1']
            status = subprocess.check_output(command, text=True).strip()
            content = open(body,'rb').read()
            header_text = open(headers, encoding='utf-8', errors='replace').read()
            results.append({
              **item,
              'status': int(status),
              'size': len(content),
              'sha256': hashlib.sha256(content).hexdigest(),
              'firstBytes': content[:120].decode('utf-8','replace'),
              'headers': header_text[-2000:],
            })
          open(out,'w',encoding='utf-8').write(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY

      - name: Install Chromium diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-diagnostic"
          cd "$RUNNER_TEMP/browser-diagnostic"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Capture browser runtime failure
        shell: bash
        working-directory: ${{ runner.temp }}/browser-diagnostic
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleMessages = [];
            const pageErrors = [];
            const failedRequests = [];
            const errorResponses = [];

            page.on('console', msg => consoleMessages.push({ type: msg.type(), text: msg.text() }));
            page.on('pageerror', err => pageErrors.push(String(err && err.stack ? err.stack : err)));
            page.on('requestfailed', req => failedRequests.push({ url: req.url(), resourceType: req.resourceType(), failure: req.failure() }));
            page.on('response', res => {
              if (res.status() >= 400) errorResponses.push({ url: res.url(), status: res.status(), resourceType: res.request().resourceType() });
            });

            const target = `${process.env.LIVE_URL}?boot-browser=${process.env.GITHUB_RUN_ID}`;
            let navigationStatus = 0;
            let navigationError = null;
            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
              navigationStatus = response ? response.status() : 0;
            } catch (error) {
              navigationError = String(error && error.stack ? error.stack : error);
            }

            await page.waitForTimeout(22000);
            const state = await page.evaluate(() => ({
              title: document.title,
              readyState: document.readyState,
              bootShellExists: Boolean(document.getElementById('iipm-boot-shell')),
              rootHtmlLength: document.getElementById('root')?.innerHTML.length || 0,
              bodyText: document.body?.innerText?.slice(0, 3000) || '',
              scripts: [...document.scripts].map(s => ({ src: s.src, type: s.type })),
              resources: performance.getEntriesByType('resource').map(entry => ({ name: entry.name, initiatorType: entry.initiatorType, duration: entry.duration, transferSize: entry.transferSize })),
              location: location.href,
            }));

            const report = {
              navigationStatus,
              navigationError,
              state,
              consoleMessages,
              pageErrors,
              failedRequests,
              errorResponses,
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/live-browser-report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${process.env.RUNNER_TEMP}/live-browser-diagnostic.png`, fullPage: true });
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-live-boot-diagnostics
          retention-days: 5
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pages-config.json
            ${{ runner.temp }}/pages-latest-build.json
            ${{ runner.temp }}/live-index-headers.txt
            ${{ runner.temp }}/live-index.html
            ${{ runner.temp }}/live-assets.json
            ${{ runner.temp }}/asset-results.json
            ${{ runner.temp }}/live-browser-report.json
            ${{ runner.temp }}/live-browser-diagnostic.png
