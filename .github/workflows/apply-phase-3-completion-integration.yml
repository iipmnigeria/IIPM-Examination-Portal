name: Integrate Phase 3 Certificate Completion

on:
  push:
    branches: [phase-3-certificate-completion]
    paths:
      - '.github/workflows/apply-phase-3-completion-integration.yml'
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-phase-3-completion-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.head_ref == 'phase-3-certificate-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Integrate database queue, candidate QR download and administrator launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/202607251800_phase_3_certificate_completion.sql')
          sql = migration.read_text(encoding='utf-8')

          function_marker = 'create or replace function public.get_agilecert_certificate_completion_console('
          if function_marker not in sql:
              raise SystemExit('Completion console function marker is missing.')
          before_console, console = sql.split(function_marker, 1)
          console = function_marker + console

          declaration = """  v_limit integer := greatest(1, least(coalesce(p_limit, 100), 250));
            v_templates jsonb;
          """
          replacement = """  v_limit integer := greatest(1, least(coalesce(p_limit, 100), 250));
            v_queue jsonb;
            v_templates jsonb;
          """
          if console.count(declaration) != 1:
              raise SystemExit(f'Expected one completion console declaration, found {console.count(declaration)}')
          console = console.replace(declaration, replacement, 1)

          authority = """  perform public.agilecert_require_certificate_admin();

            select coalesce(jsonb_agg(jsonb_build_object(
          """
          queue_query = """  perform public.agilecert_require_certificate_admin();

            select coalesce(jsonb_agg(payload order by approval_updated_at desc), '[]'::jsonb)
            into v_queue
            from (
              select er.approval_updated_at,
                jsonb_build_object(
                  'eligibilityId', er.id,
                  'candidateName', candidate.full_name,
                  'candidateEmail', candidate.email,
                  'examinationId', er.examination_id,
                  'examinationTitle', e.title,
                  'programmeCode', p.code,
                  'score', er.score,
                  'passMark', er.pass_mark,
                  'integrityStatus', er.integrity_status,
                  'eligibilityStatus', er.eligibility_status,
                  'approvalStatus', er.approval_status,
                  'approvalReason', er.approval_reason,
                  'requestedAt', er.requested_at,
                  'approvalUpdatedAt', er.approval_updated_at
                ) payload
              from public.agilecert_certificate_eligibility_records er
              join public.profiles candidate on candidate.id = er.candidate_id
              join public.examinations e on e.id = er.examination_id
              join public.programmes p on p.id = e.programme_id
              join public.agilecert_certificate_policies cp on cp.examination_id = er.examination_id
              where cp.approval_mode = 'manual'
                and er.eligibility_status <> 'issued'
                and er.approval_status in ('pending', 'changes_requested', 'rejected')
              order by er.approval_updated_at desc
              limit v_limit
            ) recent;

            select coalesce(jsonb_agg(jsonb_build_object(
          """
          if console.count(authority) != 1:
              raise SystemExit(f'Expected one console authority anchor, found {console.count(authority)}')
          console = console.replace(authority, queue_query, 1)

          return_anchor = """  return jsonb_build_object(
              'templates', v_templates,
          """
          return_replacement = """  return jsonb_build_object(
              'templates', v_templates,
              'approvalQueue', v_queue,
          """
          if console.count(return_anchor) != 1:
              raise SystemExit(f'Expected one completion return anchor, found {console.count(return_anchor)}')
          console = console.replace(return_anchor, return_replacement, 1)
          sql = before_console + console

          manual_guard = """  if coalesce(v_policy.approval_mode, 'automatic') = 'manual'
               and coalesce(v_eligibility.approval_status, 'not_required') <> 'approved' then
              raise exception 'This certificate policy requires administrator approval before issuance.';
            end if;

            select e.programme_id into v_programme_id
          """
          request_guard = """  if coalesce(v_policy.approval_mode, 'automatic') = 'manual'
               and coalesce(v_eligibility.approval_status, 'not_required') <> 'approved' then
              raise exception 'This certificate policy requires administrator approval before issuance.';
            end if;

            if coalesce(v_policy.require_candidate_request, false)
               and v_eligibility.eligibility_status not in ('requested', 'issued') then
              raise exception 'The candidate must submit a certificate request before issuance.';
            end if;

            select e.programme_id into v_programme_id
          """
          if sql.count(manual_guard) != 1:
              raise SystemExit(f'Expected one manual approval insert guard, found {sql.count(manual_guard)}')
          sql = sql.replace(manual_guard, request_guard, 1)

          workspace_marker = 'create or replace function public.get_my_agilecert_certificate_workspace_v2()'
          if sql.count(workspace_marker) != 1:
              raise SystemExit('Workspace v2 marker is missing or duplicated.')
          request_function = r"""create or replace function public.request_my_agilecert_certificate(
            p_attempt_id uuid
          )
          returns jsonb
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            v_candidate_id uuid := auth.uid();
            v_eligibility_id uuid;
            v_record public.agilecert_certificate_eligibility_records%rowtype;
            v_policy public.agilecert_certificate_policies%rowtype;
          begin
            if v_candidate_id is null then
              raise exception 'Authentication is required.';
            end if;

            v_eligibility_id := public.evaluate_agilecert_certificate_eligibility(p_attempt_id);

            select * into v_record
            from public.agilecert_certificate_eligibility_records
            where id = v_eligibility_id
              and candidate_id = v_candidate_id
            for update;

            if not found then
              raise exception 'The certificate eligibility record is unavailable.';
            end if;
            if v_record.eligibility_status in ('blocked', 'revoked') then
              raise exception 'Certificate issuance is unavailable: %.', replace(v_record.reason_code, '_', ' ');
            end if;
            if v_record.eligibility_status = 'issued' then
              return jsonb_build_object(
                'eligibilityId', v_record.id,
                'status', 'issued',
                'message', 'This certificate has already been issued.'
              );
            end if;
            if v_record.approval_status = 'rejected' then
              raise exception 'This certificate request was rejected. Contact IIPM support for further review.';
            end if;

            select * into v_policy
            from public.agilecert_certificate_policies
            where examination_id = v_record.examination_id;

            update public.agilecert_certificate_eligibility_records
            set eligibility_status = 'requested',
                requested_at = now(),
                approval_status = case
                  when coalesce(v_policy.approval_mode, 'automatic') = 'manual' then 'pending'
                  else 'not_required'
                end,
                approval_reason = null,
                approval_decided_at = null,
                approval_decided_by = null,
                approval_updated_at = now(),
                updated_at = now()
            where id = v_record.id
            returning * into v_record;

            insert into public.agilecert_certificate_audit_events (
              eligibility_id, candidate_id, actor_id, event_type, metadata
            ) values (
              v_record.id,
              v_record.candidate_id,
              v_candidate_id,
              case when v_record.approval_status = 'pending'
                then 'request_submitted_for_approval'
                else 'request_submitted'
              end,
              jsonb_build_object('approvalStatus', v_record.approval_status)
            );

            return jsonb_build_object(
              'eligibilityId', v_record.id,
              'status', 'requested',
              'approvalStatus', v_record.approval_status,
              'message', case when v_record.approval_status = 'pending'
                then 'Your certificate request has been submitted for administrator approval.'
                else 'Your certificate request has been recorded.'
              end
            );
          end;
          $$;

          """
          sql = sql.replace(workspace_marker, request_function + workspace_marker, 1)
          migration.write_text(sql, encoding='utf-8')

          candidate_path = Path('src/components/CandidateCertificateWorkspace.tsx')
          candidate = candidate_path.read_text(encoding='utf-8')
          candidate = candidate.replace("import { jsPDF } from 'jspdf';\n", "import { downloadCertificatePdf } from '../services/certificatePdfService';\n", 1)
          candidate = candidate.replace("  type IssuedCertificateRecord,\n", '', 1)

          start = candidate.index('const verificationUrl = (code: string): string => {')
          end = candidate.index('const eligibilityBadge = (item: CandidateCertificateItem) => {')
          candidate = candidate[:start] + candidate[end:]

          badge_anchor = """const eligibilityBadge = (item: CandidateCertificateItem) => {
            if (item.certificate?.status === 'active') {
          """
          badge_replacement = """const eligibilityBadge = (item: CandidateCertificateItem) => {
            if (item.certificate?.status === 'active') {
          """
          if candidate.count(badge_anchor) != 1:
              raise SystemExit('Candidate badge function anchor is missing.')
          candidate = candidate.replace(badge_anchor, badge_replacement, 1)

          requested_badge = """  if (item.eligibilityStatus === 'requested') {
              return { label: 'Issuance requested', className: 'border-blue-200 bg-blue-50 text-blue-700' };
            }
          """
          approval_badges = """  if (item.approvalStatus === 'changes_requested') {
              return { label: 'Changes requested', className: 'border-amber-200 bg-amber-50 text-amber-700' };
            }
            if (item.approvalStatus === 'rejected') {
              return { label: 'Request rejected', className: 'border-rose-200 bg-rose-50 text-rose-700' };
            }
            if (item.approvalStatus === 'pending') {
              return { label: 'Approval pending', className: 'border-blue-200 bg-blue-50 text-blue-700' };
            }
            if (item.eligibilityStatus === 'requested') {
              return { label: 'Issuance requested', className: 'border-blue-200 bg-blue-50 text-blue-700' };
            }
          """
          if candidate.count(requested_badge) != 1:
              raise SystemExit('Candidate requested badge anchor is missing.')
          candidate = candidate.replace(requested_badge, approval_badges, 1)

          state_anchor = """  const [requestingAttemptId, setRequestingAttemptId] = useState('');
            const [error, setError] = useState('');
          """
          state_replacement = """  const [requestingAttemptId, setRequestingAttemptId] = useState('');
            const [downloadingCertificateId, setDownloadingCertificateId] = useState('');
            const [error, setError] = useState('');
          """
          if candidate.count(state_anchor) != 1:
              raise SystemExit('Candidate state anchor is missing.')
          candidate = candidate.replace(state_anchor, state_replacement, 1)

          handler_anchor = """  if (!isCandidate) return null;
          """
          download_handler = """  const handleDownload = async (certificateId: string) => {
              try {
                setDownloadingCertificateId(certificateId);
                setError('');
                setMessage('');
                await downloadCertificatePdf(certificateId);
                setMessage('The QR-coded certificate PDF was generated from the current server record.');
              } catch (downloadError) {
                setError(downloadError instanceof Error ? downloadError.message : 'Unable to download the certificate PDF.');
              } finally {
                setDownloadingCertificateId('');
              }
            };

            if (!isCandidate) return null;
          """
          if candidate.count(handler_anchor) != 1:
              raise SystemExit('Candidate handler anchor is missing.')
          candidate = candidate.replace(handler_anchor, download_handler, 1)

          can_request = "const canRequest = item.eligibilityStatus === 'eligible' && !certificate;"
          can_request_new = "const canRequest = (item.eligibilityStatus === 'eligible' || item.approvalStatus === 'changes_requested') && !certificate;"
          if candidate.count(can_request) != 1:
              raise SystemExit('Candidate request rule anchor is missing.')
          candidate = candidate.replace(can_request, can_request_new, 1)

          old_request_block = """                  ) : canRequest ? (
                        <button
                          type=\"button\"
                          onClick={() => void handleRequest(item)}
                          disabled={requestingAttemptId === item.attemptId}
                          className=\"mt-5 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-3 text-sm font-extrabold text-white transition hover:bg-emerald-700 disabled:opacity-60\"
                        >
                          {requestingAttemptId === item.attemptId ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <Send className=\"h-4 w-4\" />}
                          Request certificate issuance
                        </button>
                      ) : item.eligibilityStatus === 'requested' ? (
          """
          new_request_block = """                  ) : canRequest ? (
                        <div className=\"mt-5 space-y-3\">
                          {item.approvalStatus === 'changes_requested' && (
                            <div className=\"rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800\">
                              <p className=\"font-extrabold\">Administrator changes requested</p>
                              <p className=\"mt-1\">{item.approvalReason || 'Update the required candidate information before resubmitting.'}</p>
                            </div>
                          )}
                          <button
                            type=\"button\"
                            onClick={() => void handleRequest(item)}
                            disabled={requestingAttemptId === item.attemptId}
                            className=\"inline-flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-3 text-sm font-extrabold text-white transition hover:bg-emerald-700 disabled:opacity-60\"
                          >
                            {requestingAttemptId === item.attemptId ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <Send className=\"h-4 w-4\" />}
                            {item.approvalStatus === 'changes_requested' ? 'Resubmit certificate request' : 'Request certificate issuance'}
                          </button>
                        </div>
                      ) : item.approvalStatus === 'rejected' ? (
                        <div className=\"mt-5 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800\">
                          <p className=\"font-extrabold\">Certificate request rejected</p>
                          <p className=\"mt-1 text-xs\">{item.approvalReason || 'Contact IIPM support for further review.'}</p>
                        </div>
                      ) : item.eligibilityStatus === 'requested' ? (
          """
          if candidate.count(old_request_block) != 1:
              raise SystemExit(f'Expected one candidate request block, found {candidate.count(old_request_block)}')
          candidate = candidate.replace(old_request_block, new_request_block, 1)

          old_download = """                          onClick={() => downloadIssuedCertificate(certificate)}
                            disabled={certificate.status !== 'active'}
                            className=\"inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 px-3 py-2 text-xs font-bold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-slate-300\"
                          >
                            <Download className=\"h-3.5 w-3.5\" /> Download issued PDF
          """
          new_download = """                          onClick={() => void handleDownload(certificate.id)}
                            disabled={certificate.status !== 'active' || downloadingCertificateId === certificate.id}
                            className=\"inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 px-3 py-2 text-xs font-bold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-slate-300\"
                          >
                            {downloadingCertificateId === certificate.id ? <Loader2 className=\"h-3.5 w-3.5 animate-spin\" /> : <Download className=\"h-3.5 w-3.5\" />} Download QR-coded PDF
          """
          if candidate.count(old_download) != 1:
              raise SystemExit(f'Expected one download button, found {candidate.count(old_download)}')
          candidate = candidate.replace(old_download, new_download, 1)
          candidate_path.write_text(candidate, encoding='utf-8')

          main_path = Path('src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          import_anchor = "import AdminCertificateManagementLauncher from './components/AdminCertificateManagementLauncher';\n"
          import_line = import_anchor + "import AdminCertificateCompletionLauncher from './components/AdminCertificateCompletionLauncher';\n"
          if main.count(import_anchor) != 1:
              raise SystemExit('Main import anchor is missing.')
          main = main.replace(import_anchor, import_line, 1)
          mount_anchor = '      <AdminCertificateManagementLauncher />\n'
          mount_line = mount_anchor + '      <AdminCertificateCompletionLauncher />\n'
          if main.count(mount_anchor) != 1:
              raise SystemExit('Main mount anchor is missing.')
          main = main.replace(mount_anchor, mount_line, 1)
          main_path.write_text(main, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript and production build
        run: |
          npm run lint
          npm run build

      - name: Remove one-time workflow and commit integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-phase-3-completion-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202607251800_phase_3_certificate_completion.sql src package.json .github/workflows/apply-phase-3-completion-integration.yml
          git diff --cached --check
          git commit -m 'Integrate Phase 3 certificate completion controls'
          git push origin HEAD:phase-3-certificate-completion
