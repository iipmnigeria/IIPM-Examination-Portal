name: Test Phase 2.4 Secure Delivery in Scratch Database

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-2-4-scratch-test.txt'

permissions:
  contents: read

concurrency:
  group: phase-2-4-scratch-database
  cancel-in-progress: true

jobs:
  exercise-secure-delivery:
    name: Apply and exercise Phase 2.4 SQL
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agilecert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agilecert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGURL: postgresql://postgres:postgres@localhost:5432/agilecert_test
      APPROVED_HEAD: fd197afa1f00b3a8c3b7f854fc05641858046d75
      MIGRATION_FILE: supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql

    steps:
      - name: Checkout exact Phase 2.4 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-4-secure-material-delivery
          fetch-depth: 0

      - name: Validate migration input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_HEAD"
          test -s "$MIGRATION_FILE"
          changed="$(git diff --name-only origin/supabase-integration...HEAD | grep -E '^supabase/migrations/' || true)"
          test "$changed" = "$MIGRATION_FILE"

      - name: Prepare compatible Phase 2.3B and Supabase baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phase-2-4-baseline.sql" <<'SQL'
          create extension if not exists pgcrypto;

          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;

          create schema if not exists auth;
          create schema if not exists storage;

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;

          create table public.profiles (
            id uuid primary key,
            role text not null,
            is_active boolean not null default true
          );

          create table public.programmes (
            id uuid primary key,
            code text not null,
            name text not null,
            is_active boolean not null default true
          );

          create table public.examinations (
            id uuid primary key,
            programme_id uuid not null references public.programmes(id),
            title text not null,
            status text not null default 'draft',
            requires_payment boolean not null default true
          );

          create table public.agilecert_preparation_materials (
            id uuid primary key default gen_random_uuid(),
            title text not null,
            description text,
            material_type text not null default 'study_guide',
            status text not null default 'draft',
            created_by uuid references public.profiles(id),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table public.agilecert_preparation_material_versions (
            id uuid primary key default gen_random_uuid(),
            material_id uuid not null references public.agilecert_preparation_materials(id) on delete cascade,
            version_number integer not null,
            version_label text,
            storage_bucket text not null,
            storage_path text not null,
            file_name text not null,
            mime_type text not null,
            size_bytes bigint not null default 0,
            checksum_sha256 text,
            status text not null default 'draft',
            published_at timestamptz,
            created_by uuid references public.profiles(id),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            unique (material_id, version_number),
            unique (storage_bucket, storage_path)
          );

          create unique index agilecert_one_published_material_version
            on public.agilecert_preparation_material_versions(material_id)
            where status = 'published';

          create table public.agilecert_exam_materials (
            examination_id uuid not null references public.examinations(id) on delete cascade,
            material_id uuid not null references public.agilecert_preparation_materials(id) on delete cascade,
            position integer not null default 1,
            is_required boolean not null default false,
            available_from timestamptz,
            expires_at timestamptz,
            is_active boolean not null default true,
            created_by uuid references public.profiles(id),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            primary key (examination_id, material_id)
          );

          create table public.agilecert_material_entitlements (
            id uuid primary key default gen_random_uuid(),
            candidate_id uuid not null references public.profiles(id) on delete cascade,
            examination_id uuid not null references public.examinations(id) on delete cascade,
            material_id uuid not null references public.agilecert_preparation_materials(id) on delete cascade,
            source_type text not null,
            source_order_id uuid,
            source_assignment_id uuid not null,
            status text not null default 'active',
            available_from timestamptz not null default now(),
            expires_at timestamptz,
            granted_at timestamptz not null default now(),
            revoked_at timestamptz,
            metadata jsonb not null default '{}'::jsonb,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            unique (candidate_id, examination_id, material_id)
          );

          create table storage.buckets (
            id text primary key,
            name text not null unique,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );

          create table storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null references storage.buckets(id) on delete cascade,
            name text not null,
            created_at timestamptz not null default now(),
            unique (bucket_id, name)
          );

          alter table storage.objects enable row level security;
          grant usage on schema public, auth, storage to anon, authenticated, service_role;
          grant select, insert, update, delete on storage.objects to authenticated, service_role;
          grant select on storage.buckets to authenticated, service_role;

          create or replace function public.is_exam_admin()
          returns boolean
          language sql
          stable
          security definer
          set search_path = public
          as $$
            select exists (
              select 1 from public.profiles p
              where p.id = auth.uid()
                and p.role in ('exam_admin', 'super_admin')
                and p.is_active = true
            );
          $$;

          create or replace function public.agilecert_require_material_admin()
          returns uuid
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          declare v_user_id uuid := auth.uid();
          begin
            if v_user_id is null then raise exception 'Authentication is required.'; end if;
            if not exists (
              select 1 from public.profiles p
              where p.id = v_user_id
                and p.role in ('exam_admin', 'super_admin')
                and p.is_active = true
            ) then
              raise exception 'Only an active examination administrator may manage preparation materials.';
            end if;
            return v_user_id;
          end;
          $$;

          create or replace function public.refresh_agilecert_material_entitlements(
            p_candidate_id uuid,
            p_examination_id uuid
          )
          returns void
          language plpgsql
          security definer
          set search_path = public
          as $$ begin return; end; $$;

          create or replace function public.set_agilecert_material_version_status(
            p_version_id uuid,
            p_status text
          )
          returns jsonb
          language plpgsql
          security definer
          set search_path = public
          as $$ begin return '{}'::jsonb; end; $$;

          alter table public.agilecert_material_entitlements enable row level security;
          grant select on public.agilecert_material_entitlements to authenticated;
          SQL

          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/phase-2-4-baseline.sql" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-baseline.log"

      - name: Apply Phase 2.4 migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$MIGRATION_FILE" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-migration-apply.log"

      - name: Exercise private publication, authorisation and audit behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phase-2-4-behaviour.sql" <<'SQL'
          set client_min_messages = warning;

          insert into public.profiles (id, role, is_active) values
            ('11111111-1111-4111-8111-111111111111', 'exam_admin', true),
            ('22222222-2222-4222-8222-222222222222', 'candidate', true),
            ('33333333-3333-4333-8333-333333333333', 'candidate', true);

          insert into public.programmes (id, code, name, is_active) values
            ('44444444-4444-4444-8444-444444444444', 'TEST', 'Test Programme', true);

          insert into public.examinations (id, programme_id, title, status, requires_payment) values
            ('55555555-5555-4555-8555-555555555555', '44444444-4444-4444-8444-444444444444', 'Test Examination', 'published', true);

          insert into public.agilecert_preparation_materials (
            id, title, description, material_type, status, created_by
          ) values (
            '66666666-6666-4666-8666-666666666666',
            'Secure Test Study Guide',
            'Scratch secure-delivery test',
            'study_guide',
            'draft',
            '11111111-1111-4111-8111-111111111111'
          );

          insert into public.agilecert_preparation_material_versions (
            id, material_id, version_number, version_label, storage_bucket,
            storage_path, file_name, mime_type, size_bytes, checksum_sha256,
            status, created_by
          ) values (
            '77777777-7777-4777-8777-777777777777',
            '66666666-6666-4666-8666-666666666666',
            1,
            '2026 Test Edition',
            'agilecert-preparation-materials',
            '66666666-6666-4666-8666-666666666666/test-guide.pdf',
            'test-guide.pdf',
            'application/pdf',
            128,
            repeat('a', 64),
            'draft',
            '11111111-1111-4111-8111-111111111111'
          );

          insert into public.agilecert_exam_materials (
            examination_id, material_id, position, is_required, is_active, created_by
          ) values (
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            1,
            true,
            true,
            '11111111-1111-4111-8111-111111111111'
          );

          insert into public.agilecert_material_entitlements (
            id, candidate_id, examination_id, material_id, source_type,
            source_assignment_id, status, available_from
          ) values (
            '88888888-8888-4888-8888-888888888888',
            '22222222-2222-4222-8222-222222222222',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            'admin_assignment',
            '99999999-9999-4999-8999-999999999999',
            'active',
            now() - interval '1 minute'
          );

          select set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false);

          do $$
          begin
            begin
              perform public.set_agilecert_material_version_status(
                '77777777-7777-4777-8777-777777777777', 'published'
              );
              raise exception 'Publishing unexpectedly succeeded without a private object.';
            exception
              when others then
                if sqlerrm not like '%uploaded private file could not be found%' then raise; end if;
            end;
          end;
          $$;

          insert into storage.objects (bucket_id, name) values (
            'agilecert-preparation-materials',
            '66666666-6666-4666-8666-666666666666/test-guide.pdf'
          );

          select public.set_agilecert_material_version_status(
            '77777777-7777-4777-8777-777777777777', 'published'
          );

          do $$
          begin
            if not exists (
              select 1 from public.agilecert_preparation_material_versions
              where id = '77777777-7777-4777-8777-777777777777'
                and status = 'published'
            ) then raise exception 'Version was not published.'; end if;

            if not exists (
              select 1 from public.agilecert_preparation_materials
              where id = '66666666-6666-4666-8666-666666666666'
                and status = 'published'
            ) then raise exception 'Logical material was not published.'; end if;

            if (select public from storage.buckets where id = 'agilecert-preparation-materials') then
              raise exception 'Preparation-material bucket is public.';
            end if;

            if has_function_privilege(
              'authenticated',
              'public.authorize_agilecert_material_download(uuid,uuid,uuid,uuid,text)',
              'EXECUTE'
            ) then raise exception 'Authenticated role can execute private authorisation RPC.'; end if;

            if not has_function_privilege(
              'service_role',
              'public.authorize_agilecert_material_download(uuid,uuid,uuid,uuid,text)',
              'EXECUTE'
            ) then raise exception 'Service role cannot execute private authorisation RPC.'; end if;
          end;
          $$;

          create temporary table authorised_result as
          select public.authorize_agilecert_material_download(
            '22222222-2222-4222-8222-222222222222',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'scratch-agent'
          ) as payload;

          do $$
          declare payload jsonb;
          begin
            select authorised_result.payload into payload from authorised_result;
            if coalesce((payload->>'authorized')::boolean, false) is not true then
              raise exception 'Authorised candidate was denied: %', payload;
            end if;
            if payload->>'storageBucket' <> 'agilecert-preparation-materials' then
              raise exception 'Authorisation returned the wrong private bucket.';
            end if;
            if payload->>'storagePath' <> '66666666-6666-4666-8666-666666666666/test-guide.pdf' then
              raise exception 'Authorisation returned the wrong private path.';
            end if;
            if (payload->>'signedUrlTtlSeconds')::integer <> 60 then
              raise exception 'Signed URL TTL is not 60 seconds.';
            end if;
          end;
          $$;

          create temporary table denied_result as
          select public.authorize_agilecert_material_download(
            '33333333-3333-4333-8333-333333333333',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'scratch-agent'
          ) as payload;

          do $$
          declare payload jsonb;
          declare audit_payload jsonb;
          begin
            select denied_result.payload into payload from denied_result;
            if coalesce((payload->>'authorized')::boolean, false) is true then
              raise exception 'Candidate without entitlement was authorised.';
            end if;
            if payload->>'reason' <> 'entitlement_missing' then
              raise exception 'Unexpected denial reason: %', payload;
            end if;

            select public.get_agilecert_material_download_audits(20) into audit_payload;
            if jsonb_array_length(audit_payload) <> 2 then
              raise exception 'Expected two audit records: %', audit_payload;
            end if;
            if not exists (
              select 1 from public.agilecert_material_download_audits
              where request_id = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                and status = 'requested'
            ) then raise exception 'Authorised request audit is missing.'; end if;
            if not exists (
              select 1 from public.agilecert_material_download_audits
              where request_id = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
                and status = 'denied'
                and failure_code = 'entitlement_missing'
            ) then raise exception 'Denied request audit is missing.'; end if;
          end;
          $$;

          set role authenticated;
          select set_config('request.jwt.claim.sub', '22222222-2222-4222-8222-222222222222', false);
          do $$
          begin
            if (select count(*) from storage.objects) <> 0 then
              raise exception 'Candidate can read private storage objects.';
            end if;
            if (select count(*) from public.agilecert_material_download_audits) <> 1 then
              raise exception 'Candidate cannot read exactly the candidate-owned audit record.';
            end if;
          end;
          $$;
          reset role;

          select 'phase-2-4-scratch-behaviour-passed' as result;
          SQL

          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/phase-2-4-behaviour.sql" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-behaviour.log"

      - name: Upload scratch database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-4-scratch-database-test
          path: |
            ${{ runner.temp }}/phase-2-4-baseline.log
            ${{ runner.temp }}/phase-2-4-migration-apply.log
            ${{ runner.temp }}/phase-2-4-behaviour.log
          if-no-files-found: warn
          retention-days: 3
