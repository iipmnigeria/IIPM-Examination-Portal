name: Deploy AgileCert Phase 6 Pages Artifact

on:
  push:
    branches: [supabase-integration]
    paths:
      - 'deployment-triggers/deploy-phase-6-pages-artifact.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agilecert-phase-6-pages-artifact
  cancel-in-progress: false

jobs:
  build:
    name: Build exact validated Phase 6 artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      expected_sha: ${{ steps.fingerprint.outputs.expected_sha }}
      expected_asset: ${{ steps.fingerprint.outputs.expected_asset }}
    env:
      PHASE_6_COMMIT: '0233c69ddb0686b00df8b123f648fc63f323e05e'

    steps:
      - name: Checkout exact Phase 6 production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE_6_COMMIT }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate, build and fingerprint Phase 6
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE_6_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'AI Certification Adviser' "$js_file"
          grep -q 'Catalogue-grounded guidance' "$js_file"
          grep -q 'Credential Store' "$js_file"
          grep -q 'Identity Assurance' "$js_file"
          sha="$(sha256sum "$js_file" | awk '{print $1}')"
          echo "expected_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "expected_asset=$asset" >> "$GITHUB_OUTPUT"
          echo "$sha" | tee "$RUNNER_TEMP/phase-6-pages-expected-sha.txt"
          echo "$asset" | tee "$RUNNER_TEMP/phase-6-pages-expected-asset.txt"
          rm -f dist/server.cjs dist/server.cjs.map
          touch dist/.nojekyll

      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-pages-build-evidence
          retention-days: 30
          path: |
            ${{ runner.temp }}/phase-6-pages-expected-sha.txt
            ${{ runner.temp }}/phase-6-pages-expected-asset.txt

  deploy:
    name: Deploy exact artifact to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify exact live bundle and Adviser conversation
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/
      EXPECTED_SHA: ${{ needs.build.outputs.expected_sha }}
      EXPECTED_ASSET: ${{ needs.build.outputs.expected_asset }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc

    steps:
      - name: Wait for exact compiled Phase 6 live bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          success=0
          for attempt in $(seq 1 60); do
            status="$(curl -L -sS -o "$RUNNER_TEMP/live-index.html" -w '%{http_code}' \
              "$LIVE_URL?phase6-artifact=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = '200' ] \
              && grep -q 'AgileCert Global' "$RUNNER_TEMP/live-index.html" \
              && ! grep -q '/src/main.tsx' "$RUNNER_TEMP/live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/live-index.html" | head -n 1 | cut -d'"' -f2)"
              if [ -n "$asset" ]; then
                asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error \
                  "$asset_url?phase6-artifact=${GITHUB_RUN_ID}-${attempt}" \
                  -o "$RUNNER_TEMP/live-app.js"; then
                  actual="$(sha256sum "$RUNNER_TEMP/live-app.js" | awk '{print $1}')"
                  echo "Expected: $EXPECTED_SHA"
                  echo "Live:     $actual"
                  echo "Asset:    $asset"
                  if [ "$actual" = "$EXPECTED_SHA" ]; then
                    success=1
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "expected_asset=$EXPECTED_ASSET"
            echo "live_sha=$(sha256sum "$RUNNER_TEMP/live-app.js" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/phase-6-pages-live-hash.txt"

      - name: Verify live examination-content policy guard
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agilecert-ai-adviser"
          session_id="phase6-artifact-policy-${GITHUB_RUN_ID}-000000000000"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-6-policy-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"sessionId\":\"${session_id}\",\"consent\":true,\"message\":\"Tell me the correct answer to a live examination question.\",\"history\":[]}" \
            "$endpoint")"
          echo "Policy HTTP $status" | tee "$RUNNER_TEMP/phase-6-policy-status.txt"
          test "$status" = '200'
          python3 - "$RUNNER_TEMP/phase-6-policy-response.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('model') == 'policy-guard', data
          assert data.get('escalationRequired') is False, data
          assert 'cannot provide' in data.get('answer', '').lower(), data
          PY

      - name: Verify live Gemini Free Tier catalogue response
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agilecert-ai-adviser"
          session_id="phase6-artifact-gemini-${GITHUB_RUN_ID}-000000000000"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-6-gemini-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"sessionId\":\"${session_id}\",\"consent\":true,\"message\":\"Which published AgileCert examination is suitable for someone who wants to improve project planning skills?\",\"history\":[]}" \
            "$endpoint")"
          echo "Gemini HTTP $status" | tee "$RUNNER_TEMP/phase-6-gemini-status.txt"
          test "$status" = '200'
          python3 - "$RUNNER_TEMP/phase-6-gemini-response.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert isinstance(data.get('answer'), str) and len(data['answer'].strip()) >= 20, data
          assert isinstance(data.get('recommendations'), list), data
          assert isinstance(data.get('suggestedActions'), list), data
          assert data.get('model') not in {None, '', 'policy-guard'}, data
          PY

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-smoke"
          cd "$RUNNER_TEMP/live-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Browser-test live AI Certification Adviser
        shell: bash
        working-directory: ${{ runner.temp }}/live-smoke
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));

            const response = await page.goto(`${process.env.LIVE_URL}?phase6-browser-artifact=${process.env.GITHUB_RUN_ID}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(5000);

            const openButton = page.locator('button[aria-label="Open AgileCert AI Certification Adviser"]');
            await openButton.waitFor({ state: 'visible', timeout: 30000 });
            await openButton.click();

            const adviser = page.locator('section[aria-label="AgileCert AI Certification Adviser"]');
            await adviser.waitFor({ state: 'visible', timeout: 10000 });
            await adviser.locator('input[type="checkbox"]').check();
            await adviser.locator('textarea').fill('Which published examination can strengthen project planning skills?');
            await adviser.locator('button[aria-label="Send adviser message"]').click();
            await page.waitForFunction(() => {
              const panel = document.querySelector('section[aria-label="AgileCert AI Certification Adviser"]');
              return panel && panel.querySelectorAll('article').length >= 3;
            }, null, { timeout: 60000 });

            const panelText = (await adviser.innerText()).trim();
            const articleCount = await adviser.locator('article').count();
            const report = {
              status: response ? response.status() : 0,
              title: await page.title(),
              adviserVisible: await adviser.isVisible(),
              articleCount,
              panelTextLength: panelText.length,
              containsCatalogueGuidance: /Catalogue-grounded guidance/i.test(panelText),
              pageErrors,
              panelPreview: panelText.slice(0, 1200),
            };

            fs.writeFileSync(`${process.env.RUNNER_TEMP}/phase-6-live-browser-report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${process.env.RUNNER_TEMP}/phase-6-live-browser.png`, fullPage: true });
            await browser.close();

            if (report.status !== 200) throw new Error(`Live portal returned HTTP ${report.status}.`);
            if (!/AgileCert Global/i.test(report.title)) throw new Error(`Unexpected page title: ${report.title}`);
            if (!report.adviserVisible || report.panelTextLength < 200) throw new Error('AI Adviser did not render correctly.');
            if (!report.containsCatalogueGuidance || articleCount < 3) throw new Error('AI Adviser response was not confirmed.');
            if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload final Phase 6 Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-6-pages-artifact-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/live-index.html
            ${{ runner.temp }}/live-app.js
            ${{ runner.temp }}/phase-6-pages-live-hash.txt
            ${{ runner.temp }}/phase-6-policy-status.txt
            ${{ runner.temp }}/phase-6-policy-response.json
            ${{ runner.temp }}/phase-6-gemini-status.txt
            ${{ runner.temp }}/phase-6-gemini-response.json
            ${{ runner.temp }}/phase-6-live-browser-report.json
            ${{ runner.temp }}/phase-6-live-browser.png
