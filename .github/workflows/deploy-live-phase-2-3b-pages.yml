name: Deploy Live Phase 2.3B Pages Bundle

on:
  push:
    branches:
      - pages-deploy
    paths:
      - 'deployment-triggers/deploy-live-phase-2-3b.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-live-phase-2-3b-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy approved Phase 2.3B bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APPROVED_APP_COMMIT: 'f3d6caae56e4a4ba9e0563a8549764d84dcc7f87'

    steps:
      - name: Checkout approved production branch
        uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Confirm approved application commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Verify compiled Phase 2.3B output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Production output still references the Vite source entry.'
            exit 1
          fi
          js_file="$(find dist/assets -maxdepth 1 -type f -name '*.js' | head -n 1)"
          test -s "$js_file"
          grep -q 'Material Management' "$js_file"
          grep -q 'get_agilecert_material_admin_console' "$js_file"
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload compiled Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy compiled Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
