name: Validate AgileCert Original Phase 4 Frontend

# Registered validation gate for the completed Phase 4 credential interface.
on:
  push:
    branches: [phase-4-professional-credential-system]
    paths:
      - 'src/services/credentialWalletService.ts'
      - 'src/components/CandidateCredentialWallet.tsx'
      - 'src/components/AdminCredentialLifecycleLauncher.tsx'
      - 'src/components/PublicCertificateVerification.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - '.github/workflows/validate-agilecert-original-phase-4-frontend.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'src/services/credentialWalletService.ts'
      - 'src/components/CandidateCredentialWallet.tsx'
      - 'src/components/AdminCredentialLifecycleLauncher.tsx'
      - 'src/components/PublicCertificateVerification.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - '.github/workflows/validate-agilecert-original-phase-4-frontend.yml'

permissions:
  contents: write

concurrency:
  group: validate-agilecert-original-phase-4-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate credential wallet frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify compiled Phase 4 capabilities
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Professional Credential Wallet'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Credential Lifecycle Administration'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'IIPM Professional Record Verification'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Add to LinkedIn'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Save CPD draft'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Request renewal'
          find dist -type f -name '*.js' -print0 | xargs -0 grep -q 'Temporary share link'

      - name: Confirm protected frontend boundaries
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/supabase-integration...HEAD)"
          forbidden='^src/services/(commerceService|examService|preparationMaterialService|materialAdminService|certificateCommerceService|identityAssuranceService|aiCertificationAdviserService)\.ts$|^src/components/(CandidateCommerceOverlay|PaymentReturnHandler|AdminCommerceConsole|ExamScreen|StudentDashboard|AdminPortal|CandidatePreparationMaterialsPanel|AdminMaterialManagementPanel|CandidateIdentityAssurance|AdminIdentityAssuranceLauncher|AiCertificationAdviser)\.tsx$|^supabase/functions/'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Upload frontend validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-original-phase-4-frontend-evidence
          path: dist
          if-no-files-found: warn
          retention-days: 30

      - name: Record successful frontend validation
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > docs/AGILECERT_PHASE_4_FRONTEND_VALIDATION_STATUS.md <<EOF
          # Original Phase 4 frontend validation status

          - Result: **PASSED**
          - Source commit: $COMMIT_SHA
          - Workflow run: $RUN_ID
          - Dependency installation: success
          - TypeScript validation: success
          - Production build: success
          - Compiled capability markers: success
          - Protected frontend scope: success
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AGILECERT_PHASE_4_FRONTEND_VALIDATION_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record original Phase 4 frontend validation PASSED'
            git push origin HEAD:phase-4-professional-credential-system
          fi
