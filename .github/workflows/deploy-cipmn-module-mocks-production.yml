name: Deploy CIPMN Module Mock Examinations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-cipmn-module-mocks.txt'

permissions:
  contents: read

concurrency:
  group: deploy-cipmn-module-mocks-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply and verify CIPMN module examination bank
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_COMMIT: '232df17d08687673446dd1708e2c137458596faf'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      TRACKING_BOUNDARY: '202607230101'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify approved source and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > cipmn-expected-migrations.txt <<'EOF'
          202607251701_cipmn_module_mock_exam_catalogue.sql
          202607251702_cipmn_mod_001_mock_questions.sql
          202607251703_cipmn_mod_002_mock_questions.sql
          202607251704_cipmn_mod_003_mock_questions.sql
          202607251705_cipmn_mod_004_mock_questions.sql
          202607251706_cipmn_mod_005_mock_questions.sql
          202607251707_cipmn_mod_006_mock_questions.sql
          202607251708_cipmn_mod_007_mock_questions.sql
          202607251709_cipmn_mod_008_mock_questions.sql
          202607251710_cipmn_mod_009_mock_questions.sql
          202607251711_cipmn_mod_010_mock_questions.sql
          202607251712_cipmn_mod_011_mock_questions.sql
          202607251713_cipmn_mod_012_mock_questions.sql
          202607251714_cipmn_module_mock_access88_coupon.sql
          202607251715_cipmn_module_mock_pass_mark_70.sql
          EOF

          while IFS= read -r migration; do
            test -s "supabase/migrations/$migration"
          done < cipmn-expected-migrations.txt
          test "$(wc -l < cipmn-expected-migrations.txt | tr -d ' ')" -eq 15

      - name: Isolate production-tracked migration window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-local-migrations"
          : > cipmn-legacy-local-migrations.txt
          moved=0
          for migration in supabase/migrations/*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            if [[ "$version" < "$TRACKING_BOUNDARY" ]]; then
              basename "$migration" >> cipmn-legacy-local-migrations.txt
              mv "$migration" "$RUNNER_TEMP/legacy-local-migrations/"
              moved=$((moved + 1))
            fi
          done
          sort -o cipmn-legacy-local-migrations.txt cipmn-legacy-local-migrations.txt
          test "$moved" -gt 0
          test -s supabase/migrations/202607230101_phase_2_candidate_profile_foundation.sql
          test -s supabase/migrations/202607230102_phase_2_candidate_profile_photo.sql
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tee cipmn-isolated-migration-window.txt
          awk -F_ -v boundary="$TRACKING_BOUNDARY" '$1 < boundary { print "Unexpected pre-tracking migration remains: " $0 > "/dev/stderr"; exit 1 }' cipmn-isolated-migration-window.txt

      - name: Link production and require the exact 15 migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-production-dry-run.log
          grep -Eo '202[0-9]{9,}' cipmn-production-dry-run.log | sort -u > cipmn-pending-versions.txt || true
          cut -d_ -f1 cipmn-expected-migrations.txt | sort -u > cipmn-expected-versions.txt
          diff -u cipmn-expected-versions.txt cipmn-pending-versions.txt
          test "$(wc -l < cipmn-pending-versions.txt | tr -d ' ')" -eq 15

      - name: Apply approved CIPMN migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-production-deploy.log

      - name: Verify production examination bank and coupon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          query = r"""
          with programme as (
            select id from public.programmes where code = 'CIPMN-MOCK' and is_active = true limit 1
          ), examinations_data as (
            select e.*
            from public.examinations e
            join programme p on p.id = e.programme_id
          ), quotes as (
            select jsonb_agg(
              jsonb_build_object(
                'title', e.title,
                'listAmountMinor', q.list_amount_minor,
                'discountAmountMinor', q.discount_amount_minor,
                'payableAmountMinor', q.payable_amount_minor,
                'couponCode', q.coupon_code
              ) order by e.title
            ) as value
            from examinations_data e
            cross join lateral public.resolve_exam_purchase_quote(
              e.id,
              gen_random_uuid(),
              'NGN',
              'CIPMN12-ACCESS88'
            ) q
            where e.status = 'published'
          )
          select jsonb_build_object(
            'programmeCode', 'CIPMN-MOCK',
            'examinationCount', (select count(*) from examinations_data),
            'publishedCount', (select count(*) from examinations_data where status = 'published'),
            'questionCount', (
              select count(*)
              from public.questions q
              join examinations_data e on e.id = q.examination_id
              where q.is_active = true
            ),
            'optionCount', (
              select count(*)
              from public.question_options qo
              join public.questions q on q.id = qo.question_id and q.is_active = true
              join examinations_data e on e.id = q.examination_id
            ),
            'answerKeyCount', (
              select count(*)
              from public.question_answer_keys k
              join public.questions q on q.id = k.question_id and q.is_active = true
              join examinations_data e on e.id = q.examination_id
              join public.question_options qo
                on qo.id = k.correct_option_id
               and qo.question_id = q.id
            ),
            'invalidQuestionBankCount', (
              select count(*)
              from examinations_data e
              where (
                select count(*) from public.questions q
                where q.examination_id = e.id and q.is_active = true
              ) <> 75
            ),
            'invalidConfigurationCount', (
              select count(*)
              from examinations_data e
              where e.status <> 'published'
                 or e.duration_minutes <> 120
                 or e.pass_mark <> 70
                 or e.max_attempts <> 1
                 or e.allow_self_enrollment = true
                 or e.requires_payment = false
                 or e.randomize_questions = false
                 or e.randomize_options = false
                 or not exists (
                   select 1 from public.exam_prices ep
                   where ep.examination_id = e.id
                     and ep.currency = 'NGN'
                     and ep.amount_minor = 2500000
                     and ep.is_default = true
                     and ep.is_active = true
                     and ep.effective_from <= now()
                     and (ep.effective_to is null or ep.effective_to > now())
                 )
            ),
            'coupon', (
              select jsonb_build_object(
                'code', c.code,
                'discountType', c.discount_type,
                'discountValue', c.discount_value,
                'currency', c.currency,
                'scope', c.scope,
                'programmeId', c.programme_id,
                'examinationId', c.examination_id,
                'maximumRedemptions', c.maximum_redemptions,
                'perCandidateLimit', c.per_candidate_limit,
                'isActive', c.is_active,
                'startsAt', c.starts_at,
                'expiresAt', c.expires_at
              )
              from public.coupons c
              join programme p on p.id = c.programme_id
              where upper(c.code) = 'CIPMN12-ACCESS88'
            ),
            'quotes', (select value from quotes)
          ) as verification;
          """
          with open('/tmp/cipmn-production-query.json', 'w', encoding='utf-8') as handle:
              json.dump({'query': query}, handle)
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/cipmn-production-query.json \
            -o cipmn-production-verification.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta

          data = json.load(open('cipmn-production-verification.json', encoding='utf-8'))
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('programmeCode') == 'CIPMN-MOCK', result
          assert result.get('examinationCount') == 12, result
          assert result.get('publishedCount') == 12, result
          assert result.get('questionCount') == 900, result
          assert result.get('optionCount') == 3600, result
          assert result.get('answerKeyCount') == 900, result
          assert result.get('invalidQuestionBankCount') == 0, result
          assert result.get('invalidConfigurationCount') == 0, result

          coupon = result.get('coupon') or {}
          assert coupon.get('code') == 'CIPMN12-ACCESS88', coupon
          assert coupon.get('discountType') == 'percentage', coupon
          assert float(coupon.get('discountValue')) == 88, coupon
          assert coupon.get('currency') == 'NGN', coupon
          assert coupon.get('scope') == 'programme', coupon
          assert coupon.get('programmeId'), coupon
          assert coupon.get('examinationId') is None, coupon
          assert coupon.get('maximumRedemptions') is None, coupon
          assert coupon.get('perCandidateLimit') == 12, coupon
          assert coupon.get('isActive') is True, coupon

          starts_at = datetime.fromisoformat(coupon['startsAt'].replace('Z', '+00:00'))
          expires_at = datetime.fromisoformat(coupon['expiresAt'].replace('Z', '+00:00'))
          assert expires_at - starts_at == timedelta(days=14), coupon

          quotes = result.get('quotes') or []
          assert len(quotes) == 12, quotes
          for quote in quotes:
              assert quote.get('listAmountMinor') == 2500000, quote
              assert quote.get('discountAmountMinor') == 2200000, quote
              assert quote.get('payableAmountMinor') == 300000, quote
              assert quote.get('couponCode') == 'CIPMN12-ACCESS88', quote

          safe = {
              'programmeCode': result['programmeCode'],
              'examinationCount': result['examinationCount'],
              'questionCount': result['questionCount'],
              'optionCount': result['optionCount'],
              'answerKeyCount': result['answerKeyCount'],
              'passMark': 70,
              'durationMinutes': 120,
              'standardPriceMinor': 2500000,
              'couponCode': coupon['code'],
              'discountPercent': coupon['discountValue'],
              'discountedPriceMinor': 300000,
              'couponStartsAt': coupon['startsAt'],
              'couponExpiresAt': coupon['expiresAt'],
              'couponPerCandidateLimit': coupon['perCandidateLimit'],
              'verifiedQuoteCount': len(quotes),
          }
          with open('cipmn-production-safe.json', 'w', encoding='utf-8') as handle:
              json.dump(safe, handle, indent=2)
          print(json.dumps(safe, indent=2))
          PY

      - name: Confirm no migrations remain pending
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-post-deploy-dry-run.log
          grep -Eo '202[0-9]{9,}' cipmn-post-deploy-dry-run.log | sort -u > cipmn-post-deploy-pending.txt || true
          test ! -s cipmn-post-deploy-pending.txt

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-module-mocks-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            cipmn-expected-migrations.txt
            cipmn-legacy-local-migrations.txt
            cipmn-isolated-migration-window.txt
            cipmn-production-dry-run.log
            cipmn-expected-versions.txt
            cipmn-pending-versions.txt
            cipmn-production-deploy.log
            cipmn-production-safe.json
            cipmn-post-deploy-dry-run.log
            cipmn-post-deploy-pending.txt
