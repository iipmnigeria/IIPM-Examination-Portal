name: Fix Phase 3 Template Backfill Query

on:
  push:
    branches: [phase-3-certificate-completion]
    paths:
      - '.github/workflows/fix-phase-3-template-backfill.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0

      - name: Correct PostgreSQL update-from join scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202607251800_phase_3_certificate_completion.sql')
          text = path.read_text(encoding='utf-8')
          old = """from public.examinations e
          join public.agilecert_certificate_templates t
            on t.programme_id = e.programme_id
           and t.product_code = case
             when lower(coalesce(nullif(c.metadata->>'productCode', ''), 'achievement')) = 'professional'
               then 'professional'
             else 'achievement'
           end
           and t.active = true
          where e.id = c.examination_id
            and c.template_id is null;
          """
          new = """from public.examinations e,
               public.agilecert_certificate_templates t
          where e.id = c.examination_id
            and t.programme_id = e.programme_id
            and t.product_code = case
              when lower(coalesce(nullif(c.metadata->>'productCode', ''), 'achievement')) = 'professional'
                then 'professional'
              else 'achievement'
            end
            and t.active = true
            and c.template_id is null;
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one template backfill block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-phase-3-template-backfill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202607251800_phase_3_certificate_completion.sql .github/workflows/fix-phase-3-template-backfill.yml
          git diff --cached --check
          git commit -m 'Fix Phase 3 certificate template backfill query'
          git push origin HEAD:phase-3-certificate-completion
