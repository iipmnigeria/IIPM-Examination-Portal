name: Validate CIPMN EL06 International Programs Portfolios
on:
  push:
    branches: [safe/cipmn-el06-international-programs-portfolios]
    paths:
      - 'supabase/migrations/20260926160000_cipmn_el06_international_programs_portfolios.sql'
      - 'scripts/validate-cipmn-el06-international-programs-portfolios.mjs'
      - '.github/workflows/validate-cipmn-el06-international-programs-portfolios.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/20260926160000_cipmn_el06_international_programs_portfolios.sql'
      - 'scripts/validate-cipmn-el06-international-programs-portfolios.mjs'
      - '.github/workflows/validate-cipmn-el06-international-programs-portfolios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-cipmn-el06-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate EL06 source-strict elective
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate EL06 source scope, structure and migration safety
        run: node scripts/validate-cipmn-el06-international-programs-portfolios.mjs
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Existing TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
