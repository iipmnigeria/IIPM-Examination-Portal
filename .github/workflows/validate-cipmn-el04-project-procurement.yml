name: Validate CIPMN EL04 Project Procurement

on:
  push:
    branches:
      - safe/cipmn-el04-project-procurement
    paths:
      - 'supabase/migrations/20260926123000_cipmn_el04_project_procurement.sql'
      - 'scripts/validate-cipmn-el04-project-procurement.mjs'
      - '.github/workflows/validate-cipmn-el04-project-procurement.yml'
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'supabase/migrations/20260926123000_cipmn_el04_project_procurement.sql'
      - 'scripts/validate-cipmn-el04-project-procurement.mjs'
      - '.github/workflows/validate-cipmn-el04-project-procurement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cipmn-el04-project-procurement-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate EL04 source-strict elective
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate changes
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate EL04 source scope, thresholds, structure and migration safety
        run: node scripts/validate-cipmn-el04-project-procurement.mjs
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Existing TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
