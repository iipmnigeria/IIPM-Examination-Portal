name: Diagnose CIPMN Print Chunks

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/assets/cipmnCertificatePrint/**'
      - '.github/workflows/diagnose-cipmn-print-chunks.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report chunk lengths and decodability
        shell: python
        run: |
          import base64
          import hashlib
          import re
          from pathlib import Path

          groups = {'iipm': 7, 'cipmn': 6, 'signature': 4}
          for name, count in groups.items():
              encoded = ''
              for index in range(1, count + 1):
                  path = Path(f'src/assets/cipmnCertificatePrint/{name}{index}.ts')
                  source = path.read_text(encoding='utf-8')
                  match = re.search(r"= '([A-Za-z0-9+/=]+)';", source)
                  if not match:
                      print(f'{name}{index}: malformed')
                      continue
                  chunk = match.group(1)
                  encoded += chunk
                  print(f'{name}{index}: {len(chunk)} characters')
              print(f'{name}: total={len(encoded)} characters')
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  print(f'{name}: decoded={len(raw)} bytes sha256={hashlib.sha256(raw).hexdigest()}')
              except Exception as error:
                  print(f'{name}: decode_error={error}')
