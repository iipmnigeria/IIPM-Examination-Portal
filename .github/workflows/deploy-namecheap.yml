name: Deploy Current AgileCert to Namecheap

on:
  push:
    branches:
      - supabase-integration
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agilecert-namecheap-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy current AgileCert portal
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current portal branch
        uses: actions/checkout@v6
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate deployment configuration
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_USER: ${{ secrets.NAMECHEAP_USER }}
          NAMECHEAP_APP_PATH: ${{ secrets.NAMECHEAP_APP_PATH }}
          NAMECHEAP_SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          NAMECHEAP_SSH_KEY_PASSPHRASE: ${{ secrets.NAMECHEAP_SSH_KEY_PASSPHRASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for variable in \
            NAMECHEAP_HOST \
            NAMECHEAP_PORT \
            NAMECHEAP_USER \
            NAMECHEAP_APP_PATH \
            NAMECHEAP_SSH_PRIVATE_KEY \
            NAMECHEAP_SSH_KEY_PASSPHRASE \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY
          do
            if [ -z "${!variable:-}" ]; then
              echo "Required GitHub Actions secret is missing: $variable"
              exit 1
            fi
          done

      - name: Install, validate and build current frontend
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

          npm install --no-audit --no-fund
          npm run lint
          npm run build

          test -s dist/index.html
          test -d dist/assets
          grep -q 'AgileCert Global' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html

          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'AI Certification Adviser' "$js_file"

          rm -f dist/server.cjs dist/server.cjs.map
          touch dist/.nojekyll

          cat > dist/deployment.json <<JSON
          {
            "branch": "supabase-integration",
            "commit": "$source_sha",
            "target": "agilecert.iipmi.org"
          }
          JSON

      - name: Create minimal Namecheap static server
        run: |
          cat > app.js <<'JS'
          import express from 'express';
          import path from 'path';
          import { fileURLToPath } from 'url';

          const app = express();
          const port = Number(process.env.PORT || 3000);
          const fileName = fileURLToPath(import.meta.url);
          const directory = path.dirname(fileName);
          const distPath = path.join(directory, 'dist');

          app.disable('x-powered-by');

          app.get('/healthz', (_request, response) => {
            response.json({ ok: true, service: 'agilecert' });
          });

          app.use(express.static(distPath, {
            etag: true,
            maxAge: '1h',
            index: 'index.html',
          }));

          app.get('*', (_request, response) => {
            response.sendFile(path.join(distPath, 'index.html'));
          });

          app.listen(port, '0.0.0.0', () => {
            console.log(`AgileCert static server listening on port ${port}`);
          });
          JS

          test -s app.js
          test -s package-lock.json

      - name: Configure SSH
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          NAMECHEAP_SSH_KEY_PASSPHRASE: ${{ secrets.NAMECHEAP_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$NAMECHEAP_SSH_PRIVATE_KEY" > "$HOME/.ssh/namecheap_agilecert"
          chmod 600 "$HOME/.ssh/namecheap_agilecert"

          ssh-keygen \
            -p \
            -P "$NAMECHEAP_SSH_KEY_PASSPHRASE" \
            -N "" \
            -f "$HOME/.ssh/namecheap_agilecert" \
            >/dev/null

          ssh-keyscan -p "$NAMECHEAP_PORT" -H "$NAMECHEAP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package release
        run: |
          set -euo pipefail
          tar -czf "/tmp/agilecert-${SOURCE_SHA}.tar.gz" \
            dist \
            app.js \
            package.json \
            package-lock.json

      - name: Upload release to Namecheap
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_USER: ${{ secrets.NAMECHEAP_USER }}
          NAMECHEAP_APP_PATH: ${{ secrets.NAMECHEAP_APP_PATH }}
        run: |
          set -euo pipefail
          scp \
            -P "$NAMECHEAP_PORT" \
            -i "$HOME/.ssh/namecheap_agilecert" \
            "/tmp/agilecert-${SOURCE_SHA}.tar.gz" \
            "$NAMECHEAP_USER@$NAMECHEAP_HOST:$NAMECHEAP_APP_PATH/.agilecert-${SOURCE_SHA}.tar.gz"

      - name: Activate release and restart application
        env:
          NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
          NAMECHEAP_USER: ${{ secrets.NAMECHEAP_USER }}
          NAMECHEAP_APP_PATH: ${{ secrets.NAMECHEAP_APP_PATH }}
        run: |
          set -euo pipefail
          ssh \
            -p "$NAMECHEAP_PORT" \
            -i "$HOME/.ssh/namecheap_agilecert" \
            "$NAMECHEAP_USER@$NAMECHEAP_HOST" \
            "APP_PATH='$NAMECHEAP_APP_PATH' RELEASE_SHA='$SOURCE_SHA' CPANEL_USER='$NAMECHEAP_USER' bash -s" <<'REMOTE'
          set -euo pipefail

          archive="$APP_PATH/.agilecert-$RELEASE_SHA.tar.gz"
          release="$APP_PATH/.releases/$RELEASE_SHA"
          app_name="$(basename "$APP_PATH")"

          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"

          rm -rf "$APP_PATH/dist.previous"
          if [ -d "$APP_PATH/dist" ]; then
            mv "$APP_PATH/dist" "$APP_PATH/dist.previous"
          fi

          mv "$release/dist" "$APP_PATH/dist"
          cp "$release/app.js" "$APP_PATH/app.js"
          cp "$release/package.json" "$APP_PATH/package.json"
          cp "$release/package-lock.json" "$APP_PATH/package-lock.json"

          set +u
          source "/home/$CPANEL_USER/nodevenv/$app_name/22/bin/activate"
          set -u

          cd "$APP_PATH"
          npm install --omit=dev --omit=optional --no-audit --no-fund

          test -s "$APP_PATH/dist/index.html"
          test -s "$APP_PATH/dist/deployment.json"
          test -s "$APP_PATH/app.js"

          mkdir -p "$APP_PATH/tmp"
          touch "$APP_PATH/tmp/restart.txt"

          rm -rf "$release" "$archive"
          REMOTE

      - name: Verify live deployment
        run: |
          set -euo pipefail
          sleep 20

          response_file="$(mktemp)"
          status="$({ curl \
            --location \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --retry 4 \
            --retry-delay 10 \
            --max-time 30 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127 Safari/537.36' \
            --header 'Accept: text/html,application/xhtml+xml,*/*' \
            https://agilecert.iipmi.org/; } || true)"

          case "$status" in
            200)
              grep -q 'AgileCert Global' "$response_file"
              echo "AgileCert production deployment is live from commit $SOURCE_SHA."
              ;;
            403)
              echo "::warning::Namecheap returned HTTP 403 to GitHub's external check. Server-side deployment and restart completed for commit $SOURCE_SHA."
              ;;
            000|502|503)
              echo "The application did not become healthy after restart. HTTP status: $status"
              cat "$response_file" || true
              exit 1
              ;;
            *)
              echo "Unexpected live-check status: $status"
              cat "$response_file" || true
              exit 1
              ;;
          esac
