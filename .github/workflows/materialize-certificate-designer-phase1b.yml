name: Materialize Certificate Designer Phase 1B

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/materialize-certificate-designer-phase1b.txt'

permissions:
  contents: write

concurrency:
  group: materialize-certificate-designer-phase1b
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize validated Phase 1B source
        shell: bash
        run: |
          set -euo pipefail
          cat deployment-triggers/phase1b-payload/part-* \
            | base64 --decode > /tmp/certificate-designer-phase1b.tar.gz
          echo 'aa8983f83144046ed809d106bd901cd52dfd95f4a36ed88939092a1cd4e0e163  /tmp/certificate-designer-phase1b.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/certificate-designer-phase1b.tar.gz
          rm -rf deployment-triggers/phase1b-payload
          rm -f .github/workflows/materialize-certificate-designer-phase1b.yml
          rm -f deployment-triggers/materialize-certificate-designer-phase1b.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build Certificate Visual Designer Phase 1B'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
