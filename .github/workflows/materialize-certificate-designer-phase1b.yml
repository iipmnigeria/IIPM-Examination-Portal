name: Materialize Certificate Designer Phase 1B
on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/materialize-certificate-designer-phase1b.txt'
permissions:
  contents: write
concurrency:
  group: materialize-certificate-designer-phase1b
  cancel-in-progress: false
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize validated Phase 1B source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '.github/workflows'
          printf '%s' '' | base64 -d | gzip -d > '.github/workflows/validate-certificate-visual-designer-phase1b.yml'
          mkdir -p 'docs'
          printf '%s' '' | base64 -d | gzip -d > 'docs/CERTIFICATE_VISUAL_DESIGNER_PHASE1B_SCOPE.md'
          mkdir -p 'src/components'
          printf '%s' '[... ELLIPSIZATION ...]0yx9hytlOmxfyKWEQ65H3DhfOsj9Ik7M0vHW+bggxfKsPUgtXmHMvJJCqaEnVmv9uGmRjZKP/rlZ7JPjg4PrJfborObxH78kbhLbpqyfm9IDlHYHyRgfdw7v3l57R3dvrQeOrXdt9+3rRNPmhq7/bIFR1/txy2nSjxKSCCqmSswSEf/BmL1RmeCJwAA' | base64 -d | gzip -d > 'src/services/certificateDesignerService.ts'
          mkdir -p 'supabase/migrations'
          printf '%s' '' | base64 -d | gzip -d > 'supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql'
          mkdir -p 'supabase/tests'
          printf '%s' '' | base64 -d | gzip -d > 'supabase/tests/certificate_visual_designer_phase1b_smoke.sql'
          rm -f .github/workflows/materialize-certificate-designer-phase1b.yml deployment-triggers/materialize-certificate-designer-phase1b.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Certificate Visual Designer Phase 1B'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
