name: Deploy Certificate Renderer Examination Code Compatibility

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-certificate-renderer-examination-code-production.txt'

permissions:
  contents: read

concurrency:
  group: deploy-certificate-renderer-examination-code-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy and verify examination code compatibility
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_COMMIT: 'f73a3f8c0b71ee94172e5a44a6843816803f3487'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify exact approved release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -s supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          test -s supabase/tests/certificate_renderer_examination_code_compatibility_smoke.sql
          grep -q 'add column if not exists code text' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          grep -q 'agilecert_examinations_derive_code' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          grep -q 'alter column code set not null' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql
          ! grep -R -E '(sk_(live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,})' \
            supabase/migrations/202608012300_certificate_renderer_examination_code_compatibility.sql

      - name: Rebuild approved application source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Snapshot protected production state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              function_row.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(function_row.oid)) as definition_hash
            from pg_proc function_row
            join pg_namespace namespace_row
              on namespace_row.oid = function_row.pronamespace
            where namespace_row.nspname = 'public'
              and function_row.proname in (
                'get_certificate_management_console_snapshot',
                'get_agilecert_certificate_server_render_context',
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order'
              )
          )
          select jsonb_build_object(
            'examinations', (select count(*) from public.examinations),
            'examinationIdentityHash', (
              select md5(coalesce(string_agg(
                examination.id::text || ':' ||
                coalesce(examination.programme_id::text, '') || ':' ||
                coalesce(examination.title, ''),
                '|' order by examination.id
              ), ''))
              from public.examinations examination
            ),
            'attempts', (select count(*) from public.attempts),
            'issuedCertificates', (
              select count(*) from public.agilecert_issued_certificates
            ),
            'certificateIdentityHash', (
              select md5(coalesce(string_agg(
                certificate.id::text || ':' ||
                certificate.candidate_id::text || ':' ||
                certificate.examination_id::text || ':' ||
                certificate.certificate_number || ':' ||
                certificate.verification_code || ':' ||
                certificate.status,
                '|' order by certificate.id
              ), ''))
              from public.agilecert_issued_certificates certificate
            ),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'masterTemplates', (
              select count(*) from public.agilecert_certificate_master_templates
            ),
            'masterVersions', (
              select count(*) from public.agilecert_certificate_master_versions
            ),
            'masterAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
            ),
            'rendererEnabledAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
              where renderer_enabled
            ),
            'renderBindings', (
              select count(*) from public.agilecert_certificate_render_bindings
            ),
            'renderJobs', (
              select count(*) from public.agilecert_certificate_render_jobs
            ),
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(
                identity || ':' || definition_hash,
                '|' order by identity
              ), ''))
              from protected_functions
            )
          ) as verification;
          """
          Path('/tmp/examination-code-pre-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/examination-code-pre-query.json \
            -o examination-code-pre-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('examination-code-pre-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('protectedFunctionCount', 0) >= 5, result
          assert result.get('rendererEnabledAssignments') == 0, result
          assert result.get('renderBindings') == 0, result
          assert result.get('renderJobs') == 0, result
          Path('examination-code-pre-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Require exactly one approved pending migration
        shell: bash
        run: |
          set -o pipefail
          printf '%s\n' '202608012300_certificate_renderer_examination_code_compatibility.sql' \
            > examination-code-expected-migrations.txt
          supabase db push --linked --dry-run 2>&1 \
            | tee examination-code-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' \
            examination-code-production-dry-run.log \
            | sort -u > examination-code-production-pending.txt || true
          diff -u examination-code-expected-migrations.txt \
            examination-code-production-pending.txt
          test "$(wc -l < examination-code-production-pending.txt | tr -d ' ')" -eq 1

      - name: Apply approved compatibility migration
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked 2>&1 \
            | tee examination-code-production-deploy.log
          grep -q 'Applying migration 202608012300_certificate_renderer_examination_code_compatibility.sql' \
            examination-code-production-deploy.log
          grep -q 'Finished supabase db push' examination-code-production-deploy.log

      - name: Verify live compatibility and preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              function_row.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(function_row.oid)) as definition_hash
            from pg_proc function_row
            join pg_namespace namespace_row
              on namespace_row.oid = function_row.pronamespace
            where namespace_row.nspname = 'public'
              and function_row.proname in (
                'get_certificate_management_console_snapshot',
                'get_agilecert_certificate_server_render_context',
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order'
              )
          )
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '202608012300'
            ),
            'codeColumnNotNull', exists (
              select 1 from information_schema.columns columns
              where columns.table_schema = 'public'
                and columns.table_name = 'examinations'
                and columns.column_name = 'code'
                and columns.is_nullable = 'NO'
            ),
            'codeTriggerActive', exists (
              select 1 from pg_trigger trigger_row
              where trigger_row.tgrelid = 'public.examinations'::regclass
                and trigger_row.tgname = 'agilecert_examinations_derive_code'
                and not trigger_row.tgisinternal
            ),
            'invalidCodes', (
              select count(*) from public.examinations examination
              where examination.code is null
                 or examination.code !~ '^[A-Z0-9][A-Z0-9._-]{1,79}$'
            ),
            'codedExaminations', (
              select count(*) from public.examinations
              where code is not null and length(code) >= 2
            ),
            'examinations', (select count(*) from public.examinations),
            'examinationIdentityHash', (
              select md5(coalesce(string_agg(
                examination.id::text || ':' ||
                coalesce(examination.programme_id::text, '') || ':' ||
                coalesce(examination.title, ''),
                '|' order by examination.id
              ), ''))
              from public.examinations examination
            ),
            'attempts', (select count(*) from public.attempts),
            'issuedCertificates', (
              select count(*) from public.agilecert_issued_certificates
            ),
            'certificateIdentityHash', (
              select md5(coalesce(string_agg(
                certificate.id::text || ':' ||
                certificate.candidate_id::text || ':' ||
                certificate.examination_id::text || ':' ||
                certificate.certificate_number || ':' ||
                certificate.verification_code || ':' ||
                certificate.status,
                '|' order by certificate.id
              ), ''))
              from public.agilecert_issued_certificates certificate
            ),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'bulkOrders', (select count(*) from public.exam_bulk_orders),
            'bulkPayments', (select count(*) from public.exam_bulk_payments),
            'masterTemplates', (
              select count(*) from public.agilecert_certificate_master_templates
            ),
            'masterVersions', (
              select count(*) from public.agilecert_certificate_master_versions
            ),
            'masterAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
            ),
            'rendererEnabledAssignments', (
              select count(*) from public.agilecert_certificate_master_assignments
              where renderer_enabled
            ),
            'renderBindings', (
              select count(*) from public.agilecert_certificate_render_bindings
            ),
            'renderJobs', (
              select count(*) from public.agilecert_certificate_render_jobs
            ),
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(
                identity || ':' || definition_hash,
                '|' order by identity
              ), ''))
              from protected_functions
            )
          ) as verification;
          """
          Path('/tmp/examination-code-post-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/examination-code-post-query.json \
            -o examination-code-post-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path

          pre = json.loads(Path('examination-code-pre-safe.json').read_text())
          data = json.loads(Path('examination-code-post-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          post = data[0].get('verification') or {}

          assert post.get('migrationApplied') is True, post
          assert post.get('codeColumnNotNull') is True, post
          assert post.get('codeTriggerActive') is True, post
          assert post.get('invalidCodes') == 0, post
          assert post.get('codedExaminations') == post.get('examinations'), post

          preserved = [
            'examinations', 'examinationIdentityHash', 'attempts',
            'issuedCertificates', 'certificateIdentityHash',
            'examOrders', 'examPayments', 'bulkOrders', 'bulkPayments',
            'masterTemplates', 'masterVersions', 'masterAssignments',
            'rendererEnabledAssignments', 'renderBindings', 'renderJobs',
            'protectedFunctionCount', 'protectedFunctionHash'
          ]
          for key in preserved:
            assert post.get(key) == pre.get(key), (key, pre.get(key), post.get(key))

          Path('examination-code-post-safe.json').write_text(
              json.dumps(post, indent=2), encoding='utf-8'
          )
          print(json.dumps(post, indent=2))
          PY

      - name: Confirm production migration ledger is current
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 \
            | tee examination-code-production-final-dry-run.log
          grep -q 'Remote database is up to date' \
            examination-code-production-final-dry-run.log

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-renderer-examination-code-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            examination-code-expected-migrations.txt
            examination-code-pre-safe.json
            examination-code-post-safe.json
            examination-code-production-dry-run.log
            examination-code-production-pending.txt
            examination-code-production-deploy.log
            examination-code-production-final-dry-run.log
