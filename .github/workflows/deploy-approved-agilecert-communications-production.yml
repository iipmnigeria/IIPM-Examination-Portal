name: Deploy Approved AgileCert Communications Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-communications.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-approved-agilecert-communications-production
  cancel-in-progress: false

env:
  EXPECTED_COMMIT: '00ff074d2143dfef66e92a4903f670d20f8b9411'
  PROJECT_REF: 'cfecicvugfrrhcvhduzc'

jobs:
  database-and-function:
    name: Apply communications database and deploy provider function
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact approved communications source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact approved release unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          cat > communications-expected-migrations.txt <<'EOF'
          202607271200_communications_automation.sql
          202607271201_communications_conversion_tracking.sql
          202607271202_communications_conversion_trigger.sql
          EOF
          for file in $(cat communications-expected-migrations.txt); do
            test -s "supabase/migrations/$file"
          done
          test -s supabase/functions/agilecert-communications/index.ts

          python3 <<'PY'
          from pathlib import Path
          files = [
              Path('supabase/migrations/202607271200_communications_automation.sql'),
              Path('supabase/migrations/202607271201_communications_conversion_tracking.sql'),
              Path('supabase/migrations/202607271202_communications_conversion_trigger.sql'),
          ]
          sql = '\n'.join(path.read_text() for path in files)
          edge = Path('supabase/functions/agilecert-communications/index.ts').read_text()
          required = [
              'agilecert_communication_settings', 'provider_enabled boolean not null default false',
              'agilecert_communication_preferences', 'agilecert_communication_outbox',
              'agilecert_communication_events', 'agilecert_communication_suppressions',
              'refresh_agilecert_communication_outbox', 'claim_agilecert_communication_outbox',
              'complete_agilecert_communication_delivery',
              'record_agilecert_communication_provider_event',
              'record_agilecert_communication_conversions', 'extensions.digest',
          ]
          missing = [item for item in required if item not in sql]
          assert not missing, f'Missing communications authority: {missing}'
          edge_required = [
              'RESEND_API_KEY', 'AGILECERT_COMMUNICATIONS_WORKER_TOKEN',
              'AGILECERT_COMMUNICATIONS_WEBHOOK_TOKEN',
              'AGILECERT_COMMUNICATIONS_SIGNING_SECRET', 'scan-and-send',
              'unsubscribe', 'Idempotency-Key',
          ]
          missing = [item for item in edge_required if item not in edge]
          assert not missing, f'Missing communications provider boundary: {missing}'
          forbidden = ['PAYSTACK_SECRET_KEY', 'question_answer_keys', 'candidate_answers', 'government_id', 'selfie_path']
          found = [item for item in forbidden if item in sql or item in edge]
          assert not found, f'Protected authority leaked into communications release: {found}'
          PY

      - name: Isolate pre-tracking legacy migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agilecert-legacy-migrations
          python3 <<'PY'
          from pathlib import Path
          import shutil
          boundary = 202607230101
          keep = {202607271200, 202607271201, 202607271202}
          for path in Path('supabase/migrations').glob('*.sql'):
              prefix = path.name.split('_', 1)[0]
              if prefix.isdigit():
                  version = int(prefix)
                  if version < boundary and version not in keep:
                      shutil.move(str(path), f'/tmp/agilecert-legacy-migrations/{path.name}')
          PY

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require exactly the three pending communications migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee communications-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' communications-production-dry-run.log \
            | sort -u > communications-production-pending.txt || true
          sort -o communications-expected-migrations.txt communications-expected-migrations.txt
          diff -u communications-expected-migrations.txt communications-production-pending.txt
          test "$(wc -l < communications-production-pending.txt | tr -d ' ')" -eq 3

      - name: Apply approved communications migrations
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked --include-all 2>&1 | tee communications-production-deploy.log
          for file in $(cat communications-expected-migrations.txt); do
            grep -q "Applying migration $file" communications-production-deploy.log
          done
          grep -q 'Finished supabase db push' communications-production-deploy.log

      - name: Verify production communications authority and disabled provider
        shell: bash
        run: |
          set -o pipefail
          supabase db dump --linked --schema public --file communications-production-schema.sql \
            2>&1 | tee communications-production-schema-dump.log
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          schema = Path('communications-production-schema.sql').read_text(encoding='utf-8', errors='ignore')
          required = [
              'agilecert_communication_settings', 'provider_enabled',
              'agilecert_communication_preferences', 'agilecert_communication_outbox',
              'agilecert_communication_events', 'agilecert_communication_suppressions',
              'refresh_agilecert_communication_outbox', 'claim_agilecert_communication_outbox',
              'complete_agilecert_communication_delivery',
              'record_agilecert_communication_provider_event',
              'record_agilecert_communication_conversions',
          ]
          missing = [item for item in required if item not in schema]
          assert not missing, f'Production communications schema markers missing: {missing}'
          default_markers = ['provider_enabled boolean DEFAULT false NOT NULL', 'provider_enabled boolean NOT NULL DEFAULT false']
          assert any(marker in schema for marker in default_markers), 'Provider-disabled default was not preserved.'
          evidence = {
              'sourceCommit': os.environ['EXPECTED_COMMIT'],
              'projectRef': os.environ['PROJECT_REF'],
              'migrationCount': 3,
              'providerEnabledByDefault': False,
              'outboundMessagesSentByDeployment': 0,
              'paystackAuthorityChanged': False,
              'examAuthorityChanged': False,
              'certificateAuthorityChanged': False,
          }
          Path('communications-production-safe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Confirm no migration remains pending
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee communications-post-deploy-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' communications-post-deploy-dry-run.log \
            | sort -u > communications-post-deploy-pending.txt || true
          test ! -s communications-post-deploy-pending.txt
          grep -q 'Remote database is up to date' communications-post-deploy-dry-run.log

      - name: Deploy only the approved communications Edge Function
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy agilecert-communications --project-ref "$PROJECT_REF" \
            2>&1 | tee communications-function-deploy.log
          supabase functions list --project-ref "$PROJECT_REF" \
            2>&1 | tee communications-function-list.log
          grep -q 'agilecert-communications' communications-function-list.log

      - name: Confirm worker boundary without sending email
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o communications-function-auth-response.json -w '%{http_code}' \
            -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/agilecert-communications" \
            -H 'Content-Type: application/json' \
            --data '{"action":"scan-and-send"}')"
          test "$status" = '401'

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-production-database-function-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-expected-migrations.txt
            communications-production-dry-run.log
            communications-production-pending.txt
            communications-production-deploy.log
            communications-production-schema-dump.log
            communications-production-schema.sql
            communications-production-safe.json
            communications-post-deploy-dry-run.log
            communications-post-deploy-pending.txt
            communications-function-deploy.log
            communications-function-list.log
            communications-function-auth-response.json

  pages:
    name: Verify exact compiled communications Pages deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
    steps:
      - name: Locate exact permanent Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          conclusion=''
          for attempt in $(seq 1 90); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=supabase-integration&per_page=50" \
              > communications-pages-runs.json
            run_id="$(jq -r --arg sha "$EXPECTED_COMMIT" '.workflow_runs[] | select(.head_sha == $sha and .name == "Deploy AgileCert Compiled Pages") | .id' communications-pages-runs.json | head -n 1)"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' communications-pages-runs.json)"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""' communications-pages-runs.json)"
              printf 'run_id=%s status=%s conclusion=%s\n' "$run_id" "$status" "$conclusion"
              if [ "$status" = 'completed' ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$conclusion" = 'success'
          printf '%s' "$run_id" > communications-pages-run-id.txt

      - name: Verify Pages jobs and live communications evidence
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat communications-pages-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > communications-pages-jobs.json
          jq -e '.jobs | length >= 3' communications-pages-jobs.json >/dev/null
          jq -e 'all(.jobs[]; .conclusion == "success")' communications-pages-jobs.json >/dev/null

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > communications-pages-artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name == "agilecert-pages-live-verification" and (.expired | not)) | .id' communications-pages-artifacts.json | head -n 1)"
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > communications-pages-live-evidence.zip
          mkdir -p communications-pages-live-evidence
          unzip -q communications-pages-live-evidence.zip -d communications-pages-live-evidence

          live_js="$(find communications-pages-live-evidence -type f -name 'live-app.js' | head -n 1)"
          mount_report="$(find communications-pages-live-evidence -type f -name 'agilecert-live-mount-report.json' | head -n 1)"
          test -s "$live_js"
          test -s "$mount_report"
          grep -q 'Email Preferences' "$live_js"
          grep -q 'Communications Automation' "$live_js"
          grep -q 'Provider delivery is' "$live_js"
          jq -e '.status == 200 and .adviserButtonVisible == true and .bootShellExists == false' "$mount_report" >/dev/null

          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'sourceCommit': os.environ['EXPECTED_COMMIT'],
              'deploymentRunId': int(Path('communications-pages-run-id.txt').read_text()),
              'liveUrl': os.environ['LIVE_URL'],
              'candidatePreferencesVisible': True,
              'adminCommunicationsConsoleVisible': True,
              'liveMountVerified': True,
          }
          Path('communications-pages-production-safe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-communications-production-pages-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            communications-pages-run-id.txt
            communications-pages-runs.json
            communications-pages-jobs.json
            communications-pages-artifacts.json
            communications-pages-production-safe.json
