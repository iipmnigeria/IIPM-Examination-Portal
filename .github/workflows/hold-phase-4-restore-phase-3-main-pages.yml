name: Hold Phase 4 and Restore Phase 3 Main Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/phase-4-certificate-production.txt'

permissions:
  contents: write

concurrency:
  group: phase-4-frontend-hold-main-pages
  cancel-in-progress: false

jobs:
  restore-and-verify:
    name: Restore exact Phase 3 bundle through configured Pages source
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      PHASE_3_COMMIT: 'dc98a784029ab1d08fe6e6a672983d169aece476'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Confirm Phase 4 activation remains blocked
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@latest secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-4-main-hold-secret-audit.log"
          if grep -q 'AGILECERT_PAYSTACK_SECRET_KEY' "$RUNNER_TEMP/phase-4-main-hold-secret-audit.log"; then
            echo 'Dedicated Phase 4 payment secret exists; refusing to publish the Phase 3 hold bundle.'
            exit 1
          fi

      - name: Checkout exact last verified Phase 3 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE_3_COMMIT }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and fingerprint Phase 3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE_3_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'IIPM Certificate Verification' "$js_file"
          if grep -q 'Credential Store' "$js_file"; then
            echo 'Phase 4 commerce content was found in the Phase 3 hold build.'
            exit 1
          fi
          sha256sum "$js_file" | awk '{print $1}' | tee "$RUNNER_TEMP/phase-3-main-hold-expected-js.sha256"
          rm -f dist/server.cjs dist/server.cjs.map
          touch dist/.nojekyll

      - name: Overlay only compiled Pages files on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/agilecert-main-phase-3-hold
          git worktree add --detach /tmp/agilecert-main-phase-3-hold origin/main
          rm -rf /tmp/agilecert-main-phase-3-hold/assets
          rm -f /tmp/agilecert-main-phase-3-hold/server.cjs /tmp/agilecert-main-phase-3-hold/server.cjs.map
          cp -a dist/. /tmp/agilecert-main-phase-3-hold/

          cd /tmp/agilecert-main-phase-3-hold
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html assets .nojekyll server.cjs server.cjs.map 2>/dev/null || true
          while IFS= read -r file; do
            case "$file" in
              index.html|.nojekyll) ;;
              *) git add -A -- "$file" ;;
            esac
          done < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -printf '%f\n')

          if git diff --cached --quiet; then
            echo 'The configured Pages source already contains the Phase 3 hold bundle.'
          else
            git commit -m "Hold Phase 4 frontend; restore Phase 3 ${PHASE_3_COMMIT}"
            git push origin HEAD:main
          fi

      - name: Wait for exact live Phase 3 hold bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/phase-3-main-hold-expected-js.sha256")"
          success=0
          for attempt in $(seq 1 36); do
            status="$(curl -L --silent --show-error --max-time 60 -o "$RUNNER_TEMP/phase-3-main-hold-live-index.html" -w '%{http_code}' "${LIVE_URL}?phase4-main-hold=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$status" = '200' ] && grep -q 'AgileCert Global' "$RUNNER_TEMP/phase-3-main-hold-live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/phase-3-main-hold-live-index.html" | head -n 1 | cut -d'"' -f2)"
              if [ -n "$asset" ]; then
                asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error --max-time 60 "${asset_url}?phase4-main-hold=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/phase-3-main-hold-live-app.js"; then
                  live="$(sha256sum "$RUNNER_TEMP/phase-3-main-hold-live-app.js" | awk '{print $1}')"
                  if [ "$live" = "$expected" ]; then
                    success=1
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1
          grep -q 'IIPM Certificate Verification' "$RUNNER_TEMP/phase-3-main-hold-live-app.js"
          if grep -q 'Credential Store' "$RUNNER_TEMP/phase-3-main-hold-live-app.js"; then
            echo 'Phase 4 commerce interface remains live during backend hold.'
            exit 1
          fi
          {
            echo 'phase3_main_hold_bundle_live=yes'
            echo "expected_sha256=$expected"
            echo "live_sha256=$(sha256sum "$RUNNER_TEMP/phase-3-main-hold-live-app.js" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/phase-4-main-frontend-hold-result.log"

      - name: Upload hold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-main-frontend-hold-evidence
          path: |
            ${{ runner.temp }}/phase-4-main-hold-secret-audit.log
            ${{ runner.temp }}/phase-3-main-hold-expected-js.sha256
            ${{ runner.temp }}/phase-3-main-hold-live-index.html
            ${{ runner.temp }}/phase-3-main-hold-live-app.js
            ${{ runner.temp }}/phase-4-main-frontend-hold-result.log
          if-no-files-found: warn
          retention-days: 3
