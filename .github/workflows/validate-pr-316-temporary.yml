name: Temporary PR 316 Catalogue Fallback Validation

on:
  pull_request:
    branches:
      - supabase-integration
    paths:
      - "src/components/AgileProgrammeCatalogue.tsx"
      - ".github/workflows/validate-pr-316-temporary.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Scoped typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create scoped TypeScript project
        run: |
          cat > tsconfig.catalogue-fallback.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "types": ["vite/client"]
            },
            "include": [
              "src/components/AgileProgrammeCatalogue.tsx",
              "src/data/agileProgrammeCatalogue.ts"
            ],
            "exclude": [
              "scripts/**",
              "supabase/functions/**"
            ]
          }
          JSON

      - name: Run scoped TypeScript validation
        run: npx tsc -p tsconfig.catalogue-fallback.json

      - name: Build production application
        run: npm run build
