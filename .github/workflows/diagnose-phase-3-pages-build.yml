name: Diagnose Phase 3 Pages Build

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-phase-3-pages-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Pages job log
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB_ID: '89788871082'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB_ID}/logs" \
            -o "$RUNNER_TEMP/phase3-pages-failed-job.log"
          tail -n 160 "$RUNNER_TEMP/phase3-pages-failed-job.log" | tee "$RUNNER_TEMP/phase3-pages-failed-job-tail.log"

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-pages-build-diagnostic
          path: |
            ${{ runner.temp }}/phase3-pages-failed-job.log
            ${{ runner.temp }}/phase3-pages-failed-job-tail.log
          retention-days: 7
