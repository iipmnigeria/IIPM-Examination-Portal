name: Diagnose AgileCert Phase 5 Binding V2

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/diagnose-agilecert-phase-5-binding-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture exact identity-binding diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Extract diagnostic SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/diagnose-agilecert-phase-5-binding.yml').read_text()
          start = source.index("          \\set candidate '")
          end = source.index('\n          SQL', start)
          lines = source[start:end].splitlines()
          sql = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('phase-5-binding-diagnostic.sql').write_text(sql)
          PY
          grep -q 'PHASE_5_BINDING_DIAGNOSTIC_PASSED' phase-5-binding-diagnostic.sql

      - name: Start isolated database
        shell: bash
        run: |
          set -o pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          commit;
          SQL
          supabase start 2>&1 | tee phase-5-binding-v2-start.log
          supabase db reset --local 2>&1 | tee phase-5-binding-v2-reset.log

      - name: Run extracted diagnostic SQL
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f phase-5-binding-diagnostic.sql \
            2>&1 | tee phase-5-binding-v2.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-5-binding-diagnostic-v2
          retention-days: 3
          if-no-files-found: warn
          path: |
            phase-5-binding-diagnostic.sql
            phase-5-binding-v2-start.log
            phase-5-binding-v2-reset.log
            phase-5-binding-v2.log
