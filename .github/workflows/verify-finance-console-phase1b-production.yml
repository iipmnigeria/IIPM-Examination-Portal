name: Verify Finance Console Phase 1B Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-finance-console-phase1b-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-finance-console-phase1b-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Phase 1B frontend deployments and live authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPROVED_SOURCE_COMMIT: '1a9d6f44f3423b7757f9a07f809fccf46765fe42'
      NAMECHEAP_SOURCE_COMMIT: '1a9d6f44f3423b7757f9a07f809fccf46765fe42'
      PAGES_TRIGGER_COMMIT: 'f142b077ffdaf21aab1f81a4b3b28a8ed32d0bf7'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      PAGE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact approved Phase 1B source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact approved frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_COMMIT"
          npm install --no-audit --no-fund
          npm run lint
          npx vite build
          test -s dist/index.html
          grep -q 'Certification Fees' src/components/AdminFinanceConsole.tsx
          grep -q 'Certification pricing rule' src/components/FinanceCertificationFeesPanel.tsx
          grep -q 'Programme and examination applicability' src/components/FinanceCertificationFeesPanel.tsx
          grep -q 'finance_upsert_certificate_product_price_rule' src/services/financeConsoleService.ts
          grep -q 'finance_upsert_certificate_product_scope' src/services/financeConsoleService.ts

          python3 <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          html = Path('dist/index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The approved build did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          candidate = Path('dist') / relative.lstrip('./').lstrip('/')
          if not candidate.is_file():
              raise SystemExit(f'Approved bundle not found: {candidate}')
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          Path('phase1b-approved-bundle.json').write_text(
              json.dumps({'relativePath': relative, 'sha256': digest}, indent=2),
              encoding='utf-8',
          )
          print(json.dumps({'relativePath': relative, 'sha256': digest}, indent=2))
          PY

      - name: Confirm authorised Pages and Namecheap deployment runs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20" \
            -o phase1b-pages-runs.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-namecheap.yml/runs?branch=supabase-integration&event=push&per_page=30" \
            -o phase1b-namecheap-runs.json

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          def find_run(path, expected_sha, label):
              payload = json.loads(Path(path).read_text())
              matches = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == expected_sha
              ]
              if not matches:
                  raise SystemExit(f'No {label} run was found for {expected_sha}.')
              run = matches[0]
              if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  raise SystemExit(f'{label} run is not successful: {run}')
              return {
                  'runId': run.get('id'),
                  'headSha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'createdAt': run.get('created_at'),
                  'updatedAt': run.get('updated_at'),
              }

          result = {
              'githubPages': find_run(
                  'phase1b-pages-runs.json',
                  os.environ['PAGES_TRIGGER_COMMIT'],
                  'GitHub Pages deployment',
              ),
              'namecheap': find_run(
                  'phase1b-namecheap-runs.json',
                  os.environ['NAMECHEAP_SOURCE_COMMIT'],
                  'Namecheap deployment',
              ),
          }
          Path('phase1b-deployment-runs-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify the exact public GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="$(date +%s)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${PAGE_URL}?phase1b_release=${cache_buster}" \
            -o phase1b-live-index.html

          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path('phase1b-live-index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, flags=re.I)
          if not matches:
              raise SystemExit('The live Pages document did not expose a JavaScript entry bundle.')
          relative = matches[-1]
          live_url = urljoin('https://iipmnigeria.github.io/IIPM-Examination-Portal/', relative)
          Path('phase1b-live-bundle-url.txt').write_text(live_url, encoding='utf-8')
          print(live_url)
          PY

          live_bundle_url="$(cat phase1b-live-bundle-url.txt)"
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${live_bundle_url}?phase1b_release=${cache_buster}" \
            -o phase1b-live-bundle.js

          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          approved = json.loads(Path('phase1b-approved-bundle.json').read_text())
          live_bytes = Path('phase1b-live-bundle.js').read_bytes()
          live_text = live_bytes.decode('utf-8', errors='replace')
          live_hash = hashlib.sha256(live_bytes).hexdigest()
          required = [
              'Finance Console',
              'Certification Fees',
              'Certification pricing rule',
              'Programme and examination applicability',
              'finance_upsert_certificate_product_price_rule',
              'finance_upsert_certificate_product_scope',
          ]
          missing = [marker for marker in required if marker not in live_text]
          if missing:
              raise SystemExit(f'Live Phase 1B markers are missing: {missing}')
          if live_hash != approved['sha256']:
              raise SystemExit(
                  f"Live bundle hash {live_hash} does not match approved hash {approved['sha256']}"
              )
          result = {
              'pageUrl': 'https://iipmnigeria.github.io/IIPM-Examination-Portal/',
              'approvedSha256': approved['sha256'],
              'liveSha256': live_hash,
              'exactBundleVerified': True,
              'requiredMarkersPresent': required,
          }
          Path('phase1b-pages-verification-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Run rolled-back live Phase 1B authority tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          for test_file in \
            supabase/tests/finance_console_phase1b_certification_fees_smoke.sql \
            supabase/tests/finance_console_phase1b_certification_rules_smoke.sql \
            supabase/tests/finance_console_phase1b_identity_route_smoke.sql
          do
            test_name="$(basename "$test_file" .sql)"
            TEST_FILE="$test_file" TEST_NAME="$test_name" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['TEST_FILE'])
          test_name = os.environ['TEST_NAME']
          sql = path.read_text(encoding='utf-8')
          sql = sql.replace('\\set ON_ERROR_STOP on\n\n', '', 1)
          prefix, marker, suffix = sql.rpartition('rollback;')
          assert marker, f'No rollback marker in {path}'
          sql = prefix + f"""
          select jsonb_build_object(
            'test', '{test_name}',
            'passed', true,
            'transactionRolledBack', true
          ) as verification;
          rollback;
          """ + suffix
          Path(f'/tmp/{test_name}-live.json').write_text(
              json.dumps({'query': sql}), encoding='utf-8'
          )
          PY

            curl --fail-with-body --silent --show-error \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary "@/tmp/${test_name}-live.json" \
              -o "${test_name}-live.json"

            TEST_NAME="$test_name" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          test_name = os.environ['TEST_NAME']
          data = json.loads(Path(f'{test_name}-live.json').read_text())
          if not isinstance(data, list) or not data:
              raise SystemExit(f'Unexpected production response for {test_name}: {data}')
          result = None
          for row in reversed(data):
              if isinstance(row, dict) and isinstance(row.get('verification'), dict):
                  candidate = row['verification']
                  if candidate.get('test') == test_name:
                      result = candidate
                      break
          if result is None or result.get('passed') is not True or result.get('transactionRolledBack') is not True:
              raise SystemExit(f'Phase 1B production verification failed for {test_name}: {data}')
          Path(f'{test_name}-live-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY
          done

      - name: Upload sanitized release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-console-phase1b-production-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase1b-approved-bundle.json
            phase1b-deployment-runs-safe.json
            phase1b-pages-verification-safe.json
            finance_console_phase1b_certification_fees_smoke-live-safe.json
            finance_console_phase1b_certification_rules_smoke-live-safe.json
            finance_console_phase1b_identity_route_smoke-live-safe.json
