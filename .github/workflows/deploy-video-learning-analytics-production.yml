name: Deploy Video Learning Analytics Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-video-learning-analytics-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: video-learning-analytics-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy and verify video learning analytics
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_COMMIT: 'c29e18cc137ca1ee43f704171d5d4fb1691824c7'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact approved video learning source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify approved source and release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > video-learning-expected-migrations.txt <<'EOF'
          202608010520_video_progress_learning_analytics.sql
          EOF

          while read -r migration; do
            test -s "supabase/migrations/$migration"
          done < video-learning-expected-migrations.txt

          test -s src/components/CandidateVideoLearningProgressLauncher.tsx
          test -s src/components/AdminVideoLearningAnalyticsLauncher.tsx
          test -s src/services/videoLearningAnalyticsService.ts
          test -s src/components/CandidatePrimaryToolsMenu.tsx
          test -s src/main.tsx

          grep -q 'agilecert_video_learning_progress' supabase/migrations/202608010520_video_progress_learning_analytics.sql
          grep -q 'agilecert_video_playback_progress_capture' supabase/migrations/202608010520_video_progress_learning_analytics.sql
          grep -q 'get_my_agilecert_video_learning_progress' supabase/migrations/202608010520_video_progress_learning_analytics.sql
          grep -q 'get_agilecert_video_learning_analytics' supabase/migrations/202608010520_video_progress_learning_analytics.sql
          grep -q "exactResumeSupported', false" supabase/migrations/202608010520_video_progress_learning_analytics.sql
          grep -q 'Video Progress & Completion' src/components/CandidateVideoLearningProgressLauncher.tsx
          grep -q 'Video Progress & Learning Analytics' src/components/AdminVideoLearningAnalyticsLauncher.tsx

          ! grep -R -E '(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_PASSWORD|SUPABASE_ACCESS_TOKEN)\s*=' \
            src \
            supabase/migrations/202608010520_video_progress_learning_analytics.sql

      - name: Build exact approved frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          NODE_ENV=production npx vite build
          test -s dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'Video Progress & Completion' "$js_file"
          grep -q 'Video Progress & Learning Analytics' "$js_file"
          sha256sum "$js_file" > video-learning-approved-bundle.sha256

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require exactly the approved video learning migration
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 | tee video-learning-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' video-learning-production-dry-run.log \
            | sort -u > video-learning-production-pending.txt || true
          diff -u video-learning-expected-migrations.txt video-learning-production-pending.txt
          test "$(wc -l < video-learning-production-pending.txt | tr -d ' ')" -eq 1

      - name: Apply approved video learning migration
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked 2>&1 | tee video-learning-production-deploy.log
          grep -q 'Applying migration 202608010520_video_progress_learning_analytics.sql' video-learning-production-deploy.log
          grep -q 'Finished supabase db push' video-learning-production-deploy.log

      - name: Verify production learning-progress authority and backfill
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          select jsonb_build_object(
            'tableExists', to_regclass('public.agilecert_video_learning_progress') is not null,
            'rlsEnabled', coalesce((
              select relrowsecurity
              from pg_class
              where oid = 'public.agilecert_video_learning_progress'::regclass
            ), false),
            'policyCount', (
              select count(*)
              from pg_policies
              where schemaname = 'public'
                and tablename = 'agilecert_video_learning_progress'
            ),
            'requiredColumns', (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'agilecert_video_learning_progress'
                and column_name in (
                  'candidate_id', 'examination_id', 'material_id',
                  'first_opened_at', 'last_opened_at', 'open_count',
                  'engaged_seconds', 'last_position_seconds', 'duration_seconds',
                  'completion_percent', 'completed_at', 'completion_source',
                  'last_playback_audit_id', 'metadata', 'updated_at'
                )
            ),
            'triggerEnabled', exists (
              select 1
              from pg_trigger
              where tgrelid = 'public.agilecert_material_playback_audits'::regclass
                and tgname = 'agilecert_video_playback_progress_capture'
                and not tgisinternal
                and tgenabled <> 'D'
            ),
            'securityDefinerFunctions', (
              select count(*)
              from pg_proc
              where pronamespace = 'public'::regnamespace
                and proname in (
                  'capture_agilecert_video_playback_progress',
                  'set_my_agilecert_video_lesson_completion',
                  'get_my_agilecert_video_learning_progress',
                  'get_agilecert_video_learning_analytics'
                )
                and prosecdef
            ),
            'candidateExecuteGranted',
              has_function_privilege(
                'authenticated',
                'public.set_my_agilecert_video_lesson_completion(uuid,uuid,boolean)',
                'execute'
              )
              and has_function_privilege(
                'authenticated',
                'public.get_my_agilecert_video_learning_progress()',
                'execute'
              ),
            'adminAnalyticsExecuteGranted',
              has_function_privilege(
                'authenticated',
                'public.get_agilecert_video_learning_analytics(text,text,integer,integer)',
                'execute'
              ),
            'anonExecuteExposed',
              has_function_privilege(
                'anon',
                'public.set_my_agilecert_video_lesson_completion(uuid,uuid,boolean)',
                'execute'
              )
              or has_function_privilege(
                'anon',
                'public.get_my_agilecert_video_learning_progress()',
                'execute'
              )
              or has_function_privilege(
                'anon',
                'public.get_agilecert_video_learning_analytics(text,text,integer,integer)',
                'execute'
              ),
            'authenticatedDirectWriteExposed',
              has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'insert')
              or has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'update')
              or has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'delete'),
            'authenticatedSelectGranted',
              has_table_privilege('authenticated', 'public.agilecert_video_learning_progress', 'select'),
            'invalidMaterialRows', (
              select count(*)
              from public.agilecert_video_learning_progress progress
              join public.agilecert_preparation_materials material
                on material.id = progress.material_id
              where material.material_type <> 'video'
            ),
            'invalidCompletionRows', (
              select count(*)
              from public.agilecert_video_learning_progress
              where completion_percent < 0 or completion_percent > 100
            ),
            'authorisedVideoAudits', (
              select count(*)
              from public.agilecert_material_playback_audits audit
              join public.agilecert_preparation_materials material
                on material.id = audit.material_id
               and material.material_type = 'video'
              where audit.status = 'authorized'
            ),
            'summedOpenCount', (
              select coalesce(sum(open_count), 0)
              from public.agilecert_video_learning_progress
            ),
            'authorisedAuditTriples', (
              select count(*)
              from (
                select distinct audit.candidate_id, audit.examination_id, audit.material_id
                from public.agilecert_material_playback_audits audit
                join public.agilecert_preparation_materials material
                  on material.id = audit.material_id
                 and material.material_type = 'video'
                where audit.status = 'authorized'
              ) triples
            ),
            'progressOpenRows', (
              select count(*)
              from public.agilecert_video_learning_progress
              where open_count > 0
            )
          ) as verification;
          """
          Path('/tmp/video-learning-production-verify.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/video-learning-production-verify.json \
            -o video-learning-production-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('video-learning-production-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('tableExists') is True, result
          assert result.get('rlsEnabled') is True, result
          assert int(result.get('policyCount') or 0) >= 1, result
          assert result.get('requiredColumns') == 15, result
          assert result.get('triggerEnabled') is True, result
          assert result.get('securityDefinerFunctions') == 4, result
          assert result.get('candidateExecuteGranted') is True, result
          assert result.get('adminAnalyticsExecuteGranted') is True, result
          assert result.get('anonExecuteExposed') is False, result
          assert result.get('authenticatedDirectWriteExposed') is False, result
          assert result.get('authenticatedSelectGranted') is True, result
          assert result.get('invalidMaterialRows') == 0, result
          assert result.get('invalidCompletionRows') == 0, result
          assert result.get('summedOpenCount') == result.get('authorisedVideoAudits'), result
          assert result.get('progressOpenRows') == result.get('authorisedAuditTriples'), result
          Path('video-learning-production-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Run rolled-back live RPC verification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          begin;
          do $$
          declare
            v_admin_id uuid;
            v_candidate_id uuid;
            v_payload jsonb;
          begin
            select id into v_admin_id
            from public.profiles
            where role in ('exam_admin', 'super_admin')
              and is_active = true
            order by case when role = 'super_admin' then 0 else 1 end, created_at
            limit 1;

            if v_admin_id is null then
              raise exception 'No active production administrator was available for analytics verification.';
            end if;

            perform set_config('request.jwt.claim.sub', v_admin_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);
            v_payload := public.get_agilecert_video_learning_analytics(null, null, 10, 0);
            if jsonb_typeof(v_payload) <> 'object'
               or jsonb_typeof(v_payload -> 'records') <> 'array' then
              raise exception 'Administrator analytics RPC returned an invalid payload: %', v_payload;
            end if;

            select candidate.id into v_candidate_id
            from public.profiles candidate
            where candidate.role = 'candidate'
              and candidate.is_active = true
              and exists (
                select 1
                from public.agilecert_material_entitlements entitlement
                join public.agilecert_preparation_materials material
                  on material.id = entitlement.material_id
                 and material.material_type = 'video'
                where entitlement.candidate_id = candidate.id
                  and entitlement.status = 'active'
                  and entitlement.available_from <= now()
                  and (entitlement.expires_at is null or entitlement.expires_at > now())
              )
            order by candidate.created_at
            limit 1;

            if v_candidate_id is not null then
              perform set_config('request.jwt.claim.sub', v_candidate_id::text, true);
              perform set_config('request.jwt.claim.role', 'authenticated', true);
              v_payload := public.get_my_agilecert_video_learning_progress();
              if jsonb_typeof(v_payload) <> 'array' then
                raise exception 'Candidate progress RPC returned an invalid payload: %', v_payload;
              end if;
            end if;
          end;
          $$;
          select jsonb_build_object(
            'adminAnalyticsRpcPassed', true,
            'candidateProgressRpcEvaluatedWhenEligible', true,
            'transactionRolledBack', true
          ) as verification;
          rollback;
          """
          Path('/tmp/video-learning-rpc-verification.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/video-learning-rpc-verification.json \
            -o video-learning-rpc-production.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('video-learning-rpc-production.json').read_text())
          assert isinstance(data, list) and data, data
          result = None
          for row in reversed(data):
              if isinstance(row, dict) and isinstance(row.get('verification'), dict):
                  result = row['verification']
                  break
          assert result is not None, data
          assert result.get('adminAnalyticsRpcPassed') is True, result
          assert result.get('transactionRolledBack') is True, result
          Path('video-learning-rpc-production-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Confirm production migration ledger is current
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 | tee video-learning-post-deploy-dry-run.log
          ! grep -q '202608010520_video_progress_learning_analytics.sql' video-learning-post-deploy-dry-run.log
          grep -q 'Remote database is up to date' video-learning-post-deploy-dry-run.log

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-learning-analytics-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            video-learning-expected-migrations.txt
            video-learning-approved-bundle.sha256
            video-learning-production-dry-run.log
            video-learning-production-pending.txt
            video-learning-production-deploy.log
            video-learning-production-safe.json
            video-learning-rpc-production-safe.json
            video-learning-post-deploy-dry-run.log
