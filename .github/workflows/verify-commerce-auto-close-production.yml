name: Verify Commerce Auto-Close Production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-commerce-auto-close.txt'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Confirm exact Pages deployment completed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: '0eca0bd74fbec19188395ee62b5d43c446eef116'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for exact permanent Pages run
        shell: bash
        run: |
          set -euo pipefail
          success=0
          : > commerce-auto-close-deployment.txt
          for attempt in $(seq 1 120); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-agilecert-pages.yml/runs?branch=supabase-integration&event=push&per_page=30")"
            run="$(printf '%s' "$response" | jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha == $sha)' | head -n 1)"
            if [ -n "$run" ]; then
              run_id="$(printf '%s' "$run" | jq -r '.id')"
              status="$(printf '%s' "$run" | jq -r '.status')"
              conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
              echo "Attempt $attempt: run=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = 'completed' ]; then
                printf 'source_sha=%s\nrun_id=%s\nstatus=%s\nconclusion=%s\n' \
                  "$EXPECTED_SHA" "$run_id" "$status" "$conclusion" \
                  | tee commerce-auto-close-deployment.txt
                test "$conclusion" = 'success'
                success=1
                break
              fi
            else
              echo "Attempt $attempt: exact deployment run not visible yet"
            fi
            sleep 5
          done
          test "$success" -eq 1

      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-commerce-auto-close-deployment
          retention-days: 14
          path: commerce-auto-close-deployment.txt
