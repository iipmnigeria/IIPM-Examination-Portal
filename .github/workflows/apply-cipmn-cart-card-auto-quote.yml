name: Apply CIPMN Cart Card UX

on:
  push:
    branches: [feature/cipmn-cart-card-buttons-auto-quote]
    paths:
      - '.github/workflows/apply-cipmn-cart-card-auto-quote.yml'
  pull_request:
    branches: [supabase-integration]
    types: [opened, reopened]
    paths:
      - '.github/workflows/apply-cipmn-cart-card-auto-quote.yml'

permissions:
  contents: write

concurrency:
  group: apply-cipmn-cart-card-auto-quote
  cancel-in-progress: false

jobs:
  apply:
    name: Reconstruct, validate and commit cart UX
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cipmn-cart-card-buttons-auto-quote
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct approved component
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/cipmn-cart-ux/part-*.b64 | base64 --decode > src/components/CandidateCipmnModuleCart.tsx
          test -s src/components/CandidateCipmnModuleCart.tsx
          grep -q 'In Cart — Remove' src/components/CandidateCipmnModuleCart.tsx
          grep -q 'Updating the secure total automatically' src/components/CandidateCipmnModuleCart.tsx
          grep -q 'data-agilecert-cipmn-card-cart-mount' src/components/CandidateCipmnModuleCart.tsx
          ! grep -q 'Calculate Secure Total' src/components/CandidateCipmnModuleCart.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production portal
        run: npm run build

      - name: Commit validated UX source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CandidateCipmnModuleCart.tsx
          git diff --cached --check
          git commit -m 'Improve CIPMN cart card controls and automatic totals'
          git push origin HEAD:feature/cipmn-cart-card-buttons-auto-quote
