name: Validate Certificate Visual Designer Phase 1B

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - 'src/components/AdminCertificateManagementLauncher.tsx'
      - 'src/components/AdminCertificateDesigner.tsx'
      - 'src/services/certificateDesignerService.ts'
      - 'supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql'
      - 'supabase/tests/certificate_visual_designer_phase1b_smoke.sql'
      - 'docs/CERTIFICATE_VISUAL_DESIGNER_PHASE1B_SCOPE.md'
      - '.github/workflows/validate-certificate-visual-designer-phase1b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certificate-visual-designer-phase1b-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict Phase 1B change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/supabase-integration...HEAD | sort > changed-files.txt
          cat > allowed-files.txt <<'EOF'
          .github/workflows/validate-certificate-visual-designer-phase1b.yml
          docs/CERTIFICATE_VISUAL_DESIGNER_PHASE1B_SCOPE.md
          src/components/AdminCertificateDesigner.tsx
          src/components/AdminCertificateManagementLauncher.tsx
          src/services/certificateDesignerService.ts
          supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          supabase/tests/certificate_visual_designer_phase1b_smoke.sql
          EOF
          sort -o allowed-files.txt allowed-files.txt
          diff -u allowed-files.txt changed-files.txt

      - name: Confirm protected authorities are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/supabase-integration...HEAD -- \
            src/services/certificateService.ts \
            src/services/certificatePdfService.ts \
            src/services/cipmnCertificateRenderer.ts \
            src/services/examService.ts \
            src/services/financeConsoleService.ts \
            src/services/financeConsoleCompletionService.ts \
            supabase/functions/initialize-exam-payment/index.ts \
            supabase/functions/verify-exam-payment/index.ts \
            supabase/functions/initialize-exam-cart-payment/index.ts \
            supabase/functions/verify-exam-cart-payment/index.ts \
            supabase/functions/paystack-webhook/index.ts
          ! grep -R "data:image/.*base64" \
            src/components/AdminCertificateDesigner.tsx \
            src/services/certificateDesignerService.ts
          ! grep -Ei "(insert into|update|delete from)[[:space:]]+(public\.)?(agilecert_issued_certificates|agilecert_certificate_eligibility_records|exam_orders|exam_payments|attempts)" \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q "This package stores non-authoritative visual overlays" \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q "resolve_agilecert_certificate_master" \
            supabase/tests/certificate_visual_designer_phase1b_smoke.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Phase 1B TypeScript modules
        run: >-
          npx tsc --noEmit --noCheck --skipLibCheck --target ES2022
          --module ESNext --moduleResolution Bundler
          --jsx react-jsx --allowSyntheticDefaultImports --esModuleInterop
          src/vite-env.d.ts
          src/components/AdminCertificateDesigner.tsx
          src/components/AdminCertificateManagementLauncher.tsx
          src/services/certificateDesignerService.ts

      - name: Compile protected launcher integration
        run: >-
          npx esbuild src/components/AdminCertificateManagementLauncher.tsx
          --bundle --platform=browser --format=esm
          --outfile=/tmp/admin-certificate-management-launcher-phase1b.js

      - name: Build production application
        run: npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Neutralise production-only identity bootstrap in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          -- CI-only: production identity bootstrap is intentionally disabled.
          commit;
          SQL

      - name: Start database-only Supabase services
        shell: bash
        run: |
          set -euo pipefail
          excluded='gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor'
          if ! timeout --signal=TERM --kill-after=15s 180s \
            supabase start -x "$excluded" --ignore-health-check --debug \
            > certificate-designer-supabase-start.log 2>&1; then
            cat certificate-designer-supabase-start.log
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          cat certificate-designer-supabase-start.log
          exit 1

      - name: Apply complete migration history
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local 2>&1 | tee certificate-designer-db-reset.log
          grep -q 'Applying migration 202608011300_certificate_master_console_phase1a.sql' \
            certificate-designer-db-reset.log
          grep -q 'Applying migration 202608012100_certificate_visual_designer_phase1b.sql' \
            certificate-designer-db-reset.log

      - name: Run Phase 1A regression smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_management_console_phase1a_smoke.sql \
            2>&1 | tee certificate-designer-phase1a-regression.log
          grep -q 'certificateManagementConsolePhase1AVerified' \
            certificate-designer-phase1a-regression.log

      - name: Run Phase 1B designer smoke test
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/certificate_visual_designer_phase1b_smoke.sql \
            2>&1 | tee certificate-designer-phase1b-smoke.log
          grep -q 'certificateVisualDesignerPhase1BVerified' \
            certificate-designer-phase1b-smoke.log

      - name: Verify visual designer architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Visual Designer' src/components/AdminCertificateManagementLauncher.tsx
          grep -q 'Dynamic fields' src/components/AdminCertificateDesigner.tsx
          grep -q 'Live master preview' src/components/AdminCertificateDesigner.tsx
          grep -q 'certificate_admin_save_template_design' src/services/certificateDesignerService.ts
          grep -q 'certificate_designer_validate_overlay' \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q "version.status not in ('draft', 'changes_requested')" \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q 'does not issue certificates' src/components/AdminCertificateDesigner.tsx

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-visual-designer-phase1b-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            changed-files.txt
            allowed-files.txt
            certificate-designer-supabase-start.log
            certificate-designer-db-reset.log
            certificate-designer-phase1a-regression.log
            certificate-designer-phase1b-smoke.log

      - name: Stop isolated Supabase services
        if: always()
        run: timeout --signal=TERM --kill-after=10s 45s supabase stop --no-backup || true
