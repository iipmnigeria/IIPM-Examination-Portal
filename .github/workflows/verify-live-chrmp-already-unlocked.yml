name: Verify Live CHRMP Already-Unlocked Flow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-live-chrmp-already-unlocked.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verify live migrated function and candidate result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          query = r'''
          with redeemed as (
            select cr.candidate_id, eo.examination_id
            from public.coupon_redemptions cr
            join public.coupons c on c.id = cr.coupon_id
            join public.exam_orders eo on eo.id = cr.order_id
            where upper(c.code) = 'CHRMP100'
              and cr.status = 'redeemed'
              and eo.status = 'waived'
            order by cr.created_at desc
            limit 1
          ), claims as (
            select set_config(
              'request.jwt.claims',
              jsonb_build_object(
                'sub', r.candidate_id::text,
                'role', 'authenticated'
              )::text,
              true
            ) as configured,
            r.examination_id
            from redeemed r
          )
          select jsonb_build_object(
            'migrationRecorded', exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '202607250106'
            ),
            'functionContainsGuard', (
              select prosrc like '%already_unlocked%'
              from pg_proc
              where oid = 'public.quote_exam_purchase(uuid,text,text)'::regprocedure
            ),
            'result', public.quote_exam_purchase(
              claims.examination_id,
              'NGN',
              'CHRMP100'
            ),
            'activeUsage', (
              select count(*)
              from public.coupon_redemptions cr
              join public.coupons c on c.id = cr.coupon_id
              where upper(c.code) = 'CHRMP100'
                and cr.status in ('reserved','redeemed')
            )
          ) as verification
          from claims;
          '''
          open('/tmp/query.json','w',encoding='utf-8').write(json.dumps({'query':query}))
          PY
          status=$(curl --silent --show-error \
            -o live-chrmp-already-unlocked-raw.json \
            -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json)
          echo "$status" > live-chrmp-already-unlocked-http.txt
          cat live-chrmp-already-unlocked-raw.json
          test "$status" = '201' -o "$status" = '200'
          python3 - <<'PY'
          import json
          data=json.load(open('live-chrmp-already-unlocked-raw.json',encoding='utf-8'))
          assert isinstance(data,list) and len(data)==1, data
          verification=data[0].get('verification') or {}
          result=verification.get('result') or {}
          assert verification.get('migrationRecorded') is True, verification
          assert verification.get('functionContainsGuard') is True, verification
          assert verification.get('activeUsage') == 1, verification
          assert result.get('status') == 'already_unlocked', result
          assert result.get('canLaunch') is True, result
          assert result.get('payableAmountMinor') == 0, result
          safe={
            'migrationRecorded': verification['migrationRecorded'],
            'functionContainsGuard': verification['functionContainsGuard'],
            'activeUsage': verification['activeUsage'],
            'status': result['status'],
            'canLaunch': result['canLaunch'],
            'payableAmountMinor': result['payableAmountMinor'],
          }
          open('live-chrmp-already-unlocked-safe.json','w',encoding='utf-8').write(json.dumps(safe,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agilecert-live-chrmp-already-unlocked-verification
          retention-days: 30
          path: |
            live-chrmp-already-unlocked-http.txt
            live-chrmp-already-unlocked-raw.json
            live-chrmp-already-unlocked-safe.json
