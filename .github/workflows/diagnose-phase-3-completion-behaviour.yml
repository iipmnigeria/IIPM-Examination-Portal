name: Diagnose Phase 3 Completion Behaviour

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-phase-3-completion-behaviour.yml'
      - '.github/workflows/validate-agilecert-phase-3-completion.yml'
      - 'supabase/migrations/202607251800_phase_3_certificate_completion.sql'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'phase-3-certificate-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Neutralise production-only bootstrap
        run: |
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          commit;
          SQL

      - name: Start isolated database
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee phase3-diagnostic-start.log
          supabase db reset --local 2>&1 | tee phase3-diagnostic-reset.log

      - name: Extract and run exact behavioural SQL with stderr capture
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-agilecert-phase-3-completion.yml').read_text(encoding='utf-8')
          start = source.index('          do $$\n')
          end = source.index('          SQL\n', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('phase3-extracted-behaviour.sql').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f phase3-extracted-behaviour.sql 2>&1 | tee phase3-diagnostic-behaviour.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-3-completion-behaviour-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            phase3-extracted-behaviour.sql
            phase3-diagnostic-start.log
            phase3-diagnostic-reset.log
            phase3-diagnostic-behaviour.log
