name: Verify Homepage Restore and Sponsored Tools

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-home-restore-sponsored-tools.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify exact Pages release and live markers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APPROVED_SOURCE_COMMIT: c86032aa73962f55f19f26c2a3759d426808b84b
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/
    steps:
      - name: Wait for permanent compiled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 90); do
            run="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-agilecert-pages.yml/runs?event=push&branch=supabase-integration&per_page=30" \
              --jq ".workflow_runs[] | select(.head_sha == \"$APPROVED_SOURCE_COMMIT\") | [.id,.status,.conclusion] | @tsv" \
              | head -n 1 || true)"
            if [ -n "$run" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$run"
              echo "Attempt $attempt: run=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = 'completed' ]; then
                [ "$conclusion" = 'success' ]
                echo "$run_id" > "$RUNNER_TEMP/pages-run-id.txt"
                success=1
                break
              fi
            else
              echo "Attempt $attempt: deployment run not visible yet"
            fi
            sleep 10
          done
          [ "$success" -eq 1 ]

      - name: Confirm deployment jobs passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat "$RUNNER_TEMP/pages-run-id.txt")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$RUNNER_TEMP/pages-jobs.json"
          jq -e '.jobs | length >= 3' "$RUNNER_TEMP/pages-jobs.json" >/dev/null
          jq -e 'all(.jobs[]; .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/pages-jobs.json" >/dev/null

      - name: Verify exact live homepage and Tools markers
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 60); do
            status="$(curl -L -sS -o "$RUNNER_TEMP/live-index.html" -w '%{http_code}' \
              "$LIVE_URL?restore-home=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = '200' ] && grep -q 'AgileCert Global' "$RUNNER_TEMP/live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/live-index.html" | head -n 1 | cut -d'"' -f2)"
              if [ -n "$asset" ]; then
                asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error \
                  "$asset_url?restore-home=${GITHUB_RUN_ID}-${attempt}" \
                  -o "$RUNNER_TEMP/live-app.js"; then
                  grep -q 'Sponsored Access & Refunds' "$RUNNER_TEMP/live-app.js"
                  grep -q 'Open sponsored access and refunds workspace' "$RUNNER_TEMP/live-app.js"
                  grep -q 'Candidate journey' "$RUNNER_TEMP/live-app.js"
                  ! grep -q 'images.pexels.com' "$RUNNER_TEMP/live-app.js"
                  ! grep -q 'Build credible, verified career evidence' "$RUNNER_TEMP/live-app.js"
                  success=1
                  break
                fi
              fi
            fi
            sleep 10
          done
          [ "$success" -eq 1 ]

      - name: Create sanitized verification summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          summary = {
              'approvedSourceCommit': os.environ['APPROVED_SOURCE_COMMIT'],
              'liveUrl': os.environ['LIVE_URL'],
              'homepageImagesRemoved': True,
              'previousCandidateJourneyRestored': True,
              'sponsoredAccessRefundsInTools': True,
              'floatingSponsoredLauncherHiddenByToolsMenu': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'home-restore-sponsored-tools-summary.json'), 'w') as handle:
              json.dump(summary, handle, indent=2)
          PY

      - name: Upload sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-restore-sponsored-tools-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pages-run-id.txt
            ${{ runner.temp }}/pages-jobs.json
            ${{ runner.temp }}/live-index.html
            ${{ runner.temp }}/home-restore-sponsored-tools-summary.json
