name: Diagnose AgileCert Phase 5 Binding

on:
  push:
    branches: [phase-5-identity-assurance-professional-certificate]
    paths:
      - '.github/workflows/diagnose-agilecert-phase-5-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose exact identity binding and Professional issuance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated database
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202607200003_bootstrap_super_admin.sql <<'SQL'
          begin;
          commit;
          SQL
          supabase start >/tmp/p5-binding-start.log 2>&1
          supabase db reset --local >/tmp/p5-binding-reset.log 2>&1

      - name: Run binding diagnostic
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL' 2>&1 | tee phase-5-binding-diagnostic.log
          \set candidate '11111111-1111-4111-8111-111111111111'
          \set admin 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          \set instance_id '00000000-0000-0000-0000-000000000000'

          insert into auth.users (
            instance_id, id, aud, role, email, encrypted_password,
            email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
            created_at, updated_at, confirmation_token, recovery_token,
            email_change, email_change_token_new
          ) values
          (:'instance_id', :'candidate', 'authenticated', 'authenticated', 'candidate@example.test', crypt('Password1!', gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}', '{"full_name":"Candidate One"}', now(), now(), '', '', '', ''),
          (:'instance_id', :'admin', 'authenticated', 'authenticated', 'admin@example.test', crypt('Password1!', gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}', '{"full_name":"Exam Administrator"}', now(), now(), '', '', '', '');

          update public.profiles set role = 'exam_admin' where id = :'admin';
          insert into public.agilecert_candidate_profiles (user_id, legal_name, phone, country_code, preferred_currency)
          values (:'candidate', 'Candidate One', '+2348000000001', 'NG', 'NGN');

          insert into public.programmes (id, code, name, created_by)
          values ('30000000-0000-4000-8000-000000000001', 'P5BIND', 'Phase 5 Binding', :'admin');
          insert into public.examinations (id, programme_id, title, duration_minutes, pass_mark, status, created_by, requires_payment)
          values ('40000000-0000-4000-8000-000000000001', '30000000-0000-4000-8000-000000000001', 'Phase 5 Binding Examination', 60, 70, 'published', :'admin', false);
          insert into public.exam_assignments (id, examination_id, candidate_id, assigned_by, status)
          values ('50000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate', :'admin', 'completed');
          insert into public.exam_sessions (id, assignment_id, examination_id, candidate_id, status, started_at, expires_at, submitted_at)
          values ('60000000-0000-4000-8000-000000000001', '50000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate', 'submitted', now()-interval '1 hour', now()+interval '1 hour', now()-interval '10 minutes');
          insert into public.attempts (id, session_id, examination_id, candidate_id, raw_score, maximum_score, percentage, status, suspicious_score, started_at, submitted_at)
          values ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', '40000000-0000-4000-8000-000000000001', :'candidate', 85, 100, 85, 'submitted', 0, now()-interval '1 hour', now()-interval '10 minutes');

          insert into public.agilecert_identity_verifications (
            id, candidate_id, status, legal_name_snapshot, phone_snapshot,
            country_code_snapshot, affiliation_type, affiliation_name,
            evidence_category, evidence_object_path, evidence_filename,
            evidence_mime_type, evidence_size_bytes, attested_at, submitted_at,
            reviewed_at, reviewed_by, review_note, approval_expires_at, metadata
          ) values (
            '81000000-0000-4000-8000-000000000001', :'candidate', 'approved', 'Candidate One', '+2348000000001',
            'NG', 'professional_body', 'Original Body', 'professional_membership',
            :'candidate' || '/evidence.pdf', 'evidence.pdf', 'application/pdf', 1024,
            now(), now(), now(), :'admin', 'Original approved identity.', now()+interval '2 years',
            '{"verificationMethod":"manual_iipm_review"}'::jsonb
          );

          select set_config('request.jwt.claim.sub', :'candidate', false);
          select public.create_agilecert_professional_certificate_order(
            (select id from public.agilecert_certificate_eligibility_records where candidate_id = :'candidate'),
            'NGN'
          ) as created_order;

          update public.agilecert_identity_verifications
          set status = 'expired', approval_expires_at = now()
          where id = '81000000-0000-4000-8000-000000000001';
          insert into public.agilecert_identity_verifications (
            id, candidate_id, status, legal_name_snapshot, phone_snapshot,
            country_code_snapshot, affiliation_type, affiliation_name,
            evidence_category, evidence_object_path, evidence_filename,
            evidence_mime_type, evidence_size_bytes, attested_at, submitted_at,
            reviewed_at, reviewed_by, review_note, approval_expires_at, metadata
          ) values (
            '82000000-0000-4000-8000-000000000002', :'candidate', 'approved', 'Candidate One', '+2348000000001',
            'NG', 'professional_body', 'Alternate Body', 'professional_membership',
            :'candidate' || '/evidence.pdf', 'evidence.pdf', 'application/pdf', 1024,
            now(), now(), now(), :'admin', 'Alternate later approval.', now()+interval '2 years',
            '{"verificationMethod":"manual_iipm_review"}'::jsonb
          );
          update public.agilecert_certificate_orders
          set status = 'paid', paid_at = now(), provider_transaction_id = 'P5-BIND-DIAG'
          where candidate_id = :'candidate' and product_code = 'professional';

          do $$
          declare v_order uuid;
          begin
            select id into v_order from public.agilecert_certificate_orders where candidate_id = '11111111-1111-4111-8111-111111111111' and product_code = 'professional';
            begin
              perform public.agilecert_issue_identity_verified_certificate_for_order(v_order, null, 'verified_payment');
              raise exception 'EXPECTED_BINDING_REJECTION_NOT_RAISED';
            exception when others then
              raise notice 'FIRST_ISSUANCE_RESULT: %', sqlerrm;
              if position('same active approved IIPM identity-assurance record used at checkout' in sqlerrm) = 0 then
                raise;
              end if;
            end;
          end;
          $$;

          update public.agilecert_identity_verifications set status='expired', approval_expires_at=now()
          where id='82000000-0000-4000-8000-000000000002';
          update public.agilecert_identity_verifications set status='approved', approval_expires_at=now()+interval '2 years'
          where id='81000000-0000-4000-8000-000000000001';

          select public.agilecert_issue_identity_verified_certificate_for_order(
            (select id from public.agilecert_certificate_orders where candidate_id = :'candidate' and product_code='professional'),
            null,
            'verified_payment'
          ) as successful_issuance;

          select certificate.certificate_title,
                 credential.product_code,
                 credential.transcript_code,
                 credential.metadata->>'identityVerificationId' as credential_identity,
                 certificate.metadata->>'identityVerificationId' as certificate_identity
          from public.agilecert_paid_credentials credential
          join public.agilecert_issued_certificates certificate on certificate.id = credential.certificate_id;

          select 'PHASE_5_BINDING_DIAGNOSTIC_PASSED' as result;
          SQL

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-phase-5-binding-diagnostic
          retention-days: 3
          if-no-files-found: warn
          path: |
            phase-5-binding-diagnostic.log
            /tmp/p5-binding-start.log
            /tmp/p5-binding-reset.log
