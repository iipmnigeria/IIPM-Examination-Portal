name: Diagnose AgileCert Pages Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/diagnose-agilecert-pages-source.txt'

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    name: Read Pages configuration and live source
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            > "$RUNNER_TEMP/pages-config.json"
          jq '{url, status, build_type, source, public, protected_domain, https_enforced}' \
            "$RUNNER_TEMP/pages-config.json" | tee "$RUNNER_TEMP/pages-config-sanitized.json"

      - name: Read latest Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            > "$RUNNER_TEMP/pages-build.json"
          jq '{status, error, pusher: .pusher.login, commit, duration, created_at, updated_at}' \
            "$RUNNER_TEMP/pages-build.json" | tee "$RUNNER_TEMP/pages-build-sanitized.json"

      - name: Capture current public index markers
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o "$RUNNER_TEMP/live-index.html" -w '%{http_code}' \
            "https://iipmnigeria.github.io/IIPM-Examination-Portal/?pages-diagnostic=${GITHUB_RUN_ID}")"
          echo "HTTP ${status}" | tee "$RUNNER_TEMP/live-index-status.txt"
          test "$status" = '200'
          {
            grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/live-index.html" || true
            grep -Eo '/src/main\.tsx' "$RUNNER_TEMP/live-index.html" || true
            grep -Eo 'AgileCert Global' "$RUNNER_TEMP/live-index.html" | head -n 1 || true
          } | tee "$RUNNER_TEMP/live-index-markers.txt"

      - name: Upload Pages diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilecert-pages-source-diagnostics
          retention-days: 5
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pages-config-sanitized.json
            ${{ runner.temp }}/pages-build-sanitized.json
            ${{ runner.temp }}/live-index-status.txt
            ${{ runner.temp }}/live-index-markers.txt
            ${{ runner.temp }}/live-index.html
