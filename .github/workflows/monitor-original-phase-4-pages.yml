name: Monitor Original Phase 4 Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/monitor-original-phase-4-pages.txt'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify exact compiled Phase 4 frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT: '124242c8d471c64a5eca8a83c1c22737fa8b1a2f'
      LIVE_URL: 'https://iipmnigeria.github.io/IIPM-Examination-Portal/'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate successful permanent Pages run
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 90); do
            response="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_COMMIT}&event=push&per_page=100")"
            run="$(printf '%s' "$response" | jq -c '[.workflow_runs[] | select(.name == "Deploy AgileCert Compiled Pages")] | sort_by(.created_at) | last // empty')"
            if [ -n "$run" ]; then
              run_id="$(printf '%s' "$run" | jq -r '.id')"
              status="$(printf '%s' "$run" | jq -r '.status')"
              conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
              echo "Attempt $attempt: run=$run_id status=$status conclusion=$conclusion"
              printf '%s\n' "$run" > pages-run.json
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                break
              fi
            else
              echo "Attempt $attempt: permanent Pages run not visible yet"
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Confirm permanent Pages job results
        shell: bash
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > pages-jobs.json
          jq -e '.jobs | length >= 3' pages-jobs.json >/dev/null
          jq -e 'all(.jobs[]; .conclusion == "success")' pages-jobs.json >/dev/null
          jq -e 'any(.jobs[]; .name == "Verify live portal mounts" and .conclusion == "success")' pages-jobs.json >/dev/null

      - name: Download expected bundle fingerprint
        shell: bash
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "agilecert-pages-build-fingerprint") | .id' | head -n 1)"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > fingerprint.zip
          mkdir fingerprint
          unzip -q fingerprint.zip -d fingerprint
          expected="$(tr -d '[:space:]' < fingerprint/expected-live-js.sha256)"
          test "${#expected}" -eq 64
          echo "$expected" > expected-live-js.sha256

      - name: Verify live compiled bundle and Phase 4 markers
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 60); do
            status="$(curl -L -sS -o live-index.html -w '%{http_code}' "${LIVE_URL}?phase4-live=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$status" = 200 ] && grep -q 'AgileCert Global' live-index.html && ! grep -q '/src/main.tsx' live-index.html; then
              mapfile -t assets < <(grep -Eo 'src="[^"]+\.js"' live-index.html | cut -d'"' -f2 | sort -u)
              if [ "${#assets[@]}" -gt 0 ]; then
                rm -f live-all.js live-primary.js
                primary=1
                for asset in "${assets[@]}"; do
                  asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                  )"
                  curl -L --fail --silent --show-error "${asset_url}?phase4-live=${GITHUB_RUN_ID}-${attempt}" -o asset.js
                  cat asset.js >> live-all.js
                  if [ "$primary" -eq 1 ]; then
                    cp asset.js live-primary.js
                    primary=0
                  fi
                done
                actual="$(sha256sum live-primary.js | awk '{print $1}')"
                expected="$(cat expected-live-js.sha256)"
                echo "$actual" > live-primary.sha256
                if [ "$actual" = "$expected" ] \
                  && grep -q 'Professional Credential Wallet' live-all.js \
                  && grep -q 'Credential Lifecycle Administration' live-all.js \
                  && grep -q 'IIPM Professional Record Verification' live-all.js \
                  && grep -q 'Add to LinkedIn' live-all.js \
                  && grep -q 'Save CPD draft' live-all.js \
                  && grep -q 'Request renewal' live-all.js; then
                  success=1
                  break
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1

      - name: Upload sanitized Pages verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-phase-4-pages-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            pages-run.json
            pages-jobs.json
            expected-live-js.sha256
            live-primary.sha256
            live-index.html
