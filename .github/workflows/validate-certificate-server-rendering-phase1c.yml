name: Validate Certificate Server Rendering Phase 1C

on:
  pull_request:
    branches: [supabase-integration]
    paths:
      - '.github/workflows/validate-certificate-server-rendering-phase1c.yml'
      - 'supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certificate-server-rendering-phase1c-source-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair invalid composite assignment in Phase 1C migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql')
          content = path.read_text(encoding='utf-8')
          old = """  select to_jsonb(assignment), assignment
  into v_before, v_assignment
  from public.agilecert_certificate_master_assignments assignment
  where assignment.id = p_assignment_id
  for update;
"""
          new = """  select *
  into v_assignment
  from public.agilecert_certificate_master_assignments assignment
  where assignment.id = p_assignment_id
  for update;

  v_before := to_jsonb(v_assignment);
"""
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one invalid composite assignment block.')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

          grep -q 'v_before := to_jsonb(v_assignment);' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql
          ! grep -q 'select to_jsonb(assignment), assignment' \
            supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql

          rm -f deployment-triggers/patch-certificate-server-rendering-phase1c-sql.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202608012200_certificate_server_rendering_phase1c.sql \
            deployment-triggers/patch-certificate-server-rendering-phase1c-sql.txt
          git diff --cached --check
          git commit -m 'Fix Phase 1C renderer activation migration syntax'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
