# One-purpose Edge Function deployment after the Phase 2.4 database migration.
name: Deploy Phase 2.4 Edge Function

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'deployment-triggers/phase-2-4-edge-function.txt'

permissions:
  contents: read

concurrency:
  group: phase-2-4-edge-function-production
  cancel-in-progress: false

jobs:
  deploy-edge-function:
    name: Deploy approved secure material delivery function
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cfecicvugfrrhcvhduzc
      APPROVED_APP_COMMIT: 'ca4c29ac5c2730b86000dfaefda6583cffc77053'
      FUNCTION_NAME: agilecert-material-delivery
      FUNCTION_FILE: supabase/functions/agilecert-material-delivery/index.ts
      FUNCTION_WORKDIR: /tmp/agilecert-phase-2-4-function

    steps:
      - name: Checkout exact approved application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          fetch-depth: 0

      - name: Validate exact Edge Function input
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          test -s "$FUNCTION_FILE"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source = Path(os.environ['FUNCTION_FILE']).read_text()
          markers = [
              'auth.getUser',
              'authorize_agilecert_material_download',
              'SUPABASE_SERVICE_ROLE_KEY',
              'createSignedUrl',
              'signedUrlTtlSeconds',
              'X-AgileCert-Download-Audit',
          ]
          for marker in markers:
              if marker not in source:
                  raise SystemExit(f'Edge Function marker is missing: {marker}')
          if re.search(r'sb_secret_|service_role\s*[=:]\s*["\'][A-Za-z0-9_-]{20,}', source, re.I):
              raise SystemExit('A privileged credential appears to be hard-coded.')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check approved Edge Function
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto "$FUNCTION_FILE" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-check.log"

      - name: Prepare isolated function workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FUNCTION_WORKDIR"
          mkdir -p "$FUNCTION_WORKDIR/supabase/functions/$FUNCTION_NAME"
          cp supabase/config.toml "$FUNCTION_WORKDIR/supabase/config.toml"
          cp "$FUNCTION_FILE" "$FUNCTION_WORKDIR/supabase/functions/$FUNCTION_NAME/index.ts"
          test -s "$FUNCTION_WORKDIR/supabase/functions/$FUNCTION_NAME/index.ts"

      - name: Deploy only the approved Edge Function
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-function
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-deploy.log"

      - name: Verify Edge Function registration and endpoint
        shell: bash
        working-directory: /tmp/agilecert-phase-2-4-function
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            2>&1 | tee "$RUNNER_TEMP/phase-2-4-edge-function-list.log"
          grep -q "$FUNCTION_NAME" "$RUNNER_TEMP/phase-2-4-edge-function-list.log"

          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          status="$(curl -sS -o "$RUNNER_TEMP/phase-2-4-edge-function-probe.txt" -w '%{http_code}' \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          echo "Endpoint probe status: $status" | tee "$RUNNER_TEMP/phase-2-4-edge-function-probe-status.txt"
          test "$status" != '404'
          test "$status" != '000'

      - name: Upload sanitized function deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-4-edge-function-deployment-evidence
          path: |
            ${{ runner.temp }}/phase-2-4-edge-function-check.log
            ${{ runner.temp }}/phase-2-4-edge-function-deploy.log
            ${{ runner.temp }}/phase-2-4-edge-function-list.log
            ${{ runner.temp }}/phase-2-4-edge-function-probe.txt
            ${{ runner.temp }}/phase-2-4-edge-function-probe-status.txt
          if-no-files-found: warn
          retention-days: 3
