name: Validate AgileCert Phase 2

on:
  push:
    branches:
      - phase-2-candidate-profile-materials
      - phase-2-2-profile-photo
      - phase-2-2b-profile-avatar-integration
      - phase-2-3a-material-entitlements
      - phase-2-3b-material-admin-tools
      - phase-2-4-secure-material-delivery
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
      - 'supabase/functions/agilecert-material-delivery/**'
      - 'docs/AGILECERT_PHASE_2_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-2.yml'
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
      - 'supabase/functions/agilecert-material-delivery/**'
      - 'docs/AGILECERT_PHASE_2_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.head_ref, 'phase-2-')
    name: Phase 2 TypeScript, build and scope controls
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify AgileCert browser output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          grep -q 'root' dist/index.html

      - name: Confirm exact Phase 2.4 backend scope
        shell: bash
        run: |
          set -euo pipefail
          changed_migrations="$(git diff --name-only origin/supabase-integration...HEAD | grep -E '^supabase/migrations/' || true)"
          test "$changed_migrations" = 'supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'

          changed_functions="$(git diff --name-only origin/supabase-integration...HEAD | grep -E '^supabase/functions/' || true)"
          test "$changed_functions" = 'supabase/functions/agilecert-material-delivery/index.ts'

      - name: Confirm private storage and audit schema
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          text = Path('supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql').read_text()
          required = [
              "'agilecert-preparation-materials'",
              '262144000',
              'agilecert_is_material_admin',
              "p.role in ('exam_admin', 'super_admin')",
              'agilecert_material_download_audits',
              "status in ('requested', 'delivered', 'denied', 'failed')",
              'authorize_agilecert_material_download',
              'get_agilecert_material_download_audits',
              'to service_role',
              "interval '60 seconds'",
              'storage.objects',
              'The uploaded private file could not be found',
              "notify pgrst, 'reload schema'",
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'Missing migration controls: {missing}'
          assert 'grant execute on function public.authorize_agilecert_material_download' in text
          assert 'to authenticated;\n\ngrant execute on function public.authorize_agilecert_material_download' not in text
          PY

      - name: Confirm secure Edge Function delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          text = Path('supabase/functions/agilecert-material-delivery/index.ts').read_text()
          required = [
              'auth.getUser',
              'authorize_agilecert_material_download',
              'SUPABASE_SERVICE_ROLE_KEY',
              'createSignedUrl',
              'signedUrlTtlSeconds',
              'agilecert_material_download_audits',
              'Content-Disposition',
              'no-store',
              'X-AgileCert-Download-Audit',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'Missing Edge Function controls: {missing}'
          assert not re.search(r'sb_secret_[A-Za-z0-9_-]{20,}', text)
          assert not re.search(r'service_role\s*[=:]\s*["\'][A-Za-z0-9_-]{20,}', text, re.I)
          PY

      - name: Confirm administrator private upload workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service = Path('src/services/materialAdminService.ts').read_text()
          panel = Path('src/components/AdminMaterialManagementPanel.tsx').read_text()
          service_required = [
              'AGILECERT_MATERIAL_BUCKET',
              "crypto.subtle.digest('SHA-256'",
              '.storage',
              '.upload(',
              'get_agilecert_material_download_audits',
              'uploadMaterialVersionFile',
          ]
          panel_required = [
              'uploadMaterialVersionFile',
              'Private file versions',
              'Secure delivery audit',
              '250 MB',
          ]
          assert not [v for v in service_required if v not in service]
          assert not [v for v in panel_required if v not in panel]
          PY

      - name: Confirm candidate delivery controls hide storage metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          service = Path('src/services/preparationMaterialService.ts').read_text()
          panel = Path('src/components/CandidatePreparationMaterialsPanel.tsx').read_text()
          required = [
              'agilecert-material-delivery',
              'downloadPreparationMaterial',
              'Download securely',
              'Copyright notice',
              'Private storage paths are never displayed',
          ]
          combined = service + '\n' + panel
          assert not [v for v in required if v not in combined]
          forbidden = r'storageBucket|storagePath|checksumSha256|createSignedUrl|getPublicUrl|SUPABASE_SERVICE_ROLE'
          assert not re.search(forbidden, combined, re.I), 'Candidate frontend exposes private delivery metadata.'
          PY

      - name: Confirm commerce, examination and later phases remain excluded
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only origin/supabase-integration...HEAD)"

          if printf '%s\n' "$changed_files" | grep -Eq '^src/services/(commerceService|examService)\.ts$|^src/components/AdminPortal\.tsx$'; then
            echo "$changed_files"
            echo 'Phase 2.4 must not change commerce, examination runtime or proctor-audit implementation.'
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep -Eqi '(credential|certificate-order|identity-verification|ai-adviser)'; then
            echo "$changed_files"
            echo 'A later-phase feature file was introduced in Phase 2.4.'
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql').read_text()
          assert not re.search(r'create or replace function.*(certificate|credential|identity_verification|ai_adviser|paystack)', migration, re.I)

          frontend = '\n'.join(path.read_text(errors='ignore') for path in Path('src').rglob('*') if path.is_file())
          assert 'SUPABASE_SERVICE_ROLE' not in frontend
          PY

      - name: Confirm Phase 2.4 scope document
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          text = Path('docs/AGILECERT_PHASE_2_SCOPE.md').read_text()
          required = [
              'Phase 2.3B — Administrator material publication and mapping tools — completed and deployed',
              'Phase 2.4 — Secure material delivery and audit — current build unit',
              'Candidates have no direct `storage.objects` policy',
              'Service-role-only candidate download authorisation',
              'No Phase 2.4 merge or deployment may occur without explicit approval',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'Missing scope statements: {missing}'
          PY
