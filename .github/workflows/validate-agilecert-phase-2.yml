name: Validate AgileCert Phase 2

on:
  push:
    branches:
      - phase-2-candidate-profile-materials
      - phase-2-2-profile-photo
      - phase-2-2b-profile-avatar-integration
      - phase-2-3a-material-entitlements
      - phase-2-3b-material-admin-tools
      - phase-2-4-secure-material-delivery
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
      - 'supabase/functions/agilecert-material-delivery/**'
      - 'docs/AGILECERT_PHASE_2_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-2.yml'
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
      - 'supabase/functions/agilecert-material-delivery/**'
      - 'docs/AGILECERT_PHASE_2_SCOPE.md'
      - '.github/workflows/validate-agilecert-phase-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agilecert-phase-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 2 TypeScript, build and scope controls
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify AgileCert browser output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          grep -q 'root' dist/index.html

      - name: Confirm exact Phase 2.4 backend scope
        shell: bash
        run: |
          set -euo pipefail
          changed_migrations="$(git diff --name-only origin/supabase-integration...HEAD | grep -E '^supabase/migrations/' || true)"
          allowed_migration='supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
          test "$changed_migrations" = "$allowed_migration"

          changed_functions="$(git diff --name-only origin/supabase-integration...HEAD | grep -E '^supabase/functions/' || true)"
          allowed_function='supabase/functions/agilecert-material-delivery/index.ts'
          test "$changed_functions" = "$allowed_function"

      - name: Confirm private storage and audit schema
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
          test -s "$migration"

          grep -q "'agilecert-preparation-materials'" "$migration"
          grep -q 'public,.*false' "$migration" || grep -q '^  false,$' "$migration"
          grep -q '262144000' "$migration"
          grep -q 'agilecert_is_material_admin' "$migration"
          grep -q "p.role in ('exam_admin', 'super_admin')" "$migration"
          grep -q 'agilecert_material_download_audits' "$migration"
          grep -q "status in ('requested', 'delivered', 'denied', 'failed')" "$migration"
          grep -q 'authorize_agilecert_material_download' "$migration"
          grep -q 'get_agilecert_material_download_audits' "$migration"
          grep -q 'to service_role' "$migration"
          grep -q "interval '60 seconds'" "$migration"
          grep -q 'storage.objects' "$migration"
          grep -q 'The uploaded private file could not be found' "$migration"
          grep -q "notify pgrst, 'reload schema'" "$migration"

          if grep -Eq 'create policy .*candidate.*storage|to authenticated.*authorize_agilecert_material_download' "$migration"; then
            echo 'Candidate direct storage access or browser download authorisation was introduced.'
            exit 1
          fi

      - name: Confirm secure Edge Function delivery
        shell: bash
        run: |
          set -euo pipefail
          function_file='supabase/functions/agilecert-material-delivery/index.ts'
          test -s "$function_file"

          grep -q "auth.getUser" "$function_file"
          grep -q "authorize_agilecert_material_download" "$function_file"
          grep -q "SUPABASE_SERVICE_ROLE_KEY" "$function_file"
          grep -q "createSignedUrl" "$function_file"
          grep -q "signedUrlTtlSeconds" "$function_file"
          grep -q "agilecert_material_download_audits" "$function_file"
          grep -q "Content-Disposition" "$function_file"
          grep -q "Cache-Control.*no-store" "$function_file"
          grep -q "X-AgileCert-Download-Audit" "$function_file"

          if grep -Eqi '(sb_secret_|service_role[=:][[:space:]]*["'"'][A-Za-z0-9_-]{20,})' "$function_file"; then
            echo 'A privileged credential appears to be hard-coded in the Edge Function.'
            exit 1
          fi

      - name: Confirm administrator private upload workflow
        shell: bash
        run: |
          set -euo pipefail
          service='src/services/materialAdminService.ts'
          panel='src/components/AdminMaterialManagementPanel.tsx'

          test -s "$service"
          test -s "$panel"
          grep -q "AGILECERT_MATERIAL_BUCKET" "$service"
          grep -q "crypto.subtle.digest('SHA-256'" "$service"
          grep -q "storage.*upload" "$service"
          grep -q "get_agilecert_material_download_audits" "$service"
          grep -q "uploadMaterialVersionFile" "$panel"
          grep -q "Private file versions" "$panel"
          grep -q "Secure delivery audit" "$panel"
          grep -q "250 MB" "$panel"

      - name: Confirm candidate delivery controls hide storage metadata
        shell: bash
        run: |
          set -euo pipefail
          service='src/services/preparationMaterialService.ts'
          panel='src/components/CandidatePreparationMaterialsPanel.tsx'

          grep -q "agilecert-material-delivery" "$service"
          grep -q "downloadPreparationMaterial" "$service"
          grep -q "Download securely" "$panel"
          grep -q "Copyright notice" "$panel"
          grep -q "Private storage paths are never displayed" "$panel"

          if grep -Eqi '(storageBucket|storagePath|checksumSha256|createSignedUrl|getPublicUrl|SUPABASE_SERVICE_ROLE)' "$service" "$panel"; then
            echo 'Candidate frontend exposes private storage metadata, signed storage operations or privileged credentials.'
            exit 1
          fi

      - name: Confirm commerce, examination and later phases remain excluded
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only origin/supabase-integration...HEAD)"

          if printf '%s\n' "$changed_files" | grep -Eq '^src/services/(commerceService|examService)\.ts$|^src/components/AdminPortal\.tsx$'; then
            echo "$changed_files"
            echo 'Phase 2.4 must not change commerce, examination runtime or proctor-audit implementation.'
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep -Eqi '(credential|certificate-order|identity-verification|ai-adviser)'; then
            echo "$changed_files"
            echo 'A later-phase feature file was introduced in Phase 2.4.'
            exit 1
          fi

          migration='supabase/migrations/202607240103_phase_2_4_secure_material_delivery.sql'
          if grep -Eqi 'create or replace function.*(certificate|credential|identity_verification|ai_adviser|paystack)' "$migration"; then
            echo 'The Phase 2.4 migration introduces an excluded later-phase or payment function.'
            exit 1
          fi

          if grep -R -Eqi 'SUPABASE_SERVICE_ROLE|service_role' src package.json vite.config.* 2>/dev/null; then
            echo 'A privileged server credential reference was introduced into frontend or build files.'
            exit 1
          fi

      - name: Confirm Phase 2.4 scope document
        shell: bash
        run: |
          set -euo pipefail
          scope='docs/AGILECERT_PHASE_2_SCOPE.md'
          grep -q 'Phase 2.3B — Administrator material publication and mapping tools — completed and deployed' "$scope"
          grep -q 'Phase 2.4 — Secure material delivery and audit — current build unit' "$scope"
          grep -q 'Candidates have no direct `storage.objects` policy' "$scope"
          grep -q 'service-role-only candidate download authorisation' "$scope"
          grep -q 'No Phase 2.4 merge or deployment may occur without explicit approval' "$scope"
