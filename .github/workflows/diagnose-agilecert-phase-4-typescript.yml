name: Diagnose AgileCert Phase 4 TypeScript

on:
  push:
    branches:
      - phase-4-certificate-payment-credential-issuance
    paths:
      - '.github/workflows/diagnose-agilecert-phase-4-typescript.yml'
      - 'src/**'
  pull_request:
    branches:
      - supabase-integration
    paths:
      - '.github/workflows/diagnose-agilecert-phase-4-typescript.yml'
      - 'src/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/phase-4-typescript.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/phase-4-typescript.log"
          echo "$status" > "$RUNNER_TEMP/phase-4-typescript-status.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase-4-typescript-diagnostics
          path: |
            ${{ runner.temp }}/phase-4-typescript.log
            ${{ runner.temp }}/phase-4-typescript-status.txt
          retention-days: 1
