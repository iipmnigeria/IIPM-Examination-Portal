name: Verify Phase 4 Live Activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/verify-phase-4-live-activation.txt'

permissions:
  contents: read

concurrency:
  group: verify-phase-4-live-activation
  cancel-in-progress: false

jobs:
  verify-live-phase-4:
    name: Verify exact live Phase 4 deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APPROVED_PHASE_4_COMMIT: a0aca15360c07d2e2f6bada0cf80cd35060bb9ae
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: supabase-integration
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm exact approved source and build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$APPROVED_PHASE_4_COMMIT" HEAD \
            | grep -v '^deployment-triggers/phase-4-live-publish.txt$' \
            | tee "$RUNNER_TEMP/phase-4-live-unexpected-source-diff.log" || true
          test ! -s "$RUNNER_TEMP/phase-4-live-unexpected-source-diff.log"
          test -f deployment-triggers/phase-4-live-publish.txt

          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          expected_js="dist/${asset#./}"
          test -s "$expected_js"
          grep -q 'Credential Store' "$expected_js"
          grep -q 'IIPM Certificate Verification' "$expected_js"
          sha256sum "$expected_js" | awk '{print $1}' | tee "$RUNNER_TEMP/phase-4-live-expected-js.sha256"
          git rev-parse HEAD | tee "$RUNNER_TEMP/phase-4-live-source-head.log"

      - name: Verify exact GitHub Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/phase-4-live-expected-js.sha256")"
          matched=false
          : > "$RUNNER_TEMP/phase-4-live-publish-attempts.log"

          for attempt in $(seq 1 36); do
            cache_buster="phase4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "${LIVE_URL}?verify=${cache_buster}" -o "$RUNNER_TEMP/phase-4-live-index.html"; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/phase-4-live-index.html" | head -n 1 | cut -d'"' -f2 || true)"
              if [ -n "$asset" ]; then
                asset_url="$(python - "$LIVE_URL" "$asset" <<'PY'
import sys
from urllib.parse import urljoin
print(urljoin(sys.argv[1], sys.argv[2]))
PY
)"
                if curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' \
                  "${asset_url}?verify=${cache_buster}" -o "$RUNNER_TEMP/phase-4-live-app.js"; then
                  live_hash="$(sha256sum "$RUNNER_TEMP/phase-4-live-app.js" | awk '{print $1}')"
                  printf 'attempt=%s expected=%s live=%s asset=%s\n' "$attempt" "$expected" "$live_hash" "$asset_url" \
                    | tee -a "$RUNNER_TEMP/phase-4-live-publish-attempts.log"
                  if [ "$live_hash" = "$expected" ]; then
                    printf '%s\n' "$live_hash" | tee "$RUNNER_TEMP/phase-4-live-actual-js.sha256"
                    printf '%s\n' "$asset_url" | tee "$RUNNER_TEMP/phase-4-live-asset-url.log"
                    matched=true
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done

          test "$matched" = true
          grep -q 'Credential Store' "$RUNNER_TEMP/phase-4-live-app.js"
          grep -q 'IIPM Certificate Verification' "$RUNNER_TEMP/phase-4-live-app.js"
          grep -q 'AgileCert Global' "$RUNNER_TEMP/phase-4-live-index.html"

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install --with-deps chromium

      - name: Run live Chromium smoke test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const url = process.env.LIVE_URL + '?browser-verify=' + Date.now();
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', error => pageErrors.push(String(error)));
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(2500);
            const status = response ? response.status() : 0;
            const title = await page.title();
            const bodyText = await page.locator('body').innerText();
            const verificationVisible = bodyText.includes('IIPM Certificate Verification');
            const result = { url, status, title, bodyLength: bodyText.length, verificationVisible, consoleErrors, pageErrors };
            await page.screenshot({ path: process.env.RUNNER_TEMP + '/phase-4-live-page.png', fullPage: true });
            fs.writeFileSync(process.env.RUNNER_TEMP + '/phase-4-live-browser.json', JSON.stringify(result, null, 2));
            await browser.close();
            if (status !== 200) throw new Error('Live portal did not return HTTP 200.');
            if (!title.includes('AgileCert Global')) throw new Error('Unexpected live page title.');
            if (!verificationVisible) throw new Error('Public certificate verification launcher is not visible.');
            if (consoleErrors.length) throw new Error('Live portal emitted console errors.');
            if (pageErrors.length) throw new Error('Live portal emitted page errors.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload final Phase 4 live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-final-live-activation-evidence
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/phase-4-live-*.log
            ${{ runner.temp }}/phase-4-live-*.json
            ${{ runner.temp }}/phase-4-live-*.sha256
            ${{ runner.temp }}/phase-4-live-index.html
            ${{ runner.temp }}/phase-4-live-app.js
            ${{ runner.temp }}/phase-4-live-page.png
