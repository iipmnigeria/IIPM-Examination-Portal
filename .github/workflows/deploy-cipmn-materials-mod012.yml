name: Deploy CIPMN Materials and Module 012

on:
  push:
    branches:
      - supabase-integration
    paths:
      - 'deployment-triggers/deploy-cipmn-materials-mod012.txt'
      - '.github/workflows/deploy-cipmn-materials-mod012.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cipmn-materials-mod012-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply and verify CIPMN materials and Module 012
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_REF: cfecicvugfrrhcvhduzc
      TRACKING_BOUNDARY: '202607230101'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out approved integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate exact release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > cipmn-release-migrations.txt <<'EOF'
          202607291340_cipmn_paid_preparation_material_catalogue.sql
          202607291350_cipmn_mod012_procurement_contract_management_title.sql
          202607291406_cipmn_mod012_procurement_contract_question_bank.sql
          EOF

          while IFS= read -r migration; do
            test -s "supabase/migrations/$migration"
          done < cipmn-release-migrations.txt

          test "$(wc -l < cipmn-release-migrations.txt | tr -d ' ')" -eq 3
          grep -q 'agilecert_material_source_manifests' supabase/migrations/202607291340_cipmn_paid_preparation_material_catalogue.sql
          grep -q 'Project Procurement and Contract Management Mock Examination' supabase/migrations/202607291350_cipmn_mod012_procurement_contract_management_title.sql
          grep -q 'seed_cipmn_mock_module' supabase/migrations/202607291406_cipmn_mod012_procurement_contract_question_bank.sql
          grep -q 'v_procurement_scenarios <> 75' supabase/migrations/202607291406_cipmn_mod012_procurement_contract_question_bank.sql

      - name: Isolate production-tracked migration history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-local-migrations"
          : > cipmn-legacy-local-migrations.txt

          for migration in supabase/migrations/*.sql; do
            version="$(basename "$migration" | cut -d_ -f1)"
            if [[ "$version" < "$TRACKING_BOUNDARY" ]]; then
              basename "$migration" >> cipmn-legacy-local-migrations.txt
              mv "$migration" "$RUNNER_TEMP/legacy-local-migrations/"
            fi
          done

          sort -o cipmn-legacy-local-migrations.txt cipmn-legacy-local-migrations.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > cipmn-isolated-migration-window.txt
          awk -F_ -v boundary="$TRACKING_BOUNDARY" '$1 < boundary { print "Unexpected pre-tracking migration remains: " $0 > "/dev/stderr"; exit 1 }' cipmn-isolated-migration-window.txt

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Preview and approve only the CIPMN release set
        shell: bash
        run: |
          set -euo pipefail
          set +e
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-production-dry-run.log
          dry_run_status=${PIPESTATUS[0]}
          set -e
          test "$dry_run_status" -eq 0

          python3 - <<'PY'
          from pathlib import Path
          import re

          expected = {
              line.split('_', 1)[0]
              for line in Path('cipmn-release-migrations.txt').read_text().splitlines()
              if line.strip()
          }
          local = {
              path.name.split('_', 1)[0]
              for path in Path('supabase/migrations').glob('*.sql')
          }
          text = Path('cipmn-production-dry-run.log').read_text(errors='ignore')
          pending = sorted(set(re.findall(r'202[0-9]{9,}', text)) & local)
          unexpected = sorted(set(pending) - expected)
          if unexpected:
              raise SystemExit(f'Unexpected pending production migrations: {unexpected}')
          Path('cipmn-pending-versions.txt').write_text('\n'.join(pending) + ('\n' if pending else ''))
          print({'expected': sorted(expected), 'pending': pending})
          PY

      - name: Apply approved pending migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s cipmn-pending-versions.txt ]]; then
            supabase db push --linked -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-production-deploy.log
          else
            echo 'All approved CIPMN migrations are already applied.' | tee cipmn-production-deploy.log
          fi

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-production-migration-history.log

          python3 - <<'PY'
          from pathlib import Path

          text = Path('cipmn-production-migration-history.log').read_text(errors='ignore')
          rows = []
          for line in text.splitlines():
              if '|' not in line:
                  continue
              parts = [part.strip() for part in line.split('|')]
              if len(parts) >= 3:
                  rows.append(parts)

          for version in ('202607291340', '202607291350', '202607291406'):
              matched = [row for row in rows if row[0] == version or row[1] == version]
              if not matched or not any(row[0] == version and row[1] == version for row in matched):
                  raise SystemExit(f'Migration {version} is not recorded locally and remotely: {matched}')
          PY

      - name: Verify live CIPMN catalogue, materials and Module 012
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          query = r"""
          with programme as (
            select id
            from public.programmes
            where code = 'CIPMN-MOCK' and is_active = true
            limit 1
          ), exams as (
            select e.*
            from public.examinations e
            join programme p on p.id = e.programme_id
          ), mod12 as (
            select *
            from exams
            where id = '5c49847b-3944-5034-b620-0a3c5a1c7523'::uuid
          ), relevant_materials as (
            select m.*
            from public.agilecert_preparation_materials m
            where m.title like 'CIPMN-MOD-% Study Material - %'
               or m.title like 'CIPMN-MOD-% Video Lesson - %'
               or m.title = 'ESG in Project Management Practice'
          )
          select jsonb_build_object(
            'programmeCode', 'CIPMN-MOCK',
            'examinationCount', (select count(*) from exams),
            'publishedCount', (select count(*) from exams where status = 'published'),
            'invalidConfigurationCount', (
              select count(*) from exams
              where status <> 'published'
                 or duration_minutes <> 120
                 or pass_mark <> 70
                 or max_attempts <> 1
                 or requires_payment = false
                 or allow_self_enrollment = true
                 or randomize_questions = false
                 or randomize_options = false
            ),
            'questionCount', (
              select count(*)
              from public.questions q
              join exams e on e.id = q.examination_id
              where q.is_active = true
            ),
            'optionCount', (
              select count(*)
              from public.question_options qo
              join public.questions q on q.id = qo.question_id and q.is_active = true
              join exams e on e.id = q.examination_id
            ),
            'answerKeyCount', (
              select count(*)
              from public.question_answer_keys k
              join public.questions q on q.id = k.question_id and q.is_active = true
              join public.question_options qo on qo.id = k.correct_option_id and qo.question_id = q.id
              join exams e on e.id = q.examination_id
            ),
            'mod12Title', (select title from mod12),
            'mod12QuestionCount', (
              select count(*) from public.questions q
              where q.examination_id = (select id from mod12) and q.is_active = true
            ),
            'mod12OptionCount', (
              select count(*)
              from public.question_options qo
              join public.questions q on q.id = qo.question_id
              where q.examination_id = (select id from mod12) and q.is_active = true
            ),
            'mod12AnswerKeyCount', (
              select count(*)
              from public.question_answer_keys k
              join public.questions q on q.id = k.question_id and q.is_active = true
              join public.question_options qo on qo.id = k.correct_option_id and qo.question_id = q.id
              where q.examination_id = (select id from mod12)
            ),
            'mod12ProcurementScenarioCount', (
              select count(*)
              from public.questions q
              where q.examination_id = (select id from mod12)
                and q.is_active = true
                and q.question_text ~* '(procure|contract|tender|supplier|bid|payment|variation|claim|dispute|award|market|equipment|invoice|guarantee|evaluation|specification)'
            ),
            'pdfMaterialCount', (
              select count(*) from relevant_materials where title like 'CIPMN-MOD-% Study Material - %'
            ),
            'videoMaterialCount', (
              select count(*) from relevant_materials where title like 'CIPMN-MOD-% Video Lesson - %'
            ),
            'esgMaterialCount', (
              select count(*) from relevant_materials where title = 'ESG in Project Management Practice'
            ),
            'materialMappingCount', (
              select count(*)
              from public.agilecert_exam_materials em
              join exams e on e.id = em.examination_id
              join relevant_materials m on m.id = em.material_id
              where em.is_active = true
            ),
            'esgMappingCount', (
              select count(*)
              from public.agilecert_exam_materials em
              join exams e on e.id = em.examination_id
              join relevant_materials m on m.id = em.material_id
              where em.is_active = true
                and m.title = 'ESG in Project Management Practice'
            ),
            'sourceManifestCount', (
              select count(*)
              from public.agilecert_material_source_manifests sm
              join relevant_materials m on m.id = sm.material_id
            )
          ) as verification;
          """

          with open('/tmp/cipmn-production-query.json', 'w', encoding='utf-8') as handle:
              json.dump({'query': query}, handle)
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/cipmn-production-query.json \
            -o cipmn-production-verification.json

          python3 - <<'PY'
          import json

          data = json.load(open('cipmn-production-verification.json', encoding='utf-8'))
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}

          expected = {
              'programmeCode': 'CIPMN-MOCK',
              'examinationCount': 12,
              'publishedCount': 12,
              'invalidConfigurationCount': 0,
              'questionCount': 900,
              'optionCount': 3600,
              'answerKeyCount': 900,
              'mod12Title': 'CIPMN-MOD-012 - Project Procurement and Contract Management Mock Examination',
              'mod12QuestionCount': 75,
              'mod12OptionCount': 300,
              'mod12AnswerKeyCount': 75,
              'mod12ProcurementScenarioCount': 75,
              'pdfMaterialCount': 12,
              'videoMaterialCount': 12,
              'esgMaterialCount': 1,
              'materialMappingCount': 36,
              'esgMappingCount': 12,
              'sourceManifestCount': 25,
          }

          for key, value in expected.items():
              assert result.get(key) == value, (key, result.get(key), value, result)

          with open('cipmn-production-safe.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY

      - name: Confirm no migrations remain pending
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee cipmn-post-deploy-dry-run.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          local = {
              path.name.split('_', 1)[0]
              for path in Path('supabase/migrations').glob('*.sql')
          }
          text = Path('cipmn-post-deploy-dry-run.log').read_text(errors='ignore')
          pending = sorted(set(re.findall(r'202[0-9]{9,}', text)) & local)
          if pending:
              raise SystemExit(f'Production migrations remain pending: {pending}')
          PY

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipmn-materials-mod012-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            cipmn-release-migrations.txt
            cipmn-legacy-local-migrations.txt
            cipmn-isolated-migration-window.txt
            cipmn-production-dry-run.log
            cipmn-pending-versions.txt
            cipmn-production-deploy.log
            cipmn-production-migration-history.log
            cipmn-production-verification.json
            cipmn-production-safe.json
            cipmn-post-deploy-dry-run.log
