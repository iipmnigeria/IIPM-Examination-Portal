name: Verify live approved CIPMN sample layout

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-live-cipmn-sample-layout.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download live portal bundle
        run: |
          set -euo pipefail
          mkdir -p live
          base='https://iipmnigeria.github.io/IIPM-Examination-Portal/'
          curl -fsSL --retry 18 --retry-delay 10 --retry-all-errors "${base}?release=approved-cipmn-sample-layout" -o live/index.html
          grep -oE 'assets/[^" ]+\.js' live/index.html | sort -u > live/js-assets.txt
          test -s live/js-assets.txt
          while IFS= read -r asset || [ -n "$asset" ]; do
            curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "${base}${asset}" -o "live/$(basename "$asset")"
          done < live/js-assets.txt
          cat live/*.js > live/all-js.txt

      - name: Confirm approved certificate renderer is live
        run: |
          set -euo pipefail
          grep -F 'IN COLLABORATION WITH' live/all-js.txt
          grep -F 'CERTIFICATE OF COMPLETION' live/all-js.txt
          grep -F 'CHARTERED INSTITUTE OF PROJECT MANAGERS OF NIGERIA (CIPMN)' live/all-js.txt
          grep -F 'has successfully completed the CIPMN Licensing Training Module in' live/all-js.txt
          grep -F 'Delivered through IIPM in collaboration with CIPMN.' live/all-js.txt
          grep -F 'Date of Completion' live/all-js.txt
          grep -F 'Certificate Number' live/all-js.txt
          grep -F 'EBURUCHE OBINNA CHIMEZIE BANITO' live/all-js.txt
          grep -F 'SCAN TO VERIFY' live/all-js.txt

      - name: Upload read-only verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-approved-cipmn-sample-layout-verification
          path: |
            live/index.html
            live/js-assets.txt
          retention-days: 14
