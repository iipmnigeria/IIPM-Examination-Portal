name: Deploy Approved CIPMN Certificate Pages Exact Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-approved-cipmn-certificate-pages-exact.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved certificate source
        uses: actions/checkout@v4
        with:
          ref: '115221e095f2af9d2305ac67a3f13b3c7bdd14bb'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate approved certificate implementation
        run: >-
          npx tsc --noEmit --skipLibCheck --target ES2022
          --module ESNext --moduleResolution Bundler
          --allowSyntheticDefaultImports --esModuleInterop
          src/vite-env.d.ts
          src/services/certificateCompletionService.ts
          src/services/certificatePdfService.ts
          src/services/cipmnCertificateRenderer.ts
          src/assets/cipmnCertificateIipmLogo.ts
          src/assets/cipmnCertificateCipmnLogo.ts
          src/assets/cipmnCertificateBanitoSignature.ts

      - name: Build exact Pages bundle
        run: |
          npx vite build
          test -s dist/index.html
          cat dist/assets/*.js > /tmp/cipmn-certificate-pages-bundle.js
          grep -q 'CERTIFICATE OF COMPLETION' /tmp/cipmn-certificate-pages-bundle.js
          grep -q 'IIPM_CIPMN' /tmp/cipmn-certificate-pages-bundle.js
          grep -q 'SCAN TO VERIFY' /tmp/cipmn-certificate-pages-bundle.js
          grep -q 'Programme Coordinator / Executive Director, IIPM' /tmp/cipmn-certificate-pages-bundle.js
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > approved-cipmn-certificate-pages-dist.sha256

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Upload sanitized exact-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: approved-cipmn-certificate-pages-exact-build
          retention-days: 30
          path: approved-cipmn-certificate-pages-dist.sha256

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact approved certificate bundle
        id: deployment
        uses: actions/deploy-pages@v4
