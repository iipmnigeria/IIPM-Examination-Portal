name: Apply Phase Validation Path Fix

on:
  push:
    branches: [fix-phase-validation-path-scopes]
    paths:
      - 'scripts/narrow-phase-validation-paths.py'
      - '.github/workflows/apply-phase-validation-path-fix.yml'
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/narrow-phase-validation-paths.py'
      - '.github/workflows/apply-phase-validation-path-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-phase-validation-path-fix
  cancel-in-progress: false

jobs:
  patch:
    name: Narrow phase-specific PR validation paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-phase-validation-path-scopes
          fetch-depth: 0

      - name: Apply path-filter corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/narrow-phase-validation-paths.py

      - name: Verify unrelated candidate dashboard changes are excluded
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              '.github/workflows/validate-agilecert-phase-3-completion.yml',
              '.github/workflows/validate-agilecert-phase-4.yml',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              pull_request = text.split('  pull_request:', 1)[1].split('\n\npermissions:', 1)[0]
              assert "'src/**'" not in pull_request, (path, pull_request)
              assert "'src/components/StudentDashboard.tsx'" not in pull_request, (path, pull_request)
          PY

      - name: Commit corrections and remove one-time runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/narrow-phase-validation-paths.py
          rm .github/workflows/apply-phase-validation-path-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-agilecert-phase-3-completion.yml .github/workflows/validate-agilecert-phase-4.yml scripts/narrow-phase-validation-paths.py .github/workflows/apply-phase-validation-path-fix.yml
          git commit -m 'Limit phase regression workflows to their own files'
          git push origin HEAD:fix-phase-validation-path-scopes
