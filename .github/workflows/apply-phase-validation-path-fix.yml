name: Prepare Phase Validation Path Fix

on:
  push:
    branches: [fix-phase-validation-path-scopes]
    paths:
      - 'scripts/narrow-phase-validation-paths.py'
      - '.github/workflows/apply-phase-validation-path-fix.yml'
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/narrow-phase-validation-paths.py'
      - '.github/workflows/apply-phase-validation-path-fix.yml'

permissions:
  contents: read

concurrency:
  group: prepare-phase-validation-path-fix
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare corrected phase validation workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-phase-validation-path-scopes
          fetch-depth: 0

      - name: Apply path-filter corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/narrow-phase-validation-paths.py

      - name: Verify unrelated candidate dashboard changes are excluded
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              '.github/workflows/validate-agilecert-phase-3-completion.yml',
              '.github/workflows/validate-agilecert-phase-4.yml',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              pull_request = text.split('  pull_request:', 1)[1].split('\n\npermissions:', 1)[0]
              assert "'src/**'" not in pull_request, (path, pull_request)
              assert "'src/components/StudentDashboard.tsx'" not in pull_request, (path, pull_request)
          PY

      - name: Upload corrected workflows
        uses: actions/upload-artifact@v4
        with:
          name: corrected-phase-validation-workflows
          retention-days: 3
          if-no-files-found: error
          path: |
            .github/workflows/validate-agilecert-phase-3-completion.yml
            .github/workflows/validate-agilecert-phase-4.yml
