name: Repair CIPMN PNG Assets

on:
  push:
    branches:
      - fix/cipmn-certificate-print-quality
    paths:
      - '.github/workflows/repair-cipmn-png-assets.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cipmn-certificate-print-quality
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch approved base assets
        run: git fetch origin supabase-integration

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair and validate certificate PNG data
        shell: python
        run: |
          import base64
          import io
          import re
          import subprocess
          from pathlib import Path

          from PIL import Image

          CHUNK_PATTERN = re.compile(r"=\s*'([A-Za-z0-9+/=]+)';")
          DATA_URI_PATTERN = re.compile(
              r"data:image/(?:jpe?g|png);base64,([A-Za-z0-9+/=]+)"
          )

          assets = [
              {
                  'name': 'iipm',
                  'paths': [
                      Path(f'src/assets/cipmnCertificatePrint/iipm{index}.ts')
                      for index in range(1, 8)
                  ],
                  'export_prefix': 'IIPM_PRINT_PNG_CHUNK_',
                  'two_digit_suffix': False,
                  'dimensions': (420, 436),
                  'base_module': 'src/assets/cipmnCertificateIipmLogo.ts',
              },
              {
                  'name': 'cipmn',
                  'paths': [
                      Path(f'src/assets/cipmnCertificatePrint/cipmnV2_{index:02d}.ts')
                      for index in range(1, 11)
                  ],
                  'export_prefix': 'CIPMN_PRINT_PNG_V2_CHUNK_',
                  'two_digit_suffix': True,
                  'dimensions': (1140, 306),
                  'base_module': 'src/assets/cipmnCertificateCipmnLogo.ts',
              },
              {
                  'name': 'signature',
                  'paths': [
                      Path(f'src/assets/cipmnCertificatePrint/signature{index}.ts')
                      for index in range(1, 5)
                  ],
                  'export_prefix': 'SIGNATURE_PRINT_PNG_CHUNK_',
                  'two_digit_suffix': False,
                  'dimensions': (288, 240),
                  'base_module': 'src/assets/cipmnCertificateBanitoSignature.ts',
              },
          ]

          def read_committed_png(asset):
              encoded_parts = []
              for path in asset['paths']:
                  source = path.read_text(encoding='utf-8')
                  match = CHUNK_PATTERN.search(source)
                  if not match:
                      raise ValueError(f'Malformed asset chunk: {path}')
                  encoded_parts.append(match.group(1))
              return base64.b64decode(''.join(encoded_parts), validate=True)

          def validate_png(raw, dimensions):
              with Image.open(io.BytesIO(raw)) as image:
                  image.load()
                  if image.format != 'PNG':
                      raise ValueError(f'Expected PNG, received {image.format}')
                  if image.size != dimensions:
                      raise ValueError(
                          f'Expected {dimensions[0]}x{dimensions[1]}, '
                          f'received {image.size[0]}x{image.size[1]}'
                      )

          def create_png_from_approved_base(asset):
              source = subprocess.check_output(
                  [
                      'git',
                      'show',
                      f"origin/supabase-integration:{asset['base_module']}",
                  ],
                  text=True,
              )
              match = DATA_URI_PATTERN.search(source)
              if not match:
                  raise ValueError(
                      f"No approved image data URI in {asset['base_module']}"
                  )
              approved_raw = base64.b64decode(match.group(1), validate=True)
              with Image.open(io.BytesIO(approved_raw)) as image:
                  image.load()
                  mode = 'RGBA' if 'A' in image.mode else 'RGB'
                  prepared = image.convert(mode).resize(
                      asset['dimensions'], Image.Resampling.LANCZOS
                  )
                  output = io.BytesIO()
                  prepared.save(
                      output,
                      format='PNG',
                      optimize=False,
                      compress_level=6,
                  )
                  return output.getvalue()

          def write_chunks(asset, raw):
              encoded = base64.b64encode(raw).decode('ascii')
              count = len(asset['paths'])
              base_length, remainder = divmod(len(encoded), count)
              offset = 0
              for zero_index, path in enumerate(asset['paths']):
                  length = base_length + (1 if zero_index < remainder else 0)
                  chunk = encoded[offset:offset + length]
                  offset += length
                  index = zero_index + 1
                  suffix = f'{index:02d}' if asset['two_digit_suffix'] else str(index)
                  export_name = f"{asset['export_prefix']}{suffix}"
                  path.write_text(
                      f"export const {export_name} = '{chunk}';\n",
                      encoding='utf-8',
                  )
              if offset != len(encoded):
                  raise AssertionError(f"Incomplete split for {asset['name']}")

          repaired = []
          for asset in assets:
              try:
                  raw = read_committed_png(asset)
                  validate_png(raw, asset['dimensions'])
                  print(f"{asset['name']}: committed PNG is fully decodable")
              except Exception as error:
                  print(f"{asset['name']}: repairing invalid PNG ({error})")
                  raw = create_png_from_approved_base(asset)
                  validate_png(raw, asset['dimensions'])
                  write_chunks(asset, raw)
                  repaired.append(asset['name'])

          for asset in assets:
              validate_png(read_committed_png(asset), asset['dimensions'])

          if not repaired:
              raise SystemExit('No invalid certificate PNG payload was found')

          print('Repaired assets: ' + ', '.join(repaired))

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check certificate implementation
        run: >-
          npx tsc --noEmit --skipLibCheck --target ES2022
          --module ESNext --moduleResolution Bundler
          --allowSyntheticDefaultImports --esModuleInterop
          src/vite-env.d.ts
          src/services/certificateCompletionService.ts
          src/services/certificatePdfService.ts
          src/services/cipmnCertificateRenderer.ts
          src/assets/cipmnCertificateIipmLogo.ts
          src/assets/cipmnCertificateCipmnLogo.ts
          src/assets/cipmnCertificateBanitoSignature.ts

      - name: Build production application
        run: npm run build

      - name: Render certificate samples
        run: |
          npx esbuild scripts/render-cipmn-certificate-sample.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/render-cipmn-certificate-sample.cjs
          node /tmp/render-cipmn-certificate-sample.cjs
          test -s cipmn-certificate-standard-sample.pdf
          test -s cipmn-certificate-long-content-sample.pdf

      - name: Commit verified repair and remove one-time workflow
        run: |
          rm .github/workflows/repair-cipmn-png-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/cipmnCertificatePrint .github/workflows/repair-cipmn-png-assets.yml
          git diff --cached --quiet && exit 1
          git commit -m 'Repair lossless certificate PNG payloads'
          git push origin HEAD:fix/cipmn-certificate-print-quality
