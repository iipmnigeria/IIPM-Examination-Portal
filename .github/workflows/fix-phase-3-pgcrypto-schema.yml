name: Fix Phase 3 Pgcrypto Schema Qualification

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-phase-3-pgcrypto-schema.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'phase-3-certificate-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-certificate-completion
          fetch-depth: 0

      - name: Qualify pgcrypto functions under locked search path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202607251800_phase_3_certificate_completion.sql')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "encode(gen_random_bytes(9), 'hex')": "encode(extensions.gen_random_bytes(9), 'hex')",
              "encode(digest(lower(v_certificate.verification_code), 'sha256'), 'hex')": "encode(extensions.digest(lower(v_certificate.verification_code), 'sha256'), 'hex')",
              "encode(digest(lower(v_code), 'sha256'), 'hex')": "encode(extensions.digest(lower(v_code), 'sha256'), 'hex')",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Missing expected pgcrypto expression: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary diagnostics and commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-phase-3-pgcrypto-schema.yml
          rm -f .github/workflows/diagnose-phase-3-completion-behaviour.yml
          rm -f .github/workflows/fix-phase-3-validation-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/202607251800_phase_3_certificate_completion.sql .github/workflows
          git diff --cached --check
          git commit -m 'Qualify Phase 3 pgcrypto functions'
          git push origin HEAD:phase-3-certificate-completion
