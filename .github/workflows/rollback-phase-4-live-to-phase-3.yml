name: Roll Back Phase 4 Live Frontend to Phase 3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/rollback-phase-4-live-to-phase-3.txt'

permissions:
  contents: write

concurrency:
  group: rollback-phase-4-live-to-phase-3
  cancel-in-progress: false

jobs:
  rollback-and-verify:
    name: Restore exact production-verified Phase 3 bundle
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PHASE3_APP_COMMIT: 'dc98a784029ab1d08fe6e6a672983d169aece476'
      LIVE_URL: https://iipmnigeria.github.io/IIPM-Examination-Portal/

    steps:
      - name: Checkout exact Phase 3 production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE3_APP_COMMIT }}
          fetch-depth: 0

      - name: Confirm Phase 3 source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PHASE3_APP_COMMIT"
          grep -q 'Certificate Authority Workspace' src/components/CandidateCertificateWorkspace.tsx
          grep -q 'Verify Certificate' src/components/PublicCertificateVerification.tsx
          grep -q 'Server issuance required' src/components/LegacyCertificateSecurityGate.tsx
          test ! -e src/components/CandidateCertificateCommerce.tsx
          test ! -e src/components/AdminCertificateCommerceLauncher.tsx
          test ! -e src/components/CertificatePaymentReturnHandler.tsx

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and fingerprint Phase 3
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          grep -q 'AgileCert Global' dist/index.html
          asset="$(grep -Eo 'src="[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          js_file="dist/${asset#./}"
          test -s "$js_file"
          grep -q 'IIPM Certificate Verification' "$js_file"
          if grep -q 'Credential Store' "$js_file"; then
            echo 'Phase 4 credential commerce text detected in rollback bundle.'
            exit 1
          fi
          sha256sum "$js_file" | awk '{print $1}' | tee "$RUNNER_TEMP/phase-3-rollback-expected-js.sha256"
          rm -f dist/server.cjs dist/server.cjs.map
          touch dist/.nojekyll

      - name: Overlay compiled Phase 3 files on Pages source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/agilecert-phase-3-rollback
          git worktree add --detach /tmp/agilecert-phase-3-rollback origin/main
          rm -rf /tmp/agilecert-phase-3-rollback/assets
          rm -f /tmp/agilecert-phase-3-rollback/server.cjs /tmp/agilecert-phase-3-rollback/server.cjs.map
          cp -a dist/. /tmp/agilecert-phase-3-rollback/

          cd /tmp/agilecert-phase-3-rollback
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html assets .nojekyll server.cjs server.cjs.map 2>/dev/null || true
          while IFS= read -r file; do
            case "$file" in
              index.html|.nojekyll) ;;
              *) git add -A -- "$file" ;;
            esac
          done < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -printf '%f\n')

          if git diff --cached --quiet; then
            echo 'Pages already contains the exact Phase 3 bundle.'
          else
            git commit -m "Restore Phase 3 frontend while Phase 4 payment secret is unavailable"
            git push origin HEAD:main
          fi

      - name: Wait for exact Phase 3 live bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/phase-3-rollback-expected-js.sha256")"
          success=0
          for attempt in $(seq 1 36); do
            status="$(curl -L --silent --show-error --max-time 60 -o "$RUNNER_TEMP/phase-3-rollback-live-index.html" -w '%{http_code}' "${LIVE_URL}?phase3-rollback=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$status" = '200' ]; then
              asset="$(grep -Eo 'src="[^"]+\.js"' "$RUNNER_TEMP/phase-3-rollback-live-index.html" | head -n 1 | cut -d'"' -f2 || true)"
              if [ -n "$asset" ]; then
                asset_url="$(python3 - "$LIVE_URL" "$asset" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"
                if curl -L --fail --silent --show-error --max-time 60 "${asset_url}?phase3-rollback=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/phase-3-rollback-live-app.js"; then
                  live="$(sha256sum "$RUNNER_TEMP/phase-3-rollback-live-app.js" | awk '{print $1}')"
                  echo "attempt=$attempt expected=$expected live=$live"
                  if [ "$live" = "$expected" ]; then
                    success=1
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/phase-3-rollback-smoke"
          cd "$RUNNER_TEMP/phase-3-rollback-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify rendered Phase 3 portal
        shell: bash
        working-directory: ${{ runner.temp }}/phase-3-rollback-smoke
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            const response = await page.goto(`${process.env.LIVE_URL}?phase3-rollback-final=${process.env.GITHUB_RUN_ID}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(6000);
            const status = response ? response.status() : 0;
            const title = await page.title();
            const bodyText = (await page.locator('body').innerText()).trim();
            const rootHtml = (await page.locator('#root').innerHTML()).trim();
            const credentialStoreVisible = await page.getByText('Credential Store', { exact: true }).isVisible().catch(() => false);
            const verifyLauncher = page.getByRole('button', { name: 'Verify an IIPM certificate' });
            await verifyLauncher.waitFor({ state: 'visible', timeout: 15000 });
            await verifyLauncher.click();
            await page.getByRole('heading', { name: 'IIPM Certificate Verification' }).waitFor({ state: 'visible' });

            const report = {
              status,
              title,
              bodyLength: bodyText.length,
              rootLength: rootHtml.length,
              credentialStoreVisible,
              pageErrors,
              consoleErrors,
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/phase-3-rollback-live-report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${process.env.RUNNER_TEMP}/phase-3-rollback-live.png`, fullPage: true });
            await browser.close();

            if (status !== 200) throw new Error(`Live portal returned HTTP ${status}.`);
            if (!/AgileCert Global/i.test(title)) throw new Error(`Unexpected title: ${title}`);
            if (bodyText.length < 100 || rootHtml.length < 100) throw new Error('Rendered portal is blank or incomplete.');
            if (credentialStoreVisible) throw new Error('Phase 4 Credential Store is still visible after rollback.');
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`Console errors: ${consoleErrors.join(' | ')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-frontend-safety-rollback-evidence
          path: |
            ${{ runner.temp }}/phase-3-rollback-expected-js.sha256
            ${{ runner.temp }}/phase-3-rollback-live-index.html
            ${{ runner.temp }}/phase-3-rollback-live-app.js
            ${{ runner.temp }}/phase-3-rollback-live-report.json
            ${{ runner.temp }}/phase-3-rollback-live.png
          if-no-files-found: warn
          retention-days: 3
