name: Apply CIPMN Catalogue Navigation

on:
  push:
    branches: [feature-cipmn-catalogue-navigation]
    paths:
      - 'scripts/apply-cipmn-catalogue-navigation.py'
      - '.github/workflows/apply-cipmn-catalogue-navigation.yml'
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/apply-cipmn-catalogue-navigation.py'
      - '.github/workflows/apply-cipmn-catalogue-navigation.yml'

permissions:
  contents: write

concurrency:
  group: apply-cipmn-catalogue-navigation
  cancel-in-progress: false

jobs:
  patch-and-validate:
    name: Patch catalogue navigation and validate portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-cipmn-catalogue-navigation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply navigation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-cipmn-catalogue-navigation.py

      - name: Validate navigation separation
        shell: bash
        run: |
          set -euo pipefail
          file='src/components/StudentDashboard.tsx'
          grep -q 'IIPM Specialist Certification Catalogue' "$file"
          grep -q 'CIPMN Professional Licensing Mock Examinations' "$file"
          grep -q 'Academic Gradebook & Credentials' "$file"
          grep -q "programmeCode === 'CIPMN-MOCK'" "$file"
          grep -q "examinationTitle.startsWith('CIPMN-MOD-')" "$file"
          grep -q 'catalogueTests.map' "$file"
          ! grep -q 'Examination Catalog' "$file"
          ! grep -q "setActiveTab('catalog')" "$file"

      - name: Install and build portal
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Commit validated source change and remove one-time runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-cipmn-catalogue-navigation.py
          rm .github/workflows/apply-cipmn-catalogue-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StudentDashboard.tsx scripts/apply-cipmn-catalogue-navigation.py .github/workflows/apply-cipmn-catalogue-navigation.yml
          git commit -m 'Separate CIPMN mock examinations from specialist catalogue'
          git push origin HEAD:feature-cipmn-catalogue-navigation
