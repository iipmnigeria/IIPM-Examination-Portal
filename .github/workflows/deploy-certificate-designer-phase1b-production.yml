name: Deploy Certificate Designer Phase 1B Production

on:
  pull_request:
    branches: [supabase-integration]
    types: [opened, synchronize, reopened]
    paths:
      - 'deployment-triggers/deploy-certificate-designer-phase1b-production.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-certificate-designer-phase1b-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy and verify Certificate Designer Phase 1B
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_COMMIT: 'c6c52277c5ff29a9e7680444d2967fb30f993811'
      PROJECT_REF: 'cfecicvugfrrhcvhduzc'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify exact approved release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

          cat > certificate-designer-expected-migrations.txt <<'EOF'
          202608012100_certificate_visual_designer_phase1b.sql
          EOF

          test -s supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          test -s supabase/tests/certificate_visual_designer_phase1b_smoke.sql
          test -s src/components/AdminCertificateDesigner.tsx
          test -s src/services/certificateDesignerService.ts

          grep -q 'This package stores non-authoritative visual overlays' \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q 'certificate_admin_save_template_design' \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql
          grep -q 'Visual Designer' src/components/AdminCertificateManagementLauncher.tsx
          grep -q 'Dynamic field' src/components/AdminCertificateDesigner.tsx

          git diff --quiet "${EXPECTED_COMMIT}^1" "$EXPECTED_COMMIT" -- \
            src/services/certificateService.ts \
            src/services/certificatePdfService.ts \
            src/services/cipmnCertificateRenderer.ts \
            src/services/examService.ts \
            src/services/financeConsoleService.ts \
            src/services/financeConsoleCompletionService.ts \
            supabase/functions/initialize-exam-payment/index.ts \
            supabase/functions/verify-exam-payment/index.ts \
            supabase/functions/initialize-exam-cart-payment/index.ts \
            supabase/functions/verify-exam-cart-payment/index.ts \
            supabase/functions/paystack-webhook/index.ts

          ! grep -R -E '(sk_(live|test)_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,})' \
            supabase/migrations/202608012100_certificate_visual_designer_phase1b.sql \
            src/components/AdminCertificateDesigner.tsx \
            src/services/certificateDesignerService.ts

      - name: Validate approved frontend source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > certificate-designer-approved-dist.sha256

      - name: Link controlled Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Snapshot protected production authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              p.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(p.oid)) as definition_hash
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in (
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'set_agilecert_certificate_status',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order',
                'resolve_agilecert_certificate_master'
              )
          )
          select jsonb_build_object(
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(identity || ':' || definition_hash, '|' order by identity), ''))
              from protected_functions
            ),
            'legacyTemplates', (select count(*) from public.agilecert_certificate_templates),
            'eligibilityRecords', (select count(*) from public.agilecert_certificate_eligibility_records),
            'issuedCertificates', (select count(*) from public.agilecert_issued_certificates),
            'attempts', (select count(*) from public.attempts),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'masterTemplates', (select count(*) from public.agilecert_certificate_master_templates),
            'masterVersions', (select count(*) from public.agilecert_certificate_master_versions),
            'assets', (select count(*) from public.agilecert_certificate_assets),
            'assignments', (select count(*) from public.agilecert_certificate_master_assignments),
            'masterAuditEvents', (select count(*) from public.agilecert_certificate_master_audit),
            'overlaySchemaHash', (
              select md5(coalesce(string_agg(id::text || ':' || md5(overlay_schema::text), '|' order by id), ''))
              from public.agilecert_certificate_master_versions
            )
          ) as verification;
          """
          Path('/tmp/certificate-designer-pre-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/certificate-designer-pre-query.json \
            -o certificate-designer-pre-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('certificate-designer-pre-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          result = data[0].get('verification') or {}
          assert result.get('protectedFunctionCount', 0) >= 5, result
          Path('certificate-designer-pre-safe.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Require exactly one approved pending migration
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 \
            | tee certificate-designer-production-dry-run.log
          grep -Eo '20[0-9]{10}_[A-Za-z0-9._-]+\.sql' \
            certificate-designer-production-dry-run.log \
            | sort -u > certificate-designer-production-pending.txt || true
          diff -u certificate-designer-expected-migrations.txt \
            certificate-designer-production-pending.txt
          test "$(wc -l < certificate-designer-production-pending.txt | tr -d ' ')" -eq 1

      - name: Apply approved Phase 1B migration
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | supabase db push --linked 2>&1 \
            | tee certificate-designer-production-deploy.log
          grep -q 'Applying migration 202608012100_certificate_visual_designer_phase1b.sql' \
            certificate-designer-production-deploy.log
          grep -q 'Finished supabase db push' certificate-designer-production-deploy.log

      - name: Verify live Phase 1B authority and preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          query = r"""
          with protected_functions as (
            select
              p.oid::regprocedure::text as identity,
              md5(pg_get_functiondef(p.oid)) as definition_hash
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in (
                'evaluate_agilecert_certificate_eligibility',
                'issue_agilecert_certificate',
                'set_agilecert_certificate_status',
                'verify_agilecert_certificate',
                'create_exam_order',
                'fulfil_paid_exam_order',
                'create_exam_bulk_order',
                'fulfil_paid_exam_bulk_order',
                'resolve_agilecert_certificate_master'
              )
          ), required_tables(table_name) as (
            values
              ('agilecert_certificate_dynamic_field_definitions'),
              ('agilecert_certificate_template_preview_profiles')
          ), required_functions(function_name) as (
            values
              ('certificate_designer_validate_overlay'),
              ('get_certificate_template_designer_snapshot'),
              ('certificate_admin_save_template_design')
          )
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '202608012100'
            ),
            'designerColumns', (
              select count(*) from information_schema.columns
              where table_schema = 'public'
                and table_name = 'agilecert_certificate_master_versions'
                and column_name in (
                  'designer_schema_version',
                  'designer_updated_by',
                  'designer_updated_at'
                )
            ),
            'requiredTables', (
              select count(*) from required_tables required
              where to_regclass('public.' || required.table_name) is not null
            ),
            'rlsTables', (
              select count(*)
              from required_tables required
              join pg_class relation on relation.relname = required.table_name
              join pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'public' and relation.relrowsecurity = true
            ),
            'directAuthenticatedGrants', (
              select count(*)
              from information_schema.role_table_grants grant_row
              join required_tables required on required.table_name = grant_row.table_name
              where grant_row.table_schema = 'public'
                and grant_row.grantee in ('authenticated', 'anon', 'PUBLIC')
            ),
            'securityDefinerFunctions', (
              select count(distinct required.function_name)
              from required_functions required
              join pg_proc function_row on function_row.proname = required.function_name
              join pg_namespace namespace_row on namespace_row.oid = function_row.pronamespace
              where namespace_row.nspname = 'public'
                and function_row.prosecdef = true
            ),
            'authenticatedFunctionAccess', (
              select
                (case when has_function_privilege('authenticated', 'public.certificate_designer_validate_overlay(uuid,jsonb)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('authenticated', 'public.get_certificate_template_designer_snapshot(uuid)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('authenticated', 'public.certificate_admin_save_template_design(uuid,jsonb,jsonb,jsonb,numeric,numeric,text)', 'execute') then 1 else 0 end)
            ),
            'anonFunctionAccess', (
              select
                (case when has_function_privilege('anon', 'public.certificate_designer_validate_overlay(uuid,jsonb)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('anon', 'public.get_certificate_template_designer_snapshot(uuid)', 'execute') then 1 else 0 end) +
                (case when has_function_privilege('anon', 'public.certificate_admin_save_template_design(uuid,jsonb,jsonb,jsonb,numeric,numeric,text)', 'execute') then 1 else 0 end)
            ),
            'activeFieldDefinitions', (
              select count(*) from public.agilecert_certificate_dynamic_field_definitions
              where is_active
            ),
            'previewProfiles', (
              select count(*) from public.agilecert_certificate_template_preview_profiles
            ),
            'protectedFunctionCount', (select count(*) from protected_functions),
            'protectedFunctionHash', (
              select md5(coalesce(string_agg(identity || ':' || definition_hash, '|' order by identity), ''))
              from protected_functions
            ),
            'legacyTemplates', (select count(*) from public.agilecert_certificate_templates),
            'eligibilityRecords', (select count(*) from public.agilecert_certificate_eligibility_records),
            'issuedCertificates', (select count(*) from public.agilecert_issued_certificates),
            'attempts', (select count(*) from public.attempts),
            'examOrders', (select count(*) from public.exam_orders),
            'examPayments', (select count(*) from public.exam_payments),
            'masterTemplates', (select count(*) from public.agilecert_certificate_master_templates),
            'masterVersions', (select count(*) from public.agilecert_certificate_master_versions),
            'assets', (select count(*) from public.agilecert_certificate_assets),
            'assignments', (select count(*) from public.agilecert_certificate_master_assignments),
            'masterAuditEvents', (select count(*) from public.agilecert_certificate_master_audit),
            'overlaySchemaHash', (
              select md5(coalesce(string_agg(id::text || ':' || md5(overlay_schema::text), '|' order by id), ''))
              from public.agilecert_certificate_master_versions
            )
          ) as verification;
          """
          Path('/tmp/certificate-designer-post-query.json').write_text(
              json.dumps({'query': query}), encoding='utf-8'
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/certificate-designer-post-query.json \
            -o certificate-designer-post-verification.json

          python3 <<'PY'
          import json
          from pathlib import Path

          pre = json.loads(Path('certificate-designer-pre-safe.json').read_text())
          data = json.loads(Path('certificate-designer-post-verification.json').read_text())
          assert isinstance(data, list) and len(data) == 1, data
          post = data[0].get('verification') or {}

          assert post.get('migrationApplied') is True, post
          assert post.get('designerColumns') == 3, post
          assert post.get('requiredTables') == 2, post
          assert post.get('rlsTables') == 2, post
          assert post.get('directAuthenticatedGrants') == 0, post
          assert post.get('securityDefinerFunctions') == 3, post
          assert post.get('authenticatedFunctionAccess') == 3, post
          assert post.get('anonFunctionAccess') == 0, post
          assert post.get('activeFieldDefinitions', 0) >= 20, post

          preserved = [
            'protectedFunctionCount', 'protectedFunctionHash',
            'legacyTemplates', 'eligibilityRecords', 'issuedCertificates',
            'attempts', 'examOrders', 'examPayments', 'masterTemplates',
            'masterVersions', 'assets', 'assignments', 'masterAuditEvents',
            'overlaySchemaHash'
          ]
          for key in preserved:
            assert post.get(key) == pre.get(key), (key, pre.get(key), post.get(key))

          Path('certificate-designer-post-safe.json').write_text(
              json.dumps(post, indent=2), encoding='utf-8'
          )
          print(json.dumps(post, indent=2))
          PY

      - name: Confirm production migration ledger is current
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --dry-run 2>&1 \
            | tee certificate-designer-production-final-dry-run.log
          grep -q 'Remote database is up to date' \
            certificate-designer-production-final-dry-run.log

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-designer-phase1b-production-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            certificate-designer-expected-migrations.txt
            certificate-designer-approved-dist.sha256
            certificate-designer-pre-safe.json
            certificate-designer-post-safe.json
            certificate-designer-production-dry-run.log
            certificate-designer-production-pending.txt
            certificate-designer-production-deploy.log
            certificate-designer-production-final-dry-run.log
